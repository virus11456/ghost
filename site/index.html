上，擠滿了人。<\/p>\n<p>四十幾個，排成一個方陣。雙手往前平舉，手腕垂著，往左晃，往右晃。然後往後退一步。<\/p>\n<p>他們在倒著跳。<\/p>\n<p>每一個動作都是反的，像一捲錄影帶在倒轉。舉起的手往回收，邁出去的腳往後退，往左的身體慢慢往右。整齊得像同一個人，被複製了四十幾次，然後全部倒過來播。<\/p>\n<p>周遠在第三排看見了邱永福。汗衫，發白的西裝褲，光著腳。他的臉上沒有笑，只有一種很深的、很累的空白，像一個人已經跳了很久很久，久到忘記自己為什麼在跳。<\/p>\n<p>他看見那個退休的會計。看見主街第六戶那個家暴過老婆的男人。<\/p>\n<p>他在最後一排看見了廟公。<\/p>\n<p>七十一歲，一輩子沒離開過霧川，每天早上五點開廟門。他跳得很慢，總是比別人慢一點，手抬得不夠高，腳退得不夠遠。他的嘴唇在動，一直在動，像在說什麼。<\/p>\n<p>周遠看著他的嘴型。<\/p>\n<p>毋是我。毋是我。毋是我。<\/p>\n<p>方陣的最前面，有一個人背對著所有人，在帶舞。<\/p>\n<p>很小。比方陣裡任何一個人都小，小得像一個孩子。全身是濕的，頭髮貼在背上，水一直從她身上往下滴，滴在灰色的石板上，滴出一圈一圈的波紋。<\/p>\n<p>她沒有回頭。<\/p>\n<hr class=\"sep\">\n<p>何靜蹲在他旁邊。<\/p>\n<p>他不知道她什麼時候過來的。她蹲在水邊，手電筒的光在發抖，照在水面上，照出一片晃動的灰。<\/p>\n<p>她看著水裡的那些人。看得很專心，嘴唇抿得很緊，臉色白得發青。<\/p>\n<p>「那是……」她開口，聲音卡住了。<\/p>\n<p>她伸出手，手指慢慢地，慢慢地，碰到了水面。<\/p>\n<p>很冰。周遠看見她的手指縮了一下。<\/p>\n<p>水面被她的指尖碰出一圈波紋。波紋往外擴散，擴散到水裡那座灰色的鎮上，擴散到那些倒著跳舞的人腳下。<\/p>\n<p>方陣裡，有一個人停了一下。<\/p>\n<p>是邱永福。<\/p>\n<p>他的動作慢了半拍，抬起頭來。隔著那層水，隔著那座灰色的鎮，他看見了蹲在水邊的周遠。他的臉上那片空白，裂開了一條縫。他張開嘴。<\/p>\n<p>周遠看得懂那個嘴型。<\/p>\n<p>警察先生。<\/p>\n<p>然後方陣又動了，邱永福的手被拉回去，腳被拉回去，又變回那個倒著跳舞的影子。<\/p>\n<hr class=\"sep\">\n<p>何靜把手收回來。<\/p>\n<p>她的手指濕了，一滴水從指尖滴下去，落回水面。她蹲在那裡，很久都沒有動。<\/p>\n<p>「周遠。」她說。<\/p>\n<p>「嗯。」<\/p>\n<p>「我第一次跟你談完，在紀錄上寫你是解離症狀。」她說，聲音很平，平得像在念一份病歷，「夢見自己是另一個人，迴避鏡像，在高壓下對一個不存在的影像開槍。」<\/p>\n<p>她看著水裡那座灰色的鎮。<\/p>\n<p>「對不起。」她說。<\/p>\n<p>周遠沒有說話。<\/p>\n<p>「我還寫了一份初診病歷的草稿。」她說，「存在我的平板裡。我回去就刪掉。」<\/p>\n<p>「不用刪。」<\/p>\n<p>何靜轉過頭看他。<\/p>\n<p>「留著。」周遠說，「以後有人說妳瘋了，妳可以拿出來看，妳當時有多理性。」<\/p>\n<p>何靜看著他，看了很久。然後她笑了。很短，很輕，眼眶紅了一圈。<\/p>\n<p>「你這個人，」她說，「真的很討厭。」<\/p>\n<hr class=\"sep\">\n<p>他們退回石階上的時候，周遠又看了一眼手錶。<\/p>\n<p>秒針動了。<\/p>\n<p>不是從十四分接下去。是一下子跳到了十二點四十七分。好像有三十三分鐘，在他們蹲在水邊的時候，被人從時間裡剪掉了。<\/p>\n<p>何靜的手機也一樣。十二點四十七分。<\/p>\n<p>廟裡的那個圓鐘，還停在十二點十四分。<\/p>\n<p>他們沒有再走過去看那灘水。周遠收拾好手電筒，何靜把保溫瓶蓋好。他們走回車上，坐進去，關上車門。誰都沒有馬上說話。<\/p>\n<p>何靜拿出手機，點開日曆，滑了很久。<\/p>\n<p>「農曆十月十五，」她說，「還有十二天。」<\/p>\n<p>「下元。」<\/p>\n<p>「我阿嬤說，」何靜看著手機螢幕，「那天要在河邊點燈。」<\/p>\n<p>她把手機收起來，看著擋風玻璃外面那座黑漆漆的鎮。廟埕中央那灘水，在星光底下，亮著一小片白。<\/p>\n<p>「周遠，」她說，「下一次，你們要進去的時候，」<\/p>\n<p>她停了一下。<\/p>\n<p>「我也去。」<\/p>", "chars": 3504}, "35": {"title": "第三十五章　戲班", "html": "<p class=\"era\">一九四九年，落雁街。<\/p>\n<p>停了好幾晚的夢，回來的時候，先聽見的是鑼。<\/p>\n<hr class=\"sep\">\n<p>那年冬天，陳守一在落雁街的菜市場口擺一張小桌，替人寫信。<\/p>\n<p>桌子是跟賣豆菜的阿婆借的，一張凳子，一塊木板，一個缺了口的硯台。一封信兩角，新台幣。半年前還是舊台幣，四萬塊換一塊，市場裡有個賣布的老闆把一整箱鈔票拿去燒，說留著也是擦屁股。<\/p>\n<p>來寫信的，多半是兵。<\/p>\n<p>這一年，街上的兵多了很多。他們從海的那一邊來，穿著不合身的棉軍服，說的話陳守一聽得懂一半。他們住在廟裡、學校裡、倉庫裡，晚上在街上走來走去，看什麼都像在看自己老家的東西。<\/p>\n<p>今天第一個來的是個湖南兵，十九歲，耳朵凍得通紅。他坐在凳子上，兩手插在袖子裡，一句一句地唸，陳守一一句一句地寫。<\/p>\n<p>「娘，我在台灣，很好。」<\/p>\n<p>陳守一寫：娘，兒在台灣，一切安好。<\/p>\n<p>「這裡不冷。吃得飽。」<\/p>\n<p>那兵吸了一下鼻子。陳守一寫：此地氣候溫和，三餐皆足。<\/p>\n<p>「叫爹不要去碼頭等了。」<\/p>\n<p>陳守一的筆停了一下。他寫：請父親勿再赴碼頭守候。<\/p>\n<p>兵看著他寫，說：「你的字不好看。」<\/p>\n<p>「我知。」<\/p>\n<p>「可是看得懂。」兵從口袋裡摸出兩角錢，壓在硯台旁邊，「看得懂就好。」<\/p>\n<p>他走了以後，陳守一把那封信摺好，裝進信封。信封上的地址寫得很長，一個省、一個縣、一個鄉、一個村。他不知道這封信會不會到。這幾個月他寫了上百封，沒有一個兵回來說收到回信。<\/p>\n<p>他們還是一直來。<\/p>\n<hr class=\"sep\">\n<p>他在落雁街已經住了四個月。<\/p>\n<p>這是他給自己的規矩：一個地方，最多住半年。第一個月，大家叫他「寫字的少年仔」。第三個月，豆菜阿婆會多塞一把豆芽給他，說你太瘦了。到了第五個月，就會有人開始盯著他的下巴看。<\/p>\n<p>一個十七歲的少年，四個月不刮鬍子，下巴還是乾乾淨淨的。<\/p>\n<p>今年他三十五歲了。他算過。一九一四年生，民國三年，屬虎。他的身體停在十七歲那年的秋天，停在霧川渡那條河邊。手上的繭不會變厚，指甲剪了會長，頭髮剪了會長，可是個子不再抽高，臉不再變長，眼睛底下那兩塊青，十八年都沒有退。<\/p>\n<p>手腕上那條紅布條，洗到發白了，還綁著。<\/p>\n<p>前幾天豆菜阿婆問他：少年仔，你今年幾歲？<\/p>\n<p>他說十七。<\/p>\n<p>阿婆笑了，說我去年問你，你嘛講十七。<\/p>\n<p>他也笑了。那天晚上，他把油紙包重新綁了一次，麻繩三圈。他想，過完年就走。<\/p>\n<hr class=\"sep\">\n<p>鑼聲是傍晚響起來的。<\/p>\n<p>從街尾傳過來，咚咚鏘，咚咚鏘，有一點破，像鑼面上有一道裂縫。接著是鼓，是嗩吶，是一把胡琴在調音，吱吱呀呀，拉高，又拉低。<\/p>\n<p>陳守一收桌子的手停住了。<\/p>\n<p>他站在那裡，等那把胡琴把音調好。他的背有一點僵。十八年了，他還是聽不得胡琴在夜裡響。<\/p>\n<p>豆菜阿婆在收攤，抬頭說：「瑞春班啦。廟予兵仔佔去矣，戲台搭袂起來，只好佇街尾彼塊空地仔搬。」<\/p>\n<p>「亂彈？」<\/p>\n<p>「亂彈。」阿婆搖頭，「這馬啥人閣咧看亂彈。少年的攏去看歌仔戲矣。彼班喔，欲倒矣。」<\/p>\n<hr class=\"sep\">\n<p>街尾的空地，是一間燒掉的碾米廠留下來的。<\/p>\n<p>戲台是用竹竿和木板搭的，矮矮的，台前掛兩盞電土燈，照得一片青白。台下擺了十幾張長凳，坐了不到一半，多半是老人，還有幾個小孩，蹲在台前最近的地方，張著嘴往上看。<\/p>\n<p>陳守一站在最後面。<\/p>\n<p>開場是扮仙。一個穿紅袍的老生，一個戴金冠的天官，後面跟著幾個小仙女，手上捧著壽桃。戲服很舊了，紅袍的袖口磨出了毛邊，天官的金冠掉了一顆珠子，用紅線補上一顆木頭的。<\/p>\n<p>小仙女裡最小的那個，大概七八歲。<\/p>\n<p>她走錯了一步。往左的時候她往右，撞到旁邊的仙女，壽桃差點掉下去。她自己嚇一跳，趕快抱緊，站回原位，臉漲得通紅，嘴唇抿得緊緊的。<\/p>\n<p>陳守一看見她上台之前，把一雙小布鞋脫在戲台邊上，鞋頭朝外，擺得整整齊齊。其他幾個仙女的鞋子也是，一排，全部朝外。<\/p>\n<p>他看了一眼，沒有多想。戲班有戲班的規矩，他不懂。<\/p>\n<p>那把胡琴坐在台側，拉琴的是一個瞎了一隻眼的老人，琴弓拉得很穩。陳守一聽著聽著，背慢慢鬆下來了。是好聽的胡琴。熱鬧，亮，一點都不像那天晚上。<\/p>\n<p>戲唱到一半，下雨了。<\/p>\n<p>很小的雨。台下的人撐起傘，又有幾個人乾脆站起來走了。戲台上的人沒有停，唱得一樣大聲。台頂的帆布漏水，正好漏在天官頭上，天官唱一句，抬頭看一眼，再唱一句。<\/p>\n<p>散戲的時候，台下剩下四個人。陳守一是其中一個。<\/p>\n<hr class=\"sep\">\n<p>他本來要走了。<\/p>\n<p>走過戲台後面的時候，看見那個最小的仙女蹲在雨棚底下，抱著膝蓋在哭。她的仙女衣服還沒換下來，袖子濕了一半，貼在手臂上。<\/p>\n<p>一個駝背的老人站在她旁邊，拿著一個鐵飯盒，一直說：「食啦。食啦。毋食，明仔載閣毋免搬。」<\/p>\n<p>小女孩不理他。<\/p>\n<p>老人嘆了一口氣，抬頭，看見陳守一站在那裡。<\/p>\n<p>「少年仔，」他說，「看戲看到戲台後壁來，欲做啥？欲學戲喔？」<\/p>\n<p>「毋是。」<\/p>\n<p>老人上上下下看他，看了一圈，眼睛亮了一下。<\/p>\n<p>「生做按呢，袂穤喔。」他說，「白，面細，目睭有神。妝畫畫咧，會使做小生。阮班內欠一个小生，原本彼个去做兵矣。你若欲……」<\/p>\n<p>「我毋是欲學戲。」陳守一說，「我是聽著伊咧哭。」<\/p>\n<p>老人愣了一下，看看陳守一，又看看那個小女孩，又看陳守一。<\/p>\n<p>「哭啥？」他說，「你問伊。我問規暗攏問無。」<\/p>\n<p>陳守一蹲下來。蹲到跟她一樣高。<\/p>\n<p>小女孩從膝蓋上抬起眼睛看他。眼睛哭得腫腫的，睫毛上掛著水。<\/p>\n<p>「我行毋著。」她說，「我行毋著，予人笑。」<\/p>\n<p>「誰笑妳？」<\/p>\n<p>「台跤有一个囡仔咧笑。」<\/p>\n<p>陳守一想了想。「彼个囡仔，」他說，「伊敢會曉搬仙女？」<\/p>\n<p>小女孩搖頭。<\/p>\n<p>「伊袂曉。」陳守一說，「伊連頭一步攏毋知愛行佗一爿。妳會曉，妳只是今仔日行毋著一步。毋仝款。」<\/p>\n<p>小女孩看著他，鼻子吸了一下。過了一會兒，她伸手，把老人手上的鐵飯盒拿過去，打開，低頭扒了一大口。<\/p>\n<p>老人看著她吃，又看著陳守一，表情很奇怪，像不知道該道謝還是該生氣。<\/p>\n<p>「你有細漢小妹？」<\/p>\n<p>陳守一想了一下。<\/p>\n<p>「以前有一个。」他說，「毋是小妹。是一个……我答應過要顧伊的人。」<\/p>\n<hr class=\"sep\">\n<p>老人是瑞春班的班主。<\/p>\n<p>大家叫他旺伯。七十歲，十二歲入班，翻過筋斗、唱過武生、拉過鼓，膝蓋摔壞以後就管帳，管到後來，前一個班主死了，就變成他管全部。<\/p>\n<p>他留陳守一吃飯。<\/p>\n<p>說是吃飯，其實就是一鍋番薯簽粥，配一盤菜脯蛋。戲班十一個人，圍著兩張拼起來的戲箱吃。瞎了一隻眼的胡琴老人叫做阿炳，一句話都不說，吃得很快。演天官的是個四十幾歲的男人，頭髮被雨淋濕了，一直在擦。那個小仙女叫阿桃，坐在旺伯旁邊，捧著碗，偷偷看陳守一。<\/p>\n<p>「這个月，」旺伯一邊吃一邊說，「搬了十二棚，有七棚是今仔日這款，台跤四五个人。」他把一顆菜脯蛋夾給阿桃，「錢換做新的，攏無夠看。阿兵哥佔廟，廟口無戲台。少年人愛歌仔戲，嫌阮亂彈吵、聽無。過年若閣按呢，這班就散矣。」<\/p>\n<p>沒有人接話。<\/p>\n<p>天官擦著頭髮，說：「散就散，我去做土水。」<\/p>\n<p>「你做土水？」旺伯哼了一聲，「你連一包水泥都揹袂起來。」<\/p>\n<p>大家笑了。阿桃也笑了，笑得飯粒噴出來。<\/p>\n<p>旺伯放下碗。<\/p>\n<p>「昨昏，」他說，聲音低下來，「阿成仔佇台頂跋落來，跤扭著。今仔日阿桃行毋著。前禮拜，帆布予風吹破。」他看著那兩盞電土燈，「這个台，無乾淨。」<\/p>\n<p>「愛破台。」天官說。<\/p>\n<p>「破台愛錢。」旺伯說，「請一个師公來，一棚戲的錢就無去矣。」<\/p>\n<p>陳守一低頭喝粥，喝了一口，又一口。<\/p>\n<p>他已經很久沒有替人做過事了。十八年，他寫信、寫春聯、替人看日子、收驚，從來不碰比收驚更大的事。他不想讓任何東西注意到他。他不知道那個「伊」，那個被他用自己的魂壓回沈家血脈裡的東西，會不會隔著半個島，聞得到他。<\/p>\n<p>可是阿桃坐在對面，捧著碗，腳在凳子底下晃來晃去，一直看他。<\/p>\n<p>「我會。」他說。<\/p>\n<p>所有人轉頭看他。<\/p>\n<p>「破台。」陳守一說，「我會。毋免錢。一碗粥就好。」<\/p>\n<hr class=\"sep\">\n<p>他等到半夜。<\/p>\n<p>雨停了。空地上很暗，只有戲台邊上一盞電土燈還亮著。戲班的人都在台後的棚子裡睡了，只有旺伯沒睡，坐在一張戲箱上，披著一件舊棉襖，看著他。<\/p>\n<p>陳守一從布袋裡拿出那只銅鈴。<\/p>\n<p>十八年了，這只鈴他很少拿出來。鈴身被他的手摸得很亮，邊緣有一道小小的凹痕，是那年滿月夜，師父摔在石階上的時候撞出來的。<\/p>\n<p>他上了台。<\/p>\n<p>台很小，木板在他腳底下吱吱響。他從台的左邊走到右邊，再從右邊走回左邊，一步一步，照師父教的步子。走三步，停一下，再走三步。走到台中間，他站住，右手舉鈴，左手捏一個訣，指頭彎成一個師父當年手把手掰給他看的形狀。<\/p>\n<p>他搖了鈴。<\/p>\n<p>一下，兩下，三下。<\/p>\n<p>鈴聲在空地上傳開，很清，很遠。台前那盞電土燈的火晃了一下，又站直了。<\/p>\n<p>他唸了一段很短的咒，是師父每次進一個新地方之前都會唸的那一段。唸完，他把左手往外一翻，翻掌，收指，在最後一個指頭收起來之前，小指往上勾一下。<\/p>\n<p>那個小小的勾，是師父的習慣。陳守一從來不知道那一勾有什麼用，師父也沒說過。他只是學起來了，學得跟呼吸一樣自然。<\/p>\n<p>他下了台。<\/p>\n<p>旺伯從戲箱上站起來。<\/p>\n<p>他站得很慢，膝蓋在棉襖底下響了一聲。他看著陳守一，嘴唇在動，像在嚼什麼東西。<\/p>\n<p>「你最後彼下，」他說，「手指頭勾彼下。」<\/p>\n<p>陳守一停住。<\/p>\n<p>「啥人教你的？」<\/p>\n<p>「阮師父。」<\/p>\n<p>旺伯又看了陳守一一陣子。電土燈的光從側面照過來，照得他臉上每一道皺紋都很深。<\/p>\n<p>「恁師父，」他說，「敢是姓葛？」<\/p>\n<hr class=\"sep\">\n<p>戲班的戲箱有十幾口，最舊的一口在最底下。<\/p>\n<p>旺伯叫醒天官，兩個人把上面的箱子一口一口搬開，搬到最後，露出一口黑漆漆的木箱，漆都剝了，箱角包的銅片長滿了綠鏽。箱蓋上用白漆寫著三個字，已經淡得快看不見了：瑞春班。<\/p>\n<p>「這口箱，」旺伯說，「是阮班上早的箱。光緒年間就有矣。」<\/p>\n<p>他打開箱蓋。<\/p>\n<p>一股很老的味道衝出來。樟腦，霉，舊布，還有一點點香灰。箱子裡是一疊一疊摺好的舊戲服，顏色都褪了，最上面一件是小孩穿的，粉紅色的，很小，袖口繡著一圈已經發黑的銀線。<\/p>\n<p>旺伯沒有碰那件小衣服。他把手伸到旁邊，伸進戲服和箱壁之間的縫，摸了很久，摸出一本冊子。<\/p>\n<p>很薄。藍色的布面，四個角都磨破了，用棉線裝訂。封面上寫著兩個字：<\/p>\n<p class=\"beat\"><strong>班簿<\/strong><\/p>\n<p>字很醜。<\/p>\n<p>陳守一盯著那兩個字。<\/p>\n<p>「葛仔寫的。」旺伯說，「伊老爸是阮班的鼓手，伊佇阮班內出世，佇戲箱頂睏大漢的。全班干焦伊會曉寫字，是較早一个寫戲文的先生教的。伊八歲就替阮寫班簿。啥人入班，啥人出班，啥人欠班主幾角，攏伊寫。」<\/p>\n<p>陳守一接過那本冊子。<\/p>\n<p>他翻開第一頁。<\/p>\n<p>光緒十九年，癸巳。一行一行的名字，旁邊寫著角色：老生、小旦、三花、鼓、吹。每一個字都歪歪扭扭的，有的大，有的小，「班」字的兩個王寫得一高一低，像兩個在吵架的人。<\/p>\n<p>他翻到第二頁，第三頁。字慢慢變好看了一點，可是還是醜。一個八歲、九歲、十歲的孩子，很認真、很用力地，把每一個大人的名字寫在格子裡。<\/p>\n<p>他看著那些字，忽然笑出來。<\/p>\n<p>笑出聲了。在半夜的空地上，笑得肩膀一直抖。旺伯和天官看著他，不知道他在笑什麼。<\/p>\n<p>「歹勢。」陳守一說，用手背擦了一下眼睛，「我一直以為，阮師父的字足媠。」<\/p>\n<p>他從小看師父寫字。寫符、寫手札、寫藥方，一筆一筆，又穩又好看。他寫不出來，練了三年也寫不出來，師父從來沒說過什麼。<\/p>\n<p>原來師父的字，以前也這麼醜。<\/p>\n<hr class=\"sep\">\n<p>他一頁一頁往後翻。<\/p>\n<p>丁酉年。那一年的最後一頁，有一行小字，寫在格子外面：<\/p>\n<p class=\"doc\">青崖隨師父往大坑口。<\/p>\n<p>字已經好看多了。陳守一記得師父說過，十二歲，跟師父去大坑口，封一口井，怕得尿褲子。<\/p>\n<p>「師父」兩個字，比旁邊的字寫得用力。<\/p>\n<p>「恁師祖，」旺伯說，「較早是阮班隨班的師公。阮班去到佗，伊就綴到佗，破台、送煞、看日。葛仔十二歲彼年，伊共葛仔收做徒弟。」<\/p>\n<p>「師祖是怎樣的人？」陳守一問。<\/p>\n<p>旺伯想了想。<\/p>\n<p>「足少講話。」他說，「足厲害。厲害到……」他停了一下，搖搖頭，「我毋知欲按怎講。」<\/p>\n<p>陳守一沒有再問。他繼續翻。<\/p>\n<p>戊戌年。己亥年。<\/p>\n<p>己亥年那一頁，名字比之前少了幾個。格子裡的字很工整，一筆都沒有歪。寫到中間，有一行被墨塗掉了。塗得很黑，很厚，一層又一層，墨把紙吃穿了，透到下一頁，下一頁的背面也有一團黑。<\/p>\n<p>再往後，就沒有了。己亥年之後的每一頁都是空白的。<\/p>\n<p>陳守一抬頭看旺伯。<\/p>\n<p>旺伯沒有看他。他看著那盞電土燈。<\/p>\n<p>「彼年了後，」他說，「葛仔就無閣寫矣。伊綴恁師祖走，無轉來。」<\/p>\n<p>他從那本班簿最後一頁的夾縫裡，抽出一張紙。<\/p>\n<p>紙摺成很小的四方形，摺痕都磨白了。旺伯打開來，攤平，放在戲箱蓋上，推到陳守一面前。<\/p>\n<p>「辛丑年，」旺伯說，「伊寄來的。予全班的。」<\/p>\n<hr class=\"sep\">\n<p>那是一封信。<\/p>\n<p>字比班簿上的又好看了一些，已經有一點師父後來的樣子。可是收尾的地方還是很急，像一個十六歲的少年，寫得很快，怕自己寫到一半就寫不下去了。<\/p>\n<p>&gt; 班主及班內諸位：<br>&gt;<br>&gt; 辛丑年三月，霧川渡夜有叩門三聲者，十餘戶，次日皆不起。師父與青崖往，封之於河，鎮符寄土地廟。<br>&gt;<br>&gt; 師云：來者非伊，乃他物借其形。<br>&gt;<br>&gt; 青崖不敢不信。<br>&gt;<br>&gt; 自此以後，班內諸位，莫再往霧川渡。上台之前，鞋頭照舊。<br>&gt;<br>&gt; 青崖　拜<\/p>\n<p>陳守一讀了一次。又讀了一次。<\/p>\n<p>霧川渡。叩門三聲。十餘戶。<\/p>\n<p>他的手按在那張紙上，按得很緊，指節都白了。<\/p>\n<p>一九三一年，師父在渡口擺七盞燈的時候，就已經見過它了。三十年前就見過了。師父什麼都沒說。師父帶他坐渡船，吐在包袱上，叫他自己洗，在客棧樓下吃陽春麵，把滷蛋夾給他，說自己牙痛。師父什麼都知道。<\/p>\n<p>「伊，」陳守一說，聲音很乾，「是啥人？」<\/p>\n<p>旺伯沒有回答。<\/p>\n<p>「來者非伊。」陳守一說，「這个『伊』，是啥人？」<\/p>\n<p>旺伯把那封信摺回去，摺得很慢，沿著原來的摺痕，一折，一折，摺成那個很小的四方形，夾回班簿最後一頁。<\/p>\n<p>他把班簿放回箱子裡，放在那件粉紅色的小戲服旁邊。<\/p>\n<p>「明仔暗，」他說，「戲煞，我才講。」<\/p>\n<p>他蓋上箱子。<\/p>\n<p>「今暗，我講袂出來。」<\/p>\n<hr class=\"sep\">\n<p>那晚陳守一睡在戲棚後面，睡在兩口戲箱中間。<\/p>\n<p>棚子裡很冷，風從帆布的縫隙灌進來。戲班的人橫七豎八地睡著，天官在打呼，阿炳睡覺的時候還抱著他的胡琴。阿桃睡在旺伯腳邊，身上蓋著一件舊戲服，露出一隻小腳。<\/p>\n<p>陳守一睡不著。<\/p>\n<p>他躺在那裡，看著棚頂的帆布。帆布上有一塊破洞，透進來一小塊天，天上有一顆星。<\/p>\n<p>他想起師父的臉。<\/p>\n<p>他很怕想不起來。十八年前，在客棧的樓梯上，他交出去一點點，只是一點點，心口一輕，就想不起師父長什麼樣子了。他後來拒絕了，那張臉回來了，可是從那以後，每隔一陣子，他就要在心裡把師父的臉從頭到尾畫一次，確定都還在。<\/p>\n<p>額頭。眉毛，左邊比右邊淡一點。鼻子。嘴，說話的時候嘴角會先往下撇。笑的時候，眼角的紋，左邊三條，右邊四條。<\/p>\n<p>都還在。<\/p>\n<p>他又想起另一張臉。一張他從來沒見過的、十二歲的、八歲的臉。一個在戲箱上睡大的孩子，趴在箱蓋上，握著一支比手還粗的毛筆，一筆一筆地，把大人的名字寫進格子裡。寫得很醜。被大人笑。不哭，下一頁再寫好看一點。<\/p>\n<p>阿桃在睡夢裡翻了一個身，那隻小腳縮回戲服底下去了。<\/p>\n<p>陳守一閉上眼睛。<\/p>\n<p>他想，師父八歲的時候，大概也是這樣，睡在某個大人的腳邊，蓋著一件戲服。<\/p>\n<p>天快亮的時候，他聽見阿炳醒了。老人坐起來，在黑暗裡調了調弦，拉了兩個很輕的音，又停下來，好像怕吵醒誰。<\/p>", "chars": 5786}, "36": {"title": "第三十六章　河祭", "html": "<p class=\"era\">一九四九年，落雁街。<\/p>\n<p>第二天晚上，台下坐了九個人。<\/p>\n<p>旺伯從布幕後面探頭數了兩次，數完，回頭跟天官說：「比昨昏加五个。」說得很得意，好像那五個人是他一個一個拉來的。<\/p>\n<p>其中一個是豆菜阿婆。她說她是來看陳守一的，看他是不是真的被拐去學戲。<\/p>\n<p>陳守一坐在最後一排。<\/p>\n<p>今天沒有扮仙，演的是一齣武戲，天官換了一身黑靠，背上插著四面旗子，在那個小小的台上翻了一個跟斗，落地的時候整座台晃了一下。台下的小孩拍手。阿桃演一個丫鬟，只有兩句詞，她講得很大聲，講完偷偷往台下看，看到陳守一，眼睛彎了一下。<\/p>\n<p>她上台前，鞋子還是脫在台邊，鞋頭朝外。<\/p>\n<p>阿炳坐在台側拉胡琴。他拉得很穩，一隻眼睛閉著，另一隻半睜，好像在看很遠的地方。<\/p>\n<p>戲散的時候，天上沒有雨。月亮出來了，不太圓，缺了一角。<\/p>\n<hr class=\"sep\">\n<p>旺伯把他帶到戲棚後面那口舊戲箱旁邊。<\/p>\n<p>箱子已經打開了。那件粉紅色的小戲服，被拿出來摺好，放在箱蓋上。旁邊是那本藍布面的班簿，翻在己亥年那一頁。<\/p>\n<p>旺伯坐下來。他從懷裡摸出一個小酒瓶，扭開，自己喝了一口，又遞給陳守一。<\/p>\n<p>陳守一搖頭。<\/p>\n<p>「你毋食酒？」<\/p>\n<p>「我十七歲。」<\/p>\n<p>旺伯看著他，笑了一下，笑得很苦。「你十七歲，」他說，「我嘛捌二十歲。」<\/p>\n<p>他把酒瓶放在腳邊。<\/p>\n<p>「彼年，我二十歲。」<\/p>\n<hr class=\"sep\">\n<p>他講得很慢。<\/p>\n<p>己亥年，夏天。瑞春班從南邊一路搬上來，搬到霧川渡，原本只是要在沈家門口搬三暝謝平安。第一暝還沒搬完，就開始落雨。<\/p>\n<p>落了七天七夜。<\/p>\n<p>河水一天漲一尺，漲到第五天，渡頭的石階一級一級被吃掉，漲到第七天，主街淹到膝蓋。上游沖下來豬、雞、門板、棺材。對岸有一整排厝倒進河裡，連人帶厝，一聲都沒有。<\/p>\n<p>戲班困在沈家的護龍裡，出不去。<\/p>\n<p>「第七暝，」旺伯說，「廟裡起乩。」<\/p>\n<p>他講的時候，眼睛看著那件粉紅色的小戲服。<\/p>\n<p>「渡頭彼間廟。乩童跳到半暝，跳甲歸身軀是血，坐落來，用一个毋是伊家己的聲講——」<\/p>\n<p>他停了一下。嘴唇動了動，又停了。<\/p>\n<p>「講啥？」陳守一問。<\/p>\n<p>旺伯拿起酒瓶，又喝了一口。<\/p>\n<p>「河神愛一个囡仔。」<\/p>\n<hr class=\"sep\">\n<p>棚子外面，有一隻狗在叫。叫了兩聲，又不叫了。<\/p>\n<p>「沈家的老爺，」旺伯說，「彼陣三十幾歲，猶未是老太爺。伊招鎮內有頭有面的人，佇伊兜的大廳開會。開到天光。」<\/p>\n<p>「我毋知怹講啥。我是做戲的，無資格入去。我干焦知影，天光了後，管家來護龍揣阮班主。」<\/p>\n<p>他的手放在膝蓋上，那隻摔壞的膝蓋。手指一直在搓褲子上的一個破洞，搓來搓去。<\/p>\n<p>「阮班主是一个……」他找了很久的字，「足驚死的人。伊驚大水，驚欠錢，驚沈家。管家提一袋銀出來，囥佇桌頂，講：恁是外地人，囡仔嘛毋是鎮內的。」<\/p>\n<p>「伊收矣。」<\/p>\n<p>陳守一沒有說話。<\/p>\n<p>「阮班內，」旺伯說，「有一个細漢旦。七歲，八歲，我毋知。伊是去予人揀著的，阮班主佇廟口撿著伊，伊老母死佇路邊。伊佇班內大漢，佮葛仔仝款，佇戲箱頂睏大漢的。」<\/p>\n<p>他抬頭，看著陳守一。<\/p>\n<p>「伊是全班唱上好聽的。」<\/p>\n<hr class=\"sep\">\n<p>旺伯講她唱歌的樣子。<\/p>\n<p>她站在戲台上，個子還沒有台邊的欄杆高，要踮著腳才看得見台下。可是她一開口，台下就靜了。賣枝仔冰的停下來，吵架的停下來，連在台前追來追去的狗都停下來。<\/p>\n<p>「伊的聲，」旺伯說，「毋是大，是清。清甲若像會使看著底。」<\/p>\n<p>她最喜歡一首小調。不是戲裡的，是她自己不知道從哪裡學來的，也許是她老母教的。很短，很輕快，甜甜的，她洗戲服的時候唱，等上台的時候唱，睡覺前也唱。<\/p>\n<p>阿炳那時候十五歲，剛學胡琴，什麼都拉不好，只有那首拉得好。因為她天天唱，他天天跟著拉。<\/p>\n<p>「葛仔，」旺伯說，「教伊寫字。」<\/p>\n<p>陳守一抬起頭。<\/p>\n<p>「伊攏叫葛仔『青崖兄』。」旺伯說，「葛仔大伊六七歲，去綴恁師祖學法了後，逐擺轉來班內，就提一枝筆，佇戲箱蓋仔頂教伊寫家己的名。伊寫甲足穤。比葛仔細漢的時陣閣較穤。」<\/p>\n<p>他的嘴角動了一下，好像想笑，沒有笑出來。<\/p>\n<p>「伊干焦會曉寫家己的名。」<\/p>\n<hr class=\"sep\">\n<p>「彼暗，」旺伯說，「雨停矣。」<\/p>\n<p>雨停了。七天以來第一次停。可是河水沒有退，黑黑的，平平的，月亮照在上面，一點波紋都沒有。<\/p>\n<p>整個霧川渡的人都來了。站滿了渡頭的石階，站滿了碼頭，站到主街上。點著火把。沒有人講話。<\/p>\n<p>他們跟她說，要她去唱戲。唱給河神聽。唱完，就可以回來。<\/p>\n<p>她換上了那件粉紅色的戲服。<\/p>\n<p>不對。旺伯停下來，看了一眼箱蓋上那件小衣服。<\/p>\n<p>「伊本來欲穿這領。」他說，「穿起來了，閣脫落來。伊講這領是上台穿的，袂使沾著水，沾著水就毀了，班主會罵。伊換穿家己的舊衫。」<\/p>\n<p>陳守一看著那件粉紅色的小戲服。袖口一圈銀線，黑了。五十年，摺得整整齊齊，沒有沾過一滴水。<\/p>\n<p>「伊行到渡頭上低彼級。」旺伯說，「竹排仔已經縛好矣，佇水面浮咧。伊欲踏上去以前，蹲落來，共伊的鞋仔褪落來。」<\/p>\n<p>他的聲音停了一下。<\/p>\n<p>「擺佇石階頂。鞋頭向外。」<\/p>\n<p>陳守一的手指收緊了。<\/p>\n<p>「阮班的規矩。」旺伯說，「上台以前，鞋仔褪佇台邊，鞋頭向外。落台的時陣，跤一伸，就穿會落去，就會使轉去。這是阮師父的師父傳落來的，講戲台是神明的所在，鞋頭向外，神明就知影，你上去是暫時的，你會落來。」<\/p>\n<p>「伊以為是上台。」<\/p>\n<p>陳守一閉上眼睛。<\/p>\n<p>他看見一九三一年的霧川渡。一間一間的門檻後面，草鞋鞋頭朝外。那些在床上嘴角帶著笑的人。那些被她領著，走上石階，走上一個看不見的戲台的人。<\/p>\n<p>他看見師父躺在最下一級石階上。那雙布鞋，鞋頭朝外。<\/p>\n<p>他把它轉了回來。<\/p>\n<hr class=\"sep\">\n<p>「伊坐佇竹排仔頂。」旺伯說，「怹叫伊唱，伊就唱。唱彼條伊上愛的小調。」<\/p>\n<p>「阿炳佇岸頂拉胡琴。」<\/p>\n<p>陳守一睜開眼睛。<\/p>\n<p>「班主叫伊拉的。」旺伯說，「伊十五歲，毋敢毋拉。伊一邊拉一邊哭，拉甲音攏走去，伊佇竹排仔頂閣咧共伊笑，叫伊拉較正咧。」<\/p>\n<p>旺伯把酒瓶拿起來，發現是空的，又放下。<\/p>\n<p>「乩童講，愛等到子時正，閣過一刻。」<\/p>\n<p>「時辰一到，沈家老爺舉手。有人共竹排仔推出去。」<\/p>\n<p>他的手在膝蓋上停住了。<\/p>\n<p>「有一个撐船的少年家，衝落去，欲共索仔扭轉來。伊徒手扭，索仔予水拖咧走，絞過伊的手心，兩隻手的皮攏絞去，血流甲滿手。後來予三四个人揤佇塗跤，揤咧，揤到竹排仔看袂著。」<\/p>\n<p>「你咧？」陳守一問。<\/p>\n<p>他問得很輕。<\/p>\n<p>旺伯看著他。<\/p>\n<p>「我提火把。」旺伯說，「我徛佇班主邊仔，提火把，替怹照路。」<\/p>\n<p>他低下頭。<\/p>\n<p>「我一句話都無講。」<\/p>\n<hr class=\"sep\">\n<p>棚子裡很安靜。<\/p>\n<p>陳守一聽得見阿桃在睡夢裡磨牙，聽得見天官的鼾聲，聽得見風從帆布縫裡進來，吹得電土燈的火一歪一歪。<\/p>\n<p>「我師父咧？」他問，「伊佇佗位？」<\/p>\n<p>「佇我邊仔。」旺伯說，「十四歲。徛甲直直，一動都無動。伊無哭，嘛無講話。我原本以為伊會衝落去，伊無。」<\/p>\n<p>「伊後來共我講，伊毋敢。伊講，伊驚。」<\/p>\n<p>旺伯停了一下。<\/p>\n<p>「恁師祖彼暗無佇咧。」他說，「伊講伊去廟裡。我毋知去創啥。」<\/p>\n<p>他說得很平，像隨口一提，沒有再往下說。<\/p>\n<p>「隔轉工，水就退矣。」<\/p>\n<p>退得很快。一個早上，河水退回河道，渡頭的石階一級一級露出來，濕濕的，亮亮的。最下一級的石階上，擺著一雙小小的布鞋，鞋頭朝外。<\/p>\n<p>沒有人敢去撿。<\/p>\n<p>「葛仔去撿的。」旺伯說，「伊撿起來，抱佇胸前，轉來戲班，一句話都無講。」<\/p>\n<p>「彼工下晡，班主叫伊提班簿出來，叫伊共伊的名塗掉。講伊無佇咱班過，講這个人無存在，以後啥人都莫閣講。」<\/p>\n<p>旺伯把手放在那本班簿上，放在己亥年那一頁，那一團黑得透到背面的墨上。<\/p>\n<p>「伊塗一逝。閣塗一逝。閣塗。塗到紙破去，塗到墨透過去後一頁。伊無哭，一直塗。」<\/p>\n<p>「塗煞，伊就綴恁師祖走矣。無閣轉來。」<\/p>\n<hr class=\"sep\">\n<p>陳守一看著那團墨。<\/p>\n<p>「伊叫啥名？」他問。<\/p>\n<p>旺伯張開嘴。<\/p>\n<p>他的嘴張著，停在那裡，像一個人走樓梯，以為還有一級，一腳踩空。<\/p>\n<p>他皺起眉頭。他看著那件粉紅色的小戲服，看著那團墨，看著自己的手。他的嘴唇動了好幾次，每一次都像要說出一個字，每一次那個字都沒有出來。<\/p>\n<p>「我……」<\/p>\n<p>他的手開始抖。<\/p>\n<p>「我叫伊五十冬。」他說，「逐暗。我逐暗攏會想著伊。我會記得伊的聲，會記得伊踮跤，會記得伊共阿炳笑。我會記得伊的鞋仔。」<\/p>\n<p>「我講袂出來伊的名。」<\/p>\n<p>他看著陳守一，眼睛紅了，像一個在大街上把孩子弄丟的人。<\/p>\n<p>「我毋是毋講。」他說，「我是無去矣。五十冬前，伊的名，佇我的頭殼內，就無去矣。佮葛仔塗掉的時陣仝款，攏無去矣。」<\/p>\n<p>陳守一沒有動。<\/p>\n<p>他想起師父泡腳的時候，一直哼的那支歌。往下沉，往下沉，像要把什麼東西放進很深的地方。他想起師父臨死前抓著他的手腕，說，不能殺，她是一個囡仔。<\/p>\n<p>師父知道是誰。只是三十年來，師父不敢信，一直到最後那一夜。<\/p>\n<p>可是師父也叫不出她的名字。<\/p>\n<hr class=\"sep\">\n<p>那封信還夾在班簿的最後一頁。陳守一沒有再拿出來看。他記得上面寫什麼。<\/p>\n<p>師云：來者非伊，乃他物借其形。<\/p>\n<p>青崖不敢不信。<\/p>\n<p>「恁師祖講毋是伊。」旺伯說，好像知道他在想什麼，「講是別物，借伊的形。」<\/p>\n<p>「你相信嗎？」<\/p>\n<p>旺伯看著那件小戲服，看了一陣子。<\/p>\n<p>「我想欲相信。」他說，「五十冬，我逐工都想欲相信。」<\/p>\n<hr class=\"sep\">\n<p>旺伯回去睡了以後，陳守一一個人坐在戲箱旁邊。<\/p>\n<p>月亮移到帆布的破洞上面，漏下來一小塊白，落在那件粉紅色的戲服上。<\/p>\n<p>他聽見背後有聲音。<\/p>\n<p>是阿炳。老人不知道什麼時候坐起來了，坐在棚子最暗的角落，懷裡抱著胡琴。他沒有看陳守一。他那隻閉著的眼睛一直閉著，那隻半睜的眼睛看著那件小戲服。<\/p>\n<p>他把琴弓放上去。<\/p>\n<p>陳守一的背整個僵住了。<\/p>\n<p>第一個音出來的時候，他就知道是哪一首。他在一九三一年的月光底下聽過，在月娥身後聽過，在渡口的坡上聽過，在一整個鎮的腳步聲裡聽過。甜的，黏的，像糖漿從屋簷上一滴一滴往下淌。<\/p>\n<p>可是阿炳拉得很慢。<\/p>\n<p>慢到每一個音都拉得很長，長到那股甜慢慢化開，化成另外一種東西。原本往上跳的地方，他讓它停一下；原本要轉個花腔的地方，他讓它直直地往下落。<\/p>\n<p>同一首曲子。拉慢了，就不甜了。<\/p>\n<p>就只是一個小孩子在唱歌。唱得很清，清得可以看見底。<\/p>\n<p>陳守一坐在那裡，一動也沒有動。他沒有叫阿炳停。<\/p>\n<p>阿炳拉完一遍，又從頭拉了一遍。拉到第二遍的中間，他的手停了一下，那隻半睜的眼睛眨了眨，又接下去。<\/p>\n<p>棚子的另一頭，阿桃翻了個身，在睡夢裡咕噥了一句什麼。<\/p>\n<p>阿炳拉完了，把琴弓放下來。他對著那件小戲服，很輕地，講了一句話。<\/p>\n<p>陳守一聽不清楚。<\/p>\n<p>他只看見老人的嘴型，像在叫一個人。兩個字。叫完，老人自己也愣住了，好像不知道剛剛從自己嘴裡出來的是什麼。<\/p>\n<p>然後他抱著胡琴，躺下去，背對著陳守一，睡了。<\/p>", "chars": 3970}, "37": {"title": "第三十七章　族譜", "html": "<p>沈言的電話是早上五點五十分打來的。<\/p>\n<p>周遠已經醒了。他醒了快一個小時，躺在床上，看著天花板一點一點變灰。耳朵裡還有那把胡琴的聲音，拉得很慢，慢到不甜。<\/p>\n<p>「我吵醒你了嗎？」沈言問。<\/p>\n<p>「沒有。」<\/p>\n<p>電話那頭有海浪的聲音，很遠，一下一下。還有一個很小的、塑膠袋窸窸窣窣的聲音，大概是林依在樓下準備開店。<\/p>\n<p>「我做夢了。」沈言說。<\/p>\n<p>她停了一下，好像在等他說什麼。他沒說話，她就自己接下去。<\/p>\n<p>「十二年，我一次都沒做過夢。吃藥那幾年，閉上眼睛就是黑的，張開眼睛就天亮了。藥停了以後也沒有。」她說，「昨天晚上，我夢到一條河。」<\/p>\n<p>周遠坐起來。<\/p>\n<p>「我坐在一個竹排上。」她說，「水是黑的，很平。岸上站滿了人，拿著火把。我在唱歌，唱一首很甜的歌。岸上有一個男生在拉胡琴，拉得很爛，一直走音，我一邊唱一邊笑他。」<\/p>\n<p>她的聲音很平靜。太平靜了，像是在背一段已經在心裡講過很多遍的東西。<\/p>\n<p>「然後竹排就動了。」<\/p>\n<p>周遠握著手機。<\/p>\n<p>「周遠，」沈言說，「岸上最大的那間房子，門口掛的燈籠，寫著『沈』。」<\/p>\n<hr class=\"sep\">\n<p>他們約在縣城客運站。<\/p>\n<p>沈言搭第一班車上來，兩個小時。她從車上下來的時候，背著一個帆布包，手上拎著一個寶特瓶，瓶子裡是深褐色的液體。<\/p>\n<p>「小依煮的冬瓜茶。」她把瓶子塞給他，「她說要給你試喝，她要拿去店裡賣。」<\/p>\n<p>周遠扭開喝了一口。<\/p>\n<p>很甜。甜到喉嚨發緊。<\/p>\n<p>「怎麼樣？」<\/p>\n<p>「很好喝。」<\/p>\n<p>沈言看著他的臉，看了兩秒，笑出來。「你說謊的時候，眉毛會動。」她把瓶子拿回去，自己也喝了一口，皺起臉，「我昨天就跟她說太甜了。她說海邊的人喜歡甜。」<\/p>\n<p>他們在客運站對面吃了兩碗陽春麵。沈言吃得很慢，把蔥一根一根挑出來，排在碗邊。她吃到一半，放下筷子。<\/p>\n<p>「我還記得別的。」她說。<\/p>\n<p>周遠抬頭。<\/p>\n<p>「不是夢。是霧川那兩個晚上。」她看著碗邊那排蔥，「以前我只記得醒過來在廟埕，你蹲在我旁邊，外套很臭。現在我都記得了。」<\/p>\n<p>她的手放在桌上，手指慢慢收起來。<\/p>\n<p>「我記得我去敲門。」她說，「我記得每一扇門。雜貨店那扇是鐵捲門，敲起來會晃。廟公家的門是木頭的，很舊，敲第三下的時候，裡面有人說『來矣』，好像他一直在等。」<\/p>\n<p>麵攤的老闆在旁邊切滷味，刀落在砧板上，咚，咚，咚。<\/p>\n<p>「我不是在旁邊看。」沈言說，「是我的手。是我的腳。我想停，停不下來，可是我看得很清楚。每一個人開門的臉，我都看得很清楚。」<\/p>\n<p>她抬起頭看他。<\/p>\n<p>「我是不是，」她說，「也算是做了這些事的人？」<\/p>\n<p>周遠沒有馬上回答。<\/p>\n<p>他想起夢裡的月娥。一九三一年，跪在沈家後院的石板上，說她看得見夜裡做的事，說得出每一個被敲門的人的名字，豆腐伯，打鐵的阿炎，碼頭的阿福。<\/p>\n<p>「九十五年前，」他說，「也有一個人這樣問過。」<\/p>\n<p>「誰？」<\/p>\n<p>「妳阿祖的阿母。」周遠說，「她叫月娥。」<\/p>\n<p>沈言看著他。<\/p>\n<p>「她後來，」周遠說，「自己去渡口，自己坐下來，自己開口唱。沒有人逼她。」<\/p>\n<p>他把那瓶冬瓜茶推回她面前。<\/p>\n<p>「妳也是。」<\/p>\n<hr class=\"sep\">\n<p>姑婆住在舊城區一條很窄的巷子裡。<\/p>\n<p>兩層樓的老街屋，一樓的門口擺滿了盆栽，都是蘭花，葉子擦得很亮。門沒有關，裡面的電視開著，八點檔重播，一個女人在哭喊。<\/p>\n<p>「阿姑。」沈言在門口喊了一聲。<\/p>\n<p>電視的聲音停了。一個六十幾歲的女人從裡面走出來，個子很小，頭髮燙得很捲，穿一件紫色的毛背心，手上拿著遙控器。她看見沈言，嘴角往下撇了一下，又看見沈言背後的周遠，嘴角撇得更下面。<\/p>\n<p>「轉來矣喔。」她說，「欲轉來嘛毋先講。我無煮妳的飯。」<\/p>\n<p>「我有食矣。」<\/p>\n<p>「食啥？」<\/p>\n<p>「麵。」<\/p>\n<p>「麵是飯嗎？」姑婆轉身往裡面走，「入來。鞋仔褪予好。」<\/p>\n<p>沈言彎腰脫鞋。周遠跟著脫，把兩雙鞋並排擺在門口，鞋頭朝內。<\/p>\n<p>他擺完才發現自己擺的方向，手停了一下。<\/p>\n<hr class=\"sep\">\n<p>姑婆從廚房端出一盤切好的蘋果，一盤滷肉，一鍋湯，擺在客廳的小桌上，說是剩菜，不吃就要倒掉。<\/p>\n<p>她坐在對面，看著周遠吃，看得很仔細。<\/p>\n<p>「你是警察？」<\/p>\n<p>「是。」<\/p>\n<p>「伊予警察掠去啦？」<\/p>\n<p>「阿姑。」沈言說。<\/p>\n<p>「我問一下嘛袂使。」姑婆說，夾了一塊滷肉放進沈言碗裡，「十二年前，嘛是警察共伊送去病院。伊彼陣十二歲，跤底攏是血，一句話都毋講，抱一罐藥仔，啥人欲提就咬啥人。」<\/p>\n<p>她看著周遠。<\/p>\n<p>「彼个警察，生做佮你有一點仔像。」<\/p>\n<p>周遠的筷子停了。<\/p>\n<p>沈言低下頭。<\/p>\n<p>「伊外媽過身了後，我就共伊接來飼。」姑婆說，「十八歲，家己去戶政事務所改名。沈和改做沈言。和平的和，伊講伊無愛閣聽人叫伊這个名。」她哼了一聲，「名是祖公號的，伊講改就改。」<\/p>\n<p>「阿姑，」沈言說，「我今仔日轉來，是欲看族譜。」<\/p>\n<p>姑婆的臉僵了一下。<\/p>\n<hr class=\"sep\">\n<p>族譜收在二樓神明廳，神桌底下一口樟木箱裡。<\/p>\n<p>神明廳很小，供著一尊觀音，旁邊是沈家的祖先牌位，黑底金字，一層一層往上排。香爐裡的香剛換過，煙很直。<\/p>\n<p>姑婆跪在地上，把樟木箱拖出來，打開。樟腦的味道衝上來，周遠想起夢裡那口戲箱，鼻子一酸。<\/p>\n<p>族譜是線裝的，藍色封面，一共三冊。姑婆拿出最下面那一冊，最舊的一冊，放在神桌上，沒有翻開。<\/p>\n<p>「這本，」她說，「阮阿爸講過，莫翻。」<\/p>\n<p>「為什麼？」<\/p>\n<p>「伊無講。」姑婆說，「伊只講，翻了，暗時會聽著水聲。」<\/p>\n<p>她看著沈言。沈言看著那本族譜。<\/p>\n<p>「阿姑，」沈言說，「我已經聽著矣。」<\/p>\n<p>姑婆沉默了一陣子。然後她伸手，自己把族譜翻開了。<\/p>\n<hr class=\"sep\">\n<p>周遠站在旁邊，看著那些名字。<\/p>\n<p>一頁一頁，從清朝的某一年開始，一個一個男人的名字，旁邊用小字註著配偶、生卒、葬地。翻到光緒年間，有一個名字旁邊的註特別長：<\/p>\n<p class=\"doc\">敬堂公。光緒年間承祖業，經營霧川渡碼頭、米行。樂善好施，修渡口石階、建城隍廟後殿……<\/p>\n<p>字寫得很好，很工整，一看就是請人寫的。<\/p>\n<p>下一頁，被撕掉了。<\/p>\n<p>撕得很乾淨，貼著裝訂線，只剩下一條很窄的紙邊，紙邊上留著半個字的尾巴，看不出是什麼字。<\/p>\n<p>周遠把族譜往檯燈底下挪了挪，彎下腰，臉貼近紙面。<\/p>\n<p>被撕掉那一頁的下一頁，空白的地方，有很淡的痕跡。不是墨，是壓痕。當年寫上一頁的人，筆下得很重，把字壓進了下一頁的紙裡。<\/p>\n<p>「阿姑，」他說，「有鉛筆嗎？」<\/p>\n<hr class=\"sep\">\n<p>姑婆找來一支削得很短的鉛筆。<\/p>\n<p>周遠把鉛筆斜著拿，用筆芯的側面，很輕很輕地在那片空白上來回塗。灰色一層一層鋪上去，壓痕的地方塗不到，就留下白色的筆畫。<\/p>\n<p>字一個一個浮出來。<\/p>\n<p>很多字壓得太淺，浮不出來。浮得出來的，斷斷續續的，像隔著一層霧看對岸：<\/p>\n<p>&gt; 己亥……六月……大水七日……<br>&gt; ……乩示……河神……<br>&gt; ……敬堂公率鄉老……議……<br>&gt; ……戲班……銀……<br>&gt; ……子正……推……<br>&gt; ……水退……闔鎮平安……<\/p>\n<p>最後一行比較清楚。<\/p>\n<p>&gt; 此事族中永不得提。<\/p>\n<p>沈言站在他旁邊，一直沒有說話。<\/p>\n<p>周遠放下鉛筆。他的手指沾滿了石墨，黑黑的。<\/p>\n<p>「戲班。」沈言說。<\/p>\n<p>她的聲音很輕。<\/p>\n<p>「我夢裡那個胡琴拉得很爛的男生，」她說，「他是戲班的，對不對？」<\/p>\n<p>周遠看著她。<\/p>\n<p>「他十五歲。」周遠說，「一邊哭一邊拉。後來，他拉了一輩子胡琴。」<\/p>\n<p>沈言的眼睛慢慢睜大了。<\/p>\n<p>「你怎麼……」<\/p>\n<p>「我也夢到了。」周遠說，「從另一邊。」<\/p>\n<hr class=\"sep\">\n<p>族譜後面還夾著幾張散頁。<\/p>\n<p>是帳。毛筆字，一行一行，記的是沈家歷年的開銷。修廟，添香油，請戲，請師公。其中有一行，每隔三年出現一次，一直出現，從辛丑年開始，一直到辛未年：<\/p>\n<p class=\"doc\">葛先生，謝金。<\/p>\n<p>辛未年那一行底下，有另外一個人的筆跡，加了一行小字：<\/p>\n<p class=\"doc\">葛先生歿於渡頭。<\/p>\n<p>再往下，民國二十一年，族譜正文的地方，有一個女人的名字：<\/p>\n<p class=\"doc\">沈門黃氏月娥。民國二十一年歿，產後。<\/p>\n<p>旁邊一個男孩的名字，同一年生。<\/p>\n<p>沈言伸出手，指尖碰了一下那個名字。月娥。她碰得很輕，像怕把它碰掉。<\/p>\n<p>「她生完孩子就走了。」沈言說。<\/p>\n<p>「嗯。」<\/p>\n<p>「她知道嗎？」沈言問，「她知道她肚子裡那個孩子，以後會一直傳下去，傳到我嗎？」<\/p>\n<p>周遠想起月娥跪在石板上，手按著肚子，說她怕孩子生出來，也有「伊」。<\/p>\n<p>「她知道。」他說，「她最怕的就是這個。」<\/p>\n<p>沈言把手收回來，握成拳頭，放在膝蓋上。<\/p>\n<hr class=\"sep\">\n<p>姑婆一直站在神明廳門口，沒有進來。<\/p>\n<p>周遠和沈言把族譜收好，放回樟木箱的時候，她才開口。<\/p>\n<p>「阮阿爸，」她說，「就是彼个囡仔。月娥生的彼个。」<\/p>\n<p>她看著那排牌位。<\/p>\n<p>「伊一世人毋敢倚河。」姑婆說，「厝邊的囡仔去溪仔掠魚，伊共阮關佇厝內，用竹仔捽。伊講沈家的人，袂使倚水。我細漢恨伊恨甲欲死。」<\/p>\n<p>她停了一下。<\/p>\n<p>「伊過身彼暗，我佇病院顧伊。伊半暝醒過來，一直問我，敢有聽著人咧唱歌。我講無啊，阿爸，無人咧唱。伊就哭矣。八十外歲的人，哭甲若囡仔。」<\/p>\n<p>沈言抬頭看她。<\/p>\n<p>「伊講啥？」<\/p>\n<p>姑婆搖搖頭。<\/p>\n<p>「伊講，」她說，「伊講對不起。毋知咧共啥人講。」<\/p>\n<hr class=\"sep\">\n<p>走的時候，姑婆塞給沈言一個塑膠袋，裡面是兩個保鮮盒，滷肉和湯，用橡皮筋綁了兩圈。<\/p>\n<p>「轉去愛熱。」她說，「莫食冷的。」<\/p>\n<p>「阿姑，我搭車要兩點鐘。」<\/p>\n<p>「兩點鐘袂歹去。」<\/p>\n<p>姑婆站在門口那一排蘭花中間，看著他們走到巷口。周遠回頭的時候，她還站在那裡，手上拿著遙控器，沒有進去。<\/p>\n<p>他開車送沈言去客運站。路上沈言一直很安靜，抱著那袋滷肉，看著窗外。快到車站的時候，她忽然開口。<\/p>\n<p>「周遠。」<\/p>\n<p>「嗯。」<\/p>\n<p>「那個女孩，」她說，「在竹排上，她一直在看一個人。不是拉胡琴的那個，是另一個。站在拉胡琴的人旁邊，比較高，一直站著不動的那個男生。」<\/p>\n<p>周遠握著方向盤。<\/p>\n<p>「她一直看著他，」沈言說，「一直唱，一直看。到竹排被推出去，她都還在看。」<\/p>\n<p>她把那袋滷肉抱緊了一點。<\/p>\n<p>「她以為他會來。」<\/p>\n<p>紅燈。周遠把車停下來。車窗外，客運站的看板一格一格地亮，往海尾的末班車，還有四十分鐘。<\/p>\n<p>他沒有告訴她，那個男生後來又活了三十二年，泡腳的時候一直哼一首歌，到死都沒有叫出她的名字。<\/p>\n<p>綠燈亮了。他踩下油門。<\/p>\n<p>沈言下車前，把那瓶喝了一半的冬瓜茶留在他的副駕駛座上。<\/p>\n<p>「你帶回去。」她說，「說謊要負責。」<\/p>", "chars": 3772}, "38": {"title": "第三十八章　名單", "html": "<p>周遠把冬瓜茶喝完了。<\/p>\n<p>很甜。他一口一口喝，喝到最後一口，瓶底沉著一層糖，他把瓶子倒過來敲了兩下，敲不出來，就算了。<\/p>\n<p>那天晚上他沒有做夢。他坐在客廳，開著一盞燈，在記事本上寫字。<\/p>\n<p class=\"doc\">敬堂公率鄉老。<\/p>\n<p class=\"doc\">戲班，銀。<\/p>\n<p class=\"beat\"><strong>乩示。<\/strong><\/p>\n<p>他在「鄉老」兩個字底下畫了一條線，又畫一條。<\/p>\n<hr class=\"sep\">\n<p>「一八九九年？」<\/p>\n<p>小方抱著她的大保溫杯，站在白板前面，把那三個字念了一遍，像在念一個外國地名。<\/p>\n<p>「日治時期的戶口調查簿是一九〇五年才開始的。」她說，「再往前，就只有清朝的地方志、族譜、廟裡的碑。地方志不會寫到這麼小的鎮。族譜你也看到了，會撕。」<\/p>\n<p>「碑。」周遠說。<\/p>\n<p>「什麼碑？」<\/p>\n<p>周遠翻開記事本，給她看那行從族譜上拓下來的字：修渡口石階，建城隍廟後殿。<\/p>\n<p>「蓋廟會立碑。」他說，「誰出錢，出多少，刻在上面。」<\/p>\n<p>小方看著那行字，看了一會兒。<\/p>\n<p>「如果是大水過後馬上蓋的，」她說，「就是一張謝神的名單。」<\/p>\n<p>她把保溫杯放下來。<\/p>\n<p>「組長，」她說，「霧川鎮還封著。」<\/p>\n<p>「我知道。」<\/p>\n<p>「你要我跟你偷偷進去拓一塊碑。」<\/p>\n<p>「白天。」周遠說，「不算偷偷。」<\/p>\n<p>小方瞪著他，瞪了三秒，轉身去鑑識室拿她的相機包。<\/p>\n<p>「加班今天要一個人在家了。」她說，「你要負責。」<\/p>\n<hr class=\"sep\">\n<p>霧川的城隍廟不在主街上。<\/p>\n<p>要從廟埕後面一條小路往下走，走到以前的渡口。渡口早就沒有了，河道改過，現在那裡只剩下一片長滿芒草的河灘，和一道從河灘往上爬的石階。石階很舊，一級一級長滿青苔，有幾級已經斷了。<\/p>\n<p>石階的頂端，是一座很小的廟。<\/p>\n<p>周遠站在石階底下，看了很久。<\/p>\n<p>他認得這道石階。他在夢裡爬過很多次。他在最下一級看過師父仰躺在石頭上，長衫濕透，一雙布鞋擺在頭邊。他在這裡洗過血跡。他在這裡擺過三盞燈。<\/p>\n<p>「組長？」小方在他背後。<\/p>\n<p>「沒事。」<\/p>\n<p>他一級一級地往上爬。爬到中間，他的腳停了一下。那一級，他不用低頭看也知道，是最下一級往上數第七級，師父那天晚上第一次停下來搖鈴的地方。<\/p>\n<p>他繼續往上爬。<\/p>\n<hr class=\"sep\">\n<p>廟真的很小。<\/p>\n<p>屋簷的剪黏全掉光了，只剩下灰泥的底子。門楣上的匾換過，是新的，字是金的，寫著「霧川城隍廟」，可是匾底下的木框還是舊的，黑得發亮。<\/p>\n<p>廟門關著，沒有上鎖。周遠推開門。<\/p>\n<p>裡面很暗，一盞小小的紅燈亮在神案上，照著一尊被香煙燻黑的神像。神像不大，坐著，臉看不清楚。香爐裡沒有香，只有一層很厚的灰。<\/p>\n<p>碑在後殿。<\/p>\n<p>後殿比前殿還小，牆壁斑駁，地上鋪著一層落葉。碑立在牆角，半截埋在土裡，碑面長了一層綠苔。小方蹲下來，用軟毛刷一點一點把苔刷掉。<\/p>\n<p>字慢慢露出來。<\/p>\n<p class=\"doc\">重修霧川渡城隍廟後殿樂捐芳名<\/p>\n<p class=\"doc\">庚子年　仲春　立<\/p>\n<p>「庚子。」小方說，「一九〇〇年。大水後隔年。」<\/p>\n<p>碑的第一行，字刻得最大：<\/p>\n<p class=\"doc\">沈敬堂　捐銀壹佰大員<\/p>\n<p>底下，一行一行，名字和捐款，越往下字越小，錢越少。<\/p>\n<p>小方架好相機，一張一張拍。拍完，她拿出拓包和宣紙，用水把紙貼上碑面，等它半乾，再用拓包一下一下地拍。她拍得很專心，嘴唇抿著，額頭冒汗。<\/p>\n<p>周遠站在旁邊，一個名字一個名字地數。<\/p>\n<p>沈敬堂下面，四十二個名字。<\/p>\n<hr class=\"sep\">\n<p>那天晚上，他們在局裡的小會議室待到十一點。<\/p>\n<p>小方把拓片掃描進電腦，放大，一個名字一個名字打成表格。四十二個名字，四十二個姓。有的姓霧川現在還很多，有的姓已經沒有了。<\/p>\n<p>然後她把日治時期的戶口調查簿調出來。一九〇五年那一批，霧川渡，一戶一戶，戶主的名字，前戶主的名字，前戶主的父親。<\/p>\n<p>她一個一個對。<\/p>\n<p>周遠坐在她旁邊，看著表格一格一格地填滿。<\/p>\n<p>邱。碑上第十一行，邱阿添，捐銀伍員。一九〇五年戶口調查簿，邱阿添，戶主。他的兒子，邱旺。邱旺的兒子，邱水木。邱水木的兒子，邱永福。<\/p>\n<p>雜貨店。<\/p>\n<p>小方沒有說話，在那一格裡填上「邱永福」，往下一行。<\/p>\n<p>主街第六戶。碑上第二十三行。<\/p>\n<p>鎮公所的退休會計。碑上第五行。<\/p>\n<p>一格，一格，一格。<\/p>\n<p>到了晚上十點四十分，四十二格全部填滿了。四十二個碑上的名字，往下追三代、四代、五代，每一條線，最後都落在一戶門上有三個凹痕的人家。<\/p>\n<p>一戶都沒有多，一戶都沒有少。<\/p>\n<p>小方往後靠在椅背上。她的眼睛很紅，不知道是累的還是別的。<\/p>\n<p>「四十二。」她說，「還差一戶。」<\/p>\n<p>「廟公。」<\/p>\n<p>小方點頭。她把廟公的戶籍調出來。廟公的父親，廟公的祖父。<\/p>\n<p>廟公的祖父不在碑上。<\/p>\n<p>小方把祖父那一欄的戶口調查簿放大，指著職業欄。日文，手寫，墨色很淡。<\/p>\n<p class=\"beat\"><strong>童乩<\/strong><\/p>\n<hr class=\"sep\">\n<p>周遠是第二天去找廟公的兒子的。<\/p>\n<p>他五十幾歲，在縣城的一間汽車修理廠上班，霧川出事以後，他和太太、女兒被安置在縣立體育館後面的組合屋。周遠去的時候，他剛下班，手上還有機油，蹲在組合屋門口洗手。<\/p>\n<p>「我阿爸喔。」他聽周遠講完來意，用抹布擦著手，「伊一世人毋捌欠人。人攏講伊憨，廟仔的香油錢，一角都毋敢提。」<\/p>\n<p>「你阿祖呢？恁阿爸的阿公。」<\/p>\n<p>廟公的兒子手停了一下。<\/p>\n<p>「阮阿祖，」他說，「我無看過，阮阿爸嘛無看過。伊死的時陣，阮阿公才七、八歲。」<\/p>\n<p>他站起來，進組合屋裡去，翻了一陣子，拿出一個鐵盒子。是那種很舊的餅乾盒，蓋子上印著褪色的花。<\/p>\n<p>「這是阮阿爸逐工囥佇廟裡的。」他說，「出事了後，我去廟裡收的。」<\/p>\n<p>盒子裡是一雙很小的布鞋。<\/p>\n<p>舊得發黃，鞋底磨平了，鞋面上繡著一朵很小的花，線都斷了，只剩下花的輪廓。<\/p>\n<p>周遠盯著那雙鞋。<\/p>\n<p>「阮阿爸講，」廟公的兒子說，「這是阮阿祖留落來的。阮阿祖一世人干焦講一句話，講甲伊死。」<\/p>\n<p>「什麼話？」<\/p>\n<p>「彼句毋是我講的。」<\/p>\n<p>廟公的兒子把盒子蓋起來。<\/p>\n<p>「阮阿祖以前是童乩。」他說，「後來無閣起乩矣。一世人去掃土地公廟，掃到死。阮阿公大漢接伊掃，阮阿爸閣接阮阿公掃，掃到今仔日。我細漢問阮阿爸，彼句是佗一句。阮阿爸講，伊嘛毋知，阮阿公講阮阿祖無講。干焦講，彼句毋是伊講的，是別人借伊的喙講的。」<\/p>\n<p>他看著周遠。<\/p>\n<p>「警察先生，阮阿爸到底犯著啥？」<\/p>\n<p>周遠看著那個鐵盒子。<\/p>\n<p>一雙小小的布鞋。最下一級石階。鞋頭朝外。那天早上，十四歲的葛青崖撿起來，抱在胸前，抱回戲班。<\/p>\n<p>不是這一雙。<\/p>\n<p>「這雙鞋，」周遠說，「你阿祖是從哪裡拿到的？」<\/p>\n<p>「伊家己縫的。」廟公的兒子說，「阮阿爸講，阮阿祖袂曉做針黹，縫甲十指攏是空，縫規个冬天。縫好，嘛無送予人，就囥佇廟裡。」<\/p>\n<p>他把鐵盒子抱在膝蓋上。<\/p>\n<p>「阮阿祖講，伊有欠一个囡仔一雙鞋。」<\/p>\n<hr class=\"sep\">\n<p>周遠在組合屋外面的停車場坐了很久。<\/p>\n<p>他沒有發動車子。他坐在駕駛座上，看著擋風玻璃外面那一排一排的組合屋。天黑了，組合屋一間一間亮起燈，有人在煮飯，有小孩在哭，有電視的聲音。這些人都是霧川的人。兩百六十七個，還有他們留下來的家人，在這裡等，等有一天回家，等那四十三個人回來。<\/p>\n<p>那四十三個人。<\/p>\n<p>邱永福，對老人少找錢，對外地人亂開價。主街第六戶，打老婆。退休的會計，災後重建款去向不明。四十二戶，每一戶都欠著某個人什麼。這是他們自己的債。<\/p>\n<p>可是那扇門被敲響，不是因為這些。<\/p>\n<p>是因為一百二十七年前，他們的阿祖、阿祖的阿爸，站在渡口的石階上，拿著火把，看著一個七八歲的女孩被推進大水。然後隔年，拿出錢來，把自己的名字刻在一塊謝神的碑上。<\/p>\n<p>他想起沈言夢裡的那個女孩。在竹排上，一直唱，一直看。<\/p>\n<p>她以為他會來。<\/p>\n<p>周遠把頭靠在方向盤上。<\/p>\n<p>他不知道自己要不要救他們。<\/p>\n<p>他從當警察的第一天就知道，抓人不是因為你恨他，是因為他做了什麼。可是這一次，被抓走的人什麼都沒有做。做事的人早就死了，死了一百年。這筆債，從那個站在石階上一句話都沒說的人身上，一代一代傳下來，傳到一個每年種一大堆難吃芭樂、跟女兒說每天晚上九點要打電話的老人身上。<\/p>\n<p>這算公平嗎？<\/p>\n<p>如果不救，那個在竹排上的女孩，算不算終於討回了什麼？<\/p>\n<p>如果救，那她呢？<\/p>\n<p>手機響了。是小方。<\/p>\n<p>「組長，」她說，「你還在組合屋那邊？」<\/p>\n<p>「嗯。」<\/p>\n<p>「我剛剛把廟公祖父的戶口調查簿全部看完了。」小方說，「一九〇五年，他的職業欄寫童乩。一九〇六年，改成『無』。一九〇七年以後，寫『廟守』。」<\/p>\n<p>她停了一下。<\/p>\n<p>「還有，」她說，「組長，我阿公以前也做過很爛的事。我小時候我爸跟我說過，說他年輕時候在村子裡放高利貸，逼死過人。我爸一輩子不跟他講話。我阿公死的時候，我爸去了，站在最後面，連香都沒拿。」<\/p>\n<p>周遠抬起頭。<\/p>\n<p>「我一直以為，」小方說，「那是我阿公的事，跟我沒關係。」<\/p>\n<p>電話那頭，有一隻貓叫了一聲。<\/p>\n<p>「我只是想跟你說這個。」她說，「我要去餵加班了。」<\/p>\n<p>她掛了電話。<\/p>\n<hr class=\"sep\">\n<p>那天晚上，他又去了霧川。<\/p>\n<p>阿凱還在守封鎖線。他看見周遠的車，什麼都沒問，把封鎖線拉起來。<\/p>\n<p>「學長，」他在車窗外面說，「我媽說那個平安符，你要戴在身上，不能放在車上。」<\/p>\n<p>周遠把平安符從置物箱裡拿出來，放進胸前的口袋。阿凱這才放心地點點頭。<\/p>\n<hr class=\"sep\">\n<p>他一個人爬上那道石階。<\/p>\n<p>城隍廟的門還是沒有鎖。他推門進去，神案上那盞小紅燈還亮著。他在神案前站了一會兒，從口袋裡拿出一張黃紙。<\/p>\n<p>是他下午在金紙店買的。他在上面寫了四十三個名字，一個一個，寫得很慢，用他自己那手很醜的字。每一個「一」，收尾都勾著小鉤。<\/p>\n<p>最後一個名字，他寫的是廟公。<\/p>\n<p>他不知道該說什麼。他不是先生，不會唸咒，不知道哪一種紙該燒給哪一位神。他只知道這是城隍廟，城隍管一地的亡魂，管名字。<\/p>\n<p>「他們不見了。」他對著那尊看不清楚臉的神像說，「四十三個。我知道他們在哪裡。我不知道他們該不該回來。」<\/p>\n<p>神像沒有回答。<\/p>\n<p>「如果他們不該回來，」他說，「你告訴我。」<\/p>\n<p>他走到廟埕的金爐前，把那張黃紙點著，放進去。<\/p>\n<p>火很小，燒得很慢。黃紙一點一點捲起來，變黑，變灰。他蹲在金爐前面，看著它燒。燒完了，紙沒有散，保持著原來的形狀，灰白色的一片，平平地躺在爐底。<\/p>\n<p>他湊近看。<\/p>\n<p>字還在。燒過的墨比紙的灰更深一點，四十三個名字，一個一個，清清楚楚地印在那片灰上。<\/p>\n<p>每一個名字中間，都有一條線。<\/p>\n<p>很直，很細，從第一個字的左邊劃到最後一個字的右邊，像是有人拿一把尺，在一本簿子上，一行一行地，把它們劃掉了。<\/p>\n<p>他寫的時候，沒有劃。<\/p>\n<p>周遠蹲在那裡，一動也沒有動。風從石階底下吹上來，吹過金爐，那片灰輕輕抖了一下，散了。<\/p>\n<p>散成一爐灰，什麼字都看不出來了。<\/p>\n<hr class=\"sep\">\n<p>他走下石階的時候，回頭看了一眼。<\/p>\n<p>城隍廟的門開著一條縫，他記得自己出來的時候關上了。門縫底下，透出那盞小紅燈的光，很暗，很穩。<\/p>\n<p>他沒有回去關。<\/p>\n<hr class=\"sep\">\n<p>開到封鎖線，阿凱正蹲在巡邏車旁邊吃泡麵。看見他的車，站起來，麵還掛在嘴邊。<\/p>\n<p>「學長，有找到你要找的嗎？」<\/p>\n<p>周遠把車窗搖下來。<\/p>\n<p>「找到了。」<\/p>\n<p>阿凱把泡麵碗往前遞了遞。「你要不要吃？我還有一碗，鮮蝦的。」<\/p>\n<p>周遠看著那碗泡麵。熱氣從碗口冒出來，在冷風裡散得很快。<\/p>\n<p>他把車熄火，下車，在巡邏車旁邊蹲下來。阿凱跑回車上，拿出另一碗，撕開，倒進熱水瓶裡的水，蓋上蓋子，用一支原子筆壓著。<\/p>\n<p>「三分鐘。」阿凱說，「我媽說泡麵要等三分鐘，不然會傷胃。」<\/p>\n<p>他們蹲在封鎖線旁邊，等那三分鐘。山上很冷，霧川黑漆漆的，一盞燈都沒有。<\/p>\n<p>只有石階頂上，那座小廟的門縫底下，一直亮著。<\/p>", "chars": 4215}, "39": {"title": "第三十九章　擺渡人", "html": "<p>何靜打來的時候，是凌晨一點二十分。<\/p>\n<p>周遠還沒睡。他坐在客廳，把小方印給他的碑文拓片攤在茶几上，一個名字一個名字地看。手機一響，他就知道是誰。這個時間，只有兩種人會打給他：值班台，和何靜。<\/p>\n<p>「你醒著。」何靜說。<\/p>\n<p>不是問句。她的聲音很低，低到他要把手機貼緊耳朵才聽得清楚。<\/p>\n<p>「怎麼了？」<\/p>\n<p>「你聽。」<\/p>\n<p>電話那頭窸窸窣窣，像她拿著手機在走路。拖鞋踩在磁磚上的聲音。一扇門被推開。然後是水聲。很細的，一滴，一滴，滴在什麼東西上，有一點回音。<\/p>\n<p>周遠屏住呼吸聽。<\/p>\n<p>水聲。只有水聲。<\/p>\n<p>「你有聽到嗎？」何靜問。<\/p>\n<p>「水。」<\/p>\n<p>「只有水？」<\/p>\n<p>「只有水。」<\/p>\n<p>那頭安靜了一會兒。<\/p>\n<p>「我在浴室。」何靜說，「浴缸的排水孔。我刷完牙要關燈，聽到裡面有人在唱歌。一個小孩。很小，聲音很清。」她停了一下，「我錄音了。錄起來只有水。」<\/p>\n<p>周遠站起來，走到窗邊。外面的街很空，路燈一盞一盞亮著。<\/p>\n<p>「她在唱什麼？」<\/p>\n<p>「我不知道歌名。」何靜說，「可是我聽過。我很確定我聽過。我在這裡站了二十分鐘，一直想，一直想不起來是在哪裡聽的。」<\/p>\n<p>「妳唱給我聽。」<\/p>\n<p>「我唱歌很難聽。」<\/p>\n<p>「我也是。」<\/p>\n<p>何靜沒有笑。她吸了一口氣，開始哼。<\/p>\n<p>很慢。每一個音都拖得很長，原本該往上跳的地方，停一下；原本該轉個花腔的地方，直直地往下落。<\/p>\n<p>周遠握著手機，站在窗邊，一動也沒有動。<\/p>\n<p>他知道這首。三天前的晚上，他在夢裡，坐在一間漏雨的戲棚裡聽過。一個瞎了一隻眼的老人，抱著胡琴，對著一件粉紅色的小戲服，拉了兩遍。<\/p>\n<p>拉慢了，就不甜了。<\/p>\n<p>何靜哼完，停下來。<\/p>\n<p>「你知道這是什麼，對不對？」她說。<\/p>\n<p>「嗯。」<\/p>\n<p>「你不用跟我講。」何靜說，「我現在不想知道。我只是……」她的聲音頓了一下，「我只是不想一個人站在浴室裡。」<\/p>\n<p>周遠沒有掛電話。<\/p>\n<p>他們就那樣，一個在窗邊，一個在浴室，隔著手機聽著那滴水，聽到快兩點。後來何靜說她要去睡了，說謝謝，掛了。<\/p>\n<p>天亮以前，她又傳來一則簡訊。<\/p>\n<p class=\"doc\">今天晚上你有空嗎？我媽要見你。<\/p>\n<p class=\"doc\">她誤會了。你不用解釋。<\/p>\n<hr class=\"sep\">\n<p>何靜的媽媽住在縣城最東邊，靠溪的一排老公寓裡。<\/p>\n<p>溪叫霧川溪。從山上的霧川鎮流下來，流過石崗底下的山谷，流過三個鄉，流到這裡已經變得很寬、很慢，河灘上長滿了芒草，有人在河堤上騎腳踏車，有人在遛狗。<\/p>\n<p>周遠站在河堤上，往上游看了一會兒。<\/p>\n<p>「這條河，」何靜站在他旁邊，「我小時候阿嬤每年帶我來這裡點燈。就那裡。」她指著河堤下面一塊突出去的水泥平台，「點完就回家吃湯圓。我那時候以為十月十五是湯圓節。」<\/p>\n<p>她穿著便服，牛仔褲，灰色的大學T，頭髮放下來。周遠第一次看見她不紮頭髮的樣子。<\/p>\n<p>「妳媽，」周遠說，「她誤會什麼？」<\/p>\n<p>「她以為你是我男朋友。」何靜說，臉沒有任何表情，「我說你是警察，她更高興了，說警察很穩。我說你有一點神經病，她說男人都有一點。」<\/p>\n<p>她轉身往公寓走。<\/p>\n<p>「你不用解釋。」她又說了一次，「解釋了她會更高興。」<\/p>\n<hr class=\"sep\">\n<p>何媽媽六十出頭，退休前在郵局當了三十年櫃台。她開門的時候圍裙還沒脫，手上沾著麵粉，看見周遠，眼睛一下亮起來，從頭到腳打量了一遍，打量得很仔細，像在核對一封掛號信的收件地址。<\/p>\n<p>「周先生是不是？」她說，「入來入來。鞋免脫。我煮了很多，阿靜都說你一個人住，一定都吃外面。」<\/p>\n<p>「媽。」<\/p>\n<p>「我講事實嘛。」<\/p>\n<p>餐桌上擺滿了菜。滷豬腳，炒米粉，煎魚，一鍋薑絲蛤蜊湯，還有一大盤剛煎好的蘿蔔糕。何媽媽一直夾菜給他，夾到他的碗堆成一座小山。<\/p>\n<p>「阿靜從小就這樣，」何媽媽說，「什麼事都不講。前幾天她說要值夜班，我煮薑茶給她，後來我打去醫院找她，護理站說她那天休假。」<\/p>\n<p>何靜低頭吃米粉。<\/p>\n<p>「我不是要管她。」何媽媽說，看著周遠，「我只是想說，有人陪她就好。」<\/p>\n<p>周遠放下筷子。<\/p>\n<p>「她那天，」他說，「是跟我在一起。」<\/p>\n<p>何媽媽笑得眼睛都瞇起來了。何靜在桌子底下踢了他一腳。<\/p>\n<hr class=\"sep\">\n<p>吃完飯，何靜說要看阿嬤留下來的東西。<\/p>\n<p>「那箱喔？」何媽媽在洗碗，頭都沒回，「在妳以前的房間，衣櫃最上面。妳要那個做什麼？」<\/p>\n<p>「看一下。」<\/p>\n<p>那是一個紙箱，上面用奇異筆寫著「阿母」兩個字，膠帶已經黃了。何靜站在椅子上把它搬下來，放在她以前的書桌上。書桌上還貼著一張很舊的貼紙，一隻卡通小熊，耳朵已經磨掉了。<\/p>\n<p>她打開紙箱。<\/p>\n<p>裡面是一些衣服，摺得很整齊，一本存摺，一串念珠，幾張黑白照片。最底下，用報紙包著三樣東西。<\/p>\n<p>第一樣是一塊木板。<\/p>\n<p>長方形，大概手臂那麼長，邊緣被水泡得發軟，木紋都翹起來了。上面用紅漆寫著兩個字，漆掉了一大半，還看得出是：<\/p>\n<p class=\"beat\"><strong>何記<\/strong><\/p>\n<p>周遠伸手摸了一下那兩個字。<\/p>\n<p>紅漆，剝落的邊緣，「記」字最後一筆往下拖得很長。他在夢裡看過。一艘補了好幾塊不同顏色木板的舊船，船頭就是這兩個字。<\/p>\n<p>第二樣是一盞燈。<\/p>\n<p>鐵皮做的小油燈，很舊了，鏽得發黑，燈罩的玻璃裂了一條縫，用一圈膠布纏著。<\/p>\n<p>第三樣是一把刀。<\/p>\n<p>很小，刀身只有手掌長，木柄被手握得發亮，刀刃上全是鏽。刀柄的尾端，刻著一個很小的「何」字。<\/p>\n<p>何靜把三樣東西並排擺在書桌上。<\/p>\n<p>「這把刀，」她說，「我從來沒看過。」<\/p>\n<hr class=\"sep\">\n<p>照片只有一張是那個人的。<\/p>\n<p>很小一張，黑白，邊緣都捲起來了。一個很老很老的男人，坐在一張竹椅上，背後是一條河，河邊停著一艘船。他沒有看鏡頭，眼睛看著旁邊，好像拍照的人叫他看這裡，他不肯。他的兩隻手放在膝蓋上，掌心朝上，像是剛剛在給誰看什麼東西。<\/p>\n<p>照片背面寫著一行字，鉛筆，很淡：<\/p>\n<p class=\"doc\">阿公。民國三十年。<\/p>\n<p>周遠看著那張臉。<\/p>\n<p>駝背，很瘦，戴著一頂破斗笠，斗笠拿在手上。他記得這張臉。他記得這個人把斗笠拿下來，站在最下一級石階上，看著外衣底下的人，說了三個字。<\/p>\n<p>葛先生。<\/p>\n<p>「周遠？」<\/p>\n<p>他抬頭。何靜看著他，看得很仔細，跟她媽媽一樣仔細。<\/p>\n<p>「你認得他。」她說。<\/p>\n<p>「嗯。」<\/p>\n<p>「在哪裡？」<\/p>\n<p>周遠想了一下該怎麼說。他想到很多種說法，每一種都太長，每一種都需要先講另外一件事。<\/p>\n<p>「一九三一年，」他最後說，「他幫一個十七歲的男生，把他師父埋在城隍廟後面。他沒有收錢。他叫那個男生替師父穿鞋，說，行路愛穿鞋。」<\/p>\n<p>何靜看著那張照片。<\/p>\n<p>「他的手，」周遠說，「掌心各有一道疤。橫的。從虎口劃到小指底下。」<\/p>\n<p>照片上那兩隻放在膝蓋上的手，掌心朝上。照片太小，太舊，看不清楚。<\/p>\n<p>何靜把照片拿起來，湊到檯燈底下。<\/p>\n<p>然後她把照片放下，用手背擦了一下眼睛。<\/p>\n<p>「那份初診病歷的草稿，」她說，「我還留著。我後來想了好幾遍，如果是別人告訴我他夢見一九三一年，我還是會那樣寫。」<\/p>\n<p>「我知道。」<\/p>\n<p>「可是他的手，」何靜說，「我小時候就聽阿嬤講過。阿嬤說，她阿公的手掌有兩條線，像兩條索仔。我那時候以為是掌紋。」<\/p>\n<hr class=\"sep\">\n<p>何媽媽洗完碗，擦著手走進來，看見書桌上的東西，愣了一下。<\/p>\n<p>「那把刀喔。」她說，「阿嬤寶貝得要命，誰都不給碰。」<\/p>\n<p>「媽，妳知道這把刀是怎麼來的？」<\/p>\n<p>何媽媽在床沿坐下來。她看著那把刀，想了一下。<\/p>\n<p>「阿嬤講過，」她說，「是她阿公年輕的時候的刀。撐船的人都有一把，割索仔用的。有一年做大水，她阿公帶著這把刀去渡頭，要去割一條索仔。刀被人搶走了。」<\/p>\n<p>她伸出自己的手，比了一下。<\/p>\n<p>「他就用手去拉。拉不住。手皮都磨掉了。」<\/p>\n<p>何靜沒有說話。<\/p>\n<p>「後來刀有拿回來。」何媽媽說，「誰拿回來的，阿嬤沒講。可是她阿公從那以後，一輩子都沒有再用過這把刀。每年十月十五，就帶著刀跟燈，去河邊，點燈，蹲在那裡，聽很久。」<\/p>\n<p>「聽什麼？」周遠問。<\/p>\n<p>何媽媽看了他一眼。<\/p>\n<p>「阿嬤問過。」她說，「她阿公說，在聽一個人有沒有原諒他。」<\/p>\n<p>她嘆了一口氣，站起來。<\/p>\n<p>「我以前覺得那是迷信。」她說，「老人家都這樣，做錯一件事，記一輩子。阿嬤過世以後我就沒去點了，阿靜也忙，就這樣。」<\/p>\n<p>她走到門口，又回頭。<\/p>\n<p>「阿靜，」她說，「妳怎麼突然要看這些？」<\/p>\n<p>何靜沒有回答。<\/p>\n<hr class=\"sep\">\n<p>周遠和何靜離開的時候，已經九點多了。<\/p>\n<p>何媽媽堅持送他們到樓下。她站在公寓的鐵門口，手上抱著一個保鮮盒，裡面是剩下的蘿蔔糕，硬要塞給周遠。<\/p>\n<p>「你一個人住，」她說，「冰起來，早上煎一煎就可以吃。」<\/p>\n<p>周遠接過來。<\/p>\n<p>何媽媽沒有馬上進去。她站在那裡，看著河堤的方向，夜風吹過來，帶著溪水的味道。<\/p>\n<p>她嘴裡在哼一首歌。<\/p>\n<p>很輕，很慢。她自己好像都沒發現。每一個音拖得很長，原本該往上跳的地方停一下，原本該轉個花腔的地方，直直往下落。<\/p>\n<p>何靜停住腳。<\/p>\n<p>「媽。」<\/p>\n<p>「嗯？」<\/p>\n<p>「妳在唱什麼？」<\/p>\n<p>何媽媽愣了一下，好像這才發現自己在唱。<\/p>\n<p>「這條喔？」她笑了，「阿嬤唱給妳聽的啊。妳小時候很難睡，一定要聽這條才睡得著。阿嬤說，是她阿公教她的。她阿公說，是一個囡仔教他的。」<\/p>\n<p>她揮揮手。<\/p>\n<p>「去啦去啦，很晚了。路上小心。」<\/p>\n<p>鐵門關上了。<\/p>\n<p>何靜站在公寓樓下，沒有動。路燈照著她，照著她手上那個鐵皮燈。她出門前跟她媽說要借，何媽媽說借什麼借，本來就是妳的。<\/p>\n<p>「周遠。」<\/p>\n<p>「嗯。」<\/p>\n<p>「六年。」她說，「阿婆在松嶺住的那六年，每天晚上都在唱歌。全院的護理師都學會了，只有我學不會。我以為是我五音不全。」<\/p>\n<p>她看著手上那盞燈。<\/p>\n<p>「原來是因為我腦子裡，一直有另外一首。」<\/p>\n<hr class=\"sep\">\n<p>她坐進副駕駛座，把燈放在膝蓋上，兩隻手捧著。<\/p>\n<p>車子沿著河堤開。溪在左手邊，黑黑的，很寬，很靜，對岸有幾盞零零落落的燈。<\/p>\n<p>開了一段，何靜忽然說：「十月十五。」<\/p>\n<p>「八天。」周遠說。<\/p>\n<p>「那天，」何靜說，「我要來這裡點燈。」<\/p>\n<p>她低頭看著那盞燈，用手指摸了一下燈罩上纏著的那圈膠布。<\/p>\n<p>「然後跟你們進去。」<\/p>", "chars": 3629}, "40": {"title": "第四十章　下元", "html": "<p class=\"doc\">還有七天。<\/p>\n<p>公文是隔天早上送到的。<\/p>\n<p>羅振邦把它丟在周遠桌上，沒有說話，捏著保溫杯站在旁邊，等他看完。<\/p>\n<p>&gt; 主旨：有關霧川溪上游水庫計畫範圍擴大案，請查照。<br>&gt;<br>&gt; 說明：<br>&gt; 一、本縣霧川溪上游水庫計畫，經本府召開專案會議決議，將霧川鎮全區納入計畫範圍。<br>&gt; 二、霧川鎮現已無居民居住，為避免閒置空屋衍生治安及公共安全疑慮，請貴局協助於文到三十日內完成該鎮封鎖區清查，並將相關案件依程序辦理結案。<br>&gt; 三、本案經費已獲民間善心人士捐助，遷村補償作業將於農曆年前啟動。<\/p>\n<p>周遠看了兩遍。<\/p>\n<p>「三十天。」他說。<\/p>\n<p>「三十天。」羅振邦說，「四十三個失蹤人口，老張那邊要在期限內送檢察署，以失蹤結案。封鎖線撤掉，交給水利署。」<\/p>\n<p>「霧川的人還住在組合屋裡，等著回家。」<\/p>\n<p>「縣府說會補償。」羅振邦喝了一口茶，「搬到新的地方，蓋新的房子，比住在一個死了一半的鎮好。這是他們的說法。」<\/p>\n<p>周遠把公文翻到第二頁。專案會議的出席名單，縣長、副縣長、水利處長、地政處長，還有三個縣議員。其中一個議員的名字旁邊，有人用原子筆小小地註了一行字，大概是哪個承辦人的筆記：<\/p>\n<p class=\"doc\">大廟主委。<\/p>\n<p>「民間善心人士是誰？」周遠問。<\/p>\n<p>羅振邦看著他，看了一陣子。<\/p>\n<p>「我只是來送公文的。」他說，「這份公文，我昨天晚上才收到。專案會議是上個週末開的。我在這個縣當了二十年警察，從來沒看過一個水庫計畫，在一個週末裡多了一整個鎮。」<\/p>\n<p>他把保溫杯的蓋子轉緊。<\/p>\n<p>「我什麼都沒說。」<\/p>\n<hr class=\"sep\">\n<p class=\"doc\">還有六天。<\/p>\n<p>何靜打來的時候，周遠在霧川。<\/p>\n<p>他每天下班都來。阿凱的班已經換掉了，換成一個不認識的年輕學弟，一看到他的證件就讓他進去，連問都沒問。<\/p>\n<p>廟埕中央那灘水，變小了。<\/p>\n<p>第一天他和何靜來的時候，那灘水有兩三步寬。現在只剩下一步，邊緣乾掉的地方，石板上留著一圈白白的水漬，像一個退下去的潮線。這幾天都是大晴天。可是水不是被曬乾的。周遠蹲在旁邊看，看得很清楚，水是從邊緣開始，一點一點，往中間縮回去的。<\/p>\n<p>像有人從底下，在把它抽走。<\/p>\n<p>手機響了。<\/p>\n<p>「七號床的新病人，」何靜說，「你記得嗎？」<\/p>\n<p>「大廟退下來的老乩童。」<\/p>\n<p>「他姓龔。家屬都叫他龔伯。」何靜說，「他住進來以後，大部分時間都很安靜，晚上會哼那首很甜的歌。可是昨天晚上，他不一樣。」<\/p>\n<p>她的聲音頓了一下。<\/p>\n<p>「他一直在講話。對著牆講。蔡姐去看，他抓著蔡姐的手，一直重複同一句話。蔡姐用手機錄下來了。我傳給你。」<\/p>\n<hr class=\"sep\">\n<p>錄音很短。<\/p>\n<p>一個老人的聲音，很沙啞，台語，講得很急，像怕來不及：<\/p>\n<p>「十月十五，水官開簿。水官開簿，伊就驚矣。巡夜的欲趕佇開簿進前，共霧川抹予清氣。抹清氣，簿頂就無這筆。無這筆，就無人欠，無人欠，就無人愛還……」<\/p>\n<p>然後是蔡姐的聲音，很輕：「龔伯，你講啥人？」<\/p>\n<p>老人停了一下。<\/p>\n<p>「我毋知伊的名。」他說，「四十冬，我攏毋知伊的名。我干焦知影，伊借我的喙。」<\/p>\n<p>錄音到這裡就斷了。<\/p>\n<p>何靜又傳來一張照片。<\/p>\n<p>是七號房的牆壁。白色的油漆牆上，有人用指甲，刮出了一個圖形。刮得很深，油漆底下的水泥都露出來了。一個長方形，上面是圓頂，像一塊令牌。令牌中間，有兩個字，刮得歪歪扭扭的，可是看得出來。<\/p>\n<p class=\"beat\"><strong>巡夜<\/strong><\/p>\n<p>周遠盯著那張照片。<\/p>\n<p>他見過這塊令牌。縣文史館，那本手札的封底夾層，一張薄薄的棉紙，畫著一模一樣的形狀，篆書的「巡夜」兩個字。<\/p>\n<p>他站在廟埕上，看著腳邊那灘越縮越小的水。<\/p>\n<p>「何靜。」<\/p>\n<p>「嗯。」<\/p>\n<p>「我們不能等到最後一天。」他說，「可是也只能等到最後一天。」<\/p>\n<p>何靜沒有問為什麼。<\/p>\n<p>「十月十五，」她說，「子時。」<\/p>\n<hr class=\"sep\">\n<p class=\"doc\">還有五天。<\/p>\n<p>林依的店開張了。<\/p>\n<p>在海尾港口後面那條巷子裡，一樓的店面。招牌是她自己畫的，一塊白色的木板，上面用藍色的油漆寫著四個字：<strong>小滿飲料<\/strong>。<\/p>\n<p>周遠開車下去的時候，是下午三點。店裡沒有客人，只有林依一個人，綁著頭巾，站在吧台後面切檸檬。吧台是用兩張舊書桌拼起來的，鋪了一塊藍白格子的桌巾。牆上貼著手寫的價目表：檸檬愛玉三十五，冬瓜茶二十五，冬瓜檸檬四十。<\/p>\n<p>「冬瓜茶有改過。」林依看見他，第一句話就說，「糖少了三分之一。言言說你喝完那瓶之後都沒傳訊息來，她就知道你在說謊。」<\/p>\n<p>「我喝完了。」<\/p>\n<p>「喝完跟好喝是兩件事。」<\/p>\n<p>她倒了一杯給他。周遠喝了一口。<\/p>\n<p>還是很甜。可是喝得下去。<\/p>\n<p>「好喝。」<\/p>\n<p>林依看著他的眉毛，看了兩秒，滿意地點點頭，回去切檸檬。<\/p>\n<p>沈言五點下班，從漁會走過來，身上還穿著漁會的藍色背心。她坐在店門口的塑膠椅上，拿著林依給她的檸檬愛玉，一小口一小口地吸。港口的漁船一艘一艘回來，柴油引擎的聲音很大，海鷗在船尾繞。<\/p>\n<p>周遠把公文的事、龔伯的錄音、牆上的令牌、越縮越小的水，一件一件說了。<\/p>\n<p>沈言聽完，看著港口，一直沒開口。<\/p>\n<p>「我知道那個時間。」她最後說。<\/p>\n<p>「什麼時間？」<\/p>\n<p>「子時，那一刻。」沈言看著港口，「我在裡面走了兩個晚上。不是我在走，可是我記得。每一扇門，每一條巷子，每一個路口要往哪裡轉。我記得背面是怎麼走的。」<\/p>\n<p>她把愛玉的杯子放在膝蓋上，兩隻手握著。<\/p>\n<p>「我帶你們走。」<\/p>\n<p>林依切檸檬的刀停了一下。<\/p>\n<p>「言言。」<\/p>\n<p>「我知道。」沈言說，沒有回頭，「我知道妳要說什麼。」<\/p>\n<p>林依把刀放下來，擦了擦手，走出吧台，在沈言旁邊蹲下來。她看著沈言，然後伸手，把沈言背心上一根黏著的魚鱗拿掉。<\/p>\n<p>「我也去。」她說。<\/p>\n<p>「小依——」<\/p>\n<p>「我是放出來的那個人。」林依說，「上次是我把藥還給妳。這次輪到我把她要的東西還給她。」<\/p>\n<p>她站起來，走回店裡，從吧台底下拿出一個東西。<\/p>\n<p>是那包紅布。粉紅色的，褪得很淡，麻繩綁了好幾圈，一圈都沒拆過。<\/p>\n<p>「阿祖抱了九十五年。」林依說，「我不知道裡面是什麼。我也不想拆。可是我想，她抱這麼久，一定是要拿去還給誰的。」<\/p>\n<p>她把紅布包抱在胸前。<\/p>\n<p>「我帶這個去。」<\/p>\n<hr class=\"sep\">\n<p>那天晚上，周遠在海尾吃了晚飯。林依煮了一鍋鹹粥，放了很多蚵仔和芹菜。三個人坐在一樓的店面裡，坐在兩張舊書桌拼起來的吧台旁邊，吃到一半，停電了。<\/p>\n<p>整條巷子的燈一起暗下來。<\/p>\n<p>周遠的手已經摸向腰間。沈言沒有動。林依罵了一聲，起身去找蠟燭。<\/p>\n<p>「是跳電。」沈言說，「這條巷子的電線很舊，冷氣一開就跳。我們住進來第一個禮拜就跳了五次。」<\/p>\n<p>林依點了一根蠟燭，放在吧台中間。燭光很小，照著三碗吃了一半的鹹粥。<\/p>\n<p>周遠把手放下來。<\/p>\n<p>沈言看著他，笑了一下。<\/p>\n<p>「你以後，」她說，「停電的時候不要再摸槍了。」<\/p>\n<p>林依也笑了。笑完，她說：「其實我也有一點怕。」<\/p>\n<p>「我也是。」沈言說。<\/p>\n<p>她們兩個看著周遠。<\/p>\n<p>周遠低頭吃了一口粥。<\/p>\n<p>「我也是。」他說。<\/p>\n<p>三個人在燭光底下把粥吃完了。電一直沒有來。<\/p>\n<hr class=\"sep\">\n<p class=\"doc\">還有四天。<\/p>\n<p>小方把碑文的拓片，連同四十三戶的戶籍追溯表，印成一本，用長尾夾夾好，放在他桌上。<\/p>\n<p>封面上她用麥克筆寫了一行字：<strong>霧川　樂捐碑名冊（附戶籍追溯）<\/strong><\/p>\n<p>「你上次說，」小方說，「要記住他們的名字。」<\/p>\n<p>周遠翻開。四十二個碑上的名字，每一個名字後面，一條線往下拉，拉到現在的那個人。邱阿添，邱旺，邱水木，邱永福。最後一頁，是廟公和他的祖父，職業欄那兩個字：童乩。<\/p>\n<p>「這個要送檢察署嗎？」<\/p>\n<p>「不送。」小方說，「這個不是證據。」<\/p>\n<p>她抱著保溫杯，站在他桌邊。<\/p>\n<p>「這是名冊。」<\/p>\n<hr class=\"sep\">\n<p class=\"doc\">還有三天。<\/p>\n<p>那灘水只剩下一個手掌大。<\/p>\n<p>周遠蹲在旁邊，用手電筒照。水很淺，很清，底下的石板看得清清楚楚。他湊近，把臉貼到很近的地方，近到他的呼吸在水面上吹出一點點波紋。<\/p>\n<p>水裡沒有灰色的鎮。只有他自己的臉，和他身後那個快圓的月亮。<\/p>\n<p>他把手指放進去。<\/p>\n<p>很冰。冰到骨頭。<\/p>\n<p>然後，很輕，很輕地，有什麼東西碰了一下他的指尖。<\/p>\n<p>很小。很冰。像一隻小孩的手指，從水的另一邊，碰了一下他的手指。<\/p>\n<p>周遠沒有把手抽回來。<\/p>\n<p>那隻手指碰了一下，就收回去了。<\/p>\n<p>他在那裡蹲到十二點過後，水沒有再動。<\/p>\n<hr class=\"sep\">\n<p class=\"doc\">還有兩天。<\/p>\n<p>那天晚上，周遠沒有睡。<\/p>\n<p>他坐在玄關的地板上，背靠著鞋櫃，面對著那扇鐵門。他把小方的名冊攤在膝蓋上，開著一盞小燈。<\/p>\n<p>他想把那四十三個名字記住。不是看過，是記住。像他在石崗的記事本上寫下「金牙，喜歡下象棋」那樣，記住一個人不是一個代號。他知道明天晚上，他會走進一個所有人都在倒著跳舞的地方，他不想在那裡看到一張臉，卻叫不出那張臉的名字。<\/p>\n<p>他一個一個地唸。<\/p>\n<p>小聲地，唸出來。<\/p>\n<p>「邱永福。」<\/p>\n<p>「張金水。」<\/p>\n<p>「林秀枝。」<\/p>\n<p>「陳萬福。」<\/p>\n<p>一個名字，停一下，想一下那個人的照片，再唸下一個。主街第六戶。退休的會計。種芭樂的。開計程車的。在國小當校工的。他唸得很慢，唸到一半，看了一眼時間。十一點五十二分。<\/p>\n<p>他繼續唸。<\/p>\n<p>唸到最後一個名字的時候，是十二點零二分。<\/p>\n<p>最後一個，是廟公。<\/p>\n<p>他唸完，把名冊闔起來，放在旁邊的地板上。他靠著鞋櫃，閉上眼睛，在心裡從頭再過一遍。<\/p>\n<p>叩、叩。<\/p>\n<p>他睜開眼睛。<\/p>\n<p>叩、叩。<\/p>\n<p>很輕。從那扇鐵門的另一邊。<\/p>\n<p>兩下。<\/p>\n<p>他沒有動。他看著那扇門，聽著。門外沒有聲音了。只有一點點，很淡的，濕濕的呼吸。<\/p>\n<p>他想起邱永福站在玄關那條毛巾上，捧著一杯一口都沒喝的茶。<\/p>\n<p>他想起自己剛剛做了什麼。<\/p>\n<p>他把四十三個名字，在子時，一個一個地，唸出來了。<\/p>\n<hr class=\"sep\">\n<p>周遠沒有開門。<\/p>\n<p>他把手掌貼在鐵門上，鐵皮很冷。<\/p>\n<p>「邱永福。」他說。<\/p>\n<p>門外的呼吸停了一下。然後，很慢的，一步一步，濕的腳步聲，往樓梯那邊去了。<\/p>\n<p>他等著。<\/p>\n<p>叩、叩。<\/p>\n<p>不一樣的敲法。比剛剛重一點，第二下比第一下慢。<\/p>\n<p>他翻開名冊，看了一眼第二個名字。<\/p>\n<p>「張金水。」<\/p>\n<p>腳步聲。往樓梯去了。<\/p>\n<p>叩、叩。<\/p>\n<p>這一次很快，很急，兩下幾乎黏在一起，像一個很怕被人看見的人。<\/p>\n<p>「林秀枝。」<\/p>\n<p>一個接一個。<\/p>\n<p>有的敲得很重，鐵門震了一下。有的敲得很輕，輕到他要把耳朵貼在門上才聽得見。有的敲完兩下，在門外站了一會兒才走。有一個敲完以後，他聽見門外有人在哭，很小聲，一個男人的聲音，哭了很久，哭到他唸了第二次名字，才走。<\/p>\n<p>每一個，都是兩下。<\/p>\n<p>每一個，他都叫出了名字。<\/p>\n<p>他坐在玄關的地板上，背靠著鐵門，手上拿著那本名冊，一頁一頁地翻。手電筒的光照在紙上，照著小方用麥克筆寫的那一行字。<\/p>\n<p>名冊。<\/p>\n<p>凌晨三點，他唸到第二十個。<\/p>\n<p>凌晨四點半，第三十五個。<\/p>\n<p>窗外的天開始變灰的時候，他唸到了第四十二個。<\/p>\n<p>叩、叩。<\/p>\n<p>很輕，很慢。兩下之間隔得很開，像一個老人，抬起手，敲一下，想了很久，才敲第二下。<\/p>\n<p>周遠翻到最後一頁。<\/p>\n<p>「廟公。」他說。然後他想起來，他知道廟公的名字。小方的名冊上寫著。他一直都叫他廟公，像霧川所有的人一樣，叫了一輩子，從來沒有人叫他的名字。<\/p>\n<p>他把名字唸了出來。<\/p>\n<p>門外很安靜。<\/p>\n<p>然後他聽見一個很老的聲音，隔著鐵門，很輕很輕地，說了一句話。<\/p>\n<p>「毋是我。」<\/p>\n<p>周遠閉上眼睛。<\/p>\n<p>「我知道。」他說，「我知道不是你。」<\/p>\n<p>腳步聲很慢。一步，一步，往樓梯去了。<\/p>\n<hr class=\"sep\">\n<p>天快亮了。<\/p>\n<p>周遠還坐在那裡。他的腿麻了，背很痛，手上的名冊被他翻得捲了邊。四十三個名字，他一個一個都叫過了。<\/p>\n<p>他以為結束了。<\/p>\n<p>他把名冊闔上，扶著鞋櫃，準備站起來。<\/p>\n<p>叩、叩。<\/p>\n<p>他停住了。<\/p>\n<p>不是在剛剛那個高度。剛剛的四十三次，都是從他頭頂附近傳來的，大人的手，舉起來敲門的高度。<\/p>\n<p>這兩下，很低。<\/p>\n<p>在他坐著的時候，肩膀旁邊的位置。一個七八歲的孩子，站在門外，舉起手，剛好碰得到的地方。<\/p>\n<p>很輕，很清。<\/p>\n<p>他沒有動。他屏住呼吸，等著。<\/p>\n<p>鐵門外，什麼聲音都沒有。沒有腳步，沒有呼吸。<\/p>\n<p>他等著第三下。<\/p>\n<p>窗外的天，一點一點，從灰色變成很淡的藍色。樓下有人在拉鐵門，早餐店開了。一隻麻雀在陽台的欄杆上叫了兩聲。<\/p>\n<p>第三下，一直沒有來。<\/p>\n<p>周遠慢慢站起來，握住門把，打開門。<\/p>\n<p>走廊的感應燈亮了。<\/p>\n<p>門外沒有人。<\/p>\n<p>磨石子地上，從樓梯口一路到他的門前，是一排一排濕的腳印。很多。大人的，赤腳的，有的大有的小，有的重有的輕，疊在一起，踩成一大片濕濕的痕跡，每一排都從樓梯走上來，在他門前停一下，再轉身走下去。<\/p>\n<p>在那一大片腳印的最前面，最靠近他門檻的地方，有一雙很小的。<\/p>\n<p>只有一雙。<\/p>\n<p>腳尖朝著他的門。<\/p>\n<p>沒有轉身的痕跡。沒有走回樓梯的痕跡。她就站在那裡，敲了兩下，然後就不見了。<\/p>\n<p>周遠蹲下來，看著那雙很小的濕腳印。<\/p>\n<p>腳尖朝內。<\/p>\n<p>像一個在門外等了很久、要回家的孩子。<\/p>", "chars": 4667}, "41": {"title": "第四十一章　入水", "html": "<p>下午，周遠先去了一趟石崗。<\/p>\n<p>山下是陰天，到了鎮口那棵榕樹，毛毛雨還在下，細得像霧。他把車停在墳前，那只銅鈴還在原來的地方，鈴口朝下，紅線打結的地方朝上。三支香已經燒完了，香腳插在土裡，被雨打得發黑。<\/p>\n<p>他蹲下來。<\/p>\n<p>「借我一暝。」他說，「天光就還你。」<\/p>\n<p>他把鈴拿起來。鈴身很冰，沾著雨水，他用袖子擦乾，包進外套裡。<\/p>\n<p>紅線還綁著。他沒有解。<\/p>\n<p>起身的時候，他看見墓碑旁邊多了一樣東西。一個很小的塑膠杯，裡面裝著半杯米酒，杯口蓋著一片榕樹葉子。他不知道是誰放的。也許是老闆娘，也許是金牙阿伯，也許是廟公。他們不記得他的臉，可是他們記得要有人來這裡。<\/p>\n<p>他把那片榕樹葉子扶正，上車，往山下開。<\/p>\n<hr class=\"sep\">\n<p>晚上九點半，霧川溪的河堤上沒有人。<\/p>\n<p>何靜蹲在那塊突出去的水泥平台上，把那盞鐵皮小油燈放在最前面的邊緣。她倒油，剪燈芯，劃火柴。第一根火柴被風吹熄了。第二根也是。何媽媽站在她背後，拿著一件外套擋風，嘴裡一直念：「慢慢來，慢慢來，妳阿嬤以前也要劃好幾根。」<\/p>\n<p>第三根，點著了。<\/p>\n<p>火苗很小，黃黃的，在燈罩裡晃了一下，站直了。燈罩上那圈纏著的膠布，被火光照得有一點透明。<\/p>\n<p>何靜蹲在那裡，看著那朵火，看了一陣子。<\/p>\n<p>「媽。」<\/p>\n<p>「嗯。」<\/p>\n<p>「今天晚上，」何靜說，「妳可以幫我顧著這盞燈嗎？不要讓它熄。一直到天亮。」<\/p>\n<p>何媽媽看著她。<\/p>\n<p>周遠站在河堤上，離她們幾步遠。他看見何媽媽張開嘴，像要問什麼，問她要去哪裡、為什麼、跟這個警察有什麼關係。<\/p>\n<p>何媽媽沒有問。<\/p>\n<p>她把外套披在何靜肩上，在水泥平台上坐下來，盤起腿，把那盞燈拉到自己面前。<\/p>\n<p>「妳阿嬤以前，」她說，「都是坐這個位置。」<\/p>\n<p>她從口袋裡掏出一個保溫瓶，倒了一杯薑茶，放在燈旁邊，自己先喝了一口。<\/p>\n<p>「去啦。」她說，「天亮我還在這裡。」<\/p>\n<hr class=\"sep\">\n<p>十一點四十分，霧川的封鎖線。<\/p>\n<p>守線的不是那個不認識的學弟。巡邏車旁邊站著一個人，穿著制服外套，手插在口袋裡，在冷風裡一直跺腳。<\/p>\n<p>阿凱。<\/p>\n<p>「我跟他換班。」阿凱說，不等周遠問，「他說他女朋友今天生日。我說剛好，我今天沒事。」<\/p>\n<p>周遠看著他。<\/p>\n<p>「學長，」阿凱說，「我不知道你們要幹嘛。」<\/p>\n<p>「嗯。」<\/p>\n<p>「我也不要知道。」阿凱把封鎖線拉起來，「我媽說，十月十五晚上，不要問大人在幹嘛。」<\/p>\n<p>沈言的車跟在後面。她從駕駛座探出頭，林依坐在副駕駛座上，懷裡抱著那包紅布。何靜坐在周遠的車上，膝蓋上放著一個布袋，布袋裡是那把割索刀。<\/p>\n<p>阿凱一輛一輛地讓車過去。最後一輛過去的時候，他敲了敲周遠的車窗。<\/p>\n<p>「平安符，」他說，「有戴嗎？」<\/p>\n<p>周遠拍了拍胸前的口袋。<\/p>\n<p>阿凱點點頭，退後一步，把封鎖線放下來。<\/p>\n<p>「我在這裡。」他說，「一直在這裡。」<\/p>\n<hr class=\"sep\">\n<p>廟埕上沒有水了。<\/p>\n<p>周遠用手電筒照。石板是乾的，中間那一塊顏色比旁邊深一點，摸起來有一點涼，像剛擦過。就這樣。那灘水，那個手掌大的、清得可以看見底的水，已經沒有了。<\/p>\n<p>十一點五十二分。<\/p>\n<p>四個人站在那塊顏色比較深的石板旁邊。沒有人說話。林依抱著紅布包，抱得很緊。沈言蹲下來，把手放在那塊石板上，閉著眼睛，好像在聽什麼。<\/p>\n<p>「還在。」沈言說，「在很下面。可是有東西壓著。」<\/p>\n<p>「什麼東西？」<\/p>\n<p>沈言睜開眼睛，搖頭。「我不知道。很重。像有人坐在上面。」<\/p>\n<p>周遠看了一眼手錶。十一點五十五分。<\/p>\n<p>他把外套裡的銅鈴拿出來。<\/p>\n<p>「我去一下城隍廟。」他說。<\/p>\n<p>何靜看著他。「我跟你去。」<\/p>\n<p>「不用。」周遠說，「妳們在這裡等。如果十二點十分我還沒回來——」<\/p>\n<p>他停住了。他不知道如果他沒回來，她們該做什麼。<\/p>\n<p>沈言站起來。<\/p>\n<p>「去吧。」她說，「我們等你。」<\/p>\n<hr class=\"sep\">\n<p>他一個人下了那條小路，走到舊渡口的河灘，爬上那道石階。<\/p>\n<p>他爬得很快。青苔很滑，他兩次差點跌倒，手撐在石階上，掌心被磨破了。他沒有停。最下一級往上數第七級，師父第一次停下來搖鈴的地方。他經過的時候，腳步慢了一下。<\/p>\n<p>城隍廟的門開著。<\/p>\n<p>不是一條縫。是整扇開著，兩片舊木門往裡敞開，門檻上落著幾片枯葉。神案上那盞小紅燈亮著，比上次亮，紅色的光照滿了整個前殿，照在那尊被香煙燻黑的神像上。<\/p>\n<p>周遠在門檻外面跪下來。<\/p>\n<p>他把銅鈴放在門檻上。鈴口朝下，紅線朝上。他沒有搖。<\/p>\n<p>他想起夢裡的陳守一。十七歲，跪在這個地方，把鈴放在門檻上，也沒有搖。<\/p>\n<p>「我不是先生。」周遠說。<\/p>\n<p>他的聲音在空空的廟裡，有一點回音。<\/p>\n<p>「我不會唸咒，不會畫符。我不知道你要什麼。」他說，「我只知道你管名字。廟埕底下那四十三個人，他們的名字被劃掉了，不是你劃的。我也知道，你沒辦法替他們出頭。」<\/p>\n<p>紅燈的光，很穩。<\/p>\n<p>「我要進去。」周遠說，「我要帶他們出來。還有那個女孩。」<\/p>\n<p>他停了一下。<\/p>\n<p>「我知道每一樣東西都有代價。」他說，「我不會用魂，也不知道魂怎麼給。我只有年紀。我今年三十七歲。」<\/p>\n<p>他看著那尊神像。看不清楚臉。<\/p>\n<p>「十年。」他說，「我押十年。」<\/p>\n<p>廟裡很安靜。<\/p>\n<p>然後，神案上那盞紅燈的火苗，往下沉了一下。很慢，很低，低到差點熄掉。<\/p>\n<p>周遠的胸口一緊。<\/p>\n<p>不是痛。是一種很奇怪的感覺，像有人從他身上，很輕很輕地，拿走了一樣東西。很小，很輕，像從大衣口袋裡拿走一顆鈕扣。他甚至不確定那是什麼。<\/p>\n<p>火苗又站起來了。<\/p>\n<p>比剛剛更亮。<\/p>\n<p>周遠跪在那裡，等了一下，拿起門檻上的銅鈴，站起來。膝蓋響了一聲，比平常響。<\/p>\n<p>他轉身下石階的時候，在最上面一級停了一下。手機的螢幕還亮著，十二點零九分，黑色的螢幕邊緣映出他自己的臉。<\/p>\n<p>他看見自己右邊的鬢角，有幾根頭髮，白了。<\/p>\n<p>他把手機收起來，往下跑。<\/p>\n<hr class=\"sep\">\n<p>十二點十一分，他跑回廟埕。<\/p>\n<p>三個人還站在原地。何靜一看到他，往前走了一步，又停住，看著他的臉，眼睛在他的鬢角上停了一下。<\/p>\n<p>她什麼都沒說。<\/p>\n<p>「水呢？」周遠問，喘著氣。<\/p>\n<p>沈言指著地上。<\/p>\n<p>那塊顏色比較深的石板，正在變濕。不是從上面濕，是從底下。石板和石板的縫裡，有水一點一點地滲上來，很慢，很細，像有人在底下把一個蓋子掀開了一條縫。水沿著石縫爬，爬成一個不規則的圈，圈裡的石板一塊一塊變暗，變亮，變成一層薄薄的水面。<\/p>\n<p>一步寬。兩步。<\/p>\n<p>水面很平，很清。周遠用手電筒照下去。底下沒有石板了。<\/p>\n<p>很深。很遠很遠的地方，有一點光。<\/p>\n<p>很小，黃黃的，在水底下晃了一下，站直了。<\/p>\n<p>何靜蹲下來，看著那一點光。<\/p>\n<p>「那是……」<\/p>\n<p>「妳媽。」周遠說。<\/p>\n<p>何靜沒有說話。她用手背擦了一下眼睛，站起來。<\/p>\n<p>十二點十三分。<\/p>\n<hr class=\"sep\">\n<p>沈言站在水邊。<\/p>\n<p>她把鞋子脫了。一雙白色的帆布鞋，她把它們並排擺在水邊，鞋頭朝外。然後她停了一下，蹲下來，把兩隻鞋轉過來。<\/p>\n<p>鞋頭朝內。<\/p>\n<p>「進去以後，」沈言說，聲音很平，很清楚，「不要回頭。不管聽到誰叫你，都不要回頭。」<\/p>\n<p>「有人叫你的名字，先不要答。看清楚是誰在叫，再答。」<\/p>\n<p>「跟著我的腳印走。我踩哪裡，你們踩哪裡。」<\/p>\n<p>「看到有人在跳舞，不要跟著拍手。手放在口袋裡，或是握著身上帶的東西。」<\/p>\n<p>她看著林依懷裡的紅布包，看著何靜手上的布袋，看著周遠手上的鈴。<\/p>\n<p>「還有，」她說，「不要怕她。」<\/p>\n<p>林依抬頭。「誰？」<\/p>\n<p>沈言沒有回答。她看著那片水，水底下那一點黃黃的光。<\/p>\n<p>「我在她裡面走過兩個晚上。」她說，「她很冷。她一直很冷。」<\/p>\n<p>她把林依的手拉過來，握住。林依的另一隻手抱著紅布包。何靜站在林依旁邊，把那個布袋背在肩上，伸手，握住林依抱著紅布包的那隻手的手腕。<\/p>\n<p>周遠站在最後。<\/p>\n<p>他把阿凱的平安符從口袋裡拿出來看了一眼，又放回胸前的口袋，扣好。他把小方的名冊夾在腋下，右手拿著銅鈴，左手搭上何靜的肩膀。<\/p>\n<p>他看了一眼手錶。<\/p>\n<p>秒針跳到十二。十二點十四分。<\/p>\n<p>停了。<\/p>\n<hr class=\"sep\">\n<p>沈言踩進水裡。<\/p>\n<p>水沒有濺起來。她的腳踩下去，像踩在一級石階上，往下沉了一階。再一步，又一階。水淹過她的腳踝，她的小腿，她的膝蓋。她沒有停，一步一步往下走，像在走一道看不見的石階。<\/p>\n<p>林依跟著她。何靜跟著林依。<\/p>\n<p>周遠最後一個。<\/p>\n<p>他的腳踩進水裡。很冰，冰得像那天晚上，那根很小的手指碰到他的指尖。他往下踩，腳底下有東西撐著他，硬的，平的，長著一點點滑滑的青苔。<\/p>\n<p>石階。<\/p>\n<p>他認得這種石階。他在夢裡走過很多次。<\/p>\n<p>水淹過他的腰，他的胸口。他深吸一口氣。<\/p>\n<p>水淹過他的頭頂。<\/p>\n<hr class=\"sep\">\n<p>沒有窒息。<\/p>\n<p>他睜開眼睛的時候，他站在廟埕上。<\/p>\n<p>腳是乾的。衣服是乾的。他手上還拿著那只銅鈴，腋下還夾著那本名冊。何靜的肩膀還在他的左手底下。<\/p>\n<p>可是天是灰的。<\/p>\n<p>不是夜晚的黑，也不是陰天的灰。是一種很平、很均勻的灰，沒有雲，沒有星星，沒有月亮，像一張褪了色的照片的天空。<\/p>\n<p>廟埕是灰的。土地公廟是灰的。廟門口的對聯，字是反的。<\/p>\n<p>周遠抬頭看廟裡那個圓鐘。<\/p>\n<p>十二點十四分。<\/p>\n<p>他看自己的手錶。秒針停在十二的位置，一動也不動。<\/p>\n<p>四周很安靜。安靜得聽不見風，聽不見溪水，聽不見任何一隻蟲叫。他聽得見自己的呼吸，聽得見何靜的呼吸，聽得見林依抱著紅布包、手指在布上摩擦的很細很細的聲音。<\/p>\n<p>沈言站在最前面。<\/p>\n<p>她沒有回頭。她舉起一隻手，往廟埕另一邊指了一下。<\/p>\n<p>周遠順著她的手指看過去。<\/p>\n<p>主街的方向，灰色的路燈底下，有一盞燈亮著。<\/p>\n<p>很小，黃黃的。<\/p>\n<p>不是路燈。是一盞很小的、放在地上的燈。燈罩上纏著一圈什麼東西。<\/p>\n<p>它在主街的盡頭，在很遠很遠的地方，一動也不動地亮著。<\/p>\n<p>沈言把手放下來。<\/p>\n<p>「那是回去的路。」她說。<\/p>\n<p>她邁出第一步。<\/p>\n<p>周遠低頭，看著她在灰色石板上留下的第一個腳印。他把腳踩進去，剛好。<\/p>", "chars": 3579}, "42": {"title": "第四十二章　倒舞", "html": "<p>背面的霧川沒有聲音。<\/p>\n<p>周遠一開始以為是自己的耳朵出了問題。他們走在主街上，腳踩在灰色的柏油路上，什麼聲音都沒有。不是安靜，是沒有。像有人把整條街的聲音，連同顏色一起，抽乾了。<\/p>\n<p>他聽得見自己的呼吸。聽得見林依抱著紅布包、手指在布上摩擦的聲音。聽得見何靜的布袋擦過她的外套。那些聲音都很近，很小，像從他自己身體裡面發出來的。<\/p>\n<p>腳步聲沒有。<\/p>\n<p>他們四個人走在主街上，一個踩著一個的腳印，可是腳底下什麼聲音都沒有。<\/p>\n<p>沈言走在最前面。她沒有回頭，走得很慢，每一步都踩得很穩。她走的路線很奇怪，有時候走路中間，有時候貼著騎樓，有時候在一個路口停下來，站一下，才往左轉。<\/p>\n<p>周遠沒有問。他只是把腳踩進她的腳印裡。<\/p>\n<hr class=\"sep\">\n<p>主街兩邊的房子都是反的。<\/p>\n<p>招牌上的字是反的。雜貨店的「邱記」，變成一個鏡子裡的「記邱」。春聯是反的，貼在門上的福字，連那個倒貼的福字，也被反了一次，變成正的。<\/p>\n<p>房子的門都開著。<\/p>\n<p>不是被破壞的那種開，是有人出門的時候忘了關，或是故意不關，等著誰回來。門裡面黑黑的，可是不是真的黑，是一種很深的灰，像天快亮之前的房間。<\/p>\n<p>經過雜貨店的時候，林依停了一下。<\/p>\n<p>「言言。」她小聲說。<\/p>\n<p>沈言停下來，沒有回頭。<\/p>\n<p>林依指著雜貨店的門裡面。<\/p>\n<p>周遠順著她的手指看進去。店面後面有一條走廊，走廊盡頭是一間臥室，門也開著。從他們站的地方，剛好看得見臥室裡面的一張床。<\/p>\n<p>床邊擺著一雙塑膠拖鞋。<\/p>\n<p>鞋頭朝內。<\/p>\n<p>不是朝向門口，是朝向床。整整齊齊地擺在床邊，像一個人晚上上床睡覺前，脫下來，擺好，等著第二天早上起來，腳一伸，就可以穿上。<\/p>\n<p>周遠想起他第一次走進霧川的那天早上。三百一十二人一夜之間消失，每一張床邊的拖鞋，都是鞋頭朝外，對著門，像主人起床以後，自己走出去了。<\/p>\n<p>這裡是反的。<\/p>\n<p>這裡的拖鞋在等。<\/p>\n<p>他們繼續往前走。經過主街第六戶。經過鎮公所退休會計的那間透天厝。經過一間門口擺著一台舊腳踏車的房子。每一扇開著的門裡面，每一張床邊，拖鞋都朝內。<\/p>\n<p>林依抱著紅布包的手越抱越緊。<\/p>\n<p>「她們在等人回家。」她說。<\/p>\n<p>沒有人回答。<\/p>\n<hr class=\"sep\">\n<p>走到主街的盡頭，沈言停住了。<\/p>\n<p>那盞燈就在前面。鐵皮的，很小，燈罩上纏著一圈膠布，放在路中間的柏油地上，黃黃的火苗一動也不動。它離他們還有一段距離，大概三四十步，可是周遠覺得不管他們怎麼走，它都會一直在那個距離。<\/p>\n<p>何靜看著那盞燈，嘴唇動了一下，沒有說話。<\/p>\n<p>「先不要過去。」沈言說，「那是回去的路。現在還不能回去。」<\/p>\n<p>她轉向右邊。<\/p>\n<p>右邊是一條往下的小路。周遠認得這條小路。前些天的白天，他和小方從這裡走下去，走到舊渡口的河灘，爬上那道長滿青苔的石階，找到那塊碑。<\/p>\n<p>這條小路在背面也在。灰色的，兩邊長著灰色的芒草。<\/p>\n<p>沈言站在小路口，側著頭，好像在聽什麼。<\/p>\n<p>然後周遠也聽到了。<\/p>\n<p>啪。<\/p>\n<p>很輕。從小路的底下傳上來。<\/p>\n<p>啪。啪。<\/p>\n<p>是腳步聲。很多人的腳步聲，整齊，緩慢，像同一個人被複製了很多次。在這個什麼聲音都沒有的地方，那個聲音清楚得刺耳。<\/p>\n<p>啪，啪，啪。<\/p>\n<p>越來越近。<\/p>\n<p>「手。」沈言說，「放好。」<\/p>\n<p>林依把紅布包抱在胸前，兩隻手交疊著壓在上面。何靜把手伸進布袋裡，握住那把割索刀的刀柄。周遠把銅鈴握在右手，左手按住胸前的口袋，那裡有阿凱的平安符。<\/p>\n<hr class=\"sep\">\n<p>他們先看見的，是背。<\/p>\n<p>從小路底下，一排人倒退著走上來。<\/p>\n<p>他們的背對著周遠，雙手往前平舉，手腕垂著。每走一步，往左晃一下，往右晃一下，然後往後退一步。腳跟先著地，再是腳掌，再是腳尖，像一捲錄影帶在倒著播。<\/p>\n<p>第一排六個人。第二排六個人。一排一排，倒退著從小路底下冒上來，冒到主街上，倒退著經過周遠他們身邊。<\/p>\n<p>距離很近。近到周遠伸手就碰得到。<\/p>\n<p>可是沒有一個人看他們。<\/p>\n<p>他看見邱永福在第三排。汗衫，發白的西裝褲，光著腳，腳底全是灰。他的臉上那種很深的、很累的空白，跟那天在積水裡看到的一模一樣。他的手平舉著，手腕垂著，晃過來，晃過去。<\/p>\n<p>周遠張開嘴，想叫他的名字。<\/p>\n<p>沈言沒有回頭。她的手往後一伸，在身側很輕地壓了一下，像按住一個要開口的人。<\/p>\n<p>只是一眼。很快，很輕。她馬上又轉回去了。<\/p>\n<p>周遠把那個名字吞了回去。<\/p>\n<p>方陣一排一排地經過。主街第六戶的男人，退休的會計。一個很胖的女人，穿著碎花的睡衣，周遠記得她的名字是林秀枝，在名冊上第十九頁，開美容院的。一個很瘦的年輕人，大概三十歲，戴著眼鏡，鏡片裂了一條縫。<\/p>\n<p>最後一排，廟公。<\/p>\n<p>他跳得最慢。手抬得不夠高，腳退得不夠遠，每一步都慢半拍，像一個一直跟不上的人，一直在努力跟上。他的嘴唇在動，一直在動。<\/p>\n<p>周遠不用看也知道他在說什麼。<\/p>\n<p>最後一排過去了。<\/p>\n<p>然後周遠看見了她。<\/p>\n<hr class=\"sep\">\n<p>她走在方陣的最前面。<\/p>\n<p>所有人都倒退著走，所以帶頭的那一個，反而是最後從小路底下退上來的。她也倒退著走，背對著方陣，也背對著周遠他們，臉一直朝著小路底下，朝著河的方向。四十三個人跟在她的背後，看著她的背，照著她的動作，一步一步地退。<\/p>\n<p>她很小。<\/p>\n<p>真的很小。七歲，八歲，站在那裡，頭頂大概只到周遠的腰。她全身都是濕的，頭髮黏在臉上、脖子上、背上，水從她的髮梢一直往下滴，滴在灰色的柏油路上。她每走一步，腳下就留下一個濕的腳印，腳印很快就乾了，消失了。<\/p>\n<p>她光著腳。<\/p>\n<p>她身上穿著一件衣服。不是她自己的衣服。<\/p>\n<p>周遠盯著那件衣服，過了好一會兒才明白他在看什麼。<\/p>\n<p>那是一件很大的袍子。黑色的，或者曾經是黑色的，現在被水泡得發灰，發白，像一件在河底泡了一百年的東西。袍子很大，大得離譜，像是給一個很高很高的大人做的，穿在她身上，袖子拖在地上，下襬也拖在地上，拖在她身後，拖成一條長長的、濕濕的痕跡。<\/p>\n<p>她的頭上戴著一頂帽子。<\/p>\n<p>很高，很尖，跟袍子一樣是黑的，也大得離譜，罩住了她大半個頭，帽簷壓在她的眉毛上，壓得她要很用力地仰著頭，才看得見前面。<\/p>\n<p>她的脖子上掛著一條很粗的鐵鍊，從後頸繞到前面，墜著什麼很重的東西，重得把她的脖子壓得往前彎。<\/p>\n<p>她退得很吃力。那件袍子太重了，那頂帽子太重了，那條鐵鍊太重了。她每退一步，都要先把身體往前傾，再用腳跟把那件拖在地上的袍子往後拖，才能退出下一步。<\/p>\n<p>可是她一直在走。帶著她身後那四十三個倒著跳舞的人，一直在走。<\/p>\n<p>周遠抬起頭。<\/p>\n<p>她的袍子袖口，伸出兩條線。<\/p>\n<p>很細，很黑，像兩根釣魚的線，從她的兩隻袖口裡伸出來，往上，往上，一直延伸到那片灰色的天空裡，看不見盡頭。<\/p>\n<p>線是繃緊的。<\/p>\n<p>她每一次抬手，那兩條線就跟著動一下。不對。不是她抬手，線才動。是線先動，她的手才抬起來。<\/p>\n<hr class=\"sep\">\n<p>「那件衫，」沈言說，聲音很輕，「毋是伊的。」<\/p>\n<p>周遠轉頭看她。沈言的臉色很白，嘴唇抿得很緊，眼睛一直看著那個孩子。<\/p>\n<p>「我在她裡面的時候，」沈言說，「一直覺得很重。好像穿著一件濕掉的大衣，脫不下來。我以為是我自己。」<\/p>\n<p>她的手在發抖。林依把她的手握得更緊。<\/p>\n<p>「原來是她。」沈言說，「原來她一直穿著這件。」<\/p>\n<hr class=\"sep\">\n<p>那個孩子停下來了。<\/p>\n<p>她停在離沈言三四步遠的地方。方陣裡的四十三個人同時停下來，手還平舉著，身體還歪向一邊，就那樣定住了，像一張照片。<\/p>\n<p>然後她轉過身來。<\/p>\n<p>慢慢地，拖著那件袍子，轉了半圈，第一次把臉朝向主街這一邊。她仰著頭，從那頂太大的帽子底下，看著沈言。<\/p>\n<p>周遠看見了她的臉。<\/p>\n<p>很小，很白，白得發青。眼睛很大，很黑，像兩口很深的井。嘴唇凍得發紫。臉頰上還有一點點嬰兒肥，被水泡得有點腫。<\/p>\n<p>一個普通的、很冷的小孩的臉。<\/p>\n<p>鐵鍊底下墜著的，是一塊令牌。長方形，圓頂，掛在那件袍子的胸口，比她的臉還大。令牌上刻著兩個字。<\/p>\n<p class=\"beat\"><strong>巡夜<\/strong><\/p>\n<p>周遠看過這兩個字兩次。文史館，手札的封底，一張薄薄的棉紙。七號房，白色的牆壁上，被一個老人用指甲刮出來。<\/p>\n<p>這是第三次。掛在一個七八歲的孩子的脖子上。<\/p>\n<p>她看著沈言。看了好一陣子。<\/p>\n<p>沈言沒有動。她站在那裡，讓那個孩子看。<\/p>\n<p>「我轉來矣。」沈言說。<\/p>\n<p>聲音很輕，很平，像一個人下班回家，站在玄關說的話。<\/p>\n<p>那個孩子歪了一下頭。帽子跟著歪了一下，差點掉下來，她用手扶住。<\/p>\n<p>她把目光從沈言身上移開，移到林依身上。林依懷裡抱著那包紅布。孩子的眼睛在紅布上停了一下，很短，很快，然後移開。<\/p>\n<p>移到何靜身上。何靜的手還握在布袋裡。孩子看著何靜，看得比看林依久一點，眉頭皺了一下，好像在想一件很久以前的事，想不起來。<\/p>\n<p>然後，她看著周遠。<\/p>\n<hr class=\"sep\">\n<p>周遠站在最後面。<\/p>\n<p>她看著他。從那頂帽子底下，從那兩口很深很黑的井裡，看著他。<\/p>\n<p>周遠感覺得到胸口有什麼東西動了一下。<\/p>\n<p>不是那扇門。那扇門已經空了，那個很小的、剛睡醒的東西，在石崗的那個晚上，已經走了。是另一樣東西。更深的地方，更舊的地方，一直安安靜靜地待在那裡，十二年，他從來沒有感覺過它在那裡。<\/p>\n<p>它動了一下。<\/p>\n<p>像一個人在睡夢裡，聽見有人叫他，翻了個身。<\/p>\n<p>那個孩子往前走了一步。<\/p>\n<p>她繞過沈言，繞過林依，繞過何靜。她走得很慢，袍子拖在地上，鐵鍊壓著她的脖子。她走到周遠面前，停下來。<\/p>\n<p>她太矮了。她要把頭仰得很高很高，才看得到他的臉。<\/p>\n<p>周遠蹲下來。<\/p>\n<p>蹲到跟她一樣高。<\/p>\n<p>他不知道自己為什麼要這樣做。他的身體自己做了這個動作，熟練得像做過很多次。<\/p>\n<p>她的臉離他很近。他聞得到她身上的味道。河泥，濕木頭，很淡很淡的香灰。還有一點點，很淡很淡的，甜甜的，像糖。<\/p>\n<p>她伸出手。<\/p>\n<p>從那條太長的袖子裡，伸出一隻很小的手。手指很細，很白，指甲縫裡卡著黑色的泥。<\/p>\n<p>掌心朝上。<\/p>\n<p>周遠看著那隻手。<\/p>\n<p>他見過這隻手。一九三一年，渡口最下一級石階，水裡伸出來的一隻手，掌心朝上，沒有接那包紅布，只是碰了碰一個七歲小女孩的手腕。<\/p>\n<p>他也伸出手。<\/p>\n<p>指尖碰到她的掌心。<\/p>\n<p>很冰。冰到骨頭裡。<\/p>\n<hr class=\"sep\">\n<p>然後周遠聽見了一個聲音。<\/p>\n<p>不是從外面。是從他胸口裡面，從那個很深很舊的地方，一個他很熟悉的聲音，熟悉得像聽了一輩子。<\/p>\n<p>一個少年的聲音。很年輕，很累，帶著一點點台語的腔。<\/p>\n<p>那個聲音說：<\/p>\n<p>「你終於來矣。」<\/p>\n<p>孩子袖口的那兩條黑線，猛地一扯。<\/p>\n<p>她的手被拉回去了。整個人被往後一拉，帽子掉了一半，她用另一隻手死命地扶住。她身後的四十三個人，在同一刻，同時動了起來，往左晃，往右晃，往後退一步。<\/p>\n<p>啪。<\/p>\n<p>方陣又開始走了。<\/p>\n<p>她被那兩條線拉著，轉回去，又背對著所有人，臉朝著河的方向，帶著那四十三個人，倒退著，一步一步地，往主街的另一頭退去。<\/p>\n<p>周遠還蹲在原地。他的手還伸在半空中，指尖還冰著。<\/p>\n<p>胸口裡那個聲音，沒有再說話。<\/p>\n<p>可是他知道它醒了。<\/p>", "chars": 4011}, "43": {"title": "第四十三章　遺言", "html": "<p>指尖上那一點冰，一路爬上來。<\/p>\n<p>爬過手腕，爬過手肘，爬進胸口最深的那個地方。周遠還蹲在灰色的柏油路上，他看見那個孩子被兩條黑線拉回去，看見方陣又開始倒退著走，看見沈言轉過頭來，嘴巴在動，在叫他的名字。<\/p>\n<p>他聽不見。<\/p>\n<p>胸口裡那個少年的聲音，很輕地說了一句：<\/p>\n<p>「你莫驚。我予你看。」<\/p>\n<p>然後灰色的街，不見了。<\/p>\n<hr class=\"sep\">\n<p class=\"era\">二〇一四年，和平村。<\/p>\n<p>雨。<\/p>\n<p>不是下雨，是整片天倒下來。風從山谷底下往上灌，把雨打成橫的，打在臉上像小石頭。村口那條溪漲成了一條黃色的河，河水推著整棵的樹往下游滾，滾過村口的橋，橋墩發出很低很低的聲音，像一頭老牛在哭。<\/p>\n<p>陳守一站在橋頭。<\/p>\n<p>他一百歲了。他算過。一九一四年生，屬虎。他的身體還停在十七歲那年秋天，臉還是那張臉，白，瘦，眼睛底下兩塊青。這八十三年，他沒有長高一公分。<\/p>\n<p>可是他很累。<\/p>\n<p>他從山的另一邊一路趕過來，走了一整個下午。他是在一間小廟的屋簷下躲雨的時候，忽然感覺到的。很遠很遠的地方，有一樣睡了八十三年的東西，被人叫醒了。<\/p>\n<p>像有人在他的胸口，敲了三下。<\/p>\n<hr class=\"sep\">\n<p>和平村裡，所有人都在跳舞。<\/p>\n<p>在雨裡。在積水淹到腳踝的村道上。雙手往前平舉，手腕垂著，往左晃，往右晃，往前走一步。整整齊齊，像一個人被複製了很多次。他們都在笑。雨打在他們臉上，打得他們睜不開眼睛，他們還是在笑。<\/p>\n<p>村道的盡頭，有一個人在帶舞。<\/p>\n<p>一個小女孩。十二歲，穿著睡衣，光著腳，頭髮被雨打得貼在臉上。她背對著所有人，走在最前面，走得很慢。<\/p>\n<p>陳守一知道她是誰。<\/p>\n<p>沈家的囡仔。月娥的血脈。八十三年前，他用自己的魂當線，一針一針縫進去的那個孩子，再往下的、再往下的、再往下的孩子。<\/p>\n<p>他把手伸進布袋，握住那只銅鈴。<\/p>\n<p>鈴舌綁著一條紅線，是他很多年前自己綁的。他已經很多年沒有搖過它了。<\/p>\n<p>他解開紅線，搖了三下。<\/p>\n<hr class=\"sep\">\n<p>鈴聲在雨裡傳得很遠。<\/p>\n<p>跳舞的人停了半拍。只有半拍。然後又動起來。<\/p>\n<p>小女孩沒有停。<\/p>\n<p>陳守一往前跑。他跑過那些跳舞的人，跑過一個抱著孩子的女人，跑過一個穿著汗衫的老人，跑到隊伍的最前面，跑到那個小女孩面前，張開手，擋住她。<\/p>\n<p>她撞進他懷裡。<\/p>\n<p>很輕，很冷。冷得像一塊從河底撈起來的石頭。<\/p>\n<p>他抱住她。<\/p>\n<p>然後他就看見了。<\/p>\n<p>不是用眼睛。是抱住她的那一刻，有什麼東西從她的身上，順著他的手臂，爬進他的身體裡。<\/p>\n<p>一條很寬很黑的河。<\/p>\n<p>一個竹排。竹排上坐著一個很小的孩子，比懷裡這個還小，七歲，八歲，穿著一件很舊的衣服，光著腳，在唱歌。岸上很多火把。有人在拉胡琴，拉得很爛。<\/p>\n<p>竹排動了。<\/p>\n<p>她還在唱。竹排一直往河中間漂，漂到火把照不到的地方。她還在唱。<\/p>\n<p>她的脖子上掛著一樣東西。一塊小小的木牌，用一條紅繩子穿著，木牌上寫著字。陳守一看不清楚那是什麼字，只知道字寫得很醜，很用力，像一個小孩一筆一畫照著描出來的。<\/p>\n<p>竹排翻了。<\/p>\n<p>水很冷。很黑。她往下沉，往下沉。<\/p>\n<p>那塊木牌從她的脖子上鬆開，紅繩子斷了。木牌比她沉得更快，翻著，轉著，一直往下，一直往下，落到很深很深的河底，落進淤泥裡。<\/p>\n<p>淤泥合起來，蓋住了它。<\/p>\n<p>然後，有人從上面，用一枝很粗的筆，在什麼地方，把一個名字，一筆一筆地，劃掉了。<\/p>\n<hr class=\"sep\">\n<p>陳守一跪在雨裡。<\/p>\n<p>懷裡的小女孩在發抖。她的身上有兩樣東西，一樣是她自己，十二歲，很怕，很冷，叫沈和；一樣是那個穿著舊衣服、在竹排上唱歌的孩子，很冷很冷，冷了一百一十五年。<\/p>\n<p>他把那樣東西往外拉。<\/p>\n<p>拉不動。它在沈和身上睡了八十三年，根已經長進去了。他拉，它就往裡縮；他再拉，它就往外掙。一拉一扯，那樣東西被他從中間，硬生生地，撕成了兩半。<\/p>\n<p>一半縮回沈和的身體裡。<\/p>\n<p>另一半，從他的手指縫裡，溜走了。<\/p>\n<p>他聽見它沿著村道往外跑。很快，很輕，像一陣風。跑過村口的橋，跑上山線的路，往山的另一邊去了。<\/p>\n<p>他想追。<\/p>\n<p>懷裡的小女孩抓著他的衣服，抓得很緊。<\/p>\n<p>他低頭看她。十二歲，臉色白得發青，嘴唇凍成紫色。她看著他，眼睛裡全是水，不知道是雨還是眼淚。<\/p>\n<p>她身上那一半，還在。睡著了，可是隨時會醒。<\/p>\n<hr class=\"sep\">\n<p>他坐在斷掉的橋頭，把布袋裡的東西倒出來。<\/p>\n<p>一只白色的小瓷瓶，空的，是他在上一個鎮的廟口跟人換來的。一把小刀。一張黃紙。<\/p>\n<p>他把手按在自己的胸口上。<\/p>\n<p>很多年前，在霧川渡的渡口，他也這樣做過。像從胸口抽出一條很長的線，一端在他身上，另一端穿進別人的身體裡。那一次，他抽了一大半。剩下的這一些，他帶著走了八十三年。<\/p>\n<p>這一次，他抽了剩下的一半。<\/p>\n<p>抽出來的東西很輕，很淡，在他的手心裡，是一團灰灰白白的光。他把那團光捏碎，捏成一顆一顆很小的、黑色的東西，一顆一顆放進那只瓷瓶裡。<\/p>\n<p>他拿小刀，在瓶底刻了一個字。<\/p>\n<p>和。<\/p>\n<p>和平的和。<\/p>\n<p>他怕她以後不記得自己是誰。<\/p>\n<p>他蹲下來。蹲到跟她一樣高。<\/p>\n<p>「逐工攏愛食，」他說，「一工都袂使袂記得。」<\/p>\n<p>他把瓶子放進她的手心，把她的手指一根一根地合起來，握緊。<\/p>\n<p>小女孩看著他。<\/p>\n<p>「你是誰？」她問。<\/p>\n<p>他沒有回答。他站起來，把銅鈴的紅線重新綁好，綁得很緊，打了一個結。<\/p>\n<p>然後他轉身，往山線的方向跑。<\/p>\n<hr class=\"sep\">\n<p>他跑了很久。<\/p>\n<p>雨一直下。山線的路被土石流沖斷了兩處，他從斷掉的路面上爬過去，爬過泥漿，爬過倒在路中間的樹。他的手心被磨破了，膝蓋撞在石頭上，可是不痛。他的身體已經不太會痛了。<\/p>\n<p>他胸口那裡很空。空得像一間把家具都搬走的房子，風從窗戶灌進來。<\/p>\n<p>他知道自己剩下的時間不多了。<\/p>\n<p>天快亮的時候，他看見了那個鎮。<\/p>\n<p>一條街，兩排房子。雜貨店，理髮院，藥房，一間廟，廟埕上有兩張石桌。很安靜。<\/p>\n<p>太安靜了。<\/p>\n<p>他從布袋裡摸出三枚銅錢，走進第一戶人家的騎樓，把銅錢往地上一撒。<\/p>\n<p>三枚全立。<\/p>\n<p>他走到第二戶。撒。三枚全立。<\/p>\n<p>第三戶。第四戶。雜貨店，理髮院，藥房，廟。<\/p>\n<p>整條街，每一戶，三枚全立。<\/p>\n<p>他站在廟埕中間，雨打在他的臉上，他看著地上那三枚立著的銅錢，看了很久。<\/p>\n<p>那一半，來過這裡了。<\/p>\n<hr class=\"sep\">\n<p>鎮口有一棵很大的榕樹。<\/p>\n<p>榕樹底下站著一個人。<\/p>\n<p>那個人撐著一把黑傘，戴著一頂帽子，背對著陳守一，正在榕樹底下擺什麼東西。一圈，繞著整個鎮口，一樣一樣擺下去。陳守一看不清楚是什麼。他只看見那個人的手很穩，擺得很慢，很仔細，像在佈置一桌宴席。<\/p>\n<p>他認得那雙手。<\/p>\n<p>他認得那個背影。八十三年，他沒有看見過這個背影，可是他認得。<\/p>\n<p>那個人擺完最後一樣東西，直起身來。整個鎮，在那一刻，好像被一塊看不見的布，從上面罩住了。雨還在下，可是雨落到鎮口，就停了。<\/p>\n<p>陳守一衝過去。<\/p>\n<p>他不知道自己要做什麼。他只知道不能讓那塊布蓋上去。他衝進那一圈東西裡，用肩膀，用整個身體，撞上去。<\/p>\n<p>有什麼東西裂了。<\/p>\n<p>很輕的一聲。像一只碗，摔在地上，裂了一條縫，沒有碎。<\/p>\n<p>他倒在榕樹底下。<\/p>\n<p>那個撐傘的人沒有回頭。他站在那裡，好像聽見了，又好像沒聽見。過了一會兒，他撐著傘，往山下走了。<\/p>\n<p>雨水從榕樹的葉子上滴下來，滴在陳守一的臉上。<\/p>\n<hr class=\"sep\">\n<p>他躺在泥裡，聽見有人在喊。<\/p>\n<p>很遠。從山線的路上，有一道手電筒的光，晃過來，晃過去。光底下有一個人在跑，跑得跌跌撞撞，一邊跑一邊喊一個名字。<\/p>\n<p>陳守一聽不清楚是什麼名字。雨太大了。他只聽得見那個聲音，喊得很用力，用力到聲音都破了，像一個在大街上把孩子弄丟的人。<\/p>\n<p>手電筒的光照到榕樹底下。<\/p>\n<p>是一個少年警察。二十五歲，也許更小，制服濕透了，貼在身上，頭髮貼在額頭上，臉上全是雨水，也許不只是雨水。他手上的手電筒在發抖。<\/p>\n<p>他看見倒在泥裡的陳守一，停住了。<\/p>\n<p>「先生？」他喊，「先生，你還好嗎？」<\/p>\n<p>他跑過來，蹲下來，伸手要扶他。<\/p>\n<p>就在那一刻，陳守一看見了。<\/p>\n<p>從那個鎮裡，從那一整條三枚全立的街上，有一樣東西，朝著這個少年衝過來。很快，很冷，像一陣從河底吹上來的風。<\/p>\n<p>那一半。<\/p>\n<p>它找到了一個活人。<\/p>\n<p>它撞進少年的胸口。<\/p>\n<p>少年整個人往後一仰，手電筒掉在地上，滾了兩圈，光照著榕樹的鬚根。少年跪在泥裡，兩隻手抓著自己的胸口，張著嘴，發不出聲音。<\/p>\n<p>陳守一撐起身體。<\/p>\n<p>他沒有魂了。剩下的那一點點，連一罐藥都做不出來。<\/p>\n<p>他還有一樣東西。<\/p>\n<p>他跪在雨裡，抬起頭，看著雨後面那片看不見的天。<\/p>\n<p>「我的名，」他說，「我押予你。」<\/p>\n<p>他不知道自己在跟誰說。城隍，土地，天，或是那個八十三年前在城隍廟門檻上收過他一句誓的、從來沒有開過門的人。<\/p>\n<p>雨停了一下。<\/p>\n<p>只有一下。<\/p>\n<p>然後他把手按在少年的胸口上。<\/p>\n<hr class=\"sep\">\n<p>他把自己剩下的全部，都放進去了。<\/p>\n<p>不是一條線。這一次沒有線可以抽了。他把自己整個人，像一件很舊很薄的衣服，脫下來，摺好，放進這個少年的身體裡。蓋在那一半上面。壓住它。<\/p>\n<p>他做的最後一件事，是在那件衣服的口袋裡，放了一句話。<\/p>\n<p>很小的一句。像一張摺得很小的紙條，塞在一件舊衣服的口袋最深處，穿衣服的人不會發現，要等很多年以後，有一天把手伸進口袋，才摸得到。<\/p>\n<p>他不知道這個少年以後會不會走到那條河。<\/p>\n<p>他不知道那個孩子以後會不會被找到。<\/p>\n<p>可是他看見了那塊木牌。他看見它掉下去的地方。<\/p>\n<p>他想，總要有人知道。<\/p>\n<p>他把那句話放進去了。<\/p>\n<p class=\"doc\">名字，佇河底。<\/p>\n<hr class=\"sep\">\n<p>少年倒在他身上。<\/p>\n<p>很重。比他想像的重。一個二十五歲的、活生生的人，壓在他已經不太有重量的身體上。<\/p>\n<p>陳守一躺在榕樹底下，看著從葉子縫裡漏下來的天。天開始亮了，灰白色的，很淡。<\/p>\n<p>他的手腕上綁著一條紅布條，洗到發白了，很多年了。<\/p>\n<p>他想起一個七歲的小女孩，坐在土地廟的神案底下，背靠著他的背，一直問他：小師父，你師父笑起來是什麼樣子。<\/p>\n<p>他笑了一下。<\/p>\n<p>眼角的紋，左邊三條，右邊四條。<\/p>\n<hr class=\"sep\">\n<p>周遠睜開眼睛。<\/p>\n<p>他跪在灰色的柏油路上，兩隻手撐著地。沈言蹲在他面前，一隻手抓著他的肩膀，抓得很用力。何靜和林依站在她身後。<\/p>\n<p>「周遠。」沈言說，「周遠。」<\/p>\n<p>他抬起頭。<\/p>\n<p>灰色的天，灰色的街。方陣已經退到很遠的地方了，啪，啪，啪，越來越小聲。<\/p>\n<p>他的臉上是濕的。他伸手摸了一下，不知道是什麼。<\/p>\n<p>「我看到了。」他說。<\/p>\n<p>他的聲音很啞。<\/p>\n<p>「他在我身體裡面，」他說，「放了一句話。」<\/p>\n<p>沈言看著他。<\/p>\n<p>周遠撐著地，慢慢站起來。他轉過身，看著往舊渡口的那條小路。小路底下，灰色的芒草後面，是那條河。<\/p>\n<p>「名字，」他說，「在河底。」<\/p>", "chars": 3868}, "44": {"title": "第四十四章　河底", "html": "<p>往舊渡口的小路，在背面比在外面長。<\/p>\n<p>周遠白天和小方走過一次，五分鐘就到河灘了。現在他們走了很久，小路一直往下，兩邊灰色的芒草比人還高，草葉擦過手臂，沒有聲音，也沒有感覺，像擦過一層很薄的霧。<\/p>\n<p>沈言走在最前面。她走得比剛才快。<\/p>\n<p>周遠跟在她後面，一步一步踩她的腳印。他的手還在發抖。不是冷，是另一種東西，從胸口最深的地方，一陣一陣地往外湧。那個聲音沒有再說話，可是他知道它醒著，像一個坐在黑暗房間裡的人，靜靜地，等他自己找到開關。<\/p>\n<p>芒草忽然沒有了。<\/p>\n<p>他們站在河邊。<\/p>\n<hr class=\"sep\">\n<p>不是周遠和小方白天看到的那片河灘。<\/p>\n<p>是渡口。<\/p>\n<p>一道石階，從他們腳下一級一級地往下，伸進河裡。石階很完整，沒有斷，沒有缺，每一級都乾乾淨淨，沒有青苔。石階旁邊是一座木頭的碼頭，木板一片一片排得很整齊，碼頭邊繫著兩艘小船，船頭朝著同一個方向。<\/p>\n<p>周遠回頭。<\/p>\n<p>石階的頂端，坡頂上，是那座城隍廟。不是他和小方看到的那座剪黏掉光的小廟，是一座完整的、屋簷上還站著剪黏的廟。門關著。門楣上的匾，字是反的。<\/p>\n<p>他知道這是什麼地方。<\/p>\n<p>這是一九三一年的霧川渡。不，比那更早。這是一個沒有人記得的渡口，被留在這裡，像一張被夾在書裡、忘了拿出來的照片。<\/p>\n<p>河就在石階底下。<\/p>\n<p>很寬，很平，灰色的，像一大片融化的鉛。它在流，周遠看得出來它在流，水面上有很細很細的紋路，一直往下游的方向拉。可是沒有聲音。一條這麼大的河，在他腳下流，安靜得像一幅畫。<\/p>\n<p>「這條河，」沈言說，「只往一個方向流。」<\/p>\n<p>她看著河面，聲音很低。<\/p>\n<p>「我在她裡面的時候，每天晚上都會來這裡。站在最下面那一級，看著河。」她說，「我不知道為什麼。現在我知道了。她每天晚上都要回來看一次，看她掉下去的地方。」<\/p>\n<hr class=\"sep\">\n<p>周遠走下石階。<\/p>\n<p>一級，兩級。他在最下面一級停下來。水淹到這一級的邊緣，灰色的水，很平，一點波紋都沒有。<\/p>\n<p>他蹲下來，看著水面。<\/p>\n<p>水裡沒有他的倒影。<\/p>\n<p>他伸出手，碰了一下水。<\/p>\n<p>很冰。不是冬天的那種冰，是更深的、從骨頭裡面往外透的冰。他的指尖一碰到水，胸口那個地方就猛地一縮，像有人用手抓住了他的心臟，捏了一下。<\/p>\n<p>然後他看見了。<\/p>\n<p>不是水面上。是他腦子裡。那個醒著的東西，把一樣東西推到他眼前，像攤開一張地圖。<\/p>\n<p>竹排。竹排從這一級石階邊上被推出去，往河中間漂。漂了大概二十步，三十步，翻了。一塊小木牌從一個小女孩的脖子上鬆開，往下沉。沉的位置，正對著坡頂那座城隍廟的大門，往河中間數過去，三十步。<\/p>\n<p>他站起來。<\/p>\n<p>「我要下去。」<\/p>\n<hr class=\"sep\">\n<p>沒有人說不行。<\/p>\n<p>林依把紅布包抱得很緊，看著那片灰色的河，臉色白得發青。何靜蹲下來，把手伸進布袋，握住那把割索刀，好像這樣能讓她比較不怕。<\/p>\n<p>沈言看著周遠。<\/p>\n<p>「河會牽人。」她說，「沒有名字的東西，掉進去，就一直往下游流，流到很遠很遠的地方，再也回不來。你有名字，它牽不走你。可是你不能放手。」<\/p>\n<p>「放什麼手？」<\/p>\n<p>沈言沒有回答。她轉身，走到碼頭邊，蹲下來，解開一艘小船的纜繩。纜繩是麻的，很粗，很舊，捲成一大捆，盤在碼頭的木樁上。她把纜繩的一端遞給周遠。<\/p>\n<p>「綁在你腰上。」她說，「我們拉著另一頭。你摸到了，就拉三下。」<\/p>\n<p>周遠接過纜繩，綁在腰上，打了一個死結。<\/p>\n<p>何靜站起來，把另一端接過去，纏在自己的手腕上，纏了兩圈。林依把紅布包塞進外套裡，拉上拉鍊，伸手抓住何靜後面的那一段。沈言站在最後面，握住繩子的尾巴。<\/p>\n<p>三個女人，一條繩子。<\/p>\n<p>周遠把銅鈴交給沈言，把小方的名冊交給林依。他摸了一下胸前的口袋，平安符還在。<\/p>\n<p>他走下最後一級石階，走進河裡。<\/p>\n<hr class=\"sep\">\n<p>水沒有濺起來。<\/p>\n<p>跟入口那片水一樣，他的腳踩下去，像踩在一級看不見的石階上。可是這裡沒有石階了。他往下踩，腳底下什麼都沒有，整個人一沉，水淹過他的頭頂。<\/p>\n<p>很冰。<\/p>\n<p>冰得他整個人縮起來，膝蓋撞到胸口。他睜開眼睛，眼前是一片灰，沒有上面，沒有下面，沒有光。他感覺得到腰上那條繩子，拉著他，很緊，從身後很遠的地方，有三雙手在拉著他。<\/p>\n<p>他不用呼吸。他發現了這一點，愣了一下，然後就不想了。<\/p>\n<p>他往下游。<\/p>\n<p>往下，往下。水越來越冷，越來越重，像一層一層的布壓在他身上。他用手撥開那些水，撥開的感覺很奇怪，像在撥開一層一層的紗，每撥開一層，下面還有一層。<\/p>\n<p>然後他的手碰到了底。<\/p>\n<p>軟的。很軟，很細，像麵粉，又像骨灰。他的手陷進去，陷到手腕。<\/p>\n<p>他摸到了一樣東西。<\/p>\n<p>硬的，扁的，長方形，邊緣有一點點鏽。他把它拿起來，湊到眼前。在這片灰色裡，他勉強看得見那是一塊牌子。鐵的，鏽得很厲害，上面刻著字，被鏽吃掉了一半。<\/p>\n<p>不是她的。<\/p>\n<p>他把它放下來。手往旁邊摸，又摸到一塊。再一塊。再一塊。<\/p>\n<p>整片河底，都是。<\/p>\n<p>一塊一塊的牌子，鐵的，木的，竹的，有的大有的小，有的鏽得只剩一個形狀，有的還很新，很亮。疊在一起，埋在淤泥裡，一層壓一層，像一片被人遺忘的墳場。<\/p>\n<p>他抓起一塊很亮的。很新，邊緣還是銳利的。上面刻著三個字，他認得。<\/p>\n<p class=\"beat\"><strong>邱永福<\/strong><\/p>\n<p>字的中間，有一條線。很直，很細，從第一個字的左邊，劃到最後一個字的右邊。<\/p>\n<p>周遠抓著那塊牌子，在冰冷的灰色裡，一動也不動。<\/p>\n<p>他旁邊還有。很新的，很亮的，就躺在那些舊牌子的最上面，像剛剛才掉下來。林秀枝。張金水。陳萬福。<\/p>\n<p>每一塊，都被劃了一條線。<\/p>\n<p>他把邱永福的牌子放回去。放得很小心，放在其他新牌子的旁邊，排整齊。<\/p>\n<p>他想，我會回來。<\/p>\n<hr class=\"sep\">\n<p>他繼續往前摸。<\/p>\n<p>正對著城隍廟大門，往河中間三十步。他在水裡數不清楚步數，只能憑著胸口那個東西的感覺，它一直在推他，往這邊，再往這邊，像一個人在黑暗裡，用手輕輕推著你的背。<\/p>\n<p>他的手又陷進淤泥裡。<\/p>\n<p>這一次，淤泥比剛剛更深，更冷。他的手臂陷到手肘，手指在淤泥裡摸，摸到一些很小的、碎碎的東西，像貝殼，像石頭，像牙齒。<\/p>\n<p>然後他摸到了一條繩子。<\/p>\n<p>很細，很短，斷了，斷口毛毛的，像被什麼東西扯斷的。繩子的另一端，綁在一樣東西上。<\/p>\n<p>他把那樣東西從淤泥裡拉出來。<\/p>\n<p>一塊木牌。<\/p>\n<p>很小。比他的手掌還小。木頭泡了一百多年的水，泡得發黑，發軟，邊角都圓了。繩子是紅的，或者曾經是紅的，現在只剩一點點很淡很淡的粉紅色，跟林依懷裡那包紅布的顏色一模一樣。<\/p>\n<p>他把木牌翻過來。<\/p>\n<p>上面有字。<\/p>\n<p>不是刻的，是寫的。用墨，一筆一筆寫上去的，墨吃進了木頭裡，泡了一百多年還沒有掉。字很醜，很大，很用力，兩個字擠在一塊小小的木牌上，第一個字寫得太大，第二個字只好擠在角落。<\/p>\n<p>一個小孩寫的字。照著別人寫好的，一筆一筆描出來的。<\/p>\n<p>兩個字的上面，有一條線。<\/p>\n<p>跟邱永福那塊牌子上的線不一樣。不是細細的、直直的一條。是很粗、很黑、很重的一條，像有人拿一枝很大的筆，蘸飽了墨，一口氣從左邊拖到右邊，拖到墨都滲進木紋裡，把那兩個字壓在底下。<\/p>\n<p>可是那兩個字還在。<\/p>\n<p>太用力了。那個小孩寫得太用力了。筆畫一直刻進木頭裡，比上面那條線還深。那條線把它們蓋住了，可是蓋不掉。<\/p>\n<p>周遠看著那兩個字。<\/p>\n<p class=\"beat\"><strong>蘇蟬<\/strong><\/p>\n<hr class=\"sep\">\n<p>他抓著那塊木牌，拉了繩子三下。<\/p>\n<p>繩子繃緊的那一瞬間，胸口那個醒著的東西，又替他攤開了一頁。<\/p>\n<hr class=\"sep\">\n<p class=\"era\">一九四九年，落雁街。<\/p>\n<p>天亮的時候，阿炳在戲棚外面的水溝邊洗臉。<\/p>\n<p>陳守一蹲在他旁邊，也洗。水很冰。阿炳那隻閉著的眼睛閉著，那隻半睜的眼睛看著水溝裡流過去的一片菜葉。<\/p>\n<p>「昨暝，」陳守一說，「你叫伊。」<\/p>\n<p>阿炳的手停了一下。<\/p>\n<p>「你叫一个名。兩字。」陳守一說，「我聽無。」<\/p>\n<p>阿炳沒有回答。他把臉上的水抹掉，甩了甩手，坐在水溝邊的石頭上。過了很久，他才開口。他的聲音很沙，很少說話的人那種沙。<\/p>\n<p>「我袂記得矣。」他說，「我叫的時陣，我知影。叫煞，就無去矣。逐擺攏按呢。拉彼條曲的時陣，伊就佇喙邊。曲停，伊就無去。」<\/p>\n<p>他看著自己的手。手指很粗，指腹上全是繭，是拉了一輩子胡琴的手。<\/p>\n<p>「毋過，」阿炳說，「我會記得一項代誌。」<\/p>\n<p>陳守一等著。<\/p>\n<p>「青崖仔，」阿炳說，「彼陣共伊寫過一塊柴牌仔。巴掌大，用墨寫。伊家己毋會寫，青崖仔先寫一張，伊照咧描，描甲歸手攏烏。描好，青崖仔鑽一个空，穿一條紅索仔，予伊掛佇頷頸。」<\/p>\n<p>他用手在自己的脖子上比了一下。<\/p>\n<p>「伊是撿來的。驚伊行毋見，驚人毋知伊是啥人。有彼塊牌仔，伊行到佗，人攏知伊叫啥名。」<\/p>\n<p>他把手放下來。<\/p>\n<p>「彼暗，伊有掛咧。」阿炳說，「我拉胡琴的時陣，看著伊頷頸彼條紅索仔，佇火把下底，一閃一閃。」<\/p>\n<p>他站起來，拍了拍褲子上的灰，往戲棚走去。走了兩步，他停下來，沒有回頭。<\/p>\n<p>「後來，」他說，「無人揣著。」<\/p>\n<hr class=\"sep\">\n<p>腰上的繩子在拉他。<\/p>\n<p>很用力，一下，一下，一下，三雙手一起在拉。周遠被往上拉，穿過一層一層的灰，冰冷的水從他身上滑過去。他把那塊木牌抓在手心裡，抓得很緊，緊到木頭的邊角陷進掌心的肉裡。<\/p>\n<p>他的頭衝出水面。<\/p>\n<p>灰色的天。灰色的石階。三個人站在最下面一級，何靜在最前面，手腕上纏著繩子，纏到那一圈皮膚都紅了；林依抓著她後面的那一段，指節發白；沈言在最後面，整個人往後仰，用全身的重量拉著。<\/p>\n<p>周遠爬上石階。<\/p>\n<p>他跪在最下面那一級，喘不過氣，雖然他剛剛在水裡根本不用呼吸。他渾身是濕的，冷得牙齒在打顫。<\/p>\n<p>林依衝過來，把自己的外套脫下來，裹在他身上。何靜蹲下來，抓起他的手，摸他的脈搏，她的手指在發抖。<\/p>\n<p>周遠沒有動。<\/p>\n<p>他攤開手。<\/p>\n<p>掌心裡，那塊很小的、泡得發黑的木牌，躺在那裡。紅繩子的斷口垂下來，很淡很淡的粉紅色。<\/p>\n<p>三個人都看著它。<\/p>\n<p>沈言蹲下來，看著木牌上那兩個被一條粗黑的線壓著的字。她的嘴唇動了一下。<\/p>\n<p>周遠伸出另一隻手，很輕地，按在她的手腕上。<\/p>\n<p>「先不要。」他說。<\/p>\n<p>沈言抬頭看他。<\/p>\n<p>「還不是時候。」周遠說，「她等了一百二十七年。要叫，就要好好地叫。」<\/p>\n<p>沈言看著他，看了一陣子，點點頭。<\/p>\n<p>她把那兩個字，吞了回去。<\/p>\n<p>周遠把木牌用林依的外套袖子包好，放進胸前的口袋裡，和阿凱的平安符放在一起。隔著濕透的衣服，他感覺得到它貼在他的胸口上。<\/p>\n<p>很冰。<\/p>\n<p>可是慢慢地，在他的體溫底下，好像沒有那麼冰了。<\/p>", "chars": 3824}, "45": {"title": "第四十五章　道歉", "html": "<p>他們在最下一級石階上等。<\/p>\n<p>沈言說，不用去找。她每天晚上都會回來，回到這裡，站在最下一級，看著河。方陣跟著她，她走到哪裡，方陣就退到哪裡。<\/p>\n<p>所以他們等。<\/p>\n<p>周遠坐在石階上，渾身還是濕的。林依的外套裹在他身上，袖子裡包著那塊木牌，貼著他的胸口。何靜坐在他旁邊，手腕上被纜繩勒出來的那一圈紅印，變成了紫色。她一直用另一隻手揉著它，揉一下，停一下，好像忘了自己在揉。<\/p>\n<p>林依把小方的名冊還給他。<\/p>\n<p>封面上那行麥克筆的字被水濺到了，暈開了一點。<strong>霧川　樂捐碑名冊（附戶籍追溯）<\/strong>。周遠用袖子擦了擦，沒擦乾淨。<\/p>\n<p>他翻開來。<\/p>\n<p>四十二個碑上的名字，每一個名字後面一條線，往下拉，拉到現在的那個人。最後一頁，廟公和他的祖父。<\/p>\n<p>他從第一頁開始看，一頁一頁，看到最後一頁，又翻回第一頁。<\/p>\n<p>「你在背嗎？」林依問。<\/p>\n<p>「嗯。」<\/p>\n<p>「那天晚上，你不是背過了？」<\/p>\n<p>「那天晚上是唸。」周遠說，「今天要叫。」<\/p>\n<p>林依看著他，沒有再問。<\/p>\n<hr class=\"sep\">\n<p>啪。<\/p>\n<p>從坡上，從那條長著灰色芒草的小路，傳下來。<\/p>\n<p>啪，啪，啪。<\/p>\n<p>周遠闔上名冊，站起來。何靜也站起來。沈言站在最前面，林依站在她旁邊，兩個人的手握在一起。<\/p>\n<p>方陣從芒草後面退出來。<\/p>\n<p>一排一排，倒退著，走下石階。他們的背對著河，臉朝著坡頂的城隍廟，雙手平舉，手腕垂著，往左晃，往右晃，往後退一步。他們退得很整齊，每一步都剛好踩在一級石階上，像排練過一百年。<\/p>\n<p>周遠他們退到碼頭邊上，讓出石階。<\/p>\n<p>方陣一排一排地經過他們，退到最下面幾級，停住了。最前面的那一排，腳跟已經碰到了水。<\/p>\n<p>然後她來了。<\/p>\n<p>她從芒草後面最後一個退出來，拖著那件太大的黑袍，退得很吃力。她退下石階，穿過方陣，四十三個人在她經過的時候，像水被分開一樣，讓出一條路。她一直退，退到最下面那一級，停下來。<\/p>\n<p>轉身。<\/p>\n<p>背對著所有人，面對著那條灰色的河。<\/p>\n<p>就那樣站著。<\/p>\n<p>周遠看見了一樣他剛才沒看見的東西。<\/p>\n<p>她的腰上，綁著一條繩子。<\/p>\n<p>很粗，麻的，濕透了，顏色跟河水一樣灰。繩子從她的腰上，往前延伸，垂進水裡，繃得很緊，一直延伸到河中間，延伸到看不見的地方。<\/p>\n<p>像有什麼東西，在河的另一頭，一直拉著她。<\/p>\n<p>「那條繩子，」何靜說，聲音很輕，「我剛才沒看到。」<\/p>\n<p>「只有在這裡才看得到。」沈言說，「在上面的時候，我也不知道有。我只知道每天晚上，有一個東西，一直把我往河裡拉。」<\/p>\n<p>何靜沒有說話。<\/p>\n<p>她把手伸進布袋裡，握住了那把刀。<\/p>\n<hr class=\"sep\">\n<p>周遠走到方陣前面。<\/p>\n<p>四十三個人，站在石階上，一排一排，背對著河。他們的手還平舉著，臉上是那種很深的、很累的空白。<\/p>\n<p>他翻開名冊。<\/p>\n<p>「邱永福。」<\/p>\n<p>他的聲音在這個沒有聲音的地方，很清楚，很大，大到他自己都嚇了一跳。<\/p>\n<p>第三排，汗衫、發白的西裝褲，那個人停了一下。<\/p>\n<p>周遠又叫了一次。<\/p>\n<p>「邱永福。」<\/p>\n<p>那個人的手，慢慢地，放下來了。<\/p>\n<p>他眨了眨眼睛，低頭看自己的手，又抬頭看四周。灰色的石階，灰色的河，灰色的天。他身邊一排一排的人，還舉著手，晃著。他看了一陣子，好像不認得這個地方，又好像認得。<\/p>\n<p>他的眼睛落在周遠身上。<\/p>\n<p>「警察先生。」他說。<\/p>\n<p>他的聲音很啞，很乾，像很久沒說過話。<\/p>\n<p>周遠點點頭。<\/p>\n<p>「邱先生，」他說，「你阿祖叫什麼名字？」<\/p>\n<p>邱永福愣住了。<\/p>\n<p>「我阿祖……」<\/p>\n<p>「邱阿添。」周遠說，「霧川渡城隍廟後殿的碑上，第十一行，捐銀伍員。」<\/p>\n<p>他把名冊翻到那一頁，舉起來給邱永福看。小方印出來的碑文拓片，第十一行，三個字，旁邊一條線往下拉，拉到邱旺，拉到邱水木，拉到邱永福。<\/p>\n<p>邱永福看著那三個字。<\/p>\n<p>「一八九九年，」周遠說，「霧川渡做大水。有一個戲班的小女孩，七歲，八歲，被綁在竹排上，推進河裡。你阿祖那天晚上，在石階上。」<\/p>\n<p>他沒有說更多。他沒有說是誰推的，沒有說邱阿添有沒有拿火把，沒有說隔年邱阿添拿了五塊銀，把自己的名字刻上一塊謝神的碑。<\/p>\n<p>他只是說了，然後等著。<\/p>\n<p>邱永福盯著那頁名冊。<\/p>\n<p>然後他轉過頭，看著站在最下一級石階上的那個背影。很小，濕透了，穿著一件拖到地上的黑袍。<\/p>\n<p>他看著。<\/p>\n<p>他的膝蓋彎下來了。<\/p>\n<p>他跪在石階上，跪在那個背影後面三級的地方，兩隻手撐著地，頭低下去，低到額頭快碰到石頭。<\/p>\n<p>「阮阿祖，」他說，聲音在發抖，「攏是伊的毋著。」<\/p>\n<p>他停了一下。<\/p>\n<p>「嘛是我的毋著。」他說，「我毋知。我一世人攏毋知。毋過毋知，嘛是毋著。」<\/p>\n<p>他的額頭碰到了石階。<\/p>\n<p>「對不起。」<\/p>\n<hr class=\"sep\">\n<p>周遠聽見了一個聲音。<\/p>\n<p>很小，很遠。從河裡傳上來。<\/p>\n<p>他轉過頭，看著那片灰色的水。水面上，靠近石階的地方，冒出一樣東西。一塊牌子。鐵的，很新，很亮，從水底慢慢地浮上來，浮到水面上，被水推著，漂到最下一級石階的邊上，停住了。<\/p>\n<p>周遠蹲下來，把它撿起來。<\/p>\n<p class=\"beat\"><strong>邱永福<\/strong><\/p>\n<p>中間那條細細的直線，不見了。<\/p>\n<p>他把牌子遞給邱永福。邱永福跪在那裡，伸出手，接過去。他看著自己的名字，把它抱在胸口，抱得很緊，像抱著一個剛出生的孩子。<\/p>\n<hr class=\"sep\">\n<p>周遠翻到下一頁。<\/p>\n<p>「林秀枝。」<\/p>\n<p>一個一個。<\/p>\n<p>他叫一個名字，那個人就停下來，放下手，眨眼睛，看四周，看見他，看見他手上的名冊，看見那個站在最下一級的背影。<\/p>\n<p>他把他們阿祖的名字、碑上的第幾行、捐了多少錢，唸給他們聽。唸完，他就等。<\/p>\n<p>林秀枝哭了。她哭得很大聲，在這個沒有聲音的地方，她的哭聲像一面破掉的鑼，一直響。她一邊哭一邊說對不起，說了十幾次，說到她的牌子浮上來，她還在說。<\/p>\n<p>那個戴眼鏡、鏡片裂了一條縫的年輕人，三十歲，在縣城的補習班教數學，他聽完，沉默了一陣子，然後走下石階，走到離那個背影最近的地方，蹲下來，蹲到跟她一樣高。<\/p>\n<p>「我不知道該說什麼。」他對著那個背影說，「我只知道我阿祖做了很壞的事。對不起。」<\/p>\n<p>那個背影沒有動。<\/p>\n<p>他的牌子浮上來了。<\/p>\n<p>一個，兩個，十個，二十個。<\/p>\n<p>周遠的手臂上抱滿了牌子。濕的，冰的，一塊疊一塊。何靜走過來，接過一部分。林依也接過一部分。<\/p>\n<hr class=\"sep\">\n<p>不是每一個人都跪下來。<\/p>\n<p>陳志雄，主街第六戶。大家叫他阿雄。五十幾歲，身材很壯，脖子很粗。他放下手，眨了眨眼睛，看清楚四周以後，第一件事是往後退了一步。<\/p>\n<p>周遠把他阿祖的名字唸給他聽。碑上第二十三行。<\/p>\n<p>阿雄聽完，臉上的表情很奇怪。不是害怕，是一種被冒犯的、很生氣的表情。<\/p>\n<p>「一百年前的代誌，」他說，「關我啥代？」<\/p>\n<p>周遠沒有說話。<\/p>\n<p>「我毋捌伊。」阿雄說，指著那個背影，「我嘛毋捌我阿祖。伊做啥，我哪會知？我是家己的代誌家己擔，人欠我的，我嘛無去討。今仔日叫我跪落去，替一个我毋捌的人，共一个我毋捌的囡仔會失禮？」<\/p>\n<p>他的聲音很大，很粗，在石階上撞來撞去。<\/p>\n<p>「你叫我跪，我就愛跪？」<\/p>\n<p>「我沒有叫你跪。」周遠說。<\/p>\n<p>阿雄愣了一下。<\/p>\n<p>「你可以不跪。」周遠說，「我只是把你阿祖的名字唸給你聽。你知道了。就這樣。」<\/p>\n<p>阿雄看著他。看著他手上那疊牌子。看著跪在石階上、抱著自己牌子的邱永福。<\/p>\n<p>他沒有跪。<\/p>\n<p>他往後退，退到石階的最上面，退到芒草的邊上，背對著所有人，站在那裡。<\/p>\n<hr class=\"sep\">\n<p>劉金生，鎮公所退休的會計。他聽完，搖頭，一直搖頭。<\/p>\n<p>「我家己的帳，」他說，「攏算袂清矣。閣愛算阮阿祖的？」<\/p>\n<p>他也退上去了，站在阿雄旁邊。<\/p>\n<p>吳添丁，開計程車的。他聽完，蹲在石階上，抱著頭，最後站起來，說：「我一工駛十二點鐘，駛三十冬，駛甲腰骨攏歹去。我欠啥人？我啥人都毋欠。」<\/p>\n<p>他也退上去了。<\/p>\n<p>張金水，在縣城開建材行的。他聽完，第一句話是：「阮阿祖捐偌濟？」<\/p>\n<p>周遠告訴他。碑上第三行，捐銀拾員。<\/p>\n<p>張金水點點頭，好像鬆了一口氣。<\/p>\n<p>「捐甲遮爾濟，」他說，「就是有心。阮這代，逐年嘛有捐廟，捐幾若十萬。」他攤開手，「欠啥？」<\/p>\n<p>他沒有等周遠回答，自己就走上去了。<\/p>\n<p>四個人。站在石階的最上面，芒草的邊上，背對著河，背對著那個小小的背影，也背對著周遠。<\/p>\n<p>周遠看著他們。<\/p>\n<p>他沒有叫他們回來。<\/p>\n<hr class=\"sep\">\n<p>最後一頁。<\/p>\n<p>周遠翻到最後一頁，叫了那個名字。那個他只叫過一次的名字，那天晚上，隔著一扇鐵門。<\/p>\n<p>最後一排，那個跳得最慢、手抬得不夠高、腳退得不夠遠的老人，停下來了。<\/p>\n<p>廟公放下手。<\/p>\n<p>他沒有看四周。他好像一直都知道自己在哪裡。他低著頭，看著自己腳下那一級石階。<\/p>\n<p>「毋是我。」他說。<\/p>\n<p>「我知道。」周遠說。<\/p>\n<p>「嘛毋是阮阿公。」廟公說，「伊講，彼句毋是伊講的。伊講甲死。」<\/p>\n<p>他抬起頭，看著周遠。他的眼睛很紅，紅得像一個哭了很多年的人。<\/p>\n<p>「毋過是伊的喙。」他說，「彼句話，是對伊的喙出去的。」<\/p>\n<p>他慢慢地，一級一級地，走下石階。他走得很慢，膝蓋不好，每一級都要先把一隻腳放下去，站穩了，再把另一隻腳放下去。他走到那個背影的後面，停住。<\/p>\n<p>「阮阿公，」廟公說，「做一雙鞋仔予妳。伊縫歸冬，十隻指頭仔攏是空。縫好，毋敢提來。囥佇廟裡，囥一世人。」<\/p>\n<p>他的聲音很小，很慢，像在跟一個很小的孩子講話。<\/p>\n<p>「彼雙鞋仔，阮後生有收咧。」他說，「妳若欲，我叫伊提來。」<\/p>\n<p>那個背影沒有動。<\/p>\n<p>廟公跪下來了。他跪得很慢，膝蓋碰到石階的時候，他痛得吸了一口氣。<\/p>\n<p>「對不起。」他說，「阮阿公講毋出喙，我替伊講。」<\/p>\n<p>他的牌子浮上來了。<\/p>\n<hr class=\"sep\">\n<p>周遠數了一下手上的牌子。<\/p>\n<p>三十九塊。<\/p>\n<p>他抬頭看石階的最上面。四個人，背對著他們，站在芒草的邊上，一動也不動。<\/p>\n<p>河底還有四塊。<\/p>\n<p>他把牌子交給林依，走到最下一級石階，走到那個背影旁邊。<\/p>\n<p>她還是背對著所有人，面對著河。她腰上那條灰色的麻繩，還是繃得很緊，一直延伸到河中間。<\/p>\n<p>周遠蹲下來，看著那條繩子。<\/p>\n<p>繩子綁在她的腰上，打了一個很緊的結。結很舊，泡了一百多年的水，麻繩的纖維都脹開了，黏在一起，分不清哪裡是頭，哪裡是尾。<\/p>\n<p>他伸手，想去解那個結。<\/p>\n<p>「我來。」<\/p>\n<p>何靜站在他身後。<\/p>\n<p>她把布袋放在石階上，從裡面拿出那把小刀。刀身只有手掌長，木柄被一百多年的手握得發亮，刀刃上全是鏽。刀柄的尾端，刻著一個很小的「何」字。<\/p>\n<p>她蹲下來。<\/p>\n<p>蹲在那個背影旁邊，蹲到跟她一樣高。<\/p>\n<p>「我阿嬤的阿公，」何靜說，聲音很穩，很平，像在念一份病歷，「那天晚上，帶著這把刀，來這裡，要割這條繩子。刀被搶走了。他用手拉，手皮都磨掉了。他拉不住。」<\/p>\n<p>那個背影，很輕很輕地，動了一下。<\/p>\n<p>「他後來，一輩子都在聽。」何靜說，「每年十月十五，他都帶著這把刀，坐在河邊，聽妳有沒有原諒他。」<\/p>\n<p>她握住那條繩子。<\/p>\n<p>繩子很冰，很粗，繃得很緊，她的手一碰上去，整條手臂都抖了一下。<\/p>\n<p>「我不知道妳有沒有原諒他。」何靜說，「可是他想救妳。這件事，妳要知道。」<\/p>\n<p>她把刀放上去。<\/p>\n<p>刀很鈍，鏽得很厲害，麻繩又粗又韌。她割一下，只割斷了幾根纖維。她再割。再割。她咬著牙，手腕上被纜繩勒出來的那一圈紫色的印子，被她自己的力氣撐得發白。<\/p>\n<p>割了一刀又一刀。<\/p>\n<p>最後一根纖維斷掉的時候，沒有聲音。<\/p>\n<p>繩子從那個背影的腰上鬆開，垂下去，掉進水裡。灰色的河水把它捲走了，往下游，往很遠很遠的地方，一下子就看不見了。<\/p>\n<p>那個背影晃了一下。<\/p>\n<p>像一個被拉了一百多年的人，忽然不被拉了，不知道該怎麼站。<\/p>\n<p>她慢慢地，轉過頭來。<\/p>\n<p>不是轉過整個身體。只是轉過頭，從那頂太大的帽子底下，看著蹲在她旁邊的何靜。<\/p>\n<p>看著何靜手上那把生鏽的小刀。<\/p>\n<p>看著刀柄尾端那個小小的「何」字。<\/p>\n<p>她伸出手，從那條太長的袖子裡，伸出一根很細的、指甲縫裡卡著黑泥的手指，碰了一下那個字。<\/p>\n<p>何靜沒有動。<\/p>\n<p>她蹲在那裡，讓那根手指一直碰著刀柄。<\/p>\n<hr class=\"sep\">\n<p>石階的最上面，四個人還站在那裡。<\/p>\n<p>周遠回頭看了他們一眼。<\/p>\n<p>「門開著。」他說，聲音不大，可是在這個沒有聲音的地方，他知道他們聽得見，「要走不走，你們自己選。」<\/p>\n<p>沒有人回頭。<\/p>\n<p>周遠轉回來。<\/p>\n<p>邱永福還跪在石階上，抱著他的牌子。他旁邊是林秀枝，眼睛哭腫了，一隻手搭在邱永福的背上。再旁邊是那個戴眼鏡的年輕人，廟公，三十九個人，坐的坐，跪的跪，在這道一百多年沒有人走過的石階上，一級一級地，安安靜靜地，等著。<\/p>\n<p>沒有人知道在等什麼。<\/p>\n<p>周遠也不知道。<\/p>\n<p>他只知道，那個小小的背影，第一次，沒有在看河。<\/p>", "chars": 4559}, "46": {"title": "第四十六章　葬歌・二", "html": "<p>沈言先開口。<\/p>\n<p>不是唱，是說話。她走下石階，走到最下一級，站在那個小小的背影旁邊。不是後面，是旁邊。肩膀和肩膀之間，隔著一個拳頭的距離。<\/p>\n<p>她看著河。跟那個孩子一樣，看著那片灰色的、沒有聲音的水。<\/p>\n<p>「十二年，」沈言說，「妳都在我裡面。」<\/p>\n<p>那個孩子沒有轉頭。<\/p>\n<p>「我每天早上吃一顆藥，把妳壓下去。一天都沒斷過。」沈言說，「我不知道妳是誰。我只知道我身體裡有一個很冷的東西，晚上會醒。我很怕妳。」<\/p>\n<p>她停了一下。<\/p>\n<p>「後來我想起來了。」她說，「每一扇門，每一張臉。我想起來，妳不是在帶他們跳舞。妳是在找。妳每天晚上都在找，找那些人家的門，一扇一扇敲。妳在找誰欠妳。」<\/p>\n<p>河面上，很遠的地方，有一道很細的紋，往下游拉過去。<\/p>\n<p>「我不怕了。」沈言說，「九十五年前，有一個人站在這裡，說她甘願。她是我阿祖的阿母。」<\/p>\n<p>她轉過頭，看著那個孩子的側臉。帽簷底下，那張很小、很白的臉。<\/p>\n<p>「我也甘願。」<\/p>\n<hr class=\"sep\">\n<p>林依是第二個。<\/p>\n<p>她從外套裡拿出那包紅布。粉紅色的，褪得很淡，麻繩綁了好幾圈，一圈都沒拆過。阿祖抱了九十五年，抱在胸口，抱在枕頭底下，誰都不准碰。<\/p>\n<p>她抱著它，走下石階，走到那個孩子的另一邊。<\/p>\n<p>她蹲下來。<\/p>\n<p>「我阿祖，」林依說，「叫林小滿。」<\/p>\n<p>她的聲音在抖。她吸了一口氣，讓它不要抖。<\/p>\n<p>「九十五年前，她七歲。她爬上土地廟的神桌，把橫樑上這包東西拿下來。」<\/p>\n<p>那個孩子的頭，很輕地，往林依這邊偏了一點。<\/p>\n<p>「她不知道這是什麼。她只知道拿了以後，很多人死了。她阿爸也死了。」林依說，「她抱著它，抱了一輩子。她最後一句話是說，這次我沒跑。」<\/p>\n<p>林依把紅布包放在石階上。放在那個孩子光著的腳旁邊。<\/p>\n<p>「她說，她一定會回來還。」林依說，「她回不來了。我替她來。」<\/p>\n<p>她的手放在紅布包上，按了一下。<\/p>\n<p>然後鬆開。<\/p>\n<p>「還給妳。」<\/p>\n<p>紅布包放在灰色的石階上，很小，很舊，是這整個灰色的地方唯一有顏色的東西。淡淡的粉紅色，像傍晚最後一點天光。<\/p>\n<p>那個孩子低下頭，看著它。<\/p>\n<hr class=\"sep\">\n<p>周遠站在她身後。<\/p>\n<p>他的手放在胸前的口袋上，隔著濕透的衣服，按著那塊木牌。<\/p>\n<p>宿主甘願。放之者歸還。<\/p>\n<p>封之者放手。<\/p>\n<p>他知道自己該做什麼。他不知道怎麼做。他胸口那個醒著的東西，很安靜，安靜得像在等他自己想通。<\/p>\n<p>他想起石崗的那個晚上。先生站在窗邊，說：去，敲。<\/p>\n<p>他想起他對著那床蓋著鏡子的牡丹花被子，敲了兩下，停住，想像自己掰開一隻扣了十二年的手。<\/p>\n<p>他把手伸進口袋，把那塊木牌拿出來。<\/p>\n<p>用林依的外套袖子包著。他一層一層地把袖子打開。<\/p>\n<p>木牌躺在他的手心裡。很小，泡得發黑，那條粗粗的墨線還在，壓著底下那兩個寫得很醜的字。紅繩子的斷口垂下來，淡淡的粉紅色。<\/p>\n<p>他握著它。握得很緊。他從河底一路握上來，握到木頭的邊角陷進掌心的肉裡。<\/p>\n<p>他把手指，一根一根地，鬆開。<\/p>\n<hr class=\"sep\">\n<p>他們開始唱。<\/p>\n<p>周遠先唱。他走音，他知道。他唱第一句，往下沉，沉到很深的地方，停一拍。他的聲音在這個沒有聲音的地方，很粗，很啞，像一把生鏽的鋸子。<\/p>\n<p>沈言接上來。她的聲音很穩，在第三句往下沉的那個地方，往上挑了一點點。<\/p>\n<p>林依跟著。她的聲音很小，很細，第二句往下沉的地方翻高了，翻得像一個七歲的小孩。<\/p>\n<p>何靜沒有唱。<\/p>\n<p>她站在石階上，站在三個人的後面。她不會唱這首。她六年學不會。<\/p>\n<p>可是她在聽。<\/p>\n<hr class=\"sep\">\n<p>他們唱到第八句的時候，那個孩子動了。<\/p>\n<p>她慢慢地，轉過身來。<\/p>\n<p>整個身體。拖著那件太大的黑袍，轉了半圈，背對著河，面對著站在石階上的四個人，面對著石階上坐著、跪著的三十九個人。<\/p>\n<p>她仰著頭，從帽簷底下看著他們。<\/p>\n<p>她身上那兩條黑線，從袖口伸出去，往灰色的天上繃。繃得很緊，越來越緊，緊得那兩條細細的線開始發抖，像兩根被拉到極限的琴弦。<\/p>\n<p>他們繼續唱。<\/p>\n<p>第九句。第十句。<\/p>\n<p>周遠唱得喉嚨發痛。他不知道這首歌還有多長。他只知道每一句還沒到，他就知道它會往哪裡走。往下，再往下，在這裡停一拍，在這裡轉回來。<\/p>\n<p>第十一句。<\/p>\n<p>最後一句。<\/p>\n<p>往下沉，沉到很深很深的地方。停一拍。<\/p>\n<p>轉回來。<\/p>\n<p>結束了。<\/p>\n<p>歌畢。<\/p>\n<hr class=\"sep\">\n<p>石階上很安靜。<\/p>\n<p>周遠聽得見自己的呼吸。聽得見林依在哭，哭得沒有聲音，只有吸鼻子的聲音。<\/p>\n<p>那個孩子站在最下一級，看著他。<\/p>\n<p>他知道是現在。<\/p>\n<p>歌畢，愛喊。一九三一年的那個下午，一個男人坐在客棧的窗邊，一邊寫一邊念，念到這裡，下面的字被一個十七歲少年的瞌睡蓋住了。九十五年，沒有人知道後面是什麼。<\/p>\n<p>周遠現在知道了。<\/p>\n<p>他走下石階。走到最下一級，走到她面前。他蹲下來，蹲到跟她一樣高。<\/p>\n<p>他攤開手。<\/p>\n<p>木牌在他的手心裡。<\/p>\n<p>她看著那塊木牌。看著那條粗粗的墨線。看著墨線底下，那兩個她自己一筆一筆描出來的、很醜很用力的字。<\/p>\n<p>她的眼睛睜大了。<\/p>\n<p>周遠看著她的眼睛。很大，很黑，像兩口很深的井。井底有什麼東西，很遠很遠，一點一點地，往上浮。<\/p>\n<p>他開口。<\/p>\n<p>聲音很輕，很慢，像在叫一個睡著的孩子起床。<\/p>\n<p>「蘇蟬。」<\/p>\n<hr class=\"sep\">\n<p>那條墨線，裂了。<\/p>\n<p>不是斷，是裂。像一層很老很老的漆，從中間裂開一條縫，縫往兩邊爬，爬滿整條線，然後一片一片地剝落，掉下來，落在周遠的手心裡，變成灰，被一陣他感覺不到的風吹散了。<\/p>\n<p>底下那兩個字，露出來了。<\/p>\n<p>很醜，很大，很用力。第一個字寫得太大，第二個字只好擠在角落。<\/p>\n<p>蘇蟬。<\/p>\n<p>那個孩子張開嘴。<\/p>\n<p>她的嘴唇在動，好像在學一個她很久很久沒有說過的字。嘴唇凍得發紫，抖著，一次，兩次，三次。<\/p>\n<p>然後她發出了聲音。<\/p>\n<p>很小，很啞，像一個很久沒有說話的人。<\/p>\n<p>「……蘇蟬。」<\/p>\n<p>她說了她自己的名字。<\/p>\n<hr class=\"sep\">\n<p>那兩條黑線，斷了。<\/p>\n<p>同時斷的。兩聲很輕很輕的聲音，像兩根琴弦在很遠的地方斷掉。斷掉的線往上縮，縮回那片灰色的天空裡，一下子就看不見了。<\/p>\n<p>那件黑袍，從她的肩膀上滑下來。<\/p>\n<p>很慢。像一件太大的、濕透的大衣，從一個小孩的肩膀上，自己滑下來。滑到她的手肘，滑到她的腰，滑到她的腳邊，堆在石階上，堆成一大團灰黑色的布。<\/p>\n<p>那頂帽子掉了。滾了兩圈，滾進河裡，沒有濺起水花，沉下去了。<\/p>\n<p>那條鐵鍊，那塊令牌，噹的一聲，掉在石階上。<\/p>\n<p>「巡夜」那兩個字，朝下，貼著石頭。<\/p>\n<p>她站在那一堆黑布中間。<\/p>\n<p>很小。比剛才更小。她身上穿著一件很舊的衣服，灰灰的，看不出原來是什麼顏色，袖口短了一截，露出兩隻很細的手腕。她光著腳。頭髮濕濕地貼在臉上。<\/p>\n<p>就是一個小孩。<\/p>\n<p>一個七歲還是八歲的、渾身濕透的、很冷的小孩。<\/p>\n<hr class=\"sep\">\n<p>沈言開始唱另一首歌。<\/p>\n<p>周遠一聽就知道是哪一首。<\/p>\n<p>那支甜的曲子。輕快的，黏的，像糖漿從屋簷上一滴一滴往下淌。他在一九三一年的月光底下聽過，在一整個鎮的腳步聲裡聽過，在一輛關不掉的車上收音機裡聽過。<\/p>\n<p>可是沈言唱得很慢。<\/p>\n<p>很慢，很低。原本往上跳的地方，她讓它停一下；原本要轉個花腔的地方，她讓它直直地往下落。<\/p>\n<p>拉慢了，就不甜了。<\/p>\n<p>就只是一個小孩子在唱歌。<\/p>\n<p>何靜的嘴唇動了。<\/p>\n<p>她站在三個人後面，跟著沈言哼了起來。一開始很小聲，像怕被人聽見。然後大聲一點。她的聲音跟沈言疊在一起，一高一低，一模一樣的調子，一模一樣的慢。<\/p>\n<p>她會唱這首。她從很小很小的時候就會了。她阿嬤在她床邊唱，她媽媽在她床邊唱。她阿嬤說，是她阿公教她的。她阿公說，是一個囡仔教他的。<\/p>\n<p>那個孩子轉過頭，看著何靜。<\/p>\n<p>她的眼睛睜得很大。<\/p>\n<p>然後她的嘴唇也動了。<\/p>\n<p>她跟著唱。很小聲，很啞，慢半句，走調。在第二句往下落的地方，她翻高了一點，像一個七歲的小孩不太記得調子，憑著感覺往上跳。<\/p>\n<p>三個聲音。四個。林依也跟上了。周遠沒有唱，他不會這首，他只是蹲在那裡，聽著。<\/p>\n<p>石階上，三十九個人，一個一個地，安靜下來。邱永福抱著他的牌子，閉著眼睛。林秀枝靠在他的肩膀上。廟公跪在那裡，嘴唇在動，好像也會這首，好像也有人在他很小很小的時候唱給他聽過。<\/p>\n<p>那個孩子唱著，唱著，兩隻手慢慢地垂下來。<\/p>\n<p>她的手一直舉著。從周遠第一次在積水裡看見她，她的手就一直舉著，在帶舞，往左晃，往右晃，被那兩條線拉著。線斷了，她的手還是習慣性地舉著，舉在半空中，不知道該放哪裡。<\/p>\n<p>現在，她把手放下來了。<\/p>\n<p>垂在身體兩側。很輕，很自然，像一個唱累了的孩子，終於可以休息。<\/p>\n<hr class=\"sep\">\n<p>歌停了。<\/p>\n<p>她站在石階上，低頭看著自己的手。翻過來，又翻過去。看手心，看手背，看指甲縫裡的黑泥。好像這雙手很久很久沒有屬於她了。<\/p>\n<p>然後她彎下腰，把林依放在石階上的那包紅布撿起來，抱在懷裡。<\/p>\n<p>抱得很緊。<\/p>\n<p>周遠把木牌放進她的手裡。她用另一隻手接過去，跟紅布包抱在一起。<\/p>\n<p>她抬頭看著周遠。<\/p>\n<p>「青崖兄咧？」她問。<\/p>\n<p>聲音很小，很啞，帶著一點很老很老的口音。<\/p>\n<p>周遠胸口那個醒著的東西，猛地一縮。<\/p>\n<p>他張開嘴。他聽見自己的聲音，可是那不完全是他的聲音，有一點點年輕，有一點點台語的腔，像一個十七歲的少年在借他的嘴說話。<\/p>\n<p>「伊佇城隍廟後壁。」那個聲音說，「伊等妳等足久矣。」<\/p>\n<p>她看著他，眨了眨眼睛。<\/p>\n<p>然後她轉過頭，看著石階的頂端。坡頂上，那座灰色的城隍廟，門還關著。<\/p>\n<p>她抱著那包紅布和那塊木牌，光著腳，一級一級地，往上走。<\/p>\n<p>她走得很慢。每一級，都先把一隻腳放上去，站穩了，再把另一隻腳放上去。像一個剛學會走樓梯的孩子。<\/p>\n<p>周遠沒有跟上去。他蹲在最下一級，看著她的背影，一級一級地，往上，往上。<\/p>\n<p>她經過邱永福身邊的時候，邱永福把頭低下去，低到膝蓋上。她經過廟公身邊的時候，廟公伸出手，又縮回來，沒有碰她。<\/p>\n<p>她經過石階頂上那四個背對著所有人的人。<\/p>\n<p>她沒有停。<\/p>\n<p>她走到城隍廟的門口，停下來，回頭看了一眼。<\/p>\n<p>看著石階底下的四個人。看著那條灰色的河。<\/p>\n<p>然後她轉回去，站在那扇關著的門前面，等。<\/p>", "chars": 3656}, "47": {"title": "第四十七章　天亮", "html": "<p>周遠胸口那個東西，站起來了。<\/p>\n<p>他感覺得很清楚。不是翻身，不是醒，是站起來。像一個在一間很小的房間裡坐了十二年的人，終於站起來，拍拍膝蓋上的灰，往門口走。<\/p>\n<p>他蹲在最下一級石階上，手撐著地。<\/p>\n<p>「你欲去佗位？」他聽見自己問。<\/p>\n<p>他不知道自己什麼時候學會講台語的。<\/p>\n<p>胸口裡那個聲音，很輕地笑了一下。<\/p>\n<p>「送伊。」那個聲音說，「伊細漢，行路會驚。」<\/p>\n<p>然後有什麼東西，從他的胸口裡，走出去了。<\/p>\n<hr class=\"sep\">\n<p>周遠看見了他。<\/p>\n<p>很淡。淡得像一張曝光過度的照片，淡到可以看見他身後石階的顏色。一個少年，瘦，白，短頭髮，眼睛底下兩塊青，穿著一件洗得發白的舊長衫，赤著腳。手腕上綁著一條紅布條，洗到發白了。<\/p>\n<p>他從周遠身邊走過去，一級一級地往上爬。<\/p>\n<p>經過邱永福身邊的時候，邱永福抬起頭，看見他，張大了嘴。經過廟公身邊的時候，廟公愣住了，然後慢慢地，把雙手合起來。<\/p>\n<p>他經過石階頂上那四個背對著所有人的人。阿雄回過頭，看了他一眼，又很快地轉回去。<\/p>\n<p>他走到城隍廟門口，站在那個小小的身影旁邊。<\/p>\n<p>蘇蟬抬頭看他。<\/p>\n<p>他蹲下來。蹲到跟她一樣高。<\/p>\n<p>周遠在石階底下，聽不見他們說什麼。他只看見那個少年伸出手，把她臉上一縷濕濕的頭髮撥到耳朵後面。看見她把懷裡的紅布包抱得更緊了一點，點點頭。<\/p>\n<p>然後城隍廟的門，開了。<\/p>\n<p>不是被推開的，是自己開的。兩扇很舊的木門往裡敞開，門裡透出一片光。紅色的，很暖，很穩，像一盞燈在一個很冷的晚上，照著一間有人在等的屋子。<\/p>\n<p>蘇蟬看著那片光。<\/p>\n<p>她回頭，看了少年一眼。<\/p>\n<p>少年對她點點頭，用手在她背上輕輕推了一下。<\/p>\n<p>她走進去了。<\/p>\n<p>光著腳，抱著那包紅布和那塊木牌，一步一步，走進那片紅色的光裡。走到門檻的時候，她停了一下，低頭看著自己的腳，好像想起了什麼。<\/p>\n<p>然後她跨過去。<\/p>\n<p>門在她身後，慢慢地，關上了。<\/p>\n<p>少年沒有進去。<\/p>\n<p>他站在門口，看著那兩扇關起來的門。然後他在門檻上坐下來，背靠著門，兩隻手放在膝蓋上，看著石階底下的河。<\/p>\n<p>他看著周遠。<\/p>\n<p>隔著整道石階，隔著三十九個人，隔著那片灰色的、沒有聲音的空氣，他看著周遠，笑了一下。<\/p>\n<p>眼角的紋，左邊三條，右邊四條。<\/p>\n<p>他抬起一隻手，揮了揮。<\/p>\n<p>周遠也抬起手。<\/p>\n<p>他胸口那個地方，空了。不是石崗那一次的空，那一次像一間搬走了房客的房間，窗戶開著，風吹進來。這一次不一樣。這一次像一間房子的主人，終於把最後一盞燈關掉，鎖好門，走了。<\/p>\n<p>很安靜。<\/p>\n<hr class=\"sep\">\n<p>河上有東西過來了。<\/p>\n<p>從上游。一艘船，很窄，很長，黑色的，沒有槳，自己順著水往下漂。船上站著兩個人。很高，高得不像人，穿著黑色的長衣服，戴著很高的帽子，帽子上寫著字，周遠看不清楚寫什麼。<\/p>\n<p>船停在渡口前面，河中央，離石階大概三十步的地方。<\/p>\n<p>正對著城隍廟大門。<\/p>\n<p>那兩個人彎下腰，把手伸進河裡。<\/p>\n<p>伸得很深。一直伸到手肘，伸到肩膀。他們在河底摸，然後一個一個地，把東西撈上來。<\/p>\n<p>四塊牌子。<\/p>\n<p>鐵的，很新，很亮。每一塊中間，都有一條細細的、直直的線。<\/p>\n<p>周遠站起來。<\/p>\n<p>「那是——」何靜的聲音在他身後。<\/p>\n<p>周遠沒有回答。他看著那兩個人把四塊牌子放進一個黑色的布袋裡，把袋口綁緊。其中一個人抬起頭，往石階的方向看了一眼。<\/p>\n<p>不是看周遠。是看石階頂上，那四個背對著所有人的人。<\/p>\n<p>然後船又開始動了。往下游，往很遠很遠的地方，漂走了。<\/p>\n<p>石階頂上，阿雄轉過身來。<\/p>\n<p>他的臉很白。他看著那艘船漂走的方向，嘴巴張著，像想喊什麼，可是喊不出來。他身邊的三個人也轉過身來，劉金生，吳添丁，張金水，四個人站在那裡，看著那條河。<\/p>\n<p>「伊……」阿雄的聲音在發抖，「伊提啥物走？」<\/p>\n<p>沒有人回答他。<\/p>\n<p>周遠看著他們。他想走上去。他想說，現在還來得及，現在跪下來還來得及。<\/p>\n<p>他不知道是不是真的來得及。<\/p>\n<p>沈言抓住了他的手腕。<\/p>\n<p>「走了。」她說，聲音很輕，「再不走，我們也出不去。」<\/p>\n<hr class=\"sep\">\n<p>他們沿著那條長著灰色芒草的小路往上走。<\/p>\n<p>沈言在最前面，周遠在最後面。三十九個人走在中間，一個跟著一個，踩著沈言的腳印。有的人走得很慢，林秀枝扶著廟公，戴眼鏡的年輕人扶著一個膝蓋不好的老太太。邱永福抱著他的牌子，一直走在周遠前面，走幾步就回頭看他一眼，像怕他不見了。<\/p>\n<p>「莫越頭。」沈言在最前面說，「行咱的路，莫越頭。」<\/p>\n<p>周遠沒有回頭。<\/p>\n<p>他知道身後有什麼。一道石階，一座關起來的廟，一個坐在門檻上的少年。還有四個站在石階頂上、不知道該往哪裡走的人。<\/p>\n<p>他沒有回頭。<\/p>\n<p>主街。灰色的，字是反的，每一扇門都開著，每一張床邊的拖鞋都鞋頭朝內。<\/p>\n<p>那盞燈就在前面。<\/p>\n<p>鐵皮的，很小，燈罩上纏著一圈膠布，放在路中間。之前不管他們怎麼走，它都在三四十步外。現在它近了。他們每走一步，它就近一步。<\/p>\n<p>二十步。十步。五步。<\/p>\n<p>沈言停在燈前面。<\/p>\n<p>她回頭，看著跟在她後面的人。三十九個人，加上他們四個，一個都沒少。<\/p>\n<p>「一個一個來。」她說，「踩過燈旁邊，不要碰到它。」<\/p>\n<p>邱永福第一個。他抱著他的牌子，從燈旁邊走過去，走了一步，就不見了。<\/p>\n<p>林秀枝。廟公。戴眼鏡的年輕人。一個一個，從那盞燈旁邊走過去，走一步，不見。<\/p>\n<p>林依。何靜。何靜經過那盞燈的時候，低下頭看了它一眼，眼眶紅了一圈。<\/p>\n<p>沈言。<\/p>\n<p>最後是周遠。<\/p>\n<p>他站在燈前面。火苗很小，黃黃的，在燈罩裡一動也不動。他想起何媽媽坐在水泥平台上，披著外套，把薑茶倒在燈旁邊，說：去啦，天亮我還在這裡。<\/p>\n<p>他從燈旁邊走過去。<\/p>\n<hr class=\"sep\">\n<p>冷。<\/p>\n<p>真的冷。不是背面那種從骨頭裡透出來的冷，是山上半夜的冷，帶著露水，帶著溪水的味道，帶著一點點遠處有人在燒柴的煙味。<\/p>\n<p>他站在廟埕上。<\/p>\n<p>腳底下是濕的。那灘水，兩三步寬，很淺很清，在他腳邊，映著天上的星星。星星。他抬頭，天是黑的，很深的藍黑色，滿天都是星星，月亮還沒有出來。<\/p>\n<p>有聲音。<\/p>\n<p>蟲叫。溪水。風吹過電線，嗚嗚地響。很遠的地方，有一隻狗在叫。<\/p>\n<p>三十九個人，站在廟埕上，站在那灘水的周圍。光著腳，穿著睡衣，穿著汗衫，抱著自己的牌子。他們抬頭看天，低頭看自己的腳，看彼此的臉，好像不敢相信。<\/p>\n<p>林秀枝先哭出來的。<\/p>\n<p>然後是一個接一個。<\/p>\n<p>周遠低頭看手錶。秒針在走。十二點十四分，十五分，十六分。<\/p>\n<p>他拿出手機。螢幕亮起來，一大堆通知擠在一起，跳個不停。未接來電，四十七通。他往下滑，看螢幕上的日期。<\/p>\n<p>不是他記得的那一天。<\/p>\n<p>多了十天。<\/p>\n<hr class=\"sep\">\n<p>他們在廟埕上坐到天亮。沒有人想走，也沒有人走得動。周遠打了兩通電話，一通給小方，一通給阿凱，阿凱沒有接。<\/p>\n<p>天亮的時候，第一個找到他們的是阿凱。<\/p>\n<p>他從封鎖線那邊跑過來，跑得跌跌撞撞，制服外套沒扣，頭髮亂成一團，下巴長滿了鬍渣。他跑到廟埕邊上，停下來，看著那三十九個人，看著周遠。<\/p>\n<p>「學長。」他說。<\/p>\n<p>他的聲音很啞。<\/p>\n<p>「十天。」阿凱說，「你們進去十天。」<\/p>\n<p>周遠看著他。<\/p>\n<p>「我跟學弟換了十天的班。」阿凱說，「我跟他說我女朋友生日，他說你又沒有女朋友。我說你管我。」<\/p>\n<p>他的嘴唇在抖。<\/p>\n<p>「我每天晚上都在這裡。」他說，「我媽每天晚上都打電話來，問我有沒有吃飯。我說有。我每天晚上都去廟埕看那灘水。水一直在。我就想說，水還在，你們就還在。」<\/p>\n<p>他吸了一下鼻子，用袖子擦了一下臉。<\/p>\n<p>「我在這裡。」阿凱說，「我說過我會一直在這裡。」<\/p>\n<p>周遠走過去，伸手，按住他的肩膀。<\/p>\n<p>阿凱低下頭，肩膀一抖一抖的。<\/p>\n<hr class=\"sep\">\n<p>何靜在廟埕的另一邊打電話。<\/p>\n<p>她背對著所有人，手機貼在耳朵上，一隻手捂著另一邊的耳朵。周遠聽不見她說什麼，只看見她的背，一直在抖。<\/p>\n<p>講完，她掛了電話，走過來。<\/p>\n<p>她的眼睛腫得很厲害。<\/p>\n<p>「我媽，」她說，「還在河邊。」<\/p>\n<p>周遠看著她。<\/p>\n<p>「十個晚上。」何靜說，「她每天晚上都去那個平台坐著，顧那盞燈。白天回家睡覺，晚上再去。燈油用完了，她就去買。我們家巷口那間雜貨店的老闆，問她買這麼多燈油做什麼，她說，我女兒在路上，我要給她照路。」<\/p>\n<p>她笑了一下，眼淚又掉下來。<\/p>\n<p>「她剛剛在電話裡跟我說，」何靜說，「燈還在。醫院那邊，她幫我請了假。她說她跟護理長講，我得了重感冒。」<\/p>\n<hr class=\"sep\">\n<p>小方是中午到的。<\/p>\n<p>她開著局裡的鑑識車上山，車上載著毯子、熱水、一箱一箱的礦泉水。她從車上跳下來，看見周遠，跑過來，在他面前兩步的地方停住。<\/p>\n<p>她看著他。看他的臉，看他濕透又乾掉、皺成一團的衣服。<\/p>\n<p>然後她的眼睛停在他的鬢角上。<\/p>\n<p>「組長，」她說，「你的頭髮。」<\/p>\n<p>周遠伸手摸了一下。<\/p>\n<p>「白了。」小方說，「右邊。一大片。」<\/p>\n<p>周遠沒有說話。<\/p>\n<p>小方看著他，嘴唇抿得很緊。她沒有問為什麼。她轉身回車上，拿了一條毯子，走回來，抖開，披在他肩膀上。<\/p>\n<p>「加班這十天，」她說，聲音很平，「每天都睡在你那份報告上面。我推牠下去，牠又爬上來。」<\/p>\n<p>她把毯子在他胸前拉緊。<\/p>\n<p>「牠知道你會回來。」<\/p>\n<p>她頓了一下。<\/p>\n<p>「大隊長那邊，我說你請特休。」她說，「他沒問。」<\/p>\n<hr class=\"sep\">\n<p>後來的事，發生得很快。<\/p>\n<p>三十九個人被送到縣立醫院。醫生說他們脫水、失溫、營養不良，可是生命跡象都穩定。有人問他們這兩個多月去了哪裡，他們說，記不得了，好像在跳舞，好像在一條河邊，好像有人在唱歌。<\/p>\n<p>邱永福的女兒是第一個衝進病房的家屬。她穿著超市的制服背心，名牌還別在胸口，衝進去，抱著她爸，哭得整層樓都聽得見。邱永福拍著她的背，一直說，好了好了，莫哭，莫哭，芭樂我明年閣種。<\/p>\n<p>她哭得更大聲了。<\/p>\n<p>廟公的兒子提著那個鐵餅乾盒來。廟公打開盒子，看著裡面那雙小小的布鞋，什麼話都沒說，把蓋子蓋起來，抱在懷裡。<\/p>\n<p>縣府發了新聞稿。四十三名失蹤者中的三十九名，在霧川溪上游河灘被尋獲，研判失蹤期間迷失於溪谷，靠溪水維生。另外四名仍列失蹤，持續搜尋中。<\/p>\n<p>記者問：那他們身上的鐵牌是什麼？<\/p>\n<p>縣府的人說：不清楚，可能是當地的民俗信仰。<\/p>\n<hr class=\"sep\">\n<p>霧川的遷村公告，在下元節過後第五天就貼出來了。那時候，他們還在背面。<\/p>\n<p>公告貼在鎮公所的門口，貼在土地公廟的牆上，貼在每一戶人家的門板上。水庫預定地，限期搬遷，補償金農曆年前發放。<\/p>\n<p>沒有人抗議。三十九戶人家，加上那兩百六十七個早就住在組合屋裡等著回家的人，簽了字，領了錢，一戶一戶地，把家裡的東西搬出來，裝上貨車，開下山。<\/p>\n<p>周遠去霧川幫忙搬了兩天。<\/p>\n<p>第二天下午，他一個人爬上那道長滿青苔的石階，走到城隍廟後面。<\/p>\n<p>那裡有一片空地，長滿了雜草，草裡面有一圈石頭。半圈。一顆一顆，排得歪歪扭扭的，有的被土埋了一半，有的長滿了青苔。九十五年前，一個七歲的小女孩，用手一顆一顆搬過來，排在一個新墳的旁邊。排了半圈，石頭就不夠了。<\/p>\n<p>周遠蹲在那半圈石頭旁邊，蹲到腿麻。<\/p>\n<hr class=\"sep\">\n<p>遷葬的手續，是小方幫他跑的。<\/p>\n<p>縣府民政處的承辦人看著那張申請書，皺了皺眉。「這座墳沒有登記，」他說，「沒有墓碑，沒有後人。你跟他是什麼關係？」<\/p>\n<p>周遠想了一下。<\/p>\n<p>「他是我師父的師父。」他說。<\/p>\n<p>承辦人看著他，好像在判斷他是不是在開玩笑。最後他蓋了章。<\/p>\n<p>起墳那天，是他們從背面出來的第四天。天氣很好。<\/p>\n<p>來的人不多。周遠，小方，何靜，沈言，林依。廟公的兒子帶了兩把鋤頭來，說他爸交代的。邱永福也來了，他說他一定要來，他阿祖那一代欠的，他要來還一點。<\/p>\n<p>土很硬，底下全是石頭。他們挖了一個早上。<\/p>\n<p>挖到一半，周遠的鋤頭碰到了一樣東西。<\/p>\n<p>他放下鋤頭，蹲下來，用手把土撥開。<\/p>\n<p>一雙布鞋。<\/p>\n<p>很舊了，爛了，只剩下鞋底和一點點鞋面，可是還看得出形狀。布鞋穿在一雙腳上，腳已經只剩下骨頭了，鞋帶還綁著，綁得很整齊，綁了兩次，第一次綁得太緊，後來重新綁過。<\/p>\n<p>鞋頭朝內。<\/p>\n<p>周遠蹲在那裡，看著那雙鞋。<\/p>\n<p>他想起一個十七歲的少年，跪在一具濕透的屍體旁邊，把師父的布鞋拿起來，不知道該放哪裡。想起一個撐船的老人說：穿予伊。行路愛穿鞋。<\/p>\n<p>他把手伸進土裡，很輕地，碰了一下那雙鞋。<\/p>\n<hr class=\"sep\">\n<p>他們把葛青崖葬在石崗鎮口。<\/p>\n<p>榕樹底下，陳先生的墳旁邊。新的墳，新的碑。碑是周遠請山下的石匠刻的，很普通的花崗岩，刻著三個字：<\/p>\n<p class=\"beat\"><strong>葛青崖<\/strong><\/p>\n<p>最後一橫，周遠請石匠往上勾了一個小小的鉤。<\/p>\n<p>石匠問他為什麼。<\/p>\n<p>周遠說：「他徒弟的字，都是這樣寫的。」<\/p>\n<hr class=\"sep\">\n<p>那天下午，石崗的毛毛雨一直沒有停。<\/p>\n<p>很細，很輕，落在榕樹的葉子上，落在兩座並排的墳上，落在墳前那只銅鈴上。周遠把鈴放回原來的位置，鈴口朝下，紅線打結的地方朝上。<\/p>\n<p>「天光矣，」他說，「還你。」<\/p>\n<p>民宿的老闆娘撐著一把花傘走過來，手上提著一個保溫壺。她把保溫壺放在兩座墳的中間，打開蓋子，倒了兩杯，一杯放在陳先生的墳前，一杯
