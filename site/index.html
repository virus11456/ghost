放在葛青崖的墳前。<\/p>\n<p>是熱茶。<\/p>\n<p>「新來的？」老闆娘看著那座新墳，問周遠。<\/p>\n<p>「嗯。」周遠說，「他師父。」<\/p>\n<p>老闆娘點點頭，好像這是一件很平常的事。她蹲下來，把葛青崖墳前那杯茶擺正，擺得跟陳先生墳前那杯一樣整齊。<\/p>\n<p>「按呢好，」她說，「師徒做伙，較袂孤單。」<\/p>\n<p>她站起來，撐著傘，往鎮裡走回去了。<\/p>\n<p>周遠站在雨裡，看著兩座並排的墳。一座舊的，鑿得很歪的字，陳先生之墓。一座新的，刻得很整齊的字，最後一橫勾著一個小鉤。<\/p>\n<p>他站到天快黑。<\/p>\n<p>雨落在他的頭髮上，落在他右邊鬢角那一片白頭髮上。<\/p>\n<p>那天晚上，他回到家，洗了澡，吃了半顆芭樂，關燈，睡覺。<\/p>\n<p>他沒有做夢。<\/p>\n<p>以後也沒有了。<\/p>", "chars": 5011}, "48": {"title": "第四十八章　三下", "html": "<p>石匠第二次上石崗，帶的是一塊很小的石頭。<\/p>\n<p>青灰色的，還沒有一張報紙大，上面磨得很平，什麼字都還沒有。他把石頭從貨車後斗抱下來，放在榕樹底下，跟陳先生和葛青崖兩座墳隔著一步的距離，回頭問周遠：「字咧？」<\/p>\n<p>周遠從口袋裡拿出一張摺成四摺的紙。<\/p>\n<p>紙是從記事本撕下來的。他前一天晚上在餐桌上寫了很多遍，原子筆，一張寫壞了撕掉，再寫一張。他想寫得工整一點，寫得像碑上該有的字。可是不管他怎麼寫，第一個字總是太大，寫到第二個字，紙的右邊就不夠了，只好往角落裡擠。<\/p>\n<p>他寫到第十一張，停下來，看著那兩個字，看了一陣子，把筆放下。<\/p>\n<p>就這張了。<\/p>\n<p>石匠把紙攤開，看了一眼，抬頭看他。<\/p>\n<p>「你這字，」石匠說，「我共你修較媠咧？」<\/p>\n<p>「不用。」周遠說，「照這個刻。」<\/p>\n<p>石匠沒有再問。上一次他問過一次為什麼，周遠說了，他就記住了這個客人的字有自己的道理。他蹲下來，用炭筆照著紙把兩個字描到石頭上，大的那個描得很大，小的那個擠在角落，描完，從工具袋裡拿出鑿子。<\/p>\n<p>叮。叮。叮。<\/p>\n<p>鑿子的聲音在鎮口傳得很遠。石崗沒有別的聲音，連鳥都沒有，只有這一下一下的叮叮聲，被榕樹的鬚根接住，又放下來。<\/p>\n<p>毛毛雨還在下。下在榕樹這一帶，下在三座墳上。周遠站在雨裡，看著石屑一點一點地落下來。<\/p>\n<hr class=\"sep\">\n<p>廟公是十點多到的。<\/p>\n<p>他兒子開著修車廠那台舊廂型車，從山下開上來，車停在雨停的那條線外面，下車撐傘，繞到另一邊把廟公扶下來。廟公前天才出院，瘦了一圈，走路還要人扶，膝蓋每一步都要先試一下。<\/p>\n<p>他手上抱著那個鐵餅乾盒。<\/p>\n<p>盒子很舊，蓋子上印的花都磨掉了，邊角鏽成褐色。他抱得很緊，貼著肚子，像抱著一個會冷的東西。<\/p>\n<p>「伊講伊欲家己提。」廟公的兒子對周遠說，聲音放得很低，「我講我替你提，伊毋肯。」<\/p>\n<p>廟公走到那塊小碑前面。<\/p>\n<p>石匠剛好鑿完最後一筆，用刷子把字縫裡的石粉掃乾淨，退開。兩個字露出來，刻得很深，第一個太大，第二個擠在角落。<\/p>\n<p>廟公看著那兩個字。<\/p>\n<p>他兒子要扶他蹲下，他揮揮手，自己扶著榕樹的一條鬚根，慢慢地，一點一點地，把膝蓋彎下去，跪在濕的泥地上。<\/p>\n<p>他打開鐵盒。<\/p>\n<p>那雙小布鞋躺在裡面，用一塊舊手帕墊著。黑色的布面，鞋頭繡著兩朵很小的花，針腳歪歪扭扭的，一看就是一個不會做針線的男人，一針一針學出來的。一百多年了，布面褪成深灰，花還在。<\/p>\n<p>廟公把鞋子拿出來，一隻一隻擺在碑前。<\/p>\n<p>他先擺成鞋頭朝外。擺好，看了一下，手停在半空中。<\/p>\n<p>然後他把兩隻鞋子都轉過來。鞋頭朝內，朝著那塊碑，朝著那兩個字。<\/p>\n<p>「阮阿公縫的。」他對著碑說，聲音很小，「縫歸冬，毋敢提來。這馬提來矣。」<\/p>\n<p>他頓了一下。<\/p>\n<p>「這擺，鞋頭朝內。」他說，「妳行到佗位，攏會當行轉來。」<\/p>\n<p>他跪在那裡，雙手合十，拜了三下。拜完，他兒子把他扶起來，他的膝蓋響了一聲，痛得吸了一口氣，可是他沒有讓人看出來他在痛。<\/p>\n<hr class=\"sep\">\n<p>快中午的時候，民宿的老闆娘撐著那把花傘來了。<\/p>\n<p>她提著保溫壺。這次她帶了三個杯子。<\/p>\n<p>她沒有問那塊新的小碑是誰的。她把三個杯子在三座墳前排開，一杯一杯倒滿熱茶，倒到小碑那一杯的時候，她看了一眼那雙小布鞋，把杯子往旁邊挪了一點，挪到不會擋到鞋子的地方。<\/p>\n<p>「囡仔啉茶，」她說，「較燒咧好。」<\/p>\n<p>她把杯子擺正，站起來，撐著傘，看了三座墳一眼。<\/p>\n<p>「這馬，」她說，「三个矣。」<\/p>\n<p>她說得很自然，像在說家裡多了一雙碗筷。說完，她轉身往鎮裡走，走過那條雨停的線，花傘收起來，甩了甩水，夾在腋下，一路走回那條路面乾得有灰的街。<\/p>\n<p>周遠看著她的背影。<\/p>\n<p>他想問她，妳兒子回來了沒有。他沒有問。<\/p>\n<hr class=\"sep\">\n<p>廟公的兒子要載廟公下山之前，走到周遠旁邊，從口袋裡掏出一包菸，遞一根給他。周遠搖頭。他自己點了一根，抽了兩口。<\/p>\n<p>「伊轉來了後，」他說，「暗時攏咧睏。睏甲足好。我細漢到今，毋捌看伊睏甲遮好。」<\/p>\n<p>他把菸灰彈在泥地上。<\/p>\n<p>「伊講，伊夢著一个查某囡仔，穿一雙新鞋仔，佇廟口跳格仔。」他說，「伊講伊毋知是毋是伊。我講，就是啦，毋是伊是啥人。」<\/p>\n<p>他笑了一下，把菸踩熄，撿起菸蒂放進口袋。<\/p>\n<p>「多謝。」他說。<\/p>\n<p>周遠不知道他在謝什麼。他點了點頭。<\/p>\n<p>廂型車開下山了。石匠也收好工具走了。<\/p>\n<p>周遠一個人站在三座墳前面。<\/p>\n<p>陳先生之墓。葛青崖。蘇蟬。<\/p>\n<p>一座舊的，字鑿得很歪。一座新的，最後一橫勾著鉤。一座最小的，第一個字太大，第二個字擠在角落。<\/p>\n<p>雨很細。<\/p>\n<p>他想說點什麼。他想了一下，發現自己沒有什麼要說的。他們三個人，應該已經在別的地方，說了很多話了。<\/p>\n<p>他只蹲下來，把那雙小布鞋又往碑那邊推了一點點。<\/p>\n<p>鞋頭朝內。<\/p>\n<hr class=\"sep\">\n<p>下山的路上，何靜打電話來。<\/p>\n<p>她今天上白班，聲音裡有護理站的背景音，推車的輪子，有人在叫床號。<\/p>\n<p>「龔伯今天出院了。」她說。<\/p>\n<p>「這麼快？」<\/p>\n<p>「他家屬來接的。他這幾天狀況很好，不哼歌了，晚上睡得著，吃飯吃得比蔡姐還多。」何靜說，「他的主治覺得可以回家觀察。我沒有理由留他。」<\/p>\n<p>周遠握著方向盤，車子轉過一個彎。後照鏡裡，石崗鎮口那一團毛毛雨越來越小。<\/p>\n<p>「他走之前，」何靜說，「站在七號房門口，看著牆壁看了好一陣子。就是他用指甲刮的那個地方。」<\/p>\n<p>「那個圖還在？」<\/p>\n<p>「早上叫人油漆蓋掉了。」何靜說，「他看著那片新漆，問蔡姐，伊有入去無。」<\/p>\n<p>「蔡姐怎麼說？」<\/p>\n<p>「蔡姐說，有啦，入去矣。」何靜停了一下，「她不知道他在問誰。她說她就是覺得應該這樣回答。」<\/p>\n<p>周遠沒有接話。<\/p>\n<p>電話那頭有人叫何醫師，她應了一聲，回頭對著話筒說：「我要去查房了。」<\/p>\n<p>「好。」<\/p>\n<p>「周遠。」<\/p>\n<p>「嗯？」<\/p>\n<p>「你的頭髮，」她說，「我媽問我要不要介紹她的設計師給你。她說染一下就看不出來了。」<\/p>\n<p>周遠笑了。他很少在開車的時候笑，笑完自己愣了一下。<\/p>\n<p>「跟你媽說謝謝。」他說，「我先留著。」<\/p>\n<p>「我就知道。」何靜說，「我已經跟她說你會這樣講了。」<\/p>\n<p>她掛了電話。<\/p>\n<hr class=\"sep\">\n<p>那天晚上，他煮了一鍋湯。<\/p>\n<p>本來是想照菜攤阿姨教的炒絲瓜，炒到一半水放太多，又變成了湯。他也不在意，加了一顆蛋，打散，看著蛋花在鍋子裡浮起來，關火。<\/p>\n<p>他坐在餐桌前，一個人喝湯。<\/p>\n<p>冰箱門上那張便利貼還在。葛青崖。石崗。他一直沒撕。每次開冰箱拿東西，那兩個名字就從眼角晃過去，像兩個住在這裡的人。<\/p>\n<p>他想了一下，從記事本撕下一張紙，寫了兩個字，貼在便利貼的旁邊。<\/p>\n<p>第一個字太大。第二個字擠在角落。<\/p>\n<p>他看著那張紙，又笑了一下。<\/p>\n<hr class=\"sep\">\n<p>八點四十分，有人敲門。<\/p>\n<p>叩。<\/p>\n<p>叩。<\/p>\n<p>叩。<\/p>\n<p>周遠拿著湯碗的手停在半空中。<\/p>\n<p>三下。<\/p>\n<p>十二年了。他的身體比他的腦子先記得這件事。背上的毛一根一根豎起來，胃往下沉，手指自己找到了最近的硬東西，握住，是一根湯匙。<\/p>\n<p>他把碗放下，站起來，走到玄關。<\/p>\n<p>他沒有開燈。他站在鐵門後面，從貓眼往外看。貓眼外面是樓梯間那盞老是接觸不良的燈，一閃一閃的，什麼都看不清楚，只看得見兩個模糊的影子。<\/p>\n<p>兩下是人。<\/p>\n<p>三下不是。<\/p>\n<p>他的手放在門把上，沒有轉。<\/p>\n<p>門外有人在笑。<\/p>\n<p>「他不會開的。」一個聲音說，壓得很低，可是壓不住在笑，「我就跟妳說他不會開。」<\/p>\n<p>「妳小聲一點啦。」<\/p>\n<p>「周遠——」第一個聲音提高了，「你開不開啦？芭樂很重欸。」<\/p>\n<p>周遠的手從門把上滑下來。<\/p>\n<p>他閉上眼睛，額頭靠在冰冷的鐵門上，靠了一下。<\/p>\n<p>然後他開燈，轉開門鎖，把門拉開。<\/p>\n<hr class=\"sep\">\n<p>林依站在最前面，兩手各提著一個塑膠袋，一袋是芭樂，綠綠的，塞得袋子都撐變形了；另一袋裡面是兩瓶裝在寶特瓶裡的冬瓜茶，瓶身用奇異筆寫著「減糖」，「減」字寫得特別大。<\/p>\n<p>沈言站在她後面半步，懷裡抱著一個小花盆。花盆裡是一株薄荷，才剛分出來，葉子還很小，有幾片被一路上的風吹得歪歪的。<\/p>\n<p>林依抬頭看他，笑得眼睛都瞇起來了。<\/p>\n<p>「這次三下，」她說，「是我們。」<\/p>\n<p>周遠站在門口，看著她們。<\/p>\n<p>他想板起臉。他想說妳們知不知道這樣很嚇人。他想說兩下是人三下不是，這是規矩，十二年的規矩。<\/p>\n<p>他什麼都沒說出來。他笑了，笑到要扶著門框。<\/p>\n<p>林依也笑。沈言本來站得很直，看到他們兩個在笑，終於也撐不住，抱著花盆蹲下去，笑到肩膀一直抖。<\/p>\n<p>樓梯間的燈閃了兩下，亮了。<\/p>\n<p>對門的鄰居打開門，探頭看了一眼，看見三個大人站在門口笑成一團，又把門關上了。<\/p>\n<hr class=\"sep\">\n<p>「芭樂是邱小姐給的。」林依把塑膠袋放在餐桌上，「我們來的路上去超市買東西，結帳剛好是她。她聽說我們要來找你，就跑去後面拿了一袋。她說她爸叫她拿的。」<\/p>\n<p>「她爸說什麼？」<\/p>\n<p>「她爸說，」林依清了清喉嚨，學一個老男人的聲音，「彼个警察，伊家己一个人，攏無咧食果子。」<\/p>\n<p>周遠拿起一顆芭樂，捏了一下，很硬。<\/p>\n<p>「這個很難吃。」他說。<\/p>\n<p>「我知道。」林依說，「我吃過了。她爸說明年種的會比較甜。」<\/p>\n<p>沈言把那盆薄荷放在窗台上。窗台很空，什麼都沒有，薄荷擺上去，整扇窗子好像忽然有了一點顏色。<\/p>\n<p>「每兩天澆一次。」她說，「不要澆太多。你澆太多它會爛根。」<\/p>\n<p>「我上次幫妳澆，它開花了。」<\/p>\n<p>「那是它自己要開的。」沈言說，「跟你沒關係。」<\/p>\n<p>她轉過身，看見鍋子裡的湯。<\/p>\n<p>「你煮的？」<\/p>\n<p>「本來是炒絲瓜。」<\/p>\n<p>沈言和林依互看一眼。林依去拿碗。<\/p>\n<hr class=\"sep\">\n<p>三個人擠在那張小小的餐桌前，把那鍋失敗的絲瓜湯喝完了。林依說太淡，自己去翻他的櫥櫃找鹽，找到一罐過期兩年的胡椒粉，拿起來對著燈看了很久，還是放回去了。<\/p>\n<p>沈言從包包裡拿出那本國小筆記本給他看。<\/p>\n<p>吃藥的那一排，十二年的勾，一格一格，到某一天停住。下面新畫的那一排，「記得」，已經打了三十幾個勾，中間空了十格。每一個勾都打得很用力，筆都快劃破紙。<\/p>\n<p>「你看，」她說，「除了那十天，一天都沒斷過。」<\/p>\n<p>「妳每天都記得什麼？」<\/p>\n<p>沈言想了一下。<\/p>\n<p>「不一定。」她說，「有時候是記得澆薄荷。有時候是記得她。」<\/p>\n<p>她沒有說「她」是誰。周遠也沒有問。<\/p>\n<p>那瓶白瓷瓶，沈言還是帶著，放在外套口袋裡。她吃飯的時候，偶爾會把手伸進口袋，摸一下，又拿出來。<\/p>\n<p>林依在客廳裡晃來晃去，看他的書架，看他的電視，看他冰箱門上那兩張字很醜的紙。她晃到走廊盡頭，停在靠陽台那間房間的門口。<\/p>\n<p>門關著。<\/p>\n<p>「這間是什麼？」<\/p>\n<p>「堆雜物的。」<\/p>\n<p>「你一個人住，」林依說，「為什麼要租兩房？」<\/p>\n<p>周遠張了張嘴。<\/p>\n<p>他想說，當初看房子的時候，這間比較便宜。他想說，房東只租整層。他想了好幾個理由，每一個都說得通，每一個他都不確定是不是真的。<\/p>\n<p>「忘了。」他說。<\/p>\n<p>林依看著那扇門，看了一下，沒有去碰門把。<\/p>\n<p>「你家連雜物都要關門喔。」她說，轉身走回餐桌。<\/p>\n<p>周遠看著那扇門。他好像從來沒有在這個角度看過它。<\/p>\n<hr class=\"sep\">\n<p>九點半，林依說要回去了，明天店要開。沈言說她來開車，林依說妳開車很恐怖，沈言說那妳開，林依說她沒有駕照。兩個人在玄關一邊穿鞋一邊吵。<\/p>\n<p>沈言穿好鞋，站起來，忽然低頭看了一眼。<\/p>\n<p>她們兩個人的鞋，進門的時候，都脫成鞋頭朝內。<\/p>\n<p>「欸。」沈言說。<\/p>\n<p>「什麼？」<\/p>\n<p>「沒事。」沈言說，笑了一下，「習慣了。」<\/p>\n<p>周遠送她們到樓梯口。林依走下去兩級，又回頭。<\/p>\n<p>「下次，」她說，「我們敲兩下。」<\/p>\n<p>「不用。」周遠說。<\/p>\n<p>林依看著他。<\/p>\n<p>「敲三下。」周遠說，「我會開。」<\/p>\n<p>林依笑了，揮揮手，跟著沈言下樓了。他聽著她們的腳步聲，一層一層，到一樓，鐵門碰一聲關上，然後是車子發動的聲音，然後是車子開走的聲音。<\/p>\n<p>他回到屋裡，關上門。<\/p>\n<p>這一次，他沒有在門內側站很久。<\/p>\n<hr class=\"sep\">\n<p>他在洗碗的時候，手機響了。<\/p>\n<p>十點十二分。來電顯示是小方。<\/p>\n<p>他用肩膀夾著手機，手上還是泡沫。「喂？」<\/p>\n<p>電話那頭沒有馬上說話。他聽見風的聲音，很大，還有警用無線電斷斷續續的雜音，有人在背景裡喊一個門牌號碼。<\/p>\n<p>「周遠。」小方說。<\/p>\n<p>她從來不叫他的名字。她只叫他組長。<\/p>\n<p>周遠把水龍頭關掉。<\/p>\n<p>「我在白石里。」小方說，「你知道白石里在哪嗎？霧川溪上游，另外一條支流，再往山裡面。很小一個村子。」<\/p>\n<p>「怎麼了？」<\/p>\n<p>「今天晚上報案，說整個村子很安靜。」小方說，「派出所的人上來看，我是跟老張一起上來支援的。」<\/p>\n<p>她停了一下。周遠聽見她深深吸了一口氣，像在數什麼東西。<\/p>\n<p>「門。」她說，「我數到第十一戶了。每一戶的門上，都有。」<\/p>\n<p>周遠的手在流理台上撐住。<\/p>\n<p>「三個。」小方說，「周遠，三個凹痕。」<\/p>\n<p>窗台上，那盆剛分出來的薄荷，葉子動了一下。<\/p>\n<p>窗戶是關著的。<\/p>", "chars": 4655}, "49": {"title": "第四十九章　白石里", "html": "<p>去白石里的路，比去霧川的還窄。<\/p>\n<p>過了縣道最後一個紅綠燈，路就開始往山裡鑽，柏油越來越薄，兩邊的竹林越來越密。車燈照出去，只照得到前面十幾公尺，再過去就是黑。周遠開得很慢。他手機架在冷氣出風口上，導航上的藍點已經離開所有有名字的路，在一片空白的綠色裡往前爬。<\/p>\n<p>十一點零五分，他看見了警車的燈。<\/p>\n<p>一閃一閃的紅藍光，打在一排矮矮的房子上。房子沿著一條溪蓋，溪床很寬，水很少，整片溪床鋪滿了大大小小的白色石頭，在警燈底下一下紅、一下藍、一下白。<\/p>\n<p>白石里。<\/p>\n<p>他把車停在派出所的巡邏車後面，下車。山裡比縣城冷很多，他把外套拉鍊拉到最上面。<\/p>\n<p>小方站在第一戶人家的騎樓底下，手上拿著手電筒，腳邊放著她那個大保溫杯。她看見他，往前走了一步，又停下來。<\/p>\n<p>「組長。」她說。<\/p>\n<p>她的臉色很白。手電筒的光在發抖，她自己大概沒發現。<\/p>\n<p>「妳剛剛叫我名字。」周遠說。<\/p>\n<p>小方看了他一眼。「我不記得。」她說，彎腰拿起保溫杯，擰開，喝了一口，「你要先看哪一戶？」<\/p>\n<hr class=\"sep\">\n<p>白石里一共十九戶，三十一個人。<\/p>\n<p>老張拿著派出所給的戶口名簿影本，一戶一戶對。他五十幾歲了，平常話很多，今天晚上一句廢話都沒有，只是對，對完一戶，就用原子筆在那一戶的名字旁邊打一個記號。<\/p>\n<p>周遠跟在他後面。<\/p>\n<p>門都開著。每一戶都是。木門、鐵門、紗門，全部往裡面敞開，像一整條街的人同時出門，誰都沒有回頭關。<\/p>\n<p>屋子裡面很整齊。電視關著，碗洗好了倒扣在瀝水籃上，一張餐桌上還放著吃了一半的橘子，橘子皮剝得很漂亮，一瓣一瓣攤開像一朵花。<\/p>\n<p>床邊的拖鞋，鞋頭朝外。<\/p>\n<p>周遠在第三戶的臥室門口蹲下來，看著那雙藍白拖。鞋頭朝著門，擺得很正，像有人很仔細地，把它們轉過來的。<\/p>\n<p>他想起霧川。想起背面那一整條街，每一張床邊的拖鞋都朝內。<\/p>\n<p>她們在等人回家。<\/p>\n<p>他站起來，走出去。<\/p>\n<hr class=\"sep\">\n<p>有凹痕的門，一共十四扇。<\/p>\n<p>周遠一扇一扇看過去。他用手電筒斜斜地打在門板上，讓凹痕的影子出來。三個，排成一個很小的三角形，每一個都像被指節敲進去的。<\/p>\n<p>跟霧川一樣。<\/p>\n<p>又不一樣。<\/p>\n<p>他在第七戶的鐵門前停下來。他把自己的手舉起來，握成拳頭，對著那三個凹痕比了一下。<\/p>\n<p>太高了。<\/p>\n<p>霧川那四十三扇門，凹痕都在他胸口的高度。他後來才知道，那是沈言的手，赤著腳，停不下來，一扇一扇敲上去的。<\/p>\n<p>白石里的凹痕，在他眉毛的高度。<\/p>\n<p>比他還高。<\/p>\n<p>「組長。」小方在後面叫他，「你看這個。」<\/p>\n<p>她蹲在鐵門下面，手電筒照著門檻。門檻外面的水泥地上，有一點東西。周遠蹲下去看。<\/p>\n<p>是灰。很細，很白，一小撮，像有人站在這裡的時候，從衣服上掉下來的。<\/p>\n<p>小方用棉棒沾了一點，放進證物袋。她的手還在抖，她把袋子封起來，在上面寫字，寫了兩次才寫對日期。<\/p>\n<p>「我在霧川沒有看過這個。」她說。<\/p>\n<p>「我也沒有。」<\/p>\n<hr class=\"sep\">\n<p>凌晨一點多，老張對完了最後一戶。<\/p>\n<p>三十一個人，剩下五個。<\/p>\n<p>一個八十幾歲、耳朵完全聽不見的老太太，睡在最裡面那一戶的後房，一覺到天亮，什麼都不知道。一個還在睡嬰兒床的小孩，八個月大。小孩的爸媽和姐姐，那天晚上開車下山去縣城吃喜酒，九點多回來，車子開進村子，覺得太安靜了，安靜到連狗都沒有叫。<\/p>\n<p>他們在家門口看見嬰兒床邊的阿嬤不見了，小孩一個人在床上哭。<\/p>\n<p>是那個媽媽報的案。<\/p>\n<p>周遠在派出所的巡邏車旁邊見到她。三十幾歲，還穿著吃喜酒的洋裝，外面套著先生的夾克，懷裡抱著那個八個月大的小孩。小孩已經睡著了，手裡抓著一個紅色的小東西。<\/p>\n<p>周遠看了一眼。<\/p>\n<p>是一個平安符。紅布縫的，很舊，邊角都起毛了，掛在嬰兒床的欄杆上，被小孩抓下來，抓在手裡，一整個晚上都沒放開。<\/p>\n<p>「我婆婆縫的。」那個媽媽說，聲音很啞，「她說這個掛著，囡仔暗時袂驚。」<\/p>\n<p>她看著周遠。<\/p>\n<p>「她去哪裡了？」<\/p>\n<p>周遠沒有回答。他不知道。<\/p>\n<p>他只知道一件事：有東西在這條街上，一扇一扇地敲過去，帶走了二十六個人。帶不走這個小孩，因為他手上抓著他阿嬤縫的一塊紅布。<\/p>\n<hr class=\"sep\">\n<p>天亮的時候，周遠一個人走到溪邊。<\/p>\n<p>溪床很寬，水只剩中間細細的一條，從白色的石頭縫裡流過去，聲音很小。他沿著溪床往下走了一段，走到村子正對面，停下來。<\/p>\n<p>石頭中間，有一灘水。<\/p>\n<p>不大，兩三步寬，很淺，很清，清得可以看見底下每一顆白石頭。旁邊的溪水在流，這一灘沒有流，安安靜靜地停在那裡，像被人從溪裡舀出來，放在這裡忘了拿走。<\/p>\n<p>周遠蹲下來，看著它。<\/p>\n<p>水裡是他自己的臉。右邊的鬢角，一片白。<\/p>\n<p>他沒有伸手。<\/p>\n<hr class=\"sep\">\n<p>接下來兩天，事情走得很快。<\/p>\n<p>快到不正常。<\/p>\n<p>第一天中午，縣府就發了新聞稿：白石里居民疑似集體夜間上山採集、迷途，消防局出動搜救。第二天早上，羅振邦把周遠叫進辦公室，關上門。<\/p>\n<p>「白石里，」羅振邦說，「老張接。」<\/p>\n<p>周遠沒有說話。<\/p>\n<p>「你頭髮那樣，」羅振邦說，眼睛沒有看他的頭髮，看著他的臉，「霧川剛結，你又一個人往山裡跑，上面會怎麼想？」<\/p>\n<p>「我沒有一個人。」<\/p>\n<p>「我知道。」羅振邦說，「我是說上面。」<\/p>\n<p>他從抽屜裡拿出一張照片，推過來。<\/p>\n<p>是派出所員警用手機拍的，畫質很差。白石里那條街，清晨，天剛亮，封鎖線還沒拉起來。街中間站著三四個穿黃色道袍的人，在擺香案。<\/p>\n<p>「出事隔天早上六點，」羅振邦說，「派出所的人還沒到，大廟的人已經在那裡做法會了。說是主委夢見的，夢見山上有冤，叫人連夜上去。」<\/p>\n<p>周遠看著那張照片。<\/p>\n<p>「我什麼都沒說。」羅振邦把照片收回抽屜裡，「你出去吧。」<\/p>\n<hr class=\"sep\">\n<p>第三天傍晚，何靜打電話來。<\/p>\n<p>「龔伯回來了。」她說。<\/p>\n<p>周遠正在吃便當，筷子停住。<\/p>\n<p>「他家屬說，他這幾天晚上都坐在家門口，臉朝著同一個方向，一坐就是一整夜。叫他，他不應。昨天晚上開始又哼歌。」何靜停了一下，「那支曲子。」<\/p>\n<p>「我現在過去。」<\/p>\n<p>「你等一下。」何靜說，「還有一件事。我想先跟你說，你到了再看。」<\/p>\n<hr class=\"sep\">\n<p>七號房的牆，重新漆過了。<\/p>\n<p>白色的，很新，還有一點油漆的味道。龔伯坐在床上，背靠著那面牆，眼睛半閉，嘴裡在哼。<\/p>\n<p>周遠一進門就聽出來了。<\/p>\n<p>那支甜的曲子。輕快的，黏的。不是沈言在背面唱的那種慢版，是原本的樣子，一個音一個音往上跳，像一顆糖在嘴裡滾。<\/p>\n<p>龔伯聽見腳步聲，睜開眼睛，看著他。<\/p>\n<p>「你是彼个警察。」他說。<\/p>\n<p>「是。」<\/p>\n<p>龔伯點點頭，好像早就知道他會來。他七十幾歲，瘦，手背上全是老人斑，可是眼睛很清楚，比上一次周遠在何靜的錄音裡聽見的聲音，還要清楚。<\/p>\n<p>「彼个囡仔，」龔伯說，「入去矣。」<\/p>\n<p>「入去矣。」周遠說。<\/p>\n<p>龔伯又點頭。他看著周遠的鬢角，看了一下，沒有問。<\/p>\n<p>「毋過，」他說，「彼條曲，閣咧放。」<\/p>\n<p>「在哪裡放？」<\/p>\n<p>龔伯抬起手，往一個方向指了一下。周遠順著看過去，只看到一面剛漆好的白牆。牆的另一邊，隔著松林，隔著山，是縣城。<\/p>\n<p>「大廟。」龔伯說，「後殿。逐擺降乩進前，後殿攏會放這條。錄音帶，干焦胡琴，拉甲足甜。放煞，神明就落來矣。」<\/p>\n<p>他把手放下來，放在膝蓋上。<\/p>\n<p>「我聽四十冬，」他說，「毋知是啥物曲。毋知是啥人拉的。我干焦知，曲一下放，我的喙就毋是我的矣。」<\/p>\n<p>他看著周遠。<\/p>\n<p>「彼个囡仔入去了後，我轉去厝裡，暗時攏聽著。足遠，一直放，一直放。」他說，「這擺，毋知欲叫啥人去敲門。」<\/p>\n<hr class=\"sep\">\n<p>何靜在護理站等他。<\/p>\n<p>她把一張紙推過來。是龔伯這一次的入院單。<\/p>\n<p>「出院單我也有簽。」她說，「家屬昨天晚上十一點打電話來，說要送回來。我今天早上八點到，人已經在七號房了。」<\/p>\n<p>她用筆尖點了一下入院單上的一個欄位。<\/p>\n<p>轉介時間。<\/p>\n<p class=\"doc\">民國一一五年……　二十時三十分<\/p>\n<p>「八點半。」何靜說，「比家屬打電話早兩個半小時。」<\/p>\n<p>周遠看著那個時間，然後看著時間下面那一欄。<\/p>\n<p>轉介醫師簽名。<\/p>\n<p>潦草，連成一團，認不出是什麼字。醫師證號那一欄，空白。<\/p>\n<p>他見過這個簽名。<\/p>\n<p>不是在這裡。是在局裡，在霧川案的卷宗裡，沈言從縣立醫院轉到松嶺的那張轉介單影本。他當時翻過去，沒有多看。他記得那一團線，記得醫師證號那一欄，也是空的。<\/p>\n<p>「我查過了。」何靜說，聲音很低，「醫院的醫師名冊裡，沒有一個人的簽名長這樣。」<\/p>\n<p>她把入院單收回去，夾進病歷夾裡。<\/p>\n<p>「我在這裡工作六年。」她說，「我一直以為，是我不認識的哪一位醫師。」<\/p>\n<hr class=\"sep\">\n<p>周遠走出松嶺的時候，手機響了。<\/p>\n<p>是一個市話號碼，他不認得。<\/p>\n<p>「周先生嗎？」一個女人的聲音，有點緊張，「我是縣文史館，我姓許。上次你來看過一本手札。」<\/p>\n<p>「我記得。」<\/p>\n<p>「我們這禮拜在盤點地下室，就是那批一直沒編目的捐贈。」許館員說，「找到一個箱子。我覺得……我覺得應該是要給你的。」<\/p>\n<hr class=\"sep\">\n<p>文史館已經下班了。<\/p>\n<p>紅磚樓的大門關著，許館員從側門讓他進去。她手上牽著一個五六歲的小女孩，綁兩條小辮子，手裡抱著一本著色本。<\/p>\n<p>「保母今天請假。」許館員有點不好意思，「她很乖，不會吵。」<\/p>\n<p>小女孩看了周遠一眼，眼睛停在他的頭髮上，然後低頭繼續塗她的顏色。<\/p>\n<p>箱子放在閱覽室的長桌上。<\/p>\n<p>是一個舊紙箱，紙板已經軟了，四個角用膠帶補過好幾次。外面用麻繩綁著，綁了三圈，打了一個很緊的結。<\/p>\n<p>箱子上面，用迴紋針夾著一張單子。<\/p>\n<p>是寄存單。不是捐贈，是寄存。日期欄寫著：民國一〇三年八月。寄存人：陳守一。地址、電話，空白。<\/p>\n<p>年齡欄：十七。<\/p>\n<p>周遠看著那兩個字。<\/p>\n<p>「又是十七。」許館員站在旁邊說，「我一開始也以為是寫錯。」<\/p>\n<p>備註欄寫了一行字。毛筆，很小，字很醜。<\/p>\n<p class=\"doc\">後日若有人來看「封」冊，寫字「一」尾有勾，交予伊。毋免問伊是啥人。<\/p>\n<p>周遠看著那行字，看了一陣子。<\/p>\n<p>「我翻了閱覽登記簿。」許館員說，「這幾年來看那本手札的人，只有兩個。一個是霧川出事前三週來的那位老先生，他的簽名認不出來。一個是你。」<\/p>\n<p>她把登記簿翻開，翻到周遠簽名的那一頁，指著日期欄。<\/p>\n<p>民國一一五年。<\/p>\n<p>周遠自己寫的。三個「一」，每一個的尾巴，都往上勾了一個小小的鉤。<\/p>\n<p>「我盤點的時候看到這張單子，想起你那天簽名，我就站在那裡看你寫。」許館員說，「我記得你寫完，自己盯著那幾個字看了很久。」<\/p>\n<p>她把登記簿闔起來。<\/p>\n<p>「民國一〇三年八月。」她說，「那時候，你還不認識他吧？」<\/p>\n<p>周遠沒有回答。<\/p>\n<p>一〇三年八月。和平村那一夜的前一個月。<\/p>\n<p>他不知道那時候的陳守一知道什麼。他只知道，有一個人在那個夏天，把一箱東西寄放在這裡，寫了一行字，等一個「一」字會勾的人來。<\/p>\n<p>那箱東西，在地下室等了十二年。<\/p>\n<hr class=\"sep\">\n<p>周遠解開麻繩。<\/p>\n<p>結很緊，綁的人用了很大的力氣。他解了好一陣子，中間許館員拿了一把剪刀過來，他搖頭，繼續解。解開了，麻繩一圈一圈鬆下來，他把它捲好，放在桌角。<\/p>\n<p>箱子裡是本子。<\/p>\n<p>很多本。疊得很整齊，大小不一樣，新舊也不一樣。最底下是幾本線裝的、紙已經黃到發脆的；往上是帳簿，是那種店家記帳用的紅格子簿；再往上是學生的作業簿，有一本封面印著一個褪色的卡通人物，大概是一九八〇年代的；最上面是一本很普通的筆記本，便利商店賣的那種，三十九元。<\/p>\n<p>每一本的封面，都用原子筆或毛筆寫著年份。辛未。壬申。癸酉。往下，往下，民國，西元，混在一起寫，好像寫的人自己也搞不清楚，這幾十年該用哪一種方法數。<\/p>\n<p>周遠先拿起最上面那一本。<\/p>\n<p>民國一〇三年。<\/p>\n<p>他翻到最後寫了字的那一頁。原子筆，字跡很亂，像寫的人手在抖，或是很累。<\/p>\n<p class=\"doc\">今日撒卦，兩倒一立。我的代誌，欲煞矣。<\/p>\n<p class=\"doc\">若有人看著遮，<\/p>\n<p>後面沒有了。<\/p>\n<p>那一句話停在那裡，後面是一整頁空白，再後面也是空白。周遠一頁一頁往後翻，翻到最後一頁，什麼都沒有。<\/p>\n<p>兩倒一立。<\/p>\n<p>他想起石崗民宿的窗台。先生替自己撒的那一卦，那一枚立著的銅錢，原樣立在窗台上，等它倒。<\/p>\n<p>那一卦，他十二年前就撒過了。<\/p>\n<hr class=\"sep\">\n<p>小女孩不知道什麼時候走過來了，站在長桌旁邊，踮著腳，看箱子裡的本子。<\/p>\n<p>「好多。」她說。<\/p>\n<p>「嗯。」<\/p>\n<p>「是誰的？」<\/p>\n<p>周遠想了一下。<\/p>\n<p>「一個朋友的。」他說。<\/p>\n<p>小女孩點點頭，好像這個答案很合理。她回去塗她的著色本了。<\/p>\n<hr class=\"sep\">\n<p>周遠把那本便利商店的筆記本放回去，把手伸到箱子最底下。<\/p>\n<p>他摸到一本很薄的。<\/p>\n<p>拿出來，是一本冊子，很小，比他的手掌大不了多少。紙是最便宜的那種，粗粗的，黃黃的，邊緣都捲起來了。封面上一個字，毛筆寫的，很用力。<\/p>\n<p class=\"beat\"><strong>葬<\/strong><\/p>\n<p>他認得這本冊子。<\/p>\n<p>一九三一年秋天，一艘渡船上，一個十七歲的少年，用最後一點錢，跟船上的小販買了這本空白的冊子。他把它攤在膝蓋上，照著記憶，一條一條，把師父寫過的東西寫回來。<\/p>\n<p>周遠翻開。<\/p>\n<p>宿主愛甘願。放之者愛還。封之者愛放手。三人同歌。<\/p>\n<p>歌畢——<\/p>\n<p>後面是一條短短的線。<\/p>\n<p>然後是空白。<\/p>\n<p>九十五年，那一行字後面，一直是空的。少年在渡船上，寫到這裡，想不起來了。他在那個下午睡著了，師父念到這裡的時候，他沒有聽見。他後來活了八十三年，寄存了一整箱的本子，這一頁，始終沒有補上。<\/p>\n<p>周遠看著那條短線。<\/p>\n<p>許館員從櫃檯拿來一枝筆，放在他手邊，什麼都沒說，回去陪她女兒了。<\/p>\n<p>周遠拿起筆。<\/p>\n<p>他在那條短線的後面，一筆一筆地，寫下去。<\/p>\n<p class=\"doc\">愛喊伊的名。<\/p>\n<p>字很醜。跟前面那幾行，一模一樣的醜。<\/p>", "chars": 4926}, "50": {"title": "第五十章　七號床", "html": "<p>那箱本子，周遠搬回家，放在客廳。<\/p>\n<p>他本來想放進靠陽台那間房間。那間堆雜物的，放一個紙箱剛好。他提著箱子走到門口，手放在門把上，停了一下，又把箱子放下來，放在門外的牆邊。<\/p>\n<p>他不知道為什麼。他只是覺得那扇門，不用開。<\/p>\n<p>他一個晚上讀一本。照順序，從最底下那本辛未年的開始。不跳，不先翻後面。手記裡的字很小，很擠，有時候是毛筆，有時候是鉛筆，有時候一頁寫到一半，換了一種墨水，像寫的人走了很遠的路，在別的地方坐下來，接著寫。<\/p>\n<p>第一本，他讀了兩個晚上還沒讀完。<\/p>\n<p>不是因為字難認。是因為讀幾行，他就得把本子放下來，坐在那裡，等一陣子，才能再拿起來。<\/p>\n<hr class=\"sep\">\n<p>第三天晚上十點多，何靜打電話來。<\/p>\n<p>「你今天晚上有事嗎？」<\/p>\n<p>「在讀。」<\/p>\n<p>「讀到哪裡了？」<\/p>\n<p>周遠看著攤在膝蓋上的那一頁。<\/p>\n<p>「他師兄，」他說，「教他怎麼綁鞋帶。」<\/p>\n<p>電話那頭安靜了一下。<\/p>\n<p>「你可以先放著嗎？」何靜說，「我今天值大夜。我想給你看一個東西。不能在電話裡講，也不能傳照片。」<\/p>\n<p>「我四十分鐘到。」<\/p>\n<p>「走側門。」何靜說，「不要走大廳。」<\/p>\n<hr class=\"sep\">\n<p>值班室在二樓走廊的盡頭，很小，一張單人床，一張桌子，一台咖啡機。桌上堆著一疊列印紙，一疊很厚，用長尾夾夾著，最上面那張被何靜用螢光筆畫得花花綠綠的。<\/p>\n<p>她穿著白袍，頭髮綁起來，眼睛底下兩塊青。周遠進門的時候，她正在喝一杯已經冷掉的咖啡，喝一口，皺眉，又喝一口。<\/p>\n<p>「坐。」她說，把椅子讓給他，自己坐在床沿。<\/p>\n<p>她把那疊紙推過來。<\/p>\n<p>「院裡的電子病歷系統，是民國九十八年才上線的。」她說，「再早的都是紙本，在檔案室，我進不去。所以我只能查十七年。」<\/p>\n<p>「查什麼？」<\/p>\n<p>「轉介單上醫師證號空白的。」何靜說，「簽名是圖檔，搜不到。可是證號那一欄是文字，空白就是空白，一篩就出來。」<\/p>\n<p>她把第一張紙翻開。<\/p>\n<p>是一張表。日期，姓名，年齡，轉介來源，轉介事由。<\/p>\n<p>周遠一行一行看下去。<\/p>\n<p>民國九十九年，南邊山裡一個叫竹坑的聚落，一夜之間少了十一個人，剩下兩個，送松嶺。民國一〇一年，海邊一個漁村，十九個人。民國一〇五年。民國一〇八年。民國一一一年。最後一行，民國一一五年，霧川，一個人：沈言。轉介事由那一欄，每一行寫的都一樣：<\/p>\n<p class=\"doc\">重大創傷後反應，原因不明。<\/p>\n<p>周遠數了一下。<\/p>\n<p>十一場。<\/p>\n<p>十七年，十一場。每一場，都有人不見，都有一兩個、兩三個活下來的。每一個活下來的，都送到了這裡。<\/p>\n<p>「縣府跟我們有合作。」何靜說，「我第一天上班，護理長就是這樣跟我說的。我從來沒有想過，合作是什麼意思。」<\/p>\n<hr class=\"sep\">\n<p>周遠翻到第二頁，手停了一下。<\/p>\n<p>民國一〇三年九月。轉介來源：縣立醫院兒童病房。姓名：沈和。年齡：十二歲。<\/p>\n<p>轉介事由：重大創傷後反應，原因不明。<\/p>\n<p>最後一欄，有一個藍色的印章，蓋得有點歪。<\/p>\n<p class=\"doc\">家屬拒絕。<\/p>\n<p>「姑婆。」周遠說。<\/p>\n<p>何靜看著他。<\/p>\n<p>「是姑婆去醫院把她帶回家的。」周遠說，「她說，她自己養。」<\/p>\n<p>他想起那間窄巷裡的老街屋，門口一排蘭花，紫色的毛背心，八點檔的重播。他想起姑婆把滷肉塞進沈言的手裡，說妳太瘦了。<\/p>\n<p>十二年前，一個五十出頭的女人，在醫院的櫃台前面，對著一張轉介單搖頭。她不知道自己擋掉了什麼。她只是覺得，自己家的孩子，要自己帶回家。<\/p>\n<p>「十二年後，」何靜說，「她又被轉進來了。這一次，沒有人拒絕。」<\/p>\n<p>何靜把那一頁的邊緣壓平。<\/p>\n<p>「我是她的主治。」她說，「我一直覺得，是我把她照顧好的。」<\/p>\n<hr class=\"sep\">\n<p>第三頁，是何靜自己做的統計。<\/p>\n<p>十七年，十一場，六十三個人送進松嶺。<\/p>\n<p>出院回家的，九個。病歷上寫死亡的，兩個。<\/p>\n<p>剩下五十二個。<\/p>\n<p>周遠看著那一欄。五十二個人的名字後面，處置那一欄，寫的都是同一行字：<\/p>\n<p class=\"doc\">轉特別病房。<\/p>\n<p>「特別病房在哪裡？」<\/p>\n<p>「我不知道。」何靜說，「我在這裡六年，沒有聽過特別病房。」<\/p>\n<p>她站起來，走到門邊，把門打開一條縫，往走廊看了一眼，又關上。<\/p>\n<p>「我問過護理長，」她說，「問得很隨便，像在問明天誰值班。她說那是很早以前的分類，現在沒有了，系統沒改而已。」<\/p>\n<p>「妳相信嗎？」<\/p>\n<p>「最後一筆轉特別病房，」何靜說，「是今年夏天。」<\/p>\n<hr class=\"sep\">\n<p>凌晨一點，何靜帶他去看電梯。<\/p>\n<p>不是大廳那兩台載病人的。是一樓走廊最裡面，洗衣房旁邊那一台，貨梯，門漆成灰綠色，漆掉了好幾塊。平常送被單、送餐車、送藥品，晚上很少人用。<\/p>\n<p>何靜按了向下的鍵。門開了，裡面很窄，四面都是不鏽鋼板，刮痕很多，地上鋪著一塊髒髒的橡膠墊。<\/p>\n<p>她指著按鈕面板。<\/p>\n<p>一排圓形的按鈕，從上到下：4、3、2、1、B1、B2。<\/p>\n<p>B2 底下，有一塊方形的鐵片。<\/p>\n<p>跟面板一樣的不鏽鋼，大小剛好是一個按鈕的位置，四個角各鎖著一顆螺絲。面板上其他的螺絲都舊了，十字的凹槽裡卡著黑垢；這四顆是新的，亮的，像是最近才鎖上去。<\/p>\n<p>周遠伸手摸了一下那塊鐵片。<\/p>\n<p>很冰。比面板其他地方都冰。<\/p>\n<p>「這棟樓，」何靜說，「消防平面圖上只有到 B2。B2 是鍋爐房跟洗衣房的倉庫。」<\/p>\n<p>她沒有按任何一個鍵。電梯門自己關上了，兩個人站在那個窄窄的不鏽鋼盒子裡，看著那塊鐵片。<\/p>\n<p>「是蔡姐跟我說的。」何靜說，聲音很低，「她做了二十年。她說，有時候三更半夜，這台電梯會自己往下走。沒有人按。樓層燈一格一格亮下去，一樓，B1，B2。然後燈就暗了。」<\/p>\n<p>「暗了？」<\/p>\n<p>「整排都暗。」何靜說，「好像電梯不在任何一層。過四十分鐘左右，B2 的燈會再亮起來，然後一路往上，停在一樓，門打開，裡面沒有人。」<\/p>\n<p>周遠看著面板上那一排圓形的燈。<\/p>\n<p>一個樓層燈，能亮的只有它有的那幾個數字。如果它停在一個沒有數字的地方，燈就只能是暗的。<\/p>\n<p>「蔡姐說，」何靜說，「她剛來的時候問過老一輩的護理師。老一輩的跟她說，那是電梯在睡覺，不要管它。」<\/p>\n<hr class=\"sep\">\n<p>他們按了 B2。<\/p>\n<p>電梯往下走，很慢，鋼索發出長長的聲音。門打開，是一條很長的水泥走廊，天花板上的日光燈隔一盞亮一盞，牆邊堆著一袋一袋還沒洗的被單，空氣裡是漂白水跟潮濕的味道。<\/p>\n<p>走廊走到底，是一面牆。<\/p>\n<p>牆上掛著一張消防逃生圖，用塑膠套套著，邊角泛黃。紅色的箭頭指向一扇綠色的逃生門。逃生圖上，這一層寫著 B2，下面什麼都沒有。<\/p>\n<p>周遠推開那扇逃生門。<\/p>\n<p>是樓梯間。水泥樓梯，往上通到 B1、一樓。往下——<\/p>\n<p>往下還有一段。<\/p>\n<p>很短，十幾級，燈是壞的，只有上面那一層的光斜斜地照下來，照到一半。周遠拿出手機，打開手電筒，往下照。<\/p>\n<p>樓梯的盡頭，是一扇鐵門。<\/p>\n<p>灰色的，沒有門把，沒有門牌。門的右邊牆上，裝著一個黑色的感應讀卡機，很新，上面一顆小小的紅燈，亮著。<\/p>\n<p>周遠走下去。何靜跟在他後面，一隻手抓著他外套的衣角，抓得很緊，她大概自己也沒發現。<\/p>\n<p>他在鐵門前面蹲下來。<\/p>\n<p>門底下有一條縫，很窄，不到一根手指高。縫裡有風，很細，很冷，從門的另一邊吹出來，吹在他的手背上。<\/p>\n<p>風裡有味道。<\/p>\n<p>消毒水。很重的消毒水。底下壓著另一種，很淡，淡到他要閉上眼睛才分得出來。<\/p>\n<p>香灰。<\/p>\n<p>他在石崗的廟裡聞過。在霧川城隍廟的香爐裡聞過。在背面，那個孩子蹲在他面前的時候，從她濕透的黑袍上，聞過。<\/p>\n<p>他沒有說話。他把手機的光關掉，在黑暗裡蹲了一會兒。<\/p>\n<p>門的另一邊，什麼聲音都沒有。<\/p>\n<p>太安靜了。安靜得不像一個空房間。像一個很大的房間裡，有很多人，同時在睡覺，同時屏住呼吸。<\/p>\n<hr class=\"sep\">\n<p>他們回到二樓的時候，是兩點二十分。<\/p>\n<p>經過七號房，門開著一條縫。龔伯躺在床上，背對著門，臉朝著那面新漆的白牆。他沒有在哼歌。他在睡覺。<\/p>\n<p>可是他的一隻手，從被子底下伸出來，垂在床邊。<\/p>\n<p>食指伸直，指著地板。<\/p>\n<p>周遠在門口站了幾秒鐘，沒有進去。<\/p>\n<hr class=\"sep\">\n<p>值班室的咖啡機嗶了一聲。何靜倒了兩杯，一杯推給他。這一次是熱的。<\/p>\n<p>她坐在床沿，捧著杯子，沒有喝。<\/p>\n<p>「我明天要去找護理長要特別病房的名單。」她說。<\/p>\n<p>「她不會給妳。」<\/p>\n<p>「我知道。」何靜說，「我就是想看她怎麼不給我。」<\/p>\n<p>周遠看著她。<\/p>\n<p>六年前，她第一天來這裡上班，有人跟她說，縣府跟我們有合作。她點頭，把這句話記下來，從來沒有懷疑過。六年後，她坐在這間小小的值班室裡，在大夜班的凌晨兩點，決定去問一個她明知道不會有答案的問題。<\/p>\n<p>「妳可能會被調走。」周遠說。<\/p>\n<p>「我可能會被開除。」何靜說，「我媽會很高興。她一直覺得山上太冷。」<\/p>\n<p>她低頭喝了一口咖啡。<\/p>\n<p>然後她從白袍口袋裡掏出一本便利貼，黃色的，撕下一張，用筆在上面寫了兩個字。寫完，她把那張便利貼捲起來，貼在她那枝原子筆的筆桿上。<\/p>\n<p>以前，那裡貼著一張「回媽電話」。後來不見了。<\/p>\n<p>周遠看見她寫的是什麼。<\/p>\n<p>B3。<\/p>", "chars": 3244}, "51": {"title": "第五十一章　師兄", "html": "<p class=\"doc\">手記・辛未。<\/p>\n<hr class=\"sep\">\n<p>渡船上。<\/p>\n<p>我先寫師父的名。<\/p>\n<p>葛青崖。<\/p>\n<p>寫三遍。第三遍的最後一橫，又勾起來了。師父，你看，我還是改不掉。<\/p>\n<p>我跟船上賣雜貨的買了兩本冊子，最便宜的。一本寫「葬」，一本寫這個。<\/p>\n<p>船很搖，字寫得歪。船上的阿伯一直看我，以為我在寫批。我說我在寫帳。他笑，說這麼小就在記帳，以後會做頭家。<\/p>\n<p>我不是在記帳。我是怕忘記。<\/p>\n<p>那天晚上，樓梯上那個東西跟我講，交出來，就不會疼。我說不要。可是牠一講，我就真的想不起來師父的臉，想了好一陣子，才想回來。<\/p>\n<p>所以我要寫下來。寫下來，就算我忘記，紙也記得。<\/p>\n<p>從頭寫。<\/p>\n<hr class=\"sep\">\n<p class=\"doc\">丙寅年。<\/p>\n<p>我十二歲那年，港仔尾的隔壁阿財仔發燒，燒了七天，退不下來。暗時坐在眠床上，一直看厝角，笑。<\/p>\n<p>阿母去廟口請先生。<\/p>\n<p>來的是一個瘦瘦的人，穿一件洗到變色的長衫，背一個布袋，袋子裡有銅鈴在響。他進門，沒先看阿財仔，先看了厝角一下。<\/p>\n<p>我也在看厝角。<\/p>\n<p>厝角有一個東西。很小，黑黑的，像一隻沒有毛的貓，蹲在樑上，一直對阿財仔笑。<\/p>\n<p>先生轉頭看我。<\/p>\n<p>「你看會著？」<\/p>\n<p>我點頭。<\/p>\n<p>他沒有說什麼，從布袋裡拿出一張符，叫我拿著，去站在阿財仔的眠床邊。我站過去，厝角那個東西就不笑了。先生搖鈴，三下，那個東西縮起來，縮成一團黑煙，從窗仔縫鑽出去了。<\/p>\n<p>阿財仔第二天就退燒了。<\/p>\n<p>先生要走的時候，在我家門口站了一下，跟阿母講了一大堆話。阿母一直擦眼淚。我阿爸死得早，阿母做裁縫，一個人養我，三頓都吃番薯簽。<\/p>\n<p>那天晚上，阿母替我收了一包衫，兩雙襪，一雙她自己做的布鞋。<\/p>\n<p>「綴先生去，」她說，「較贏綴我食番薯簽。」<\/p>\n<p>我問她，先生叫什麼名字。<\/p>\n<p>她說：「葛先生。」<\/p>\n<hr class=\"sep\">\n<p>先生說，我的名字太普通，跟他走，要換一個。<\/p>\n<p>他想了一個晚上，第二天早上，用手指在桌上沾茶水寫了兩個字給我看。<\/p>\n<p>守一。<\/p>\n<p>「守一件代誌就好。」師父說，「人一世人，若會當守好一件，就夠矣。」<\/p>\n<p>我問他，是哪一件。<\/p>\n<p>他說：「到時陣你就知。」<\/p>\n<p>那天他教我寫字，第一個字教的就是「一」。他說，一，上簡單，嘛上歹寫。寫平，毋通歪，毋通翹。<\/p>\n<p>我寫了一整張紙。每一個「一」，寫到最後，筆尾都往上一勾。<\/p>\n<p>我改不掉。手自己會勾。<\/p>\n<p>師父看了半天，沒有罵我。他把紙拿起來，對著光看，說：「好。就按呢寫。按呢，人就知是你寫的。」<\/p>\n<hr class=\"sep\">\n<p>師兄那天也在。<\/p>\n<p>他坐在窗邊，翹著腳，在看一本書。他那時十七歲，比我高兩個頭，頭上戴一頂黑色的呢帽，那種城裡讀冊人戴的，帽沿很硬。在屋子裡面也戴，吃飯也戴，睡覺才拿下來，放在枕頭邊。<\/p>\n<p>他走過來，看我寫的那一張「一」，看了一下，笑出來。<\/p>\n<p>「一尾一尾，」他說，「像魚仔咧跳。」<\/p>\n<p>我的臉很燙。<\/p>\n<p>他拍拍我的頭。「莫歹勢。字醜無要緊，記會牢上要緊。」<\/p>\n<p>他叫梁鶴年。<\/p>\n<p>師父撿到他，比撿到我早四年。在下溪那邊，那年做瘟，一整條街的人都倒了，他家是開布莊的，一家七口，剩他一個，十三歲，坐在布莊門口的布堆上，等人來。<\/p>\n<p>師父說，他等了三天，沒哭。<\/p>\n<hr class=\"sep\">\n<p>師兄對我很好。<\/p>\n<p>我剛去的時候，什麼都不會。不會畫符，不會認字，不會搖鈴，鈴一拿起來就噹噹亂響，師父要我壓住鈴舌，我壓不住，手指壓到發白。<\/p>\n<p>我也不會綁鞋帶。<\/p>\n<p>阿母做的那雙布鞋，是有鞋帶的，兩條黑色的細布條。在港仔尾的時候，我都打赤腳，沒穿過有鞋帶的鞋。第一天要出門，我坐在門檻上綁，綁了一個死結，解不開，急得要哭。<\/p>\n<p>師兄蹲下來。<\/p>\n<p>他把我的腳抬起來，放在他的膝蓋上，用指甲把死結一點一點摳開。<\/p>\n<p>「看好。」他說。<\/p>\n<p>他把兩條鞋帶交叉，繞一圈，拉緊。再繞一圈，再拉緊。<\/p>\n<p>「綁兩擺。」他說，「一擺會落，兩擺袂落。」<\/p>\n<p>我問他，為什麼要綁這麼緊。<\/p>\n<p>他抬起頭看我。帽沿底下，他的眼睛很亮。<\/p>\n<p>「鞋帶若落，」他說，「人就會跋倒。跋倒，就予人追著。」<\/p>\n<p>我那時候不懂。我以為他是在講走路。<\/p>\n<p>他替我把另一隻也綁好，拍拍我的腳背，站起來，從布袋裡摸出一塊東西，塞進我的手裡。<\/p>\n<p>是一塊麥芽糖。用油紙包著，黏黏的，琥珀色。<\/p>\n<p>「食。」他說，「做先生的人，嘴愛甜。」<\/p>\n<p>我吃了。很甜。甜到牙齒都酸。<\/p>\n<p>那是我第一次吃他給的糖。<\/p>\n<hr class=\"sep\">\n<p>我寫到這裡，停下來想了很久。<\/p>\n<p>我想不起來我後來還有沒有吃過。<\/p>\n<p>在霧川渡的客棧，他又給了我一包。對岸的，他說。我沒有吃。我那時候不知道我為什麼不吃。我只是覺得，不想吃。<\/p>\n<p>現在我知道了。<\/p>\n<p>可是我還不想寫。<\/p>\n<hr class=\"sep\">\n<p class=\"doc\">第一天。<\/p>\n<p>師父說，學我們這一行，第一天要學的不是符，是看。<\/p>\n<p>那天下午，師父帶我們兩個去一戶人家。一個阿婆的孫子，晚上會爬起來對著水缸講話。<\/p>\n<p>我們到的時候，水缸裡有一個東西。很小，比我在厝角看到的還小，像一隻泡在水裡的蝌蚪，可是有臉。<\/p>\n<p>師父沒有搖鈴。他蹲在水缸邊，看了一陣子，用手指在水面上畫了一個圈。那個東西在圈裡轉了兩圈，沉下去了，沒有再浮上來。<\/p>\n<p>回來的路上，師兄走在師父旁邊。我走在後面。<\/p>\n<p>我聽見師兄問：「師父，彼款物件，會使飼無？」<\/p>\n<p>師父停下來。<\/p>\n<p>他轉頭看了師兄一眼。不是生氣，是一種我後來很多年都忘不掉的眼神，像在看一個站在井邊、一直往下探頭的小孩。<\/p>\n<p>「會使。」師父說。<\/p>\n<p>師兄的眼睛亮起來。<\/p>\n<p>「毋過，」師父說，「飼大矣，伊就飼你。」<\/p>\n<p>他繼續往前走。<\/p>\n<p>師兄站在路中間，沒有動。過了一下，他追上去，又問了一句什麼。我沒聽清楚。師父沒有回答。<\/p>\n<p>那是我第一天。<\/p>\n<p>那是師兄第一次問。<\/p>\n<p>不是最後一次。<\/p>\n<hr class=\"sep\">\n<p class=\"doc\">丁卯。戊辰。己巳。庚午。<\/p>\n<p>這四年，我寫不出什麼大事。<\/p>\n<p>我學會畫符，學會搖鈴，學會看日子，學會收驚。師父教的東西，師兄聽一遍就會，我要抄三遍。師兄笑我笨，笑完，就坐在我旁邊，等我抄完。<\/p>\n<p>他字很漂亮。一筆一畫，像刻出來的。師父說，鶴年的字，比我還好看。<\/p>\n<p>師兄一直在問。<\/p>\n<p>換一種方法問。在河邊問，在廟裡問，在吃飯的時候問。那個東西能不能用。那個東西能不能留。那個東西若是可以讓人忘記痛，是不是也算救人。<\/p>\n<p>師父有時候回答，有時候不回答。<\/p>\n<p>庚午年秋天，在溪頭一戶有錢人家收驚。收完那天晚上，我起來尿尿，看到師兄蹲在後院的井邊，手裡捧著一個小陶甕，甕口用油紙封著，綁了麻繩。甕在他手上一直抖，好像裡面有東西在撞。<\/p>\n<p>他看到我，把甕藏到背後，笑了一下。<\/p>\n<p>「莫共師父講。」他說，「我只是欲看伊會大到偌大。」<\/p>\n<p>我沒有講。<\/p>\n<p>可是師父知道了。第二天早上，師父從師兄的布袋裡把甕拿出來，一句話都沒說，拿到河邊，打破。裡面流出來的不是水，是一灘黑黑的東西，在石頭上爬了兩下，就乾了。<\/p>\n<p>師父三天沒有跟師兄講話。第四天，師兄跪在師父面前，說他知錯。師父扶他起來，說好。<\/p>\n<p>那天晚上，師兄坐在我旁邊抄符，手很穩，字跟平常一樣漂亮。<\/p>\n<p>又有一次，在一間破廟裡過夜，我半夜醒來，聽見他們兩個在廟埕講話。<\/p>\n<p>師兄說：「師父，你毋驚死？」<\/p>\n<p>師父說：「驚。」<\/p>\n<p>「驚，是按怎毋想辦法？」<\/p>\n<p>師父很久沒有講話。<\/p>\n<p>「鶴年，」他說，「驚死，毋是毋著。人攏驚。毋過你若驚甲想欲共死推予別人，你就毋是驚死矣。」<\/p>\n<p>「是啥？」<\/p>\n<p>「是欠。」<\/p>\n<p>師兄沒有再說話。<\/p>\n<p>我躺在神案底下，閉著眼睛，假裝我在睡覺。<\/p>\n<p>第二天早上，師兄跟平常一樣，笑著叫我起床，好像昨晚什麼都沒有講。<\/p>\n<hr class=\"sep\">\n<p class=\"doc\">辛未。霧川渡之後。<\/p>\n<p>師父死了。<\/p>\n<p>我寫這四個字，寫了一個下午。<\/p>\n<p>師兄不在。他那天晚上丟下小滿，走了。天亮的時候，水退了一半，我看到一艘小船往下游去，船上的人不回頭。我那時候不知道是誰。<\/p>\n<p>我現在知道了。<\/p>\n<p>他走的時候，有沒有綁鞋帶。<\/p>\n<p>我一直在想這件事。很奇怪，師父死了，下冊不見了，我卻一直在想，他那天晚上走的時候，鞋帶有沒有綁兩擺。<\/p>\n<p>我想，一定有。<\/p>\n<p>他從來不會讓自己跋倒。<\/p>\n<hr class=\"sep\">\n<p>我替師父穿鞋的時候，綁了兩次。<\/p>\n<p>第一次太緊了，我怕他會痛，解開，重新綁。綁兩擺。一擺會落，兩擺袂落。<\/p>\n<p>我的手記得那個結。是師兄教的。<\/p>\n<p>我一邊綁，一邊哭。我不知道我是在哭師父，還是在哭別的。<\/p>\n<hr class=\"sep\">\n<p>船快到了。<\/p>\n<p>我把這本冊子收起來，跟「封」和「葬」放在一起，用油紙包好，綁三圈。<\/p>\n<p>師父，我會守。<\/p>\n<p>守一件代誌。<\/p>\n<p>你說到時陣我就知是哪一件。我還不知道。可是我想，大概就是這個：師兄問的那個問題，我這世人，都要替你回答。<\/p>\n<p>袂使。<\/p>\n<hr class=\"sep\">\n<p>周遠把本子闔上。<\/p>\n<p>客廳只開了一盞小燈。窗台上那盆薄荷，葉子在暗處，看不太出顏色。<\/p>\n<p>他低頭看自己的腳。<\/p>\n<p>他還穿著外出的鞋，剛才回家，懶得換。黑色的皮鞋，鞋帶綁得很緊。<\/p>\n<p>交叉，繞一圈，拉緊。再繞一圈，再拉緊。<\/p>\n<p>兩擺。<\/p>\n<p>他不記得自己是從什麼時候開始這樣綁的。他一直以為，是當了警察以後學的。追人的時候，鞋帶不能鬆。<\/p>", "chars": 3234}, "52": {"title": "第五十二章　院長", "html": "<p>電話是隔天下午打來的。<\/p>\n<p>一個女人的聲音，很有禮貌，咬字很清楚，像在電台念廣告。<\/p>\n<p>「周組長您好，這裡是松嶺療養院院長室。院長想請您明天上午撥空來坐一下，喝杯茶。關於霧川那邊的事，院長一直想當面謝謝您。」<\/p>\n<p>周遠握著手機，看著辦公桌上那疊沒看完的白石里筆錄。<\/p>\n<p>「院長怎麼知道我的電話？」<\/p>\n<p>電話那頭停了一秒。<\/p>\n<p>「院長認識很多人。」秘書說，聲音還是很有禮貌，「明天十點，可以嗎？」<\/p>\n<hr class=\"sep\">\n<p>他打給何靜。<\/p>\n<p>何靜在吃午餐，嘴裡還有東西，含糊地說：「我早上去找護理長了。」<\/p>\n<p>「她怎麼說？」<\/p>\n<p>「她說特別病房是舊分類，系統沒改。」何靜吞下去，「跟上次一樣。然後她問我，最近是不是太累了。她說，院長很關心第一線醫師的身心狀況。」<\/p>\n<p>周遠沒有說話。<\/p>\n<p>「下午三點，」何靜說，「院長室打電話給你，對不對？」<\/p>\n<p>「妳怎麼知道？」<\/p>\n<p>「我猜的。」何靜說，「我十一點去找護理長，十一點半護理長上四樓。我從護理站的窗戶看到的。」<\/p>\n<p>她停了一下。<\/p>\n<p>「周遠，你明天去，不要吃他給你的任何東西。」<\/p>\n<p>「為什麼？」<\/p>\n<p>「我不知道。」何靜說，「我就是覺得。」<\/p>\n<hr class=\"sep\">\n<p>松嶺的四樓，周遠沒有上來過。<\/p>\n<p>電梯門一開，是一條鋪著深色木地板的走廊，很安靜，安靜得聽得見自己鞋底踩在木頭上的聲音。走廊兩邊沒有病房，只有幾扇關著的門，門上掛著銅牌：會議室、財務室、檔案室。牆上掛著一幅一幅的書法，裱得很好，寫的都是「仁心」「濟世」那一類的字。<\/p>\n<p>走廊的盡頭，最右邊那一扇門，銅牌上刻著：院長室。<\/p>\n<p>周遠站在門前，想起那個凌晨。整棟樓的燈都亮著，只有四樓最右邊那一扇窗是暗的。後來它亮了。<\/p>\n<p>秘書替他開門。<\/p>\n<p>院長室很大，比他想像的大。一整面牆的落地窗，對著外面的松林，再遠一點是山，山底下看得見縣城灰灰的一片。窗前一張很大的紅木書桌，桌上乾乾淨淨，一個筆筒，一個玻璃罐，一盞綠色燈罩的檯燈。<\/p>\n<p>靠牆的一邊，一座小小的神龕。<\/p>\n<p>神龕裡供著一尊神像，黑臉，長鬚，一手拿筆，一手拿簿子。神像前面一個銅香爐，插著三支香，香燒到一半，煙很細，筆直地往上飄。<\/p>\n<p>周遠認得那是誰。他小時候在廟裡看過，站在城隍旁邊。判官。<\/p>\n<p>「周組長。」<\/p>\n<p>書桌後面的人站起來了。<\/p>\n<hr class=\"sep\">\n<p>他看起來六十出頭。<\/p>\n<p>頭髮全白了，梳得很整齊，往後梳，露出很寬的額頭。臉很乾淨，皺紋不多，眼角有幾條細紋，笑起來的時候才看得見。他穿著一件深灰色的羊毛背心，裡面是白襯衫，袖口的釦子扣得好好的。<\/p>\n<p>他走過來，伸出手。<\/p>\n<p>周遠握住。<\/p>\n<p>那隻手很乾，很涼，握得不輕不重，剛剛好。可是周遠低頭看了一眼。手背上的皮很薄，薄得像紙，底下的青筋一條一條浮起來，老人斑一塊疊一塊。<\/p>\n<p>那不是一隻六十歲的手。<\/p>\n<p>「請坐。」院長說，鬆開手，「喝茶？」<\/p>\n<p>「好。」<\/p>\n<p>秘書端了茶進來，放下，退出去，把門帶上。<\/p>\n<p>院長在他對面坐下。周遠看見書桌邊的名牌，木頭底座，金色的字：<\/p>\n<p class=\"doc\">院長　梁鶴年<\/p>\n<p>他看著那三個字。<\/p>\n<p>前天晚上，在他家客廳那盞小燈底下，一本泛黃的手記裡，一個十七歲的少年用很醜的字寫：他叫梁鶴年。<\/p>\n<p>周遠把視線從名牌上移開，拿起茶杯。<\/p>\n<p>茶很燙，很香。他沒有喝，放下了。<\/p>\n<p>院長看見了，笑了一下。眼角那幾條細紋出來了。<\/p>\n<hr class=\"sep\">\n<p>「霧川的事，」院長說，「辛苦你了。」<\/p>\n<p>「是我的工作。」<\/p>\n<p>「三十九個人。」院長說，「找回來三十九個。很不容易。」他頓了一下，「另外四個，可惜。」<\/p>\n<p>周遠看著他。新聞稿上寫的是四名續列失蹤。他沒有說可惜。<\/p>\n<p>「水庫那邊，」院長說，「是我捐的。遷村的補償，大部分也是。那個地方，淹掉好。」<\/p>\n<p>「為什麼？」<\/p>\n<p>院長轉頭看了一眼窗外。山底下，縣城的方向，再過去，看不見的地方，是霧川。<\/p>\n<p>「有些地方，」他說，「放在水底下，比較安靜。」<\/p>\n<p>他轉回來，把書桌上那個玻璃罐推過來。<\/p>\n<p>罐子裡是糖。一顆一顆，用油紙包著，琥珀色的，透過油紙看得見。<\/p>\n<p>「吃一塊。」院長說，「對岸的。我年輕的時候就吃這個，吃了一輩子，吃不膩。」<\/p>\n<p>周遠看著那罐糖。<\/p>\n<p>他想起手記裡那一行字。做先生的人，嘴愛甜。<\/p>\n<p>他想起林依的行李箱，想起霧川廟口監視器裡那個五點零三分走進畫面、拎走行李箱、帽簷壓得很低的男人。想起一個七歲的小女孩說，一个戴帽仔的人，閣予我一塊糖。<\/p>\n<p>「我不吃甜的。」周遠說。<\/p>\n<p>院長點點頭，好像早就知道。他自己拿了一顆，剝開油紙，放進嘴裡，慢慢地含著。<\/p>\n<p>「你們這一代的人，」他說，「都不吃甜的了。」<\/p>\n<hr class=\"sep\">\n<p>他們聊了二十分鐘。<\/p>\n<p>院長問他當了幾年警察，問他住在縣城哪裡，問他吃得慣松嶺附近那間麵店的麵嗎。都是很普通的問題，問得很客氣，聲音很溫和，像一個退休的長輩在關心晚輩。<\/p>\n<p>周遠一句一句回答，回答得很短。<\/p>\n<p>他一直在看。<\/p>\n<p>看書桌下面，院長的腳。黑色的皮鞋，擦得很亮，鞋帶繫得很整齊。交叉，繞一圈，拉緊。再繞一圈，再拉緊。<\/p>\n<p>兩擺。<\/p>\n<p>看門邊的衣帽架。架上掛著一件深色的大衣，大衣上面，一頂帽子。<\/p>\n<p>黑色的呢帽。硬帽沿。那種很老很老的款式，現在已經沒有人戴了。可是保養得很好，一點灰塵都沒有，帽沿的弧度很漂亮，像剛從店裡買回來。<\/p>\n<p>院長順著他的視線，也看了一眼那頂帽子。<\/p>\n<p>「老東西了。」他說，「我師父那時候說，戴這個，像讀冊人。我年輕的時候很想當讀冊人。」<\/p>\n<p>他笑了。<\/p>\n<p>「後來發現，讀冊人沒有什麼了不起。」<\/p>\n<p>「你師父，」周遠說，「是做什麼的？」<\/p>\n<p>院長看著他，看了一下。<\/p>\n<p>「看日的。收驚的。」他說，「一个好人。可惜，傷早死。」<\/p>\n<p>他把茶杯轉了半圈，讓杯子上的花紋朝著自己。<\/p>\n<p>「好人攏較早死。」他說，「你看過伊的字無？足穤。伊收的徒弟，字一个比一个較穤。」<\/p>\n<p>他抬起眼睛。<\/p>\n<p>「聽講，你這陣，暗時攏咧讀冊。」<\/p>\n<p>周遠拿起茶杯，又放下。<\/p>\n<p>他沒有問院長是聽誰講的。他知道問了，對方也只會笑。<\/p>\n<hr class=\"sep\">\n<p>「何醫師，」院長說，像是忽然想起來，「是一個很好的醫師。」<\/p>\n<p>周遠的手在膝蓋上停住了。<\/p>\n<p>「很認真。」院長說，「認真的人，容易累。我跟護理長說了，要多關心她。」<\/p>\n<p>「她很好。」<\/p>\n<p>「我知道。」院長說，「所以才要關心。」<\/p>\n<p>他拿起茶杯，喝了一口，放下。<\/p>\n<p>「白石里，」他說，「你去看過了吧。」<\/p>\n<p>「看過了。」<\/p>\n<p>「很可憐。」院長說，「那些剩下來的人，以後要是需要照顧，松嶺這邊都可以收。我們跟縣府有合作。」<\/p>\n<p>周遠看著他。<\/p>\n<p>院長也看著他。很平靜，很溫和。<\/p>\n<p>「你的頭髮，」院長說，眼睛往他的右鬢看了一下，「是最近才白的吧。」<\/p>\n<p>周遠沒有回答。<\/p>\n<p>「十年，」院長說，聲音很輕，輕到周遠以為自己聽錯了，「換一暝。」<\/p>\n<p>他微微地笑了一下。<\/p>\n<p>「划算。」<\/p>\n<hr class=\"sep\">\n<p>會面結束的時候，院長站起來，親自送他到門口。<\/p>\n<p>他走在周遠旁邊，比周遠矮半個頭，背挺得很直。走過那座神龕的時候，他伸手，很自然地，把一支快要燒完的香換掉，換上一支新的，點著，插好。<\/p>\n<p>一點都沒有停頓。好像他這輩子每一天，都在做這件事。<\/p>\n<p>周遠站在門口，等秘書開門。<\/p>\n<p>院長站在他旁邊，忽然往他靠近了一點。很近。近到周遠聞得到他身上的味道。<\/p>\n<p>沉香。麥芽糖。還有很淡很淡的，底下的，一種他在 B2 樓梯底下那扇鐵門的門縫裡聞過的味道。<\/p>\n<p>院長的聲音很輕，輕得只有他們兩個人聽得見。<\/p>\n<p>「你身上，」他說，「有我師弟的味道。」<\/p>\n<p>周遠沒有動。<\/p>\n<p>「可惜，」院長說，「伊已經走矣。」<\/p>\n<p>他退開一步，又是那個客氣的、溫和的老先生，伸出那隻很乾、很涼、很老的手。<\/p>\n<p>「有空再來坐。」<\/p>\n<hr class=\"sep\">\n<p>周遠一路走到停車場，沒有回頭。<\/p>\n<p>他坐進車裡，關上門，兩隻手放在方向盤上，坐了一陣子。<\/p>\n<p>然後他拿出手機。<\/p>\n<p>剛才在院長室，等秘書端茶的時候，他看見了牆上掛的一塊匾。木框，玻璃，裡面是一張很長的紅紙，松嶺療養院歷年捐款芳名錄。最上面一行，金色的字，捐款人的名字，名字後面一個簽名。<\/p>\n<p>他趁院長轉頭看窗外的時候，拍了下來。<\/p>\n<p>他把那張照片放大。<\/p>\n<p>簽名很潦草。開頭的地方，筆畫纏在一起，糾成一小團，然後一筆往右下拉，拉得很長，一直拉到紅紙的邊緣。<\/p>\n<p>一筆拉到底。<\/p>\n<p>他打開另一張照片。文史館的閱覽登記簿，許館員前幾天傳給他的。霧川出事前三週，那個只看最後一頁的老先生，留下的那個簽名。<\/p>\n<p>一模一樣。<\/p>\n<p>他再打開一張。龔伯的入院單，何靜拍給他的。轉介醫師簽名那一欄，很窄，那一團糾在一起的筆畫擠在裡面，後面那一筆拉不出去，被欄位的框線截斷了。<\/p>\n<p>所以看起來，只是一團。<\/p>\n<p>周遠把三張照片並排，一張一張看過去。<\/p>\n<p>他抬起頭，看著後照鏡。<\/p>\n<p>鏡子裡，是松嶺那棟灰白色的四層樓。四樓最右邊那一扇窗，窗簾拉開了一半。<\/p>\n<p>窗後面站著一個人。<\/p>\n<p>戴著帽子。<\/p>", "chars": 3222}, "53": {"title": "第五十三章　下半本", "html": "<p class=\"doc\">手記・壬申。<\/p>\n<hr class=\"sep\">\n<p>我一直沒有寫。<\/p>\n<p>辛未年那本，寫到「袂使」，我就收起來了。我跟自己說，等我想清楚，再寫後面。<\/p>\n<p>我想了一年。<\/p>\n<p>今年春天，在南邊一個賣甘蔗的小鎮，廟口有人在講霧川渡的事。說沈家少奶奶生了，生一個後生，白白胖胖。生了第三天，少奶奶自己就沒了。<\/p>\n<p>我站在甘蔗攤旁邊，聽完，買了一節甘蔗，咬了一口，甜得我想吐。<\/p>\n<p>我那條線，跟著那個囡仔去了。<\/p>\n<p>那天晚上我就開始寫。寫不出來。寫一行，劃掉。再寫一行，再劃掉。寫到天亮，紙上只剩一行沒有劃掉的。<\/p>\n<p class=\"doc\">是師兄。<\/p>\n<p>我現在要從頭寫。寫清楚。寫得跟師父教我記帳一樣，一筆一筆，不能漏，也不能多。<\/p>\n<hr class=\"sep\">\n<p class=\"doc\">辛未。壽宴那暗。<\/p>\n<p>我們到霧川渡的那天，師兄先到兩天了。<\/p>\n<p>師父說，師兄以前跟他來過霧川渡兩次。我那時候沒有多想。師父每三年回去一次，師兄跟了師父九年，跟過兩次，很平常。<\/p>\n<p>可是跟過，就看過。<\/p>\n<p>看過土地廟的橫樑。看過那包粉紅色的紅布。看過師父每次去，都先在神案前站一陣子，抬頭看那包東西，像在看一個睡著的人。<\/p>\n<p>那天晚上，我半夜餓醒，偷吃壽宴剩下的滷蹄膀，走過窗邊，看到小滿光著腳往鎮尾走。我跟上去，跟到土地廟，看到她踩著香爐的邊，伸手去搆那包紅布。<\/p>\n<p>我喊她。她嚇到，手一扯，紅布掉下來，落進她懷裡。<\/p>\n<p>她從我腋下鑽過去，跑到廟門口，回頭看了我一眼。長明燈照在她臉上。<\/p>\n<p>她的嘴角，黏著一點亮亮的東西。像是糖。<\/p>\n<p>我那時候沒有想，一個沒人管的囡仔，三更半夜，嘴角哪裡來的糖。<\/p>\n<hr class=\"sep\">\n<p>那天晚上，師兄一整夜沒有回客棧。<\/p>\n<p>第二天中午他才回來，帶了一包麥芽糖，對岸的，說要給我。我沒有吃。他笑一笑，說放著，想吃再吃。<\/p>\n<p>他坐下來吃飯，布袋放在桌邊。袋口露出一角油紙，油紙上黏著一點琥珀色的東西。<\/p>\n<p>我看到了。<\/p>\n<p>我那時候只覺得，他連自己吃的糖都包得那麼好。<\/p>\n<hr class=\"sep\">\n<p>後來，在河邊的船底下，小滿把紅布還給我，哭著說是她的錯。我問她，是誰叫她去拿的。<\/p>\n<p>她說：一个戴帽仔的人。面看無清楚。伊講廟仔頂懸有好物，閣予我一塊糖。<\/p>\n<p>我背上發冷。<\/p>\n<p>我想起那包我沒有吃的糖。<\/p>\n<p>可是我沒有再往下想。<\/p>\n<p>我跟自己說，戴帽子的人很多。碼頭上的挑夫戴斗笠，沈家的管家戴瓜皮帽，對岸來的生意人戴呢帽。霧川渡那麼大，戴帽子的人那麼多。<\/p>\n<p>我跟自己說，師兄不會。<\/p>\n<p>我跟自己說，他是師兄。他教我綁鞋帶。他給我吃第一塊糖。他看我抄符抄到半夜，坐在旁邊等我。<\/p>\n<p>我跟自己說了很多。<\/p>\n<p>我現在知道，我那時候不是不知道。我是不敢知道。<\/p>\n<p>跟師父一樣。<\/p>\n<hr class=\"sep\">\n<p>我後來想通一件事。<\/p>\n<p>那包鎮符，是師父跟師祖三十年前一起封的。符上有師父的手。先生的手只要一碰到，師父就會知道。不管在多遠的地方，他都會知道。<\/p>\n<p>可是一個七歲的囡仔的手，符不認得。<\/p>\n<p>所以要找一個囡仔。<\/p>\n<p>不是鎮上的囡仔。鎮上的囡仔有阿爸阿母，晚上會被叫回家。要找一個沒人管的。一個阿爸撐船、阿母不在、晚上一個人在碼頭邊晃的囡仔。<\/p>\n<p>一個嘴饞的囡仔。<\/p>\n<p>師兄最會看人了。師父說過，鶴年看人，一眼就看到底。<\/p>\n<p>他看到小滿。<\/p>\n<p>他蹲下來，跟她一樣高，從布袋裡拿出一塊糖。<\/p>\n<hr class=\"sep\">\n<p class=\"doc\">辛未。滿月那暗。<\/p>\n<p>那天下午，師父在客棧寫下冊。<\/p>\n<p>寫了一整個下午，一頁接一頁，筆沒有停過。他坐在窗邊的桌前，一邊寫一邊念，念給自己聽。我前一夜守著小滿沒睡，躺在床上，半睡半醒，本來在聽，後來睡著了。<\/p>\n<p>我醒來的時候，師父已經寫完了。他把兩冊疊在一起，用油紙包好，綁三圈麻繩，放進布包裡。<\/p>\n<p>我睡著以前，最後看到的，是師兄坐在另一張床上，手上拿著一本書。<\/p>\n<p>他的眼睛沒有在書上。在看師父的筆。<\/p>\n<hr class=\"sep\">\n<p>天黑以後，師父要去渡口。<\/p>\n<p>他把那包油紙交給師兄。<\/p>\n<p>「你留佇客棧，」師父說，「顧好這个包，顧好小滿。」<\/p>\n<p>師兄看了看那包東西，又看了看坐在門檻上啃饅頭的小滿。<\/p>\n<p>他說好。<\/p>\n<p>他笑著說好。<\/p>\n<p>我要跟師父出門的時候，他叫住我。<\/p>\n<p>「守一。」<\/p>\n<p>我回頭。他從床上下來，走到我面前，低頭看我的腳。<\/p>\n<p>我的鞋帶鬆了。那天下午我睡得太死，起來隨便一綁，一邊已經散開了。<\/p>\n<p>他蹲下來。<\/p>\n<p>跟我十二歲那年一樣，他把我的腳抬起來，放在他的膝蓋上。交叉，繞一圈，拉緊。再繞一圈，再拉緊。另一隻也是。<\/p>\n<p>「今暗，」他說，沒有抬頭，「若是欲走，就走。毋通越頭。」<\/p>\n<p>我問他，師兄你講啥。<\/p>\n<p>他拍拍我的腳背，站起來，又是那個笑笑的樣子。<\/p>\n<p>「無啦。」他說，「緊去，師父咧等。」<\/p>\n<hr class=\"sep\">\n<p>我寫到這裡，停了很久。<\/p>\n<p>我不知道該怎麼想這件事。<\/p>\n<p>那天晚上，他知道會出事。也許他知道師父回不來。他知道那包油紙裡有他要的東西，知道他要坐一艘船，往下游走，一次都不回頭。<\/p>\n<p>他都知道。<\/p>\n<p>可是他還是蹲下來，替我把鞋帶綁好。<\/p>\n<p>綁兩擺。<\/p>\n<p>我不知道那是什麼。我想了一年，還是不知道。<\/p>\n<hr class=\"sep\">\n<p>我跟師父去了渡口。<\/p>\n<p>後來的事，我已經寫過了。我不想再寫一次。<\/p>\n<p>我只寫一件事。<\/p>\n<p>天亮的時候，水退了一半。我站在石階上，還沒有走下去找師父，就看到一艘小船，遠遠的，順著水往下游走。<\/p>\n<p>船上有一個人。<\/p>\n<p>他沒有划槳。他坐在船尾，背對著岸，一動也不動，讓水帶著他走。<\/p>\n<p>太遠了，我只看了一眼。我只記得他頭上，有一個黑黑的、圓圓的、帽沿很硬的形狀。<\/p>\n<p>他一次都沒有回頭。<\/p>\n<hr class=\"sep\">\n<p>小滿在渡口就跟我講過，師兄講伊欲去便所，就無轉來矣。我帶她回到客棧的時候，太陽已經很高了。<\/p>\n<p>那個布包還在床頭。<\/p>\n<p>我拿起來。很輕。比我記得的輕。<\/p>\n<p>我那時候沒有打開。我只是覺得輕，覺得哪裡不對，可是我腦子裡只有師父，只有石階上那雙鞋頭朝外的布鞋，我沒有辦法再想別的事。<\/p>\n<p>第二天，我打開了。<\/p>\n<p>裡面只有一冊。「封」。<\/p>\n<p>下面那一冊，不見了。<\/p>\n<p>我記得那一冊的題簽。師父寫的時候，我瞄到一眼，沒看清楚，只記得那個字的筆畫很多，比「封」字多很多。<\/p>\n<p>我後來在渡船上，自己買了一本冊子，在封面上寫了一個字。<\/p>\n<p>葬。<\/p>\n<p>我寫完，看著那個字，看到船靠岸。<\/p>\n<p>我想，師父的那一冊，應該也是這個字。<\/p>\n<hr class=\"sep\">\n<p>我一直在想，師兄為什麼要拿。<\/p>\n<p>他要「封」，可以拿「封」。「封」他看過很多次了，他記得比我熟。<\/p>\n<p>他拿的是師父那天下午才寫完的那一冊。<\/p>\n<p>那一冊裡面，寫的是師父花了三十年才想通的事。怎麼葬。<\/p>\n<p>一個會葬的人，就知道怎麼不葬。<\/p>\n<p>一個知道怎麼葬的人，就知道那東西要什麼、怕什麼、會變成什麼。<\/p>\n<p>師兄從第一天就在問：會使飼無？<\/p>\n<p>師父那一冊裡面，有答案。<\/p>\n<hr class=\"sep\">\n<p class=\"doc\">壬申。下溪。<\/p>\n<p>寫到這裡，我去了一趟下溪。<\/p>\n<p>師兄出生的地方。一整條街的人都在瘟疫裡死掉的地方。師父說他坐在布莊門口的布堆上，等了三天，沒有哭。<\/p>\n<p>我走了五天才走到。<\/p>\n<p>一路上，我問每一個撐船的人，有沒有看過一個戴黑帽子、坐在船尾不划槳的少年家。大部分的人都搖頭。只有一個老船夫想了半天，說有，去年秋天，在溪口換了一艘大船，往北去了。上船的時候，那個少年家給了他一塊糖。<\/p>\n<p>下溪的那條街還在。房子都在。可是我記得師父說過，那條街的人死光以後，十幾年都沒人敢住。<\/p>\n<p>現在有人在住了。<\/p>\n<p>整條街都在修。拆舊厝，起新厝，挖地基，運石頭。工人很多，吵得要命。<\/p>\n<p>我在街口問一個賣茶的阿婆，這條街怎麼忽然熱鬧起來了。<\/p>\n<p>阿婆說，去年有一個少年家回來，把整條街的地都買下來了。那些地，死光的人家，沒有人繼承，官廳拍賣，很便宜。<\/p>\n<p>「彼个少年家，」阿婆說，「生做足緣投。講話足甜。戴一頂烏帽仔。」<\/p>\n<p>我問她，那個少年家有沒有說，買這麼多地要做什麼。<\/p>\n<p>阿婆想了一下。<\/p>\n<p>「伊講，」她說，「無人的所在，上好起厝。」<\/p>\n<hr class=\"sep\">\n<p>我在下溪住了一晚。<\/p>\n<p>那天晚上，我在布莊的舊址前面站了很久。布莊已經拆了，地基挖了一半，一個大坑。<\/p>\n<p>坑邊上，有人放了一包東西。<\/p>\n<p>我蹲下來看。<\/p>\n<p>是一包麥芽糖。油紙包著，琥珀色的。還沒開。<\/p>\n<p>旁邊壓著一張紙，紙上一個字都沒有。只畫了一條線。<\/p>\n<p>很平。很直。<\/p>\n<p>尾巴，沒有勾。<\/p>\n<hr class=\"sep\">\n<p>我把那包糖留在那裡，沒有拿。<\/p>\n<p>我寫到這裡，手很酸。天快亮了。<\/p>\n<p>師父，你說人一世人若會當守好一件代誌，就夠矣。<\/p>\n<p>我還不知道是哪一件。<\/p>\n<p>可是我現在知道，我要找一個人。<\/p>\n<p>我要找到他，把你的那一冊拿回來。<\/p>\n<p>我要問他，你吃那麼多糖，嘴巴，到底有沒有甜過。<\/p>", "chars": 3049}, "54": {"title": "第五十四章　B3", "html": "<p>他們決定等電梯睡覺。<\/p>\n<p>何靜說，蔡姐記得的那幾次，都是凌晨三點前後。不是每天，大概一個禮拜兩三次。她排了連續五天的大夜，跟護理長說是想多賺一點夜班費。護理長看了她一眼，在排班表上簽了名，什麼都沒說。<\/p>\n<p>第一天晚上，電梯沒有動。<\/p>\n<p>周遠每天晚上十一點從側門進來，坐在何靜值班室的那張單人床上，等。何靜在護理站和值班室之間來回，每隔半小時去貨梯那裡看一眼。兩個人很少講話。何靜帶了她媽媽滷的豆干，周遠吃了半盒，剩下的她用保鮮膜包好，放回冰箱。<\/p>\n<p>第二天晚上，兩點五十一分，何靜推開值班室的門。<\/p>\n<p>她只是對他點了一下頭。<\/p>\n<hr class=\"sep\">\n<p>貨梯停在一樓，門開著。<\/p>\n<p>裡面的燈亮著，很白，照得不鏽鋼牆壁上的刮痕一條一條，清清楚楚。樓層燈那一排，一樓那顆亮著。<\/p>\n<p>沒有人按。門就那樣開著，像在等。<\/p>\n<p>周遠走進去。何靜跟在後面。<\/p>\n<p>門關上了。<\/p>\n<p>周遠沒有碰任何按鈕。電梯自己動了，往下，很慢，鋼索拉出長長的、低低的聲音，像一個很老的人在嘆氣。<\/p>\n<p>樓層燈一格一格往下亮。一樓。B1。B2。<\/p>\n<p>B2 的燈亮了一下，暗了。<\/p>\n<p>整排都暗了。<\/p>\n<p>電梯沒有停。它還在往下走，腳底下傳來那種往下沉的感覺，很輕，很穩。周遠低頭看了一眼面板上那塊鐵片，那四顆新的螺絲。鐵片底下透出一點點很淡的紅光，像有一顆燈泡，在那塊鐵片後面亮著。<\/p>\n<p>何靜看了一眼手錶。<\/p>\n<p>「兩點五十三分。」她說，聲音很低，「四十分鐘。」<\/p>\n<p>電梯停了。<\/p>\n<p>門打開。<\/p>\n<hr class=\"sep\">\n<p>冷。<\/p>\n<p>這是周遠第一個感覺。不是冷氣的那種冷，是地底下的冷，從腳底的水泥地往上爬，爬進褲管，爬上小腿。<\/p>\n<p>然後是味道。消毒水，很重，重到刺鼻子。底下壓著那個味道。香灰。不是廟裡那種剛燒過、還帶著煙的香灰，是冷掉的、放了很久的，像一個很多年沒有人去拜的香爐。<\/p>\n<p>然後是聲音。<\/p>\n<p>很多人在呼吸。<\/p>\n<p>很慢，很深，很整齊。吸進去，停一下，吐出來。幾十個人，同一個速度，同一個深淺，像一個很大的東西在黑暗裡睡覺。<\/p>\n<p>周遠打開手機的手電筒，又關掉。<\/p>\n<p>不用。這裡有光。天花板上，每隔幾公尺一盞小小的藍色夜燈，光很弱，剛好看得見輪廓。<\/p>\n<p>一條很長的病房。<\/p>\n<p>左右兩排病床，一張接一張，一直排到藍光照不到的地方。床跟床之間隔著淺綠色的布簾，布簾都拉開了。每一張床上，都躺著一個人。<\/p>\n<hr class=\"sep\">\n<p>周遠走過去。<\/p>\n<p>第一張床上是一個中年男人，五十幾歲，臉很瘦，閉著眼睛，雙手交疊放在胸前，右手壓著左手。<\/p>\n<p>周遠的腳步停了一下。<\/p>\n<p>右手壓著左手。霧川後山公墓那兩百六十七個人，被找到的時候，手都是這樣放的。<\/p>\n<p>男人的左手臂上插著一根點滴管。管子往上，接到床頭的點滴架上，架上掛著一袋液體。<\/p>\n<p>黑色的。<\/p>\n<p>不是深褐色，不是暗紅色，是黑的。像墨汁，像香灰泡出來的水，在藍色的夜燈底下，一點光都不反。點滴管裡，黑色的液體一滴一滴往下走，很慢，比正常的點滴慢很多。<\/p>\n<p>何靜站在他旁邊，看著那袋點滴，臉色很白。<\/p>\n<p>「這不是任何一種藥。」她說，「我沒有看過這種顏色的藥。」<\/p>\n<p>她伸手去看那個男人的手腕。手腕上套著一條病人識別手環，白色的塑膠，上面印著字。<\/p>\n<p>她把手環轉過來，讓藍光照在上面。<\/p>\n<p class=\"doc\">竹坑-02<\/p>\n<p>沒有名字。<\/p>\n<p>只有一個地名，一個號碼。<\/p>\n<hr class=\"sep\">\n<p>他們一張一張往下走。<\/p>\n<p>每一張床都一樣。閉著眼睛，雙手交疊，右手壓左手。黑色的點滴。白色的手環。手環上，一個地名，一個號碼。<\/p>\n<p>竹坑-01。漁村-04。漁村-07。<\/p>\n<p>周遠看見一個老太太，頭髮全白了，嘴角往下垂，手環上印著一個他沒聽過的地名。他看見一個年輕女生，二十出頭，指甲上還有沒卸乾淨的指甲油，粉紅色的，剝落了一半。<\/p>\n<p>何靜在一張床前面停下來。<\/p>\n<p>床上是一個男生，十七八歲，臉上還有青春痘。何靜看著他，伸手把他額頭上一撮頭髮撥開。<\/p>\n<p>「他叫阿翔。」何靜說，聲音很穩，可是周遠聽得出來那種穩是用力撐住的，「三年前送進來的。我收的。他很愛講話，每天早上都問我今天的早餐是什麼。他說他以後要去開早餐店。」<\/p>\n<p>她低頭看他的手環。<\/p>\n<p>上面印著一個地名，一個號碼。<\/p>\n<p>「今年夏天，」何靜說，「病歷上寫，轉特別病房。我以為他轉去別的醫院了。」<\/p>\n<p>周遠往後看。越往裡面走，手環上的字越淡。<\/p>\n<p>有的地名只剩一半。有的號碼看不清楚。再往裡面，十幾張床，手環是空白的。白色的塑膠，乾乾淨淨，什麼都沒有。<\/p>\n<p>不是沒印。周遠湊近看，看得出來，那上面曾經有字。字的地方，塑膠的表面比較霧，像有人用橡皮擦，一點一點，把字擦掉了。<\/p>\n<p>他想起河底那一層一層的鐵牌。想起邱永福那塊牌子上，那一條很細很直的線。<\/p>\n<p>點滴一滴一滴往下走。<\/p>\n<p>黑色的。<\/p>\n<hr class=\"sep\">\n<p>病房的最裡面，有一扇門。<\/p>\n<p>門沒有鎖。周遠推開，裡面是一個小房間，比病房更冷。一整面牆的鐵架子，架上排著一箱一箱的紙箱，紙箱上用麥克筆寫著日期。<\/p>\n<p>周遠打開最近的一箱。<\/p>\n<p>裡面是瓶子。<\/p>\n<p>小小的瓷瓶，白色的，拇指那麼大，一排一排插在瓦楞紙隔板裡。每一個瓶子都用紅蠟封了口，瓶身上貼著一張小小的標籤。<\/p>\n<p class=\"doc\">竹坑-02　第一四二號<\/p>\n<p>他拿起一個，對著手機的光看。瓶子很輕，可是搖起來，裡面有東西。不是液體，是更細的、更乾的東西，像沙，像灰。<\/p>\n<p>他想起沈言那個白色的瓷瓶。瓶底刻著一個「和」字。<\/p>\n<p>他把瓶子放回去。<\/p>\n<p>紙箱的側面，貼著一張出貨單。用電腦印的，很正式，收件人那一欄只寫了兩個字：<\/p>\n<p class=\"beat\"><strong>後殿<\/strong><\/p>\n<p>備註欄寫著：<strong>初一、十五　金爐<\/strong><\/p>\n<hr class=\"sep\">\n<p>何靜在房間的另一頭叫他。<\/p>\n<p>「周遠。」<\/p>\n<p>她站在最下面一層的架子前面，蹲著。架子上沒有紙箱，只放著一樣東西。<\/p>\n<p>一個行李箱。<\/p>\n<p>深藍色的，硬殼的，一邊的輪子有一點歪，把手上綁著一條褪色的絲巾。<\/p>\n<p>周遠認得它。<\/p>\n<p>他在霧川的監視器畫面上看過這個行李箱。凌晨四點多，靠在廟埕的牆邊。人群都走光以後，它還在。五點零三分，一個戴帽子的男人走進畫面，彎腰拎起它，轉身就走。經過監視器底下的時候，抬了一下頭。<\/p>\n<p>周遠蹲下來，拉開拉鍊。<\/p>\n<p>裡面是一個女生的東西。幾件衣服，捲得很整齊。一個化妝包。一本翻到捲邊的旅遊雜誌。一雙拖鞋。<\/p>\n<p>衣服的最上面，放著一個長方形的鐵盒子。<\/p>\n<p>盒蓋上印著一間老店的名字，字是紅色的，舊式的字體。底下一行小字：對岸名產。<\/p>\n<p>周遠打開盒子。<\/p>\n<p>是麥芽糖。一顆一顆，用油紙包著，琥珀色的。盒子裡原本應該有二十顆，現在少了四五顆。<\/p>\n<p>盒子底下，壓著一張名片。<\/p>\n<p>白色的，很厚，紙很好。正面印著：<\/p>\n<p class=\"doc\">松嶺療養院　院長　梁鶴年<\/p>\n<p>周遠把名片翻過來。<\/p>\n<p>背面有字。手寫的，藍色的鋼筆。字很漂亮，一筆一畫，像刻出來的。<\/p>\n<p class=\"doc\">那顆黑藥丸是管制藥，來路不明。妳室友被那個算命的控制了。拿走它，是在救她。<\/p>\n<p class=\"doc\">妳阿祖那裡，我會替妳多照顧。<\/p>\n<hr class=\"sep\">\n<p>周遠拿著那張名片，蹲在那裡，沒有動。<\/p>\n<p>何靜蹲在他旁邊，看著那幾行字。<\/p>\n<p>「林依每個月來看她阿祖。」何靜說，聲音很輕，「每一次要走的時候，院長室的秘書都會下來，請她上去坐一下。」<\/p>\n<p>周遠想起那份訪客紀錄。每一行的備註欄，警衛都寫同一句話。院長室會客。<\/p>\n<p>一個月一次。一年十二次。<\/p>\n<p>一個老先生，很客氣，很溫和，請她喝茶，問她阿祖最近好不好，問她在霧川住得習不習慣，問她室友是做什麼的。<\/p>\n<p>推一盒糖過去。<\/p>\n<p>吃一塊。對岸的。<\/p>\n<p>他想起手記裡那一行字。一個嘴饞的囡仔。一個沒人管的囡仔。<\/p>\n<p>林依不是七歲。可是她二十出頭，一個人顧著一個一百多歲、誰都不認得的阿祖，每個月上山一次，下山的時候，眼睛常常是紅的。<\/p>\n<p>鶴年看人，一眼就看到底。<\/p>\n<p>何靜看了一眼手錶。<\/p>\n<p>「三點二十一分。」她說，「還有十二分鐘。」<\/p>\n<p>周遠拿出手機，把名片的正面、背面、糖盒、行李箱，一樣一樣拍下來。拍完，他把名片放回盒子底下，把盒子放回衣服上面，拉上拉鍊，把行李箱推回原來的位置。<\/p>\n<p>他站起來的時候，看見天花板角落有一個小小的黑色半球。<\/p>\n<p>監視器。紅色的燈，亮著。<\/p>\n<p>他看著那顆紅燈。<\/p>\n<p>紅燈也看著他。<\/p>\n<hr class=\"sep\">\n<p>他們走回病房，往電梯的方向走。<\/p>\n<p>走到一半，何靜停下來。<\/p>\n<p>病房最裡面那一頭，靠牆的地方，還有一張床。<\/p>\n<p>周遠剛才沒有注意到它。它在藍光照不太到的角落，比其他的床更靠裡面一點，像是後來才加上去的。<\/p>\n<p>床是空的。<\/p>\n<p>床單是新的，白得發亮，摺得很整齊，四個角都塞進床墊底下。枕頭拍過了，很鬆，很軟。床頭的點滴架上，已經掛好了一袋點滴。<\/p>\n<p>黑色的。滿的。還沒有接上任何人。<\/p>\n<p>床頭插著一張空白的名牌卡。卡片上什麼都沒寫。<\/p>\n<p>何靜看著那張床。<\/p>\n<p>「這張，」她說，「是在等誰？」<\/p>\n<p>周遠沒有回答。<\/p>\n<p>遠處，電梯那邊，傳來一聲很輕的叮。<\/p>\n<p>他們跑。<\/p>\n<hr class=\"sep\">\n<p>電梯門開著。他們衝進去，門在身後關上。樓層燈整排是暗的，電梯往上走。<\/p>\n<p>過了一下，B2 的燈亮了。B1。一樓。<\/p>\n<p>門打開。一樓的走廊，日光燈，洗衣房的味道，推車停在牆邊。三點三十二分。<\/p>\n<p>何靜靠在不鏽鋼牆上，大口大口地喘氣。她的手在抖。她把手塞進白袍口袋裡，不讓它抖。<\/p>\n<p>「阿翔，」她說，「他每天早上都問我早餐是什麼。」<\/p>\n<p>周遠站在她旁邊。<\/p>\n<p>他想說點什麼。他想不出來有什麼話，是可以在這種時候說的。<\/p>\n<p>他伸手，很輕地，按了一下她的肩膀。<\/p>\n<p>何靜沒有動。過了一會兒，她把頭往他的手那邊，很輕很輕地，靠了一下。<\/p>\n<p>只有一下。然後她站直，把白袍拉好，走出電梯。<\/p>\n<p>「我去巡房。」她說，「五點半交班。你天亮以前走。」<\/p>\n<hr class=\"sep\">\n<p>周遠回到車上，天還沒亮。<\/p>\n<p>他坐在駕駛座，看著手機裡那幾張照片，一張一張翻過去。翻到名片背面那張，他停下來，放大。<\/p>\n<p>妳阿祖那裡，我會替妳多照顧。<\/p>\n<p>他撥了一個電話。<\/p>\n<p>響了很久。響到他以為不會有人接了，電話才通。<\/p>\n<p>「……周遠？」林依的聲音，很啞，剛被吵醒，「現在幾點？」<\/p>\n<p>「四點。」周遠說，「對不起。」<\/p>\n<p>「怎麼了？沈言……」<\/p>\n<p>「沈言沒事。」周遠說，「我想問妳一件事。」<\/p>\n<p>電話那頭安靜了。他聽見翻身的聲音，被子的聲音，然後是很輕的腳步聲，好像她下了床，走到別的地方，怕吵醒隔壁房間的人。<\/p>\n<p>「你問。」<\/p>\n<p>「妳每個月去松嶺看阿祖，」周遠說，「院長有沒有請妳上去坐過？」<\/p>\n<p>很長的安靜。<\/p>\n<p>長到周遠以為斷線了。<\/p>\n<p>「有。」林依說，「每次都有。他人很好。他會泡茶給我喝，問我阿祖的事，問我工作，問我室友。」<\/p>\n<p>她停了一下。<\/p>\n<p>「他給過我一盒糖。」她說，「很好吃。對岸的。我每次心情不好就吃一顆。」<\/p>\n<p>周遠閉上眼睛。<\/p>\n<p>「他說，」林依的聲音開始抖了，「他說沈言吃的那個藥，他看過，他是醫生，他說那種沒有標示的藥很可怕，吃久了人會被控制。他給我一張名片，說如果我需要幫忙，可以找他。」<\/p>\n<p>她吸了一口氣。<\/p>\n<p>「我一直以為，是我自己聽人家講的。」她說，「我跟你說，我跟先生說，我都說，我之前聽人家講過。我一直以為那個『人家』，是隨便一個什麼人。」<\/p>\n<p>周遠沒有說話。<\/p>\n<p>「周遠。」林依說。<\/p>\n<p>「嗯。」<\/p>\n<p>「我是不是，」她說，「被人家騙了？」<\/p>\n<p>天還是黑的。停車場那盞路燈底下，松林只看得見最前面一排。<\/p>\n<p>周遠想了一陣子，該怎麼回答這個問題。<\/p>\n<p>「妳那時候，」他最後說，「是想救她。」<\/p>\n<p>電話那頭，林依哭了出來。<\/p>\n<p>很小聲。悶悶的，像是用手摀著嘴，怕吵醒睡在隔壁房間的人。<\/p>\n<p>周遠握著電話，聽她哭。<\/p>\n<p>他沒有掛。<\/p>", "chars": 4167}, "55": {"title": "第五十五章　解聘", "html": "<p>B3 那一夜之後的隔天下午，何靜打電話來。那時候周遠正在局裡寫白石里的補充報告。<\/p>\n<p>「我被開除了。」她說。<\/p>\n<p>她的聲音很平，像在念一份檢驗報告。背景很安靜，有一點回音，好像她站在一個很空的地方。<\/p>\n<p>「什麼時候？」<\/p>\n<p>「十分鐘前。」何靜說，「人事室。院長沒有出現。人事主任跟護理長坐在對面，一人一份文件。」<\/p>\n<p>周遠把筆放下。<\/p>\n<p>「理由呢？」<\/p>\n<p>「三條。」何靜說，「第一，擅自進入院內非開放區域。第二，違反病歷調閱規範，在無醫療必要的情況下，大量查詢非本人負責之病人資料。第三，擅自調整排班，連續排定大夜班，影響院內人力調度。」<\/p>\n<p>她停了一下。<\/p>\n<p>「他們有監視器畫面。」她說，「B2 的走廊。我跟一個男人走進逃生門。畫面只拍到背影，他們沒有說那個男人是誰。」<\/p>\n<p>周遠沒有說話。<\/p>\n<p>「還有一件。」何靜說，「衛生局今天早上收到一封檢舉信，說我洩漏病人資料給非醫療人員，說我跟病人家屬有不當往來。他們會調查我的執照。」<\/p>\n<p>「病人家屬是誰？」<\/p>\n<p>「沒寫。」何靜說，「可是信裡附了一張照片。一九五四年林小滿的入院病歷。我在員工休息室給你看的那一份。照片的角度，是從休息室門口拍進去的。」<\/p>\n<p>周遠閉上眼睛。<\/p>\n<p>那天下午，他坐在員工休息室那張圓桌旁邊，看那份手寫的病歷。門是開著的。他記得。<\/p>\n<p>「我五點以前要交出識別證。」何靜說，「現在是一點四十。」<\/p>\n<p>「我上去。」<\/p>\n<p>「你不要上來。」何靜說，「你上來，他們就有名字了。」<\/p>\n<p>她停了一下。<\/p>\n<p>「可是我的東西很多。」她說，「一個人搬不完。」<\/p>\n<hr class=\"sep\">\n<p>他把車停在松嶺的停車場，熄火。<\/p>\n<p>何靜站在大門口，已經沒有穿白袍了。她穿著一件淺灰色的針織外套，頭髮綁得很緊，腳邊放著兩個紙箱。紙箱裡是書，是文件夾，是一個馬克杯，一盆很小的多肉植物，一個裝筆的筆筒。<\/p>\n<p>筆筒裡插著那枝筆。筆桿上，那張黃色的便利貼還捲在上面。<\/p>\n<p>B3。<\/p>\n<p>周遠走過去，彎腰搬起一箱。<\/p>\n<p>「還有一箱在樓上。」何靜說，「值班室。」<\/p>\n<p>「我去拿。」<\/p>\n<p>「我跟你去。」她說，聲音放低，「蔡姐在護理站等我們。」<\/p>\n<hr class=\"sep\">\n<p>蔡姐站在護理站的櫃台後面，假裝在整理病歷。<\/p>\n<p>她看見何靜，眼眶就紅了，可是她什麼都沒說。她從抽屜裡拿出一串鑰匙，放在櫃台上，推過來，推到何靜手邊。<\/p>\n<p>鑰匙串上掛著一個塑膠牌子，牌子上寫著兩個字：檔案。<\/p>\n<p>「我兩點去食飯。」蔡姐說，眼睛看著別的地方，「四點才轉來。鑰匙我放佇遮，我無看著啥人提去。」<\/p>\n<p>何靜看著那串鑰匙。<\/p>\n<p>「蔡姐——」<\/p>\n<p>「我佇遮做二十冬矣。」蔡姐說，「我知影啥物是醫生，啥物毋是。」<\/p>\n<p>她轉過身，拿起保溫杯，往員工休息室的方向走了。<\/p>\n<p>何靜站在那裡，看著她的背影。<\/p>\n<p>然後她把鑰匙拿起來，握在手裡。<\/p>\n<hr class=\"sep\">\n<p>檔案室在二樓走廊的另一頭，一扇很舊的木門，門上的漆剝得很厲害。何靜開了鎖，兩個人進去，周遠把門帶上，站在門邊。<\/p>\n<p>裡面很暗，很悶，有一股紙放久了的味道。一排一排的鐵櫃，從地板頂到天花板，每一格的抽屜上都貼著標籤，標籤上寫著年份。<\/p>\n<p>何靜沒有開大燈。她打開手機的手電筒，沿著鐵櫃一排一排看過去。<\/p>\n<p>「民國九十八年以前的轉介單，」她說，「都在這裡。紙本的。」<\/p>\n<p>她找到了。轉介登記簿，一年一本，硬殼的，綠色封面，用細麻繩串起來。<\/p>\n<p>她從最近的一本開始往回翻。民國九十七年。九十六年。九十五年。<\/p>\n<p>她翻得很快。她知道自己要找什麼。轉介醫師簽名那一欄，那一團糾在一起的筆畫，證號那一欄，空白。<\/p>\n<p>民國九十三年。一個海邊的村子，九個人不見，一個倖存者。<\/p>\n<p>民國八十九年。山裡的一個礦工聚落。<\/p>\n<p>民國八十五年。<\/p>\n<p>何靜翻到那一頁，手停住了。<\/p>\n<p>「三十年。」她說。<\/p>\n<p>她拿手機一頁一頁拍。周遠站在門邊，聽著走廊上的動靜，聽著自己的心跳。<\/p>\n<p>電子系統十七年，十一場。紙本十三年，六場。<\/p>\n<p>十七場。<\/p>\n<p>每一場，轉介單上都是同一個簽名。<\/p>\n<p>三十年前的那一團，跟三十年後的那一團，一模一樣。墨水的顏色不一樣，紙的顏色不一樣，可是那一筆一筆糾在一起的方式，每一個轉彎，每一個打結的地方，都一模一樣。<\/p>\n<p>一個人的字，三十年不會一點都不變。<\/p>\n<p>除非那個人，三十年都沒有變。<\/p>\n<hr class=\"sep\">\n<p>何靜拍完最後一頁，把登記簿放回去。<\/p>\n<p>她沒有走。她站在另一排鐵櫃前面，手電筒的光照在一個標籤上。<\/p>\n<p class=\"doc\">病歷・已出院・民國一一五年<\/p>\n<p>她拉開抽屜，手指在一排病歷夾上滑過去，停在其中一本。<\/p>\n<p>沈言。<\/p>\n<p>她把病歷夾抽出來，翻開，翻到很後面。護理紀錄單。一張一張，每一張是一個晚上，每三十分鐘一格，每一格裡是值班護理師的字。<\/p>\n<p>她翻到某一張，停住。<\/p>\n<p>周遠走過去。<\/p>\n<p>那一晚的日期，他記得。福星旅社。三〇七號房。停電。鏡子。他開的那一槍。<\/p>\n<p>紀錄單上，從二十一點開始，一格一格往下：在床，睡眠中。在床，睡眠中。在床，睡眠中。<\/p>\n<p>零點三十分那一格，也是在床，睡眠中。<\/p>\n<p>一點那一格，不一樣。<\/p>\n<p>那一格裡的字，被人用一條很直的線劃掉了。劃得很整齊，像用尺比著劃的。劃掉的字還看得見，是另一個人的筆跡，比較圓，比較急，寫得歪歪的：<\/p>\n<p class=\"doc\">接獲警方來電，查看病人。雙足底有泥，量多。已告知來電者。<\/p>\n<p>劃線的旁邊，用另一種墨水，重新寫了一行：<\/p>\n<p class=\"doc\">在床，睡眠中。<\/p>\n<p>再旁邊，是更正簽名。<\/p>\n<p>一團糾在一起的筆畫，然後一筆往右下拉，拉得很長，拉出了格子，拉到紀錄單的邊緣。<\/p>\n<p>一筆拉到底。<\/p>\n<p>何靜看著那一行字。看著那個簽名。<\/p>\n<p>「我那天早上去看她，」她說，聲音很輕，「她的腳是乾淨的。我還摸了一下。很乾淨，很軟，像剛洗過。」<\/p>\n<p>她把紀錄單翻到下一張。<\/p>\n<p>六點那一格。值班護理師的字，跟一點那一格劃掉的那幾個字，同一個筆跡，圓的，急的：<\/p>\n<p class=\"doc\">院長室人員到病房，表示協助病人清潔。護理師依指示離開病房。<\/p>\n<p>這一格沒有被劃掉。<\/p>\n<p>也許是忘了。也許是覺得不重要。<\/p>\n<p>何靜站在那裡，很久沒有動。<\/p>\n<p>「那天值班的是阿芬。」她說，「她下個月就辭職了。說要去台北。我還幫她辦了歡送會。」<\/p>\n<p>她把病歷夾闔上，抱在胸口。<\/p>\n<p>「我跟督察室說，」她說，「病人的雙足是乾淨的。我是親眼看到的。我簽了名。」<\/p>\n<p>周遠看著她。<\/p>\n<p>「他們就是要妳這樣說。」他說，「妳說的是實話。」<\/p>\n<p>何靜低著頭。<\/p>\n<p>「我說的是實話。」她說，「所以他們才找我說。」<\/p>\n<hr class=\"sep\">\n<p>她把那幾張紀錄單拍了下來。拍完，把病歷夾放回原位，抽屜推回去，推到底。<\/p>\n<p>三點五十分，他們離開檔案室。何靜鎖上門，把鑰匙放回護理站的櫃台上，放在蔡姐剛才放的那個位置，一公分都沒有差。<\/p>\n<p>四點零五分，蔡姐從員工休息室走回來。她看了一眼櫃台上的鑰匙，什麼都沒說，把它收回抽屜裡。<\/p>\n<p>然後她走出櫃台，抱住何靜。<\/p>\n<p>抱得很用力。<\/p>\n<p>「妳是好醫生。」蔡姐說，在何靜的耳朵邊，用很小的聲音，「我做二十冬，看過足濟醫生。妳是好的。」<\/p>\n<p>何靜沒有哭。她讓蔡姐抱著，雙手垂在身體兩邊，過了一會兒，才慢慢地抬起來，抱回去。<\/p>\n<hr class=\"sep\">\n<p>走廊那頭，七號房的門開著。<\/p>\n<p>龔伯坐在床上，看著他們。他的手放在膝蓋上，沒有指地板。他看了何靜一陣子，然後抬起一隻手，很慢地，揮了兩下。<\/p>\n<p>像在說再見。<\/p>\n<p>又像在說，快走。<\/p>\n<hr class=\"sep\">\n<p>四點五十分，何靜在人事室交出識別證。<\/p>\n<p>周遠在停車場等她。兩個紙箱已經放進他的後車廂了，還有那盆很小的多肉植物，他把它放在副駕駛座的腳邊，用一件外套墊著，怕它倒。<\/p>\n<p>何靜走出大門。<\/p>\n<p>她站在台階上，回頭看了一眼那棟灰白色的四層樓。看了一下，就轉回來，走下台階。<\/p>\n<p>她坐進副駕駛座，低頭看見腳邊那盆多肉。<\/p>\n<p>「你幹嘛把它放在這裡？」<\/p>\n<p>「怕它倒。」<\/p>\n<p>何靜看著他。<\/p>\n<p>然後她笑了一下。很短，很輕，好像今天第一次。<\/p>\n<p>周遠發動車子，開出停車場，開上那條兩邊都是松樹的產業道路。他沒有看後照鏡。<\/p>\n<p>何靜拿出手機，撥了一個號碼。<\/p>\n<p>響了兩聲，接通了。<\/p>\n<p>「媽。」何靜說。<\/p>\n<p>電話那頭的聲音很大，周遠坐在旁邊都聽得見。何媽媽在問她吃了沒，在問她今天幾點下班，在問她週末要不要回來，滷了豬腳。<\/p>\n<p>「媽，」何靜說，「我明天開始，放長假。」<\/p>\n<p>電話那頭停了一下。<\/p>\n<p>然後何媽媽的聲音傳過來，很大，很高興，一點都沒有問為什麼。<\/p>\n<p>「好啊！」何媽媽說，「山上那麼冷，早就該下來了。」<\/p>\n<p>何靜把手機拿遠一點，看著窗外一棵一棵往後退的松樹。<\/p>\n<p>她的眼睛紅了。<\/p>\n<p>可是她一直在笑。<\/p>", "chars": 3093}, "56": {"title": "第五十六章　那四個", "html": "<p>老張是在茶水間攔住他的。<\/p>\n<p>他手上拿著一個牛皮紙袋，另一隻手端著一杯泡麵，麵還沒泡開，蓋子用一根原子筆壓著。他看了一眼走廊兩頭，把周遠拉進茶水間，把門帶上。<\/p>\n<p>「你看一下這個。」老張說。<\/p>\n<p>牛皮紙袋裡是四張表格。撤回失蹤人口協尋申請書。一式四份，同一天送到局裡，同一個時間，一張疊一張，連釘書針釘的位置都一樣。<\/p>\n<p>申請人的名字，周遠一個一個看過去。<\/p>\n<p>陳志雄的太太。劉金生的兒子。吳添丁的女兒。張金水的太太。<\/p>\n<p>撤回原因那一欄，四張寫的都是同一句話，字跡不一樣，句子一模一樣：<\/p>\n<p class=\"doc\">當事人已尋獲，目前於安養機構接受照顧，家屬意願不受打擾。<\/p>\n<p>「哪一間安養機構？」周遠問。<\/p>\n<p>「沒寫。」老張說，「我一個一個打電話去問。四家，四個人接，講的話都一樣。說人找到了，在一個很好的地方，有人照顧，叫我們不要再查了。我問在哪裡，他們說不方便講。我問可不可以讓我們去看一眼，確認一下，他們說不用。」<\/p>\n<p>他把泡麵的蓋子掀開，看了一眼，又蓋回去。<\/p>\n<p>「陳志雄做過兩任里長，霧川誰都認得他。他太太，」老張說，「我去她組合屋找她。她不讓我進門。隔著紗門跟我講話，一直在哭。我問她哭什麼，她說高興。」<\/p>\n<p>他停了一下。<\/p>\n<p>「她手上戴著一只新的金手環。很粗。組合屋門口停了一台新的機車。」<\/p>\n<p>周遠看著那四張表格。<\/p>\n<p>「還有這個。」老張從紙袋底下又抽出一張紙，是一張收據的影本，「陳志雄太太不讓我進門，可是她的垃圾放在門口。我翻了一下。」<\/p>\n<p>周遠看了老張一眼。<\/p>\n<p>「我知道。」老張說，「不要問。」<\/p>\n<p>收據是一間基金會開的。慰問金，新台幣十萬元整。基金會的名字很長，周遠沒聽過，最後四個字是：仁濟慈善。<\/p>\n<p>地址那一欄，是松嶺的地址。<\/p>\n<hr class=\"sep\">\n<p>「白石里的案子是我的。」老張說，「霧川這四個，也是我的。」<\/p>\n<p>他把紙袋收回去，夾在腋下。<\/p>\n<p>「大隊長叫我不要給你看。」他說，「他說你頭髮已經白一半了，不要再讓你操心。」<\/p>\n<p>周遠沒有說話。<\/p>\n<p>「我跟大隊長說，」老張說，「周遠的頭髮是為了誰白的，局裡每個人都知道。他不看，誰看？」<\/p>\n<p>他拿起那碗泡麵，終於泡開了。他掀開蓋子，吸了一口，燙得皺眉。<\/p>\n<p>「我女兒今年考大學。」他說，嘴裡還有麵，「我想等她考完再退休。所以有些事，我只能做到這裡。」<\/p>\n<p>他打開茶水間的門，走出去了。<\/p>\n<hr class=\"sep\">\n<p>那天晚上九點多，蔡姐打電話來。<\/p>\n<p>周遠不知道她怎麼有他的號碼。後來才想到，是何靜給的。<\/p>\n<p>「周先生，」蔡姐的聲音壓得很低，背景有推車的聲音，有人在走廊上叫床號，「你敢有閒？」<\/p>\n<p>「有。」<\/p>\n<p>「我欲共你講一件代誌。」她說，「你莫共何醫師講是我講的。伊這陣已經夠艱苦矣。」<\/p>\n<p>「好。」<\/p>\n<p>蔡姐停了一下。他聽見她換了一個地方，走廊的聲音不見了，變成很小的、有回音的空間。<\/p>\n<p>「我昨暗，」她說，「十點交班，我去洗衫間提被單。洗衫間佇彼台貨梯邊仔。」<\/p>\n<p>「嗯。」<\/p>\n<p>「電梯門開。」蔡姐說，「我想講是送餐的。結果，入面徛四个查埔人。穿看護的衫，白的。推一台車，欲來提被單。」<\/p>\n<p>周遠握著手機的手，慢慢收緊。<\/p>\n<p>「伊四个，」蔡姐說，「我攏無看過。我佇遮做二十冬，啥人來啥人去，我攏知。這四个，我毋捌看過。」<\/p>\n<p>她吸了一口氣。<\/p>\n<p>「毋過，我捌看過伊的面。」她說，「佇報紙頂懸。霧川彼四个，無揣著的。報紙有刊相片。」<\/p>\n<hr class=\"sep\">\n<p>周遠十點前到了松嶺。<\/p>\n<p>蔡姐在側門等他。她穿著護理師的制服，外面套了一件深藍色的毛線外套，手上拿著一串鑰匙，站在門邊的陰影裡，看見他的車燈就揮了一下手。<\/p>\n<p>「你頭髮，」她第一句話就說，「何醫師有共我講。」<\/p>\n<p>周遠沒有接話。<\/p>\n<p>「伊講你是為著別人白的。」蔡姐說，「我活六十幾冬，看過足濟人頭毛白，攏是為著家己。」<\/p>\n<p>她打開側門，讓他進去。<\/p>\n<p>「十點交班。」她說，「伊會上來提被單。我共你囥佇洗衫間，你莫出聲。」<\/p>\n<hr class=\"sep\">\n<p>洗衣房很熱。<\/p>\n<p>一整排大型的滾筒洗衣機，有兩台還在轉，轟轟轟的，熱氣從機器的縫裡冒出來，空氣裡全是漂白水跟柔軟精混在一起的味道。牆邊堆著一疊一疊折好的被單，白的，藍的，淺綠的。<\/p>\n<p>洗衣房的門是一扇推拉門，門上有一塊玻璃，從玻璃看出去，正好看得見走廊另一邊那台貨梯的灰綠色門。<\/p>\n<p>周遠站在門後面，看著那扇電梯門。<\/p>\n<p>九點五十八分。<\/p>\n<p>樓層燈那一排是暗的。不是一樓亮著，不是 B1 亮著，不是 B2 亮著。整排都是暗的。<\/p>\n<p>電梯不在任何一層。<\/p>\n<p>九點五十九分。<\/p>\n<p>十點整。<\/p>\n<p>B2 的燈，亮了。<\/p>\n<p>然後是 B1。然後是一樓。<\/p>\n<p>叮。<\/p>\n<p>電梯門打開。<\/p>\n<hr class=\"sep\">\n<p>四個男人。<\/p>\n<p>穿著一樣的白色看護服，短袖，胸口一個口袋。下面是白色的長褲，白色的布鞋。他們推著一台空的布草車，從電梯裡走出來，走得很慢，很整齊，像一個人被複製了四次。<\/p>\n<p>最前面的那一個，很壯，脖子很粗，看護服的領口被撐得緊緊的。<\/p>\n<p>周遠認得那個脖子。<\/p>\n<p>背面的石階上，那個退到芒草邊、背對著所有人的男人。一百年前的代誌，關我啥代？<\/p>\n<p>陳志雄。<\/p>\n<p>他後面的那一個，戴著一副老花眼鏡，鏡片很厚，眼鏡掛在鼻尖上，從鏡片上面看路。鎮公所退休的會計。我家己的帳攏算袂清矣。<\/p>\n<p>劉金生。<\/p>\n<p>再後面那一個，腰是彎的，走路的時候一隻手按著後腰，好像那裡一直在痛。開了三十年計程車，一天十二個鐘頭。我啥人都毋欠。<\/p>\n<p>吳添丁。<\/p>\n<p>最後面那一個，瘦，矮，頭髮梳得很整齊，抹了油。在縣城開建材行的。阮這代逐年嘛有捐廟。欠啥？<\/p>\n<p>張金水。<\/p>\n<p>他們推著布草車，從電梯走到洗衣房門口，停下來。<\/p>\n<p>周遠退到門後面，退到一台滾筒洗衣機的旁邊。<\/p>\n<p>推拉門被推開了。<\/p>\n<hr class=\"sep\">\n<p>陳志雄第一個走進來。<\/p>\n<p>他走到牆邊那疊被單前面，彎腰，抱起一疊，轉身，放進布草車裡。動作很順，很穩，好像他做這件事已經做了很多年。<\/p>\n<p>周遠站在洗衣機旁邊，離他不到三步。<\/p>\n<p>他看見陳志雄的臉。<\/p>\n<p>眼睛半閉著。不是睡著的那種閉，是那種很睏、可是還在走路的人的閉，上眼皮垂下來，蓋住一半的眼珠，底下露出一條細細的白。<\/p>\n<p>嘴角是往上翹的。<\/p>\n<p>在笑。<\/p>\n<p>很淡，很輕，像一個人在做一個很好的夢，夢到一半，嘴角自己翹起來，自己都不知道。<\/p>\n<p>周遠見過這個笑。<\/p>\n<p>霧川的監視器畫面裡，兩百多個人跳著舞走上後山，每一張臉都是這樣笑的。一九三一年的霧川渡，十幾戶被敲過門的人家，死在床上，每一個人的嘴角都是這樣翹著的。<\/p>\n<p>陳志雄抱起第二疊被單。<\/p>\n<p>周遠看見他胸口那個口袋。口袋上別著一個名牌。白色的塑膠，長方形的，醫院裡每個員工都會別的那種。<\/p>\n<p>名牌上是空白的。<\/p>\n<p>不是沒有印。周遠在 B3 看過這種空白。塑膠的表面霧霧的，像有人用橡皮擦，一點一點，把上面的字擦掉了。<\/p>\n<hr class=\"sep\">\n<p>劉金生和吳添丁也進來了，一人抱一疊被單，放進車裡。張金水站在門口，扶著布草車，沒有動。<\/p>\n<p>周遠看著他們四個。<\/p>\n<p>他們的手。陳志雄的手很粗，手背上有一道很舊的疤；劉金生的手很白，指甲剪得很短；吳添丁的手指頭有菸燻的黃；張金水的手上戴著一只玉戒指。<\/p>\n<p>四雙手，手指的皮，全部都是皺的。<\/p>\n<p>白白的，皺皺的，一條一條，像在水裡泡了很久很久的手。<\/p>\n<p>跟邱永福那天晚上，站在他家玄關的毛巾上，捧著熱茶不敢喝的那雙手，一模一樣。<\/p>\n<p>周遠張開嘴。<\/p>\n<p>「陳志雄。」<\/p>\n<p>他的聲音不大。在洗衣機轟轟轟的聲音裡，幾乎聽不見。<\/p>\n<p>陳志雄停住了。<\/p>\n<p>他抱著一疊被單，停在布草車旁邊，停了一秒，兩秒。他的頭很慢很慢地轉過來，轉向周遠站的地方。<\/p>\n<p>半閉的眼睛，看著他。<\/p>\n<p>裡面什麼都沒有。<\/p>\n<p>不是不認得。是那裡面，根本沒有一個可以認得人的東西。像一間很大的房子，門開著，燈開著，家具都在，可是沒有人住。<\/p>\n<p>周遠又叫了一次。<\/p>\n<p>「陳志雄。」<\/p>\n<p>在背面，他叫邱永福叫了兩次，邱永福就把手放下來了。叫林秀枝，林秀枝就哭了。叫廟公，廟公就說，毋是我。<\/p>\n<p>名字叫出來，人就會回來。<\/p>\n<p>陳志雄的嘴唇動了。<\/p>\n<p>很慢，很輕，像一台很老的收音機，轉到一個快要收不到的頻道，斷斷續續地，漏出一句話。<\/p>\n<p>「……關我……啥代……」<\/p>\n<p>然後他轉回去，把那疊被單放進布草車裡。<\/p>\n<p>周遠站在那裡，手心全是汗。<\/p>\n<p>他想起那艘黑色的船。兩個很高的人，手伸進水裡，把四塊還有細線的鐵牌撈起來，放進黑布袋裡，順著水漂走了。<\/p>\n<p>名字不在了。<\/p>\n<p>叫什麼，都沒有用了。<\/p>\n<hr class=\"sep\">\n<p>被單裝滿了。<\/p>\n<p>四個人推著布草車，走出洗衣房，走回那台灰綠色的電梯。周遠跟到門邊，從推拉門的玻璃看出去。<\/p>\n<p>他們走進電梯，排成一排，面朝外站好。陳志雄，劉金生，吳添丁，張金水。四張臉，四雙半閉的眼睛，四個翹起來的嘴角。<\/p>\n<p>電梯門開始關。<\/p>\n<p>關到一半的時候，張金水抬起頭。<\/p>\n<p>不是轉頭，是抬頭。他的眼睛還是半閉著，可是他的臉，正正地對著洗衣房的那扇推拉門，對著門上那塊玻璃，對著玻璃後面的周遠。<\/p>\n<p>他的嘴唇動了。<\/p>\n<p>聲音很小，很平，像在念一張別人寫好的紙條。電梯門還沒關上，那句話剛好從那條縫裡擠出來，穿過走廊，穿過那塊玻璃，落進周遠的耳朵裡。<\/p>\n<p>「院長講，」張金水說，「你嘛會來。」<\/p>\n<p>電梯門關上了。<\/p>\n<p>樓層燈亮了一下。一樓。B1。B2。<\/p>\n<p>然後整排都暗了。<\/p>", "chars": 3372}, "57": {"title": "第五十七章　拾遺會", "html": "<p>何媽媽家的餐桌，被紙淹掉了。<\/p>\n<p>周遠進門的時候，何靜坐在桌子的一頭，頭髮用一枝原子筆盤起來，戴著一副他沒見過的黑框眼鏡，身上是一件洗到起毛球的大學運動服。桌上攤滿了列印出來的紙，一疊一疊，用不同顏色的迴紋針夾著，有的邊上貼著便利貼，有的用螢光筆畫得滿滿的。<\/p>\n<p>十七疊。<\/p>\n<p>何媽媽在廚房。她探頭出來，看見周遠，眼睛一亮。<\/p>\n<p>「周先生來了！」她說，「坐，坐。我在搓湯圓。冬至快到了，我先搓起來冰。你吃紅的還是白的？」<\/p>\n<p>「都可以。」<\/p>\n<p>「那就都吃。」何媽媽說，縮回廚房去了。<\/p>\n<p>何靜從眼鏡上面看他一眼。<\/p>\n<p>「她從我回來那天開始，」何靜說，「每天都在煮東西。我說媽我不是去坐牢。她說，坐牢出來的人才不用補。」<\/p>\n<p>周遠笑了一下，拉開椅子坐下。<\/p>\n<hr class=\"sep\">\n<p>「我找到一樣東西。」何靜說。<\/p>\n<p>她從十七疊紙裡，每一疊都抽出一張，排成一列。十七張轉介單的影本，三十年，從泛黃的手寫到電腦列印，紙的大小都不一樣。<\/p>\n<p>「轉介醫師那一欄，你已經看過了。」她說，「同一團。」<\/p>\n<p>她用筆尖點了一下每張單子的右下角。<\/p>\n<p>「你看這裡。」<\/p>\n<p>那是一個小小的欄位，很多人填表的時候根本不會注意。<strong>費用負擔<\/strong>。<\/p>\n<p>十七張，每一張，那一欄都蓋著同一個章。紅色的，長方形，章裡面兩行小字。最舊的幾張蓋得歪歪的、印泥暈開了；最新的幾張很清楚。<\/p>\n<p class=\"doc\">財團法人仁濟慈善基金會<br>全額補助<\/p>\n<p>「老張給你看的那張收據，」何靜說，「也是這個。」<\/p>\n<p>周遠點點頭。<\/p>\n<p>「所以我去查了這個基金會。」何靜說，「財團法人，要登記，法院的登記資料誰都可以查。我花了一個下午。」<\/p>\n<p>她把一張列印出來的網頁推過來。<\/p>\n<p class=\"doc\">財團法人仁濟慈善基金會<br>設立登記：民國八十年<br>董事長：梁鶴年<\/p>\n<p>下面是董事名單。七個名字。<\/p>\n<p>何靜一個一個用螢光筆畫過了，在名字旁邊寫小字。<\/p>\n<p class=\"doc\">蕭○○　大廟主委。<br>林○○　縣議員，第三屆起連任至今。<br>黃○○　縣府地政處，前科長，已退休。<br>鄭○○　○○建設董事長。<br>吳○○　○○營造董事長。<br>陳○○　前縣議會議長，已歿，由其子繼任董事。<\/p>\n<p>「這幾個人，」何靜說，「我都認得。」<\/p>\n<p>周遠抬頭看她。<\/p>\n<p>「不是在新聞上。」何靜說，「是在三樓。」<\/p>\n<hr class=\"sep\">\n<p>松嶺的三樓，周遠沒有去過。何靜說，那是 VIP 病房。單人房，有沙發，有電視，有家屬陪睡的床。走廊鋪地毯，護理師另外配。<\/p>\n<p>「林議員的媽媽，在三樓住了十一年。」何靜說，「失智。我查過房。林議員每個月來一次，每次都帶一盒很貴的水果。他很客氣，會跟護理師說謝謝。」<\/p>\n<p>「蕭主委的太太，住了七年。鄭董的爸爸，住了快二十年，前年才走。黃科長的哥哥。吳董的女兒，二十幾歲，我不知道是什麼病，病歷是院長室直接管的，我們看不到。」<\/p>\n<p>她把筆放下。<\/p>\n<p>「我一直以為，」她說，「這些人選松嶺，是因為松嶺好。山上安靜，空氣好，院長很有名。」<\/p>\n<p>「現在呢？」<\/p>\n<p>何靜沒有直接回答。她翻開另一疊紙。<\/p>\n<p>「基金會設立登記是民國八十年。」她說，「可是我去調了更早的資料。民國八十年以前，這個基金會有一個前身。不是財團法人，是人民團體，登記在縣政府社會科。民國七十三年成立。」<\/p>\n<p>她把那張紙推過來。<\/p>\n<p>是一份很舊的立案證書影本。字是用打字機打的，有幾個字打歪了。<\/p>\n<p class=\"doc\">人民團體名稱：拾遺會<br>宗旨：拾人所遺，濟人所困<br>會址：松嶺療養院內<br>負責人：梁鶴年<\/p>\n<p>周遠看著那三個字。<\/p>\n<p>拾遺會。<\/p>\n<p>「民國七十三年。」何靜說，「一九八四年。」<\/p>\n<hr class=\"sep\">\n<p>何媽媽端著兩碗湯圓出來，看見桌上的紙，皺了皺眉頭，把碗放在紙比較少的那一角。<\/p>\n<p>「先吃。」她說，「冷了就不好吃了。」<\/p>\n<p>周遠低頭看那碗湯圓。紅的白的混在一起，湯是甜的，薑味很重。<\/p>\n<p>他吃了一顆。<\/p>\n<p>很甜。他一直說自己不吃甜的，可是這一顆，他吃完了。<\/p>\n<p>何媽媽坐在旁邊，沒有走，看著他們吃。看著看著，她伸手，把何靜盤頭髮的那枝原子筆抽出來，讓她的頭髮散下來，然後用手指替她把頭髮梳順。<\/p>\n<p>何靜沒有躲。<\/p>\n<p>「媽，」她說，「我在工作。」<\/p>\n<p>「妳在我家餐桌上工作，」何媽媽說，「就要照我家的規矩。」<\/p>\n<p>她梳完了，站起來，回廚房去了。<\/p>\n<p>何靜低著頭，吃湯圓，吃得很慢。<\/p>\n<hr class=\"sep\">\n<p>「還有一件事。」何靜吃完，把碗推到一邊，「我想不通。」<\/p>\n<p>她把十七張轉介單重新排了一次，這次照時間順序。<\/p>\n<p>「我手上只有近一年的訪客紀錄，」她說，「就是我上次從警衛室偷印的那一份。三十年的，我拿不到。可是近一年，有一場。」<\/p>\n<p>她抽出白石里那一疊。<\/p>\n<p>「白石里出事前九天，三樓的訪客紀錄裡，這幾個董事，同一天下午，一起來。不是來看家人。警衛的備註欄寫的是——」<\/p>\n<p>「院長室會客。」周遠說。<\/p>\n<p>何靜看著他。<\/p>\n<p>「林依的訪客紀錄上，也是這四個字。」周遠說。<\/p>\n<p>何靜點點頭。<\/p>\n<p>「一場，」她說，「我只能證明一場。可是我猜，十七場都一樣。每一場之前，他們都在院長室開會。開完會，一個禮拜到十天，某個地方就有人敲門。」<\/p>\n<p>她把手放在那十七張紙上面。<\/p>\n<p>「然後，」她說，「每一場之後，大概一兩天，大廟就會派人去那裡做法會。說是主委夢見的，夢見那裡有冤。」<\/p>\n<p>周遠想起羅振邦推過來的那張照片。白石里，清晨六點，派出所的人還沒到，穿黃道袍的人已經在擺香案了。<\/p>\n<p>「主委夢見的，」周遠說，「是開會開出來的。」<\/p>\n<hr class=\"sep\">\n<p>晚上八點半，他們到了大廟。<\/p>\n<p>大廟在縣城的舊市區中心，三進的廟，屋頂的剪黏又高又密，金色的、紅色的，在夜裡被燈照得亮晃晃的。廟埕很大，停滿了機車，賣香的、賣金紙的、賣香腸的攤子排了一整排。<\/p>\n<p>今天是農曆初十。<\/p>\n<p>何靜說，大廟每逢初十、二十、三十的晚上，正殿會開放問事。九點開始。來的人很多，有人問工作，有人問姻緣，有人問家裡的老人家什麼時候會走。<\/p>\n<p>他們跟著人群走進正殿。<\/p>\n<p>正殿裡擠滿了人，香煙很濃，濃到眼睛發酸。神案前面擺著一張長桌，長桌後面坐著一個六十幾歲的男人，戴金框眼鏡，頭髮梳得油亮，手上拿著一枝毛筆，面前攤著一本很厚的簿子。<\/p>\n<p>「蕭主委。」何靜在他耳邊說，聲音很低，「他太太在三樓。」<\/p>\n<p>主委旁邊站著一個年輕人，三十出頭，穿著一件很舊的白汗衫，赤腳，臉色很白，眼睛下面兩塊很深的青。<\/p>\n<p>新的乩童。<\/p>\n<p>周遠看著他。龔伯當了四十年。四十年，嘴巴一直不是自己的。這個年輕人，才剛開始。<\/p>\n<hr class=\"sep\">\n<p>九點差五分。<\/p>\n<p>正殿後面，傳來一個聲音。<\/p>\n<p>很小，很遠，隔著一道牆。<\/p>\n<p>胡琴。<\/p>\n<p>一個音，一個音，往上跳。輕快的，黏的，甜的。像一顆糖在嘴裡滾。<\/p>\n<p>周遠全身的毛都豎起來了。<\/p>\n<p>他轉頭看何靜。<\/p>\n<p>何靜的臉一下子白了。她站在那裡，一動也不動，嘴唇微微張著，像被什麼東西從背後打了一下。<\/p>\n<p>這是她的搖籃曲。阿嬤在她床邊唱，媽媽在她床邊唱。一個囡仔教給她高祖的歌。<\/p>\n<p>可是這不是她聽過的樣子。這是原本的樣子。快的，甜的，一點都沒有慢下來。<\/p>\n<p>「後殿。」周遠低聲說，「錄音帶。」<\/p>\n<p>何靜沒有回答。她的手伸過來，抓住他的袖子，抓得很緊。<\/p>\n<hr class=\"sep\">\n<p>胡琴拉完了。<\/p>\n<p>正殿裡很安靜。幾十個人站著，香煙在燈底下慢慢地轉。<\/p>\n<p>那個年輕的乩童，開始發抖。<\/p>\n<p>先是手，然後是肩膀，然後是整個身體。他的頭往後仰，喉嚨裡發出一種很低很低的聲音，像一頭牛在很遠的地方叫。他的眼睛翻上去，只剩眼白。<\/p>\n<p>然後他開口了。<\/p>\n<p>不是他的聲音。<\/p>\n<p>那個聲音很老，很平，很冷，像一個人在念一張帳單。每一個字都咬得很清楚，台語，可是是很古老的那種台語，有幾個字周遠聽不懂。<\/p>\n<p>「霧川之帳，」那個聲音說，「尾數未清。」<\/p>\n<p>主委手上的毛筆動了。他在簿子上寫字，寫得很快。<\/p>\n<p>「宿主一名，」那個聲音說，「猶在人間。」<\/p>\n<p>周遠的手指，一根一根地，收緊了。<\/p>\n<p>「在海之墘。」<\/p>\n<p>主委寫完，抬起頭，往正殿裡看了一圈。<\/p>\n<p>他的眼睛，在人群裡停了一下。<\/p>\n<p>停在周遠的臉上。<\/p>\n<p>然後移開了，好像什麼都沒看見。<\/p>\n<p>乩童的身體猛地一軟，往前倒，被兩個廟裡的人扶住了，扶到後面去。主委把毛筆放下，闔上簿子，對著人群笑了一下，很和氣，很客氣。<\/p>\n<p>「好，」他說，「今仔日問事開始。第一號。」<\/p>\n<hr class=\"sep\">\n<p>他們走出大廟的時候，九點二十分。<\/p>\n<p>廟埕上，賣香腸的攤子在烤香腸，油滴在炭上，滋滋地響。一個小孩子拿著一根糖葫蘆，跑過他們身邊，被他媽媽在後面喊。<\/p>\n<p>何靜一直走到停車場，才放開他的袖子。<\/p>\n<p>她打開車門，坐進副駕駛座，關上門，坐在那裡，看著擋風玻璃外面那座燈火通明的廟。<\/p>\n<p>「海之墘。」她說。<\/p>\n<p>「嗯。」<\/p>\n<p>「海尾。」<\/p>\n<p>周遠沒有說話。他拿出手機，撥了林依的電話。<\/p>\n<p>響了兩聲就接了。背景很吵，有冰塊撞在塑膠杯裡的聲音，有人在喊「一杯冬瓜檸檬去冰」。<\/p>\n<p>「周遠？」林依說，「你等一下，我在收攤。」<\/p>\n<p>「沈言在哪裡？」<\/p>\n<p>「在樓上啊。在洗澡。」林依說，「怎麼了？」<\/p>\n<p>周遠看著擋風玻璃外面那座廟。屋頂上的剪黏，金色的龍，在燈底下張著嘴。<\/p>\n<p>「今天晚上，」他說，「門鎖好。」<\/p>\n<p>電話那頭安靜了一下。<\/p>\n<p>然後林依笑了。是那種很努力讓自己聽起來輕鬆的笑。<\/p>\n<p>「好啦。」她說，「我知道。三下才開，對不對？」<\/p>\n<p>「兩下也不要開。」周遠說，「誰敲都不要開。我明天一早過去。」<\/p>\n<p>林依沒有笑了。<\/p>\n<p>「好。」她說，「我知道了。」<\/p>\n<p>她掛了電話。<\/p>\n<p>何靜轉過頭來看他。<\/p>\n<p>「他看見你了。」她說，「主委。」<\/p>\n<p>「我知道。」<\/p>\n<p>「他沒有叫人來趕你。」<\/p>\n<p>「嗯。」<\/p>\n<p>「為什麼？」<\/p>\n<p>周遠把手機放下，發動車子。<\/p>\n<p>他想起院長室裡那罐麥芽糖。想起那隻很乾、很涼、很老的手。想起那句很輕很輕的話。你身上，有我師弟的味道。<\/p>\n<p>「因為他們不怕我知道。」他說。<\/p>", "chars": 3536}, "58": {"title": "第五十八章　獨葬", "html": "<p>海尾的早上，風很大。<\/p>\n<p>周遠到的時候，林依已經在拉鐵捲門了。鐵捲門拉到一半卡住，她踮著腳，兩隻手抓著門的下緣，往上推，推了兩下，推不動。周遠走過去，一隻手幫她頂上去。<\/p>\n<p>「謝謝。」林依說。她的眼睛底下有黑眼圈。<\/p>\n<p>「昨天晚上，」周遠說，「有人敲門嗎？」<\/p>\n<p>「沒有。」林依說，「我一整個晚上都沒睡。沒有人敲。巷子裡連貓都沒有。」<\/p>\n<p>她轉身，朝樓上喊了一聲。<\/p>\n<p>「沈言，他來了。」<\/p>\n<p>沈言從樓梯走下來，穿著漁會的藍背心，手上拿著一杯剛泡好的茶。她把茶放在吧台上，推給周遠，然後在吧台另一邊坐下來。<\/p>\n<p>「林依說，」沈言說，「大廟有人在說我。」<\/p>\n<p>周遠沒有瞞她。他把昨天晚上的事，從頭講了一遍。後殿的胡琴，乩童翻白的眼睛，那句很老很冷的台語。霧川之帳，尾數未清。宿主一名，猶在人間。在海之墘。<\/p>\n<p>沈言聽完，沒有說話。她低頭看著自己的手。<\/p>\n<p>「我可以安排妳們先住到別的地方。」周遠說，「何靜她媽媽那邊，或是我那邊——」<\/p>\n<p>「不要。」沈言說。<\/p>\n<p>林依看了她一眼。<\/p>\n<p>「我躲了十二年。」沈言說，聲音很平，「每天早上吃一顆藥，躲。躲到後來，我連自己在躲什麼都不知道。」<\/p>\n<p>她抬起頭，看著周遠。<\/p>\n<p>「我不要再躲了。」<\/p>\n<p>周遠看著她。他想說，這次不一樣。他想說，這次要妳的不是一個很冷的小孩，是一群坐在療養院四樓喝茶的人。<\/p>\n<p>他沒有說。他知道沈言聽得懂。<\/p>\n<p>「那妳答應我一件事。」他說，「誰敲門都不要開。」<\/p>\n<p>沈言點點頭。<\/p>\n<p>林依在旁邊，把一杯冬瓜茶推到周遠手邊，減糖的那種，杯子上用奇異筆寫著「周」。<\/p>\n<p>「你要去哪裡？」林依問。<\/p>\n<p>「白石里。」<\/p>\n<p>沈言抬起頭。<\/p>\n<p>「一個人？」<\/p>\n<p>「嗯。」<\/p>\n<p>沈言看著他。然後她站起來，走到吧台後面，從抽屜裡拿出一張便條紙，寫了幾行字，摺起來，塞進他的外套口袋。<\/p>\n<p>「進去以後再看。」她說。<\/p>\n<hr class=\"sep\">\n<p>白石里的封鎖線還在。<\/p>\n<p>老張的人撤了一半，只剩一個派出所的年輕員警在村口的貨櫃屋裡值班，看見周遠的證件，揮揮手讓他過去，繼續低頭滑手機。<\/p>\n<p>村子跟那天晚上一樣。十九戶，門都關著。只是門上多了東西。<\/p>\n<p>黃色的符。<\/p>\n<p>一張一張，貼在門板正中央，蓋著紅色的印。有的門上貼一張，有的貼兩張，交叉貼成一個叉。門把上纏著新的鐵鍊，掛著新的大鎖，鎖頭還亮著。<\/p>\n<p>周遠走到第一戶，彎腰看那張符。<\/p>\n<p>符的角落，蓋著一個小小的章。他認得那個章。大廟。<\/p>\n<p>他走了一圈。十九戶，十一戶貼了符、上了鎖。剩下八戶，大概是貼的人符不夠了，或是那幾戶的門太舊，鎖不上，只在門把上綁了一條紅布。<\/p>\n<p>周遠站在村子中間，把沈言塞給他的那張便條紙拿出來。<\/p>\n<p>他說進去以後再看。可是他想，這裡已經算進去了。<\/p>\n<p>紙上是沈言的字，很工整，一筆一畫：<\/p>\n<p class=\"doc\">她們在等人回家。拖鞋要朝內，人才找得到路。<\/p>\n<p class=\"doc\">白石里的拖鞋，是朝外的。<\/p>\n<p>周遠看著那兩行字。<\/p>\n<p>他想起那天晚上，他在第三戶的臥室門口，蹲下來看那雙藍白拖。鞋頭朝著門，擺得很正。像有人很仔細地，把它們轉過來的。<\/p>\n<p>他想起背面的霧川，每一張床邊，每一雙拖鞋，都朝著裡面。<\/p>\n<p>他把便條紙摺好，放回口袋。<\/p>\n<p>然後他走向第一戶沒有上鎖的人家。<\/p>\n<hr class=\"sep\">\n<p>一整個下午，他在那八戶人家裡進進出出。<\/p>\n<p>推開門，走進去，找到臥室，找到床，找到床邊那雙鞋。拖鞋，布鞋，雨鞋，夾腳拖。鞋頭全部朝著門。<\/p>\n<p>他蹲下來，一隻一隻，把它們轉過來。<\/p>\n<p>鞋頭朝內。朝著床。朝著屋子裡面。<\/p>\n<p>八戶人家，十一雙鞋。有一戶的床邊放著兩雙，一雙大的男用拖鞋，一雙小的、粉紅色、有兔子的。他把兩雙都轉過來，轉的時候，手停了一下。<\/p>\n<p>霧川那天早上，小孩房裡也有一雙有兔子的拖鞋。<\/p>\n<p>他蹲在那裡，蹲了一會兒，才站起來。<\/p>\n<p>最後一戶，是那個八個月大的嬰兒家。嬰兒床還在，床欄上那條紅布不見了，大概是被他媽媽帶走了。阿嬤房間的床邊，一雙黑色的老布鞋，鞋頭朝著門。<\/p>\n<p>他把它轉過來的時候，想起那個媽媽說，我婆婆縫的。<\/p>\n<p>另外十一戶，門上貼著符，掛著鎖。他站在其中一扇門前面，手放在那條新的鐵鍊上。<\/p>\n<p>他可以去找鎖匠。他可以申請搜索票。他可以撬。<\/p>\n<p>可是今天是十一月十一。四天以後，就是十五。<\/p>\n<p>他把手放下來。<\/p>\n<hr class=\"sep\">\n<p>天黑以後，他走到溪邊。<\/p>\n<p>溪床上的白石頭，在月光底下一片一片地亮著。月亮快圓了，大大的，掛在山頭，照得整條溪床像鋪了一層霜。<\/p>\n<p>那灘水還在。<\/p>\n<p>兩三步寬，很淺，很清。旁邊的溪水在流，它不流。月光照在上面，照不出底下的石頭，只照出一片很平很平的亮。<\/p>\n<p>周遠在水邊坐下來。<\/p>\n<p>他帶了一個背包。背包裡是一支手電筒，一瓶水，兩包餅乾，白石里的戶口名簿影本，老張給的。還有一枝原子筆。<\/p>\n<p>沒有鈴。鈴在石崗，在陳先生的墳前。他想過要不要去借。他想了一個晚上，最後沒有去。<\/p>\n<p>借一暝，天光就還你。那是他跟先生講好的。他已經借過一次了。<\/p>\n<p>他沒有三個人。沒有宿主。沒有放之者。這裡面的東西，不是一個被推下河的小孩，他不知道它是什麼，不知道它叫什麼名字，不知道它欠了誰、誰欠了它。<\/p>\n<p>他葬不了它。<\/p>\n<p>他只想把人帶出來。<\/p>\n<hr class=\"sep\">\n<p>十一點五十九分。<\/p>\n<p>他站起來，走到水邊。<\/p>\n<p>零點。<\/p>\n<p>水面沒有動。<\/p>\n<p>零點零五分。零點十分。<\/p>\n<p>周遠低頭看著那灘水。月光底下，水面很平，平得像一塊玻璃。<\/p>\n<p>零點十四分。<\/p>\n<p>水面上，有一圈很小很小的波紋，從中間散開。<\/p>\n<p>然後水變深了。<\/p>\n<p>不是水漲了，是底下的石頭不見了。剛才還看得見的白石頭，一顆一顆，往下沉，沉到看不見的地方。那灘兩三步寬的水，變成一口井。很深，深到底下是黑的。<\/p>\n<p>周遠把背包背好，深吸一口氣。<\/p>\n<p>他沒有人可以牽。沒有人走在他前面，讓他踩著腳印。<\/p>\n<p>他自己走下去。<\/p>\n<hr class=\"sep\">\n<p>白石里的背面，是白的。<\/p>\n<p>不是灰。是一種很淡很淡的白，像一張被曬了很多年的照片，所有的顏色都褪光了，只剩下一點點輪廓。溪床是白的，石頭是白的，天是白的，房子是白的。<\/p>\n<p>沒有聲音。<\/p>\n<p>周遠站在溪床上，往村子看。<\/p>\n<p>他們在那裡。<\/p>\n<p>二十六個人，排成方陣，在村子唯一那條路上，倒退著走。雙手往前平舉，手腕垂著，往左晃，往右晃，往後退一步。跟霧川一樣。<\/p>\n<p>帶頭的，不一樣。<\/p>\n<p>在霧川帶舞的，是一個只到他腰那麼高的小孩。<\/p>\n<p>這裡帶舞的，很高。<\/p>\n<p>比方陣裡最高的那個男人，還高出一個頭。它背對著方陣，也背對著他，倒退著走，走得很慢，很穩。身上穿著一件黑色的長袍，袍子垂到地上，不大也不小，剛剛好。頭上戴著一頂又高又尖的黑帽子。<\/p>\n<p>它的後頸，繞著一條很粗的鐵鍊，鐵鍊往前垂。<\/p>\n<p>周遠看不見它的臉。<\/p>\n<p>他不用看也知道，那條鐵鍊的前面，墜著什麼。<\/p>\n<p>巡夜。<\/p>\n<p>那件黑袍，那頂帽子，那塊令牌。從一個七歲的小孩身上脫下來，掉進河裡，沉下去。<\/p>\n<p>現在有人把它撈起來，給另一個東西穿上了。<\/p>\n<p>這一次，穿起來剛剛好。<\/p>\n<hr class=\"sep\">\n<p>周遠蹲在溪床上，把戶口名簿攤開在膝蓋上。<\/p>\n<p>他不能叫它。他不知道它是什麼。<\/p>\n<p>他只能叫他們。<\/p>\n<p>他照著名簿上的順序，一個一個叫。聲音不大，在這個沒有聲音的地方，每一個名字都像丟進井裡的石頭，往下掉，掉得很遠。<\/p>\n<p>第一個名字。方陣裡，沒有人停。<\/p>\n<p>第二個。沒有。<\/p>\n<p>第三個。<\/p>\n<p>方陣第二排，一個穿汗衫的中年男人，腳步亂了一下。他的手垂下來了。他轉過頭，看著溪床的方向，看著周遠，臉上是那種剛睡醒、不知道自己在哪裡的表情。<\/p>\n<p>周遠看了一眼名簿。第三個名字，第七戶。<\/p>\n<p>下午，他在第七戶的臥室裡，把一雙男用拖鞋轉了過來。<\/p>\n<p>他繼續叫。<\/p>\n<p>有的人停了，有的人沒有。停下來的人，一個一個，從方陣裡走出來，像被什麼東西從隊伍裡輕輕推了出來，搖搖晃晃，赤著腳，朝溪床的方向走過來。<\/p>\n<p>沒有停的人，繼續倒退著走，繼續晃，好像根本沒聽見。<\/p>\n<p>周遠叫到第二十六個的時候，手在發抖。<\/p>\n<p>他身邊站著十一個人。<\/p>\n<p>十一個人。八戶人家。他轉過鞋子的那八戶。<\/p>\n<p>另外十五個人，還在方陣裡。他們的家門上，貼著大廟的符，掛著新的鎖。他們床邊的拖鞋，還朝著外面。<\/p>\n<p>他們找不到回家的路。<\/p>\n<hr class=\"sep\">\n<p>那個很高的東西，停下來了。<\/p>\n<p>它沒有轉身。它背對著所有人，站在路的盡頭，一動也不動。方陣在它身後也停了，十五個人，同時定住，雙手平舉，像十五個被釘在半空中的影子。<\/p>\n<p>然後周遠看見了。<\/p>\n<p>它的兩隻袖子裡，伸出兩條線。很細，很黑，往白色的天上拉，拉得很緊。<\/p>\n<p>線動了一下。<\/p>\n<p>那個高高的東西，慢慢地，慢慢地，開始轉身。<\/p>\n<p>周遠沒有等它轉過來。<\/p>\n<p>他站起來，對身邊那十一個人說：「走。」<\/p>\n<p>他不知道往哪裡走。<\/p>\n<hr class=\"sep\">\n<p>白石里的背面，沒有燈。<\/p>\n<p>霧川的背面，有一盞燈。何媽媽坐在河堤的水泥平台上，守了十個晚上。那是回去的路。<\/p>\n<p>這裡沒有人守。<\/p>\n<p>周遠帶著十一個人，沿著溪床往下游走。白的石頭，白的天，白的房子。他走了很久。他沒有回頭。他只是覺得，背後那個高高的東西，轉過來了。<\/p>\n<p>他感覺得到它在看。<\/p>\n<p>不是用眼睛。是一種很重的、很冷的東西，壓在他的背上，像一隻很大的手，慢慢地，一根手指一根手指地，按下來。<\/p>\n<p>他身邊那個穿汗衫的男人，腳步慢下來了。他的手，又開始往前抬。<\/p>\n<p>「不要。」周遠抓住他的手腕，「不要抬。」<\/p>\n<p>那個男人看著他，眼睛很空。<\/p>\n<p>周遠拉著他往前走。拉著他，又拉著另一個人。一個老太太，走得很慢，周遠把她的手搭在自己的肩膀上。<\/p>\n<p>他不知道入口在哪裡。<\/p>\n<p>溪床是白的，水是白的，每一灘水看起來都一樣。他走過一灘，又一灘，每一灘都是淺的，底下看得見白色的石頭。<\/p>\n<p>背上那隻手，越按越重。<\/p>\n<p>他的膝蓋軟了一下。<\/p>\n<p>他想起城隍廟的門檻。他跪在那裡，說，我押十年。<\/p>\n<p>他想起自己右邊鬢角那一片白。<\/p>\n<p>他想，再押一次，還剩下什麼可以押。<\/p>\n<hr class=\"sep\">\n<p>然後他看見了。<\/p>\n<p>溪床前面，很遠的地方，有一點光。<\/p>\n<p>很小，很暗，黃黃的，像一顆螢火蟲停在石頭上。在這一整片白裡面，那一點黃，是唯一有顏色的東西。<\/p>\n<p>周遠拉著那十一個人，朝那點光走過去。<\/p>\n<p>越走越近。<\/p>\n<p>是一盞燈。<\/p>\n<p>一盞很舊很舊的油燈，放在一灘水的旁邊。銅的燈座，生了綠鏽，燈罩是玻璃的，裂了一條縫，沒有纏膠布。火苗很小，很穩，一動也不動。<\/p>\n<p>周遠認得這盞燈。<\/p>\n<p>不是用眼睛認得的。是更深的地方。一九三一年的那個晚上，一個十七歲的少年跪在城隍廟的門檻外面，把鈴放在門檻上，沒有搖。門沒有開。可是門縫底下，亮起了一點光。<\/p>\n<p>就是這盞。<\/p>\n<p>他蹲下來，看著那盞燈。<\/p>\n<p>燈旁邊那灘水，很深，深到底下是黑的。<\/p>\n<p>他把那十一個人，一個一個，扶到水邊。<\/p>\n<p>「下去。」他說，「不要回頭。」<\/p>\n<p>穿汗衫的男人第一個走下去。然後是那個老太太。一個，兩個，十一個。<\/p>\n<p>最後一個走下去的時候，周遠聽見背後有聲音。<\/p>\n<p>在這個沒有聲音的地方，他聽見了。<\/p>\n<p>很輕，很慢。鐵鍊拖在石頭上的聲音。<\/p>\n<p>他沒有回頭。<\/p>\n<p>他伸手，拿起那盞燈。燈座很冰，比他想像的重。他把它抱在胸口，走下那灘水。<\/p>\n<hr class=\"sep\">\n<p>他從水裡出來的時候，是晚上。<\/p>\n<p>溪床，白石頭，月亮。月亮比他進去的時候更圓了一點。有蟲在叫，有溪水的聲音。<\/p>\n<p>那十一個人，坐在溪床上，有的在哭，有的在發抖，有的什麼都沒做，只是抬頭看月亮。<\/p>\n<p>溪邊站著一個人。<\/p>\n<p>拿著手電筒，背著一個很大的保溫杯。<\/p>\n<p>小方。<\/p>\n<p>她看見周遠從水裡走出來，手電筒的光照在他臉上，照了很久。<\/p>\n<p>「你知不知道，」她說，聲音在抖，「你進去多久了？」<\/p>\n<p>周遠看了一眼手錶。零點十六分。<\/p>\n<p>「一天。」小方說，「整整一天。你的車在村口停了一整天。我早上打你電話打不通，下午上來找，找到天黑。我在這裡坐了四個鐘頭。」<\/p>\n<p>她走過來，把保溫杯塞進他手裡。<\/p>\n<p>「喝。」<\/p>\n<p>是熱咖啡。很苦，很燙。<\/p>\n<p>周遠喝了一口，低頭看著抱在胸口的那盞燈。<\/p>\n<p>小方也看著那盞燈。<\/p>\n<p>「這是什麼？」<\/p>\n<p>周遠把燈翻過來。<\/p>\n<p>燈座的底部，刻著兩個字。刻得很深，很舊，筆畫裡卡著黑色的泥。<\/p>\n<p class=\"beat\"><strong>辛未<\/strong><\/p>\n<p>「一九三一年。」周遠說。<\/p>\n<p>小方看著他，沒有問。<\/p>\n<p>周遠把燈翻回來，抱好。他看著溪床上那十一個人，又看著那灘水。<\/p>\n<p>水還在。很深，很黑。<\/p>\n<p>另外十五個人，還在裡面。<\/p>\n<p>他們床邊的拖鞋，還朝著外面。<\/p>", "chars": 4454}}, "core": "一個小鎮三百人兩夜消失，唯一的倖存者被送進精神病院；追查此案的刑警每晚夢見自己是九十五年前的陰陽先生，而那個先生，當年正是在同一座鎮上，用自己的魂封住了同一個東西。"};
const CN = "〇一二三四五六七八九";
const cn = n => n <= 10 ? (n === 10 ? "十" : CN[n]) : n < 20 ? "十" + (n % 10 ? CN[n % 10] : "") : CN[Math.floor(n / 10)] + "十" + (n % 10 ? CN[n % 10] : "");
const store = {
  get(k, d) { try { const v = localStorage.getItem("wuchuan." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("wuchuan." + k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
const written = Object.keys(DATA.chapters).map(Number).sort((a, b) => a - b);
const all = DATA.volumes.flatMap(v => v.chapters.map(c => ({ ...c, vol: v.vol, volName: v.name })));
const meta = n => all.find(c => c.n === n) || { n, name: "", line: "" };
const main = $("main");
let current = 0;

const prefs = {
  size: store.get("size", window.innerWidth <= 700 ? 18 : 19),
  lead: store.get("lead", 2),
  vertical: store.get("vertical", false),
  theme: store.get("theme", "auto")
};
function applyPrefs() {
  const root = document.documentElement;
  root.style.setProperty("--size", prefs.size + "px");
  root.style.setProperty("--lead", prefs.lead);
  if (prefs.theme === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", prefs.theme);
  document.body.classList.toggle("vertical", prefs.vertical);
  $("sizeRange").value = prefs.size;
  document.querySelectorAll("#leadSeg button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.lead) === prefs.lead)));
  document.querySelectorAll("#modeSeg button").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.mode === "v") === prefs.vertical)));
  document.querySelectorAll("#themeSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeSet === prefs.theme)));
}

function neighbours(n) {
  const i = written.indexOf(n);
  return { prev: written[i - 1], next: written[i + 1] };
}
function setNav(n) {
  const { prev, next } = n ? neighbours(n) : {};
  for (const [id, v] of [["dPrev", prev], ["prevTop", prev], ["dNext", next], ["nextTop", next]]) {
    $(id).disabled = !v; $(id).dataset.go = v || "";
  }
  $("prevTop").hidden = $("nextTop").hidden = !n;
}

function toc() {
  current = 0;
  document.body.classList.remove("reading", "chrome-off");
  const last = store.get("last", null);
  const resume = last && DATA.chapters[last];
  const next = resume ? last : written[0];
  $("where").textContent = "目錄";
  setNav(0);
  main.innerHTML = `
    <section class="cover">
      <h1>霧川</h1>
      <div class="meta">
        <p class="core">${DATA.core}</p>
        <div class="stat"><span>十卷・八十章</span><span>已寫 ${written.length} / 80 章</span>
          <span class="progress" aria-hidden="true"><i style="width:${written.length / 80 * 100}%"></i></span></div>
        <button class="go" type="button" data-go="${next}">${resume ? "繼續讀　第" + cn(last) + "章〈" + meta(last).name + "〉" : "從第一章讀起"}</button>
        <p class="hint">閱讀時點一下畫面中央可以收起工具列，左右滑動可以換章。</p>
      </div>
    </section>
    <div class="toc">
      ${DATA.volumes.map(v => `
        <section class="vol">
          <header><h2><small>${v.vol}</small>${v.name}</h2></header>
          <p class="blurb">${v.blurb}</p>
          <ol>${v.chapters.map(c => {
            const has = !!DATA.chapters[c.n];
            return `<li class="${has ? "" : "todo"} ${c.n === last ? "here" : ""}">
              <button type="button" ${has ? `data-go="${c.n}"` : `disabled aria-label="第${c.n}章 ${c.name}，尚未寫成"`}>
                <span class="n">${c.n}</span><span class="t">${c.name}</span><span class="l">${has ? c.line : "未寫"}</span>
              </button></li>`;
          }).join("")}</ol>
        </section>`).join("")}
    </div>`;
  window.scrollTo(0, store.get("tocScroll", 0));
  updateReadbar();
}

function read(n) {
  const ch = DATA.chapters[n];
  if (!ch) return toc();
  current = n;
  document.body.classList.add("reading");
  document.body.classList.remove("chrome-off");
  const m = meta(n);
  const { prev, next } = neighbours(n);
  store.set("last", n);
  $("where").textContent = `第${cn(n)}章　${m.name}`;
  setNav(n);
  const title = ch.title.replace(/^第.+?章　/, "");
  main.innerHTML = `
    <article class="chapter" id="text">
      <p class="num">${m.vol || ""}・${m.volName || ""}　第 ${n} 章</p>
      <h2>${title}</h2>
      ${ch.html}
    </article>
    <nav class="nav" aria-label="換章">
      <button type="button" ${prev ? `data-go="${prev}"` : "disabled"}><small>上一章</small><span>${prev ? "第" + cn(prev) + "章　" + meta(prev).name : "已是第一章"}</span></button>
      <button type="button" ${next ? `data-go="${next}"` : "disabled"}><small>下一章</small><span>${next ? "第" + cn(next) + "章　" + meta(next).name : "還沒寫到"}</span></button>
    </nav>
    ${next ? "" : `<p class="end">目前寫到這裡。下一章是第${cn(n + 1)}章〈${meta(n + 1).name}〉。</p>`}`;
  const pos = store.get("pos", {})[n] || 0;
  if (prefs.vertical) { window.scrollTo(0, 0); const t = $("text"); t.scrollLeft = -pos * (t.scrollWidth - t.clientWidth); t.addEventListener("scroll", onScroll, { passive: true }); }
  else window.scrollTo(0, pos * (document.documentElement.scrollHeight - innerHeight));
  updateReadbar();
}

function ratio() {
  if (!current) return 0;
  if (prefs.vertical) { const t = $("text"); const max = t.scrollWidth - t.clientWidth; return max > 0 ? Math.min(1, Math.abs(t.scrollLeft) / max) : 0; }
  const max = document.documentElement.scrollHeight - innerHeight;
  return max > 0 ? Math.min(1, scrollY / max) : 0;
}
function updateReadbar() { $("readbar").style.width = (ratio() * 100) + "%"; }

let lastY = 0, saveTimer = 0;
function onScroll() {
  updateReadbar();
  if (current) {
    const y = scrollY;
    if (!prefs.vertical && Math.abs(y - lastY) > 12) {
      document.body.classList.toggle("chrome-off", y > lastY && y > 120);
      lastY = y;
    }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { const p = store.get("pos", {}); p[current] = Number(ratio().toFixed(4)); store.set("pos", p); }, 250);
  } else {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => store.set("tocScroll", scrollY), 250);
  }
}
window.addEventListener("scroll", onScroll, { passive: true });

function route() {
  const m = location.hash.match(/^#c(\d+)$/);
  m ? read(Number(m[1])) : toc();
}
function go(n) {
  const h = n ? "#c" + n : "#toc";
  if (location.hash === h) route(); else location.hash = h;
}

/* 點擊：換章、目錄 */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b && b.dataset.go) { go(Number(b.dataset.go)); return; }
  if (current && e.target.closest(".chapter") && !getSelection().toString()) {
    const y = e.clientY / innerHeight;
    if (y > .25 && y < .75) document.body.classList.toggle("chrome-off");
  }
});
$("home").onclick = () => go(0);
$("dToc").onclick = () => go(0);

/* 左右滑動換章（橫排時） */
let sx = 0, sy = 0, st = 0;
document.addEventListener("touchstart", e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
document.addEventListener("touchend", e => {
  if (!current || prefs.vertical || !$("sheet").hidden) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Date.now() - st < 600 && Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2) {
    const { prev, next } = neighbours(current);
    if (dx < 0 && next) go(next);
    if (dx > 0 && prev) go(prev);
  }
}, { passive: true });

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("sheet").hidden) return closeSheet();
  if (!current || e.target.closest("input,textarea")) return;
  const { prev, next } = neighbours(current);
  if (e.key === "ArrowRight" && next) go(next);
  if (e.key === "ArrowLeft" && prev) go(prev);
});

/* 設定面板 */
function openSheet() { $("sheet").hidden = $("shade").hidden = false; $("closeSheet").focus(); }
function closeSheet() { $("sheet").hidden = $("shade").hidden = true; }
$("openSheet").onclick = openSheet;
$("dSet").onclick = openSheet;
$("closeSheet").onclick = closeSheet;
$("shade").onclick = closeSheet;
$("sizeRange").oninput = e => { prefs.size = Number(e.target.value); store.set("size", prefs.size); applyPrefs(); updateReadbar(); };
$("leadSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; prefs.lead = Number(b.dataset.lead); store.set("lead", prefs.lead); applyPrefs(); };
$("themeSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; prefs.theme = b.dataset.themeSet; store.set("theme", prefs.theme); applyPrefs(); };
$("modeSeg").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const v = b.dataset.mode === "v"; if (v === prefs.vertical) return;
  prefs.vertical = v; store.set("vertical", v); applyPrefs(); if (current) read(current);
};

window.addEventListener("hashchange", route);
applyPrefs();
route();
</script>

</body>
</html>
