鎮尾跑。整條街的門都關著，可是他聽得見，每一扇門後面都有人在輕輕地晃，左，右，左，右，像關在箱子裡的鐘擺。<\/p>\n<p>他沒有回頭。<\/p>\n<p>土地廟的門半掩著，跟那天晚上一樣。他把小滿推進去，自己閃進去，用背頂住門。廟裡只有神案上那盞長明燈，燈芯很短了，火苗小小的，一跳一跳。<\/p>\n<p>他們在神案底下坐下來，背靠著背。紅布包放在兩個人中間，一人一隻手按著。<\/p>\n<p>「小師父。」小滿小聲說。<\/p>\n<p>「嗯。」<\/p>\n<p>「阿伯是啥款的人？」<\/p>\n<p>陳守一想了想。<\/p>\n<p>「伊足兇。」他說，「我寫字寫毋著，伊會用煙吹頭敲我的手。我暈船，伊叫我吐佇外口，莫吐佇伊的包仔頂懸。」<\/p>\n<p>小滿在他背後笑了一下，很小聲。<\/p>\n<p>「伊會把滷卵讓我食，講伊喙齒疼。伊喙齒根本無疼。」<\/p>\n<p>「伊笑起來，」陳守一說，聲音開始抖，「目睭邊仔，有三條紋。毋對，四條。左爿三條，右爿四條。」<\/p>\n<p>他一邊說，一邊在心裡把那張臉重新畫回來。一條紋，一條紋，一筆一筆。<\/p>\n<p>「閣講。」小滿說。<\/p>\n<p>他就一直講。講師父第一天收他的時候，下著雨，師父撐著一把破傘，傘骨斷了一根。講師父教他畫第一道符，他畫了一百張，師父全部撕掉，第一百零一張才點頭。講師父說，夜裡走路，別回頭。<\/p>\n<p>長明燈的火苗越來越小，越來越小。<\/p>\n<p>天快亮的時候，小滿靠在他背上睡著了。陳守一還醒著。他撿起地上一塊燒剩的炭，在神案的木腳上，很慢很慢地刻了三個字。<\/p>\n<p>葛青崖。<\/p>\n<p>刻完了，他看了很久。那三個字刻得很醜，最後一個字的一橫往上翹了一下，像一個小小的鉤子。他想把它磨平，想了想，沒有。<\/p>\n<hr class=\"sep\">\n<p>周遠醒過來的時候，手腕上什麼都沒有。<\/p>\n<p>他坐起來，看著自己的手腕，看了一會兒。然後他下床，在桌上找到一支原子筆，在便利貼上寫了三個字。<\/p>\n<p>寫完，他把便利貼貼在冰箱門上，旁邊是一張早就過期的瓦斯費帳單。<\/p>", "chars": 3352}, "16": {"title": "第十六章　還差一個", "html": "<p>休假第三天，周遠把家裡打掃了一遍。<\/p>\n<p>他洗了浴室的地板，把冰箱裡過期的豆腐丟掉，把陽台的衣服收進來摺好。他擦了一遍桌子，又擦一遍。擦到冰箱門的時候，他看了一眼那張便利貼，三個字，最後一橫往上勾。他沒有撕掉，繞過去擦。<\/p>\n<p>靠陽台那間房的門，他也擦了。門把上的灰擦掉以後，露出底下的金屬，比他想的還亮。他沒有開門。<\/p>\n<p>下午兩點，他坐在乾乾淨淨的客廳裡，發現自己沒有別的事可以做了。<\/p>\n<p>他想起沈言在會談室裡說的話。從十二歲開始，十二年，一天都沒斷過。一個算命的先生蹲下來，跟她一樣高。<\/p>\n<p>十二年前，一個十二歲的女孩，遇到了什麼事，需要一個陌生人蹲下來給她一瓶藥？<\/p>\n<p>他拿起車鑰匙。<\/p>\n<hr class=\"sep\">\n<p>縣警局的檔案庫在地下二樓，要走一段樓梯，經過鍋爐間，再推開一扇很重的防火門。管檔案的老鄭再兩年就退休了，在這裡坐了二十幾年，桌上永遠泡著一杯濃得發黑的烏龍茶，旁邊一台收音機在播老歌。<\/p>\n<p>「周遠？」老鄭從老花眼鏡上面看他，「你不是休假？」<\/p>\n<p>「來找一個舊案子。」<\/p>\n<p>「休假還來找案子。」老鄭搖搖頭，把登記簿推過來，「你喔，跟以前一點都不一樣了。」<\/p>\n<p>周遠簽名的手停了一下。「以前？」<\/p>\n<p>「你剛來的時候啊。」老鄭說，「那時候你很愛笑，笑起來很吵，每次下來調資料都跟我講一堆有的沒有的。講你女朋友，講你阿嬤種的高麗菜，講你要存錢買機車。」他喝了一口茶，「後來就不講了。我記得是哪一年……你生了一場病之後吧？」<\/p>\n<p>周遠記得那場病。2014 年秋天，他二十五歲，進局裡第一年。醫生說是病毒性腦炎，高燒，他在醫院躺了很久，醒來以後少了三個禮拜的記憶。同事說他那陣子照常上班，照常出勤，只是後來什麼都不記得了。醫生說這很常見，叫他不要勉強去想。<\/p>\n<p>他就沒有去想。<\/p>\n<p>「我那時候有女朋友？」他問。<\/p>\n<p>老鄭愣了一下，笑了。「有啊，你不記得喔？一個很高的女生，在銀行上班。你們後來分了吧。」<\/p>\n<p>周遠不記得。他把登記簿推回去。<\/p>\n<p>「我要找 2014 年的。」他說，「縣內所有跟兒童有關的失蹤、重大事件，倖存者是十二歲左右的女孩。」<\/p>\n<hr class=\"sep\">\n<p>老鄭幫他在電腦上篩了一遍，篩出四筆。三筆是單純的走失，孩子都找回來了。<\/p>\n<p>第四筆的案名很短：和平村失蹤案。<\/p>\n<p>「這件我有印象。」老鄭說，「颱風那幾天，山上的和平村土石流，十九個人不見了，一個都沒找到。後來縣府算天災，案子就結了。」他起身去找，「整箱都在後面，沒人動過。」<\/p>\n<p>那是一個褪了色的紙箱，邊角被水泡過，有一股霉味。周遠把它搬到閱覽桌上，戴上手套，一份一份拿出來。<\/p>\n<p>現場照片。一個很小的山村，十幾戶人家，沿著一條溪排開，後面就是山壁。照片是颱風過後拍的，路上全是泥和斷掉的樹枝。可是房子都好好的。土石流只沖垮了村口的一座橋，沒有一間房子被埋。<\/p>\n<p>周遠把照片一張一張攤開。<\/p>\n<p>第七張，是一扇木門的特寫。門上，離地大約一百五十公分，有三個淺淺的凹痕，排成一列。<\/p>\n<p>第八張，是另一扇門。也是三個。<\/p>\n<p>第十二張，是一間臥室。床上的被子掀開一角，床邊擺著一雙塑膠拖鞋。<\/p>\n<p>鞋頭朝外。<\/p>\n<p>他把那張照片拿起來，拿了很久，才放下。<\/p>\n<hr class=\"sep\">\n<p>報告寫得很潦草。颱風夜，村民失聯，搜救隊上山，十九人下落不明。唯一被找到的，是一個十二歲的女孩，坐在村口那座斷橋的橋頭，光著腳，身上只穿一件睡衣。<\/p>\n<p>女孩的名字叫沈和。<\/p>\n<p>筆錄夾在報告後面，兩張紙，用迴紋針夾著，迴紋針已經生鏽，在紙上留下一圈褐色的印子。<\/p>\n<p class=\"doc\">調查筆錄<\/p>\n<p class=\"doc\">受詢問人：沈和　年齡：十二歲<br>詢問時間：中華民國一〇三年九月　日<br>詢問地點：縣立醫院兒童病房<\/p>\n<p>問：妳那天晚上看到什麼？<br>答：阿姨們在跳舞。<br>問：哪些阿姨？<br>答：全部。隔壁的，雜貨店的，學校的老師。叔叔也有。大家都在跳。<br>問：妳有跳嗎？<br>答：沒有。我在看。<br>問：妳為什麼沒有跳？<br>答：我不知道。我的腳很痛。<br>問：後來呢？<br>答：後來有一個穿長衫的人來了。他叫大家停下來。大家都不聽他的。<br>問：那個人長什麼樣子？<br>答：（沉默）<br>問：他有沒有對妳做什麼？<br>答：他蹲下來，跟我一樣高。他給我一個小瓶子。他說，每天都要吃，一天都不能忘記。<br>問：瓶子現在在哪裡？<br>答：（受詢問人拒絕交出）<br>問：還有其他想說的嗎？<br>答：我想回家。<\/p>\n<p class=\"doc\">詢問人：<br>承辦人：周遠<\/p>\n<p>周遠盯著最後那一行。<\/p>\n<p>是他的簽名。他認得自己的字，就像認得自己的臉，甚至比認得自己的臉還要熟，因為他很少看自己的臉。<\/p>\n<p>他不記得這份筆錄。他不記得這間病房，不記得這個光著腳的女孩，不記得自己問過她任何一個問題。<\/p>\n<p>可是那是他的字。「周遠」兩個字，周字裡面那個口寫得特別扁，是他從國中就改不掉的習慣。<\/p>\n<hr class=\"sep\">\n<p>他把筆錄翻過來。<\/p>\n<p>背面原本是空白的。可是在紙的最下面，靠近邊緣的地方，有一行很小的字。毛筆寫的，墨色已經褪成淡灰色，字很歪，很用力，像一個不太會寫字的人，一筆一畫照著描的。<\/p>\n<p class=\"doc\">這次只擋住一個，還差一個。<\/p>\n<p>周遠看著那行字。<\/p>\n<p>他看著那個「一」字的收尾。往上勾了一個小小的鉤，像釣魚的鉤子。這行字裡有兩個「一」，兩個都勾著。<\/p>\n<p>他拿出手機，翻出那張照片：文史館閱覽室裡，手札的最後一頁。此物不能殺，只能葬。他把手機放在筆錄旁邊，兩個「一」並排擺著。<\/p>\n<p>一樣的鉤子。一樣的歪，一樣的用力。<\/p>\n<p>一樣的人。<\/p>\n<p>他把手機收起來，坐在那裡，聽著老鄭的收音機在遠處放一首很老的情歌。他想不出一個合理的解釋。一個九十五年前的少年，在十二年前，在他簽過名的筆錄背面，寫了一行字。<\/p>\n<p>還差一個。<\/p>\n<p>差誰？<\/p>\n<hr class=\"sep\">\n<p>失蹤名單在報告的最後一頁。十九個名字，排成一欄，後面是年齡和身分。<\/p>\n<p>他一個一個看下去。<\/p>\n<p>村長，六十八歲。雜貨店老闆娘，五十二歲。國小校工，五十九歲。一個三歲的男孩，跟他的阿嬤。<\/p>\n<p>第十四個名字，他看了兩次。<\/p>\n<p class=\"doc\">周寧　二十三歲　和平國小代課老師<\/p>\n<p>跟他同一個姓。<\/p>\n<p>他看著那兩個字，等著自己有什麼感覺。什麼都沒有。周不是什麼稀有的姓，縣裡隨便一個國中的點名簿上，都找得到幾個。<\/p>\n<p>報告裡附了一張她的證件照，影印得很糊，只看得出一個綁著馬尾的女孩，眼睛很圓，對著鏡頭笑，笑得有點太用力，好像拍照的人叫她笑，她就真的很認真地笑了。<\/p>\n<p>他覺得她長得像某個人。想不起來是誰。<\/p>\n<p>他把那一頁翻過去。<\/p>\n<hr class=\"sep\">\n<p>離開之前，他請老鄭幫他調另一樣東西。<\/p>\n<p>「你自己以前寫的報告？」老鄭挑起眉毛，「你要那個幹嘛？」<\/p>\n<p>「想看一下自己以前的字。」<\/p>\n<p>老鄭看了他一眼，沒多問，去後面翻了一陣，抱回一個資料夾，標籤上寫著 2014。<\/p>\n<p>一個二十五歲的菜鳥寫的報告。字比現在圓，比現在大，寫得很快，有幾個錯字用立可白塗掉。一月，一份竊盜案，他寫：「被害人一名，於一樓客廳發現。」<\/p>\n<p>那個「一」字，平平的。收尾的地方，乾乾淨淨。<\/p>\n<p>他往後翻。二月，平的。三月，平的。六月，平的。八月，平的。<\/p>\n<p>九月的報告少了好幾份。中間空了一段，空了大概三個禮拜。<\/p>\n<p>十月第一份報告，是一件很普通的車禍。他寫：「機車一輛，倒於路旁。」<\/p>\n<p>那個「一」字的收尾，往上勾了一個小小的鉤。<\/p>\n<hr class=\"sep\">\n<p>小方是五點多下來的。她休息時間偷溜下來，手上拎著兩個便當，一個排骨一個雞腿，自己先挑了雞腿。<\/p>\n<p>「老鄭說你在這裡待了一個下午。」她在他對面坐下，「休假欸。你到底知不知道休假是什麼意思？」<\/p>\n<p>周遠把一月和十月的兩份報告並排推到她面前，指給她看那兩個「一」。<\/p>\n<p>小方看了很久。她是鑑識組的，她看筆跡比看人還準。<\/p>\n<p>「同一個人寫的。」她說，「筆壓、角度、起筆的方式都一樣。可是這個鉤子……」她把兩張紙換了個方向，又看了一次，「這不是慢慢改變的習慣。是忽然有的。一夜之間。」<\/p>\n<p>「十月。」周遠說，「2014 年十月。」<\/p>\n<p>小方抬起頭。「你那年生病，對吧？」<\/p>\n<p>他點頭。<\/p>\n<p>她看著他，又看看桌上那個褪色的紙箱，什麼都沒問。她把排骨便當推到他面前，把筷子拆開，放在便當蓋上。<\/p>\n<p>「先吃。」她說，「吃完我載你回去，你這樣開車我不放心。」<\/p>\n<p>他吃了。排骨很鹹，飯很硬，他全部吃完了。回程的車上，小方開得很慢，電台在放路況，他靠著車窗，在第二個紅綠燈之前就睡著了。<\/p>\n<p>那天晚上，他沒有做夢。<\/p>", "chars": 3071}, "17": {"title": "第十七章　石崗", "html": "<p>手機是凌晨三點四十分震的。<\/p>\n<p>周遠沒有接到。他睡得很沉，沉到那天晚上第一次沒有夢。等他醒過來，螢幕上是一通未接來電，一個沒看過的號碼，區碼是山線那邊的。底下一個紅色的小圈：語音留言，兩則。<\/p>\n<p>他坐在床邊，按下播放。<\/p>\n<hr class=\"sep\">\n<p class=\"doc\">語音留言（一）<br>03:41<\/p>\n<p>（風聲。很近，像是對著話筒在喘氣。）<\/p>\n<p>周警官，我……我是林依。<\/p>\n<p>你那天從門縫塞了一張名片進來，我一直放在口袋裡。我沒有手機，這是……這是民宿的電話。對不起，這麼晚。<\/p>\n<p>（停頓。）<\/p>\n<p>我在石崗。山線最後一站。我也不知道為什麼來這裡，我上了一台客運，就一直坐，坐到它不開了，我就下車了。<\/p>\n<p>我住了兩個晚上。這裡的人都很好。真的，都很好。<\/p>\n<p>（停頓，很長。）<\/p>\n<p>可是她還是在。每天晚上我睜開眼睛，床邊都站著一個人。我不敢看。我把燈開著，把被子蓋到頭頂，可是我知道她在那裡，站在床邊，一直看著我。<\/p>\n<p>周警官，我今天遇到一個人，他——<\/p>\n<p>（電話那頭有人說話，聽不清楚。喀一聲，斷了。）<\/p>\n<hr class=\"sep\">\n<p class=\"doc\">語音留言（二）<br>03:52<\/p>\n<p>（比較安靜。有一台老冰箱在嗡嗡響。）<\/p>\n<p>是我。對不起，剛剛老闆娘起來上廁所，我嚇到了，就掛了。<\/p>\n<p>（停頓。）<\/p>\n<p>我想跟你講今天的事。我怕我明天就不敢講了。<\/p>\n<p>下午我在廟口坐。我不想待在房間裡，房間有那張床。廟口有一個算命的攤子，一張摺疊桌，鋪一塊黃布，上面壓著一個銅鈴。坐在後面的是一個穿長衫的人。<\/p>\n<p>我說不上來他幾歲。有時候看起來二十幾，有時候看起來很老很老。他的手腕上綁著一條很舊的紅布條，洗到快變白了。<\/p>\n<p>我一開始以為是騙子。<\/p>\n<p>真的，周警官，我坐在旁邊看了一個下午。好多人排隊去找他，阿伯、阿嬤、雜貨店的老闆、一個抱小孩的媽媽。每個人坐下來，他就撒三個銅板。<\/p>\n<p>然後他每個人都說一樣的話。<\/p>\n<p>「今日無卦。」<\/p>\n<p>每一個。一整個下午，沒有一個人算到東西。大家也都不生氣，笑一笑，說好啦明天再來，就走了。<\/p>\n<p>收攤的時候，他把桌上的銅板一個一個收起來。我那時候坐得很近，我看到了。有幾個銅板，是立著的。他沒有直接收，他先用手掌把它們壓倒，一個一個壓倒，才收進袋子裡。<\/p>\n<p>我那時候想，這個人好奇怪，生意不做，還要故弄玄虛。<\/p>\n<p>然後我站起來要走。<\/p>\n<p>（停頓。她吸了一口氣，聲音開始發抖。）<\/p>\n<p>他叫住我。他沒有抬頭，一邊收桌子一邊說：<\/p>\n<p>「小姐，妳每天暗時，眠床邊攏有人徛咧，著無？」<\/p>\n<p>（很長的沉默。冰箱還在嗡嗡響。）<\/p>\n<p>我沒有跟任何人講過。周警官，我連你都沒有講。<\/p>\n<p>我想報警。我真的想。我手都拿起老闆娘的電話了。可是我一開口，我就……我就哭了。我在廟口哭，哭到蹲在地上。我一直跟他說，救我，拜託你救我。<\/p>\n<p>（她在哭。斷斷續續的。）<\/p>\n<p>他把一張板凳拉過來給我坐。他什麼都沒問，倒了一杯茶給我，等我哭完。<\/p>\n<p>然後他說，那我替妳算一卦。<\/p>\n<p>他撒了三個銅板。<\/p>\n<p>兩個倒下來。一個立著。<\/p>\n<p>他看著那個立著的銅板，看了很久。然後他抬起頭，不是看我，是看我後面。看廟口那條街，從鎮口進來的那條路。<\/p>\n<p>他說：「有物件，綴妳入來矣。」<\/p>\n<p>有東西，跟著妳進來了。<\/p>\n<p>（停頓。）<\/p>\n<p>周警官，我要去睡了。老闆娘說明天早上要煮地瓜粥給我吃。這裡的人真的都很好。<\/p>\n<p>如果……如果你聽到這個，可以打給我嗎？任何時候都可以。我會開著燈。<\/p>\n<p>（喀。）<\/p>\n<hr class=\"sep\">\n<p>周遠聽完，又聽了一次。<\/p>\n<p>然後他起來，洗了臉，泡了一杯咖啡，沒有喝，放在桌上。他拿出紙筆，把兩則留言裡的每一個細節寫下來：石崗，民宿，廟口，算命攤，黃布，銅鈴，長衫，手腕上的紅布條，今日無卦，立著的銅板。<\/p>\n<p>寫到紅布條的時候，他的筆停了。<\/p>\n<p>他想起一條洗得發白的紅髮帶，被一隻很小、很髒的手，歪歪地綁在一個少年的手腕上。<\/p>\n<p>他把筆放下，看著那三個字。手腕上的紅布條。他不知道自己為什麼會連到那裡去。一條紅布，滿街都是。<\/p>\n<p>四點半，他回撥了那個號碼。<\/p>\n<hr class=\"sep\">\n<p>電話響了很久，久到他以為沒人會接。<\/p>\n<p>「喂？」是一個老婦人的聲音，很和氣，帶著剛睡醒的鼻音。<\/p>\n<p>「您好，不好意思這麼早。」周遠說，「我找林依小姐。」<\/p>\n<p>「喔，你是她的朋友喔？」老婦人說，「伊佇遮，你等一下。小依，小依，你的電話。」<\/p>\n<p>話筒被放下的聲音。拖鞋踩在木頭地板上的聲音。然後是林依，聲音很小，很近。<\/p>\n<p>「周警官？」<\/p>\n<p>「是我。」<\/p>\n<p>她沒有說話。他聽得見她在喘氣，喘得很急，然後慢慢地，慢下來。<\/p>\n<p>「妳還好嗎？」<\/p>\n<p>「還好。」她說，「燈開著。」<\/p>\n<p>「她今天晚上有來嗎？」<\/p>\n<p>「有。」林依說，「可是她今天站得比較遠。」<\/p>\n<p>周遠握著手機，看著窗外。天還沒亮，樓下的路燈還開著，一台垃圾車停在巷口，工人一包一包地把垃圾丟上去。<\/p>\n<p>「林依，」他說，「我去找妳。」<\/p>\n<p>「不要。」她說得很快，「不要帶警察來。拜託。他們會把我帶回去，會問我一堆問題，會叫我交出藥瓶。你一個人來。」<\/p>\n<p>「我現在也算不上是警察。」周遠說，「我在休假。被逼的，槍也被收走了。」<\/p>\n<p>電話那頭安靜了一下。<\/p>\n<p>「因為那一槍？」<\/p>\n<p>「嗯。」<\/p>\n<p>「對不起。」她小聲說。<\/p>\n<p>「不是妳的錯。」<\/p>\n<p>「是我的錯。」她說，「全部都是我的錯。」<\/p>\n<p>周遠沒有接這句話。他等了一會兒，換了一個問題。<\/p>\n<p>「那個算命的，妳知道他叫什麼嗎？」<\/p>\n<p>「大家都叫他先生。陳先生。」林依說，「老闆娘說，他在這裡很久了，久到她都想不起來他是什麼時候來的。」<\/p>\n<p>周遠的手指在桌上停了。<\/p>\n<p>「他明天還會在廟口嗎？」<\/p>\n<p>「會。」林依說，「他每天都在。他說明天叫我再去，他有東西要問我。」她的聲音低下來，「周警官，他說，要我把我做過的事，全部告訴他。」<\/p>\n<p>「妳要去嗎？」<\/p>\n<p>她想了很久。<\/p>\n<p>「要。」她說，「我不想再逃了。我已經逃到沒有車可以坐了。」<\/p>\n<hr class=\"sep\">\n<p>他們又講了一陣。都是一些不重要的事。<\/p>\n<p>她說石崗的民宿是一棟兩層的木頭房子，老闆娘六十幾歲，每天早上五點起床掃地，掃完了就坐在門口看路，不知道在等什麼。她說雜貨店的阿伯人很好，第一天就送她一瓶牛奶，說年輕人要多喝牛奶。牛奶的日期印得很糊，她看不清楚，喝起來有點怪，她還是喝完了，因為阿伯一直在旁邊看著她笑。她說廟口的日曆好像都沒有人在撕，停在某一天，她沒注意是哪一天。<\/p>\n<p>她說這裡都沒下雨。她來的那天山下在下大雨，客運的雨刷一直刷，可是一進石崗，路就是乾的。<\/p>\n<p>「這裡好安靜。」她說，「我從來沒有睡過這麼安靜的地方。晚上一點聲音都沒有。」<\/p>\n<p>說著說著，她的聲音越來越慢，越來越輕。<\/p>\n<p>「周警官。」<\/p>\n<p>「嗯。」<\/p>\n<p>「你可以不要掛嗎？」她說，「我想睡一下。燈開著，可是我想睡一下。」<\/p>\n<p>「我不掛。」<\/p>\n<p>「謝謝。」<\/p>\n<p>過了一會兒，電話那頭只剩下她的呼吸聲。很淺，很規律，偶爾停一下，又接上。<\/p>\n<p>周遠把手機開了擴音，放在桌上，坐在旁邊。天慢慢亮了。他聽得見自己這邊的聲音：樓下早餐店拉開鐵門，隔壁的嬰兒在哭，一台機車發不動，騎士罵了一句髒話，又踩了一次，終於發動了，噗噗噗地騎走。<\/p>\n<p>電話那頭，除了林依的呼吸，什麼都沒有。<\/p>\n<p>沒有狗。沒有雞。沒有機車，沒有掃地的聲音，沒有一個早起的老人咳嗽。他把音量開到最大，耳朵貼過去聽了很久。<\/p>\n<p>整座石崗，安靜得像一張還沒有人寫上字的紙。<\/p>\n<p>他一直沒有掛。等到林依的呼吸變得很深、很沉，他才輕輕拿起手機，看了一眼通話時間。兩個小時十七分。他把手機放回桌上，去廚房，把那杯冷掉的咖啡倒掉，重新泡了一杯。<\/p>", "chars": 2767}, "18": {"title": "第十八章　玉佛", "html": "<p>休假第四天下午，周遠去了黃昏市場。<\/p>\n<p>他已經很久沒有自己買菜了。冰箱裡只剩下啤酒，他站在菜攤前面，不知道該拿什麼。賣菜的阿姨看他站了很久，自己替他挑了一把青江菜、兩條絲瓜、一盒雞蛋，說：「少年仔，一个人蹛喔？絲瓜炒卵上簡單，袂曉我教你。」<\/p>\n<p>她真的教了。站在攤子後面，一邊秤蔥，一邊用手比：蛋先炒，炒到一半起鍋，絲瓜下去，加一點水，蓋鍋蓋，蛋再丟回去。周遠點頭，點得很認真，像在聽案情簡報。<\/p>\n<p>阿姨多塞了一把蔥給他，不收錢。<\/p>\n<p>他提著塑膠袋走回家，手機在口袋裡震。是山線那邊的區碼。<\/p>\n<hr class=\"sep\">\n<p>「周警官？」<\/p>\n<p>林依的聲音跟凌晨不一樣。比較穩，比較清楚，背景有風，有一點點腳步聲。<\/p>\n<p>「我在民宿外面的公共電話。」她說，「我剛從廟口回來。我想趁我還記得，全部告訴你。」<\/p>\n<p>周遠在路邊的機車旁邊停下來，把菜放在坐墊上。<\/p>\n<p>「妳說。」<\/p>\n<p>「我中午就去了。他還沒擺攤，坐在廟口的台階上吃一顆饅頭。看到我，他把饅頭掰一半給我。」林依頓了一下，「我沒吃。我太緊張了。他就自己吃完了。」<\/p>\n<p>「他問了妳什麼？」<\/p>\n<p>「他問我，」林依說，「妳欠過誰？結過什麼怨？」<\/p>\n<p>她說她一開始講不出來。她說她坐在那張小板凳上，手放在口袋裡，握著那個瓶子，握到手心都是汗。先生沒有催她，就坐在對面，把桌上的銅板一個一個擦乾淨，擦完了排成一排。<\/p>\n<p>「然後我就全部講了。」她說，「從那天早上開始。她睡過頭，我把藥藏起來，我聽到敲門聲，我看到她在街上跳舞，我回去，我跟著跳，她問我為什麼拿走她的藥。全部。」<\/p>\n<p>「他說什麼？」<\/p>\n<p>「他什麼都沒說。他一直聽。」林依的聲音低下去，「講完以後，我把瓶子拿出來，放在他的黃布上。」<\/p>\n<hr class=\"sep\">\n<p>電話那頭安靜了一會兒。風聲。一台腳踏車的鈴響了一下，很遠。<\/p>\n<p>「他拿起來看，」林依說，「轉過來，看瓶底。」<\/p>\n<p>周遠想起筆錄上那個生鏽的迴紋針。想起「受詢問人拒絕交出」那一行小字。<\/p>\n<p>「瓶底刻了一個字，」林依說，「很小，很淺。我以前都沒注意。是一個『和』字。和平的和。」<\/p>\n<p>「他看到以後呢？」<\/p>\n<p>「他就不動了。」<\/p>\n<p>她說先生拿著那個瓶子，看著那個字，看了很久。久到廟口的阿伯們下完了一盤棋，又開了一盤。久到太陽從屋簷這一頭移到那一頭。他的手在抖，抖得很細，很密，瓶子裡的藥丸輕輕地響。<\/p>\n<p>「我問他是不是認識這個瓶子。」林依說，「他沒回答我。他問我一個問題。」<\/p>\n<p>「什麼問題？」<\/p>\n<p>林依用一種很奇怪的腔調說，像是在學他：<\/p>\n<p>「這个查某囡仔，伊這馬敢好？」<\/p>\n<p>這個女孩子，她現在好嗎？<\/p>\n<p>周遠站在路邊，看著坐墊上那袋青江菜。<\/p>\n<p>「我說她住院了。在松嶺。我說她現在叫沈言，不叫沈和。」林依說，「他就一直念那個名字。沈言，沈言。念了好幾次，很小聲，好像要把它記住。」<\/p>\n<hr class=\"sep\">\n<p>「然後他給了我兩樣東西。」<\/p>\n<p>林依說，先生從長衫的口袋裡拿出一個小布包，打開，裡面是一尊白玉佛，大拇指那麼大，用一條紅繩穿著。玉的顏色有點黃，邊角被摸得很圓，像戴過很多年。<\/p>\n<p>「他叫我掛在脖子上。」她說，「他說，掛咧，莫提落來。暗時睏，嘛莫提落來。」<\/p>\n<p>「另一樣呢？」<\/p>\n<p>「一個小瓶子。比沈言那個還小，黑色的，裡面只有幾顆藥。」林依說，「跟她吃的那種一樣，黑黑的，聞起來像香灰。」<\/p>\n<p>「他有說要給誰吃嗎？」<\/p>\n<p>「我問了。」林依說，「他說：該予啥人食，到時陣，妳就知。」<\/p>\n<p>周遠沒有說話。<\/p>\n<p>「然後他把沈言的瓶子還給我了。」林依說，「我以為他會留著。他說，這不是他的，也不是我的。他叫我收好，有一天，要親手還給她。」<\/p>\n<p>她吸了一口氣。<\/p>\n<p>「周警官，我不懂。我拿了她的藥，害死了一整個鎮的人。可是他看著我，一點都不像在看一個壞人。他看我的樣子，好像我是一個……一個走丟了，終於被找到的小孩。」<\/p>\n<p>周遠想起一個七歲的女孩，跪在河邊的泥地上，把一包紅布舉過頭頂。<\/p>\n<p>「林依，」他說，「他手上那條紅布條，妳有問他嗎？」<\/p>\n<p>「有。」她說，「我走的時候問的。我說，先生，你那條紅色的是什麼？」<\/p>\n<p>「他怎麼說？」<\/p>\n<p>「他笑了。」林依說，「那是我第一次看到他笑。他說：人送我的。伊講，綁這个，就袂驚。」<\/p>\n<hr class=\"sep\">\n<p>那天晚上，周遠照著阿姨教的方法炒了絲瓜。<\/p>\n<p>蛋炒得太老，絲瓜放太多水，煮成了一鍋湯。他還是吃完了，配了一碗白飯。洗碗的時候，他看了一眼冰箱門上那張便利貼。葛青崖。他想了想，拿起筆，在底下補了兩個字：石崗。<\/p>\n<p>十一點多，手機又響了。<\/p>\n<p>「周警官。」林依的聲音壓得很低，「你聽。」<\/p>\n<p>話筒那頭先是一陣窸窣，像有人拿著電話走路，走到窗邊，推開窗。然後是那種他在凌晨聽過的安靜，整座鎮像一張白紙一樣的安靜。<\/p>\n<p>然後他聽見了。<\/p>\n<p>很遠的地方，有一個人在唱歌。<\/p>\n<p>男人的聲音，不高，不低，很乾淨。聽不清楚字，只聽得到調子，一句一句，從很遠的地方飄過來。每一句都往下沉，尾音拖得很長，像要把什麼東西，一點一點，放進很深的地方。<\/p>\n<p>周遠站在廚房裡，手上還拿著擦碗的布。<\/p>\n<p>那是七號床阿婆唱的歌。<\/p>\n<p>「是他。」林依小聲說，「他收攤以後，就往鎮口走。老闆娘說他每天晚上都這樣，走到鎮口那棵大榕樹下面，唱到天亮。她說她聽了很多年了，聽習慣了，不聽反而睡不著。」<\/p>\n<p>「鎮口有什麼？」<\/p>\n<p>「我不知道。」林依說，「我不敢去。老闆娘說，那邊只有一座小小的墳。」<\/p>\n<p>周遠沒有再問。他聽著那支歌，一句接一句，從很遠的山上，穿過一支民宿的電話，穿過一整條山線，到他的廚房裡。<\/p>\n<p>他聽著聽著，覺得胸口某個地方又鬆開了。像一扇門，被人從裡面輕輕推開一條縫。<\/p>\n<p>「周警官？」<\/p>\n<p>「嗯。」<\/p>\n<p>「你在哼歌。」林依說，「跟他一樣的歌。」<\/p>\n<p>周遠停了下來。<\/p>\n<p>他不知道自己什麼時候開始哼的。他站在那裡，擦碗布垂在手上，聽著電話那頭的歌聲繼續往下唱，唱到一個地方停了一拍，又轉回來，跟他剛剛哼的，一模一樣。<\/p>\n<p>「我明天上山。」他說。<\/p>\n<p>「好。」林依說。她沒有問為什麼。<\/p>\n<p>他們都沒有掛電話。那支歌一直唱。周遠把手機放在流理台上，開著擴音，把碗一個一個洗完，擦乾，放回櫃子裡。洗到最後一個碗的時候，他發現自己又在跟著哼了。這一次，他沒有停下來。<\/p>", "chars": 2318}, "19": {"title": "第十九章　廟公", "html": "<p>山線的雨下了一整路。<\/p>\n<p>周遠早上七點出門，開了兩個半小時。縣道過了最後一個加油站以後就開始爬坡，一邊是山，一邊是谷，雨從擋風玻璃上一層一層地往下流，雨刷開到最快也刷不乾淨。收音機收不到電台了，只剩一片沙沙聲，他關掉了。<\/p>\n<p>路邊的里程牌越來越舊。最後一塊寫著：石崗　2。字被青苔吃掉一半。<\/p>\n<p>轉過最後一個彎，路變平了。路邊有一棵很大的榕樹，鬚根垂到地上，樹下有一座很小的墳，一塊矮矮的石碑，前面插著三根燒完的香腳。<\/p>\n<p>他的車經過那座墳的時候，雨停了。<\/p>\n<p>不是慢慢停的。是一下子就沒了。雨刷在乾掉的玻璃上刮了一下，發出很刺耳的聲音。他把雨刷關掉，從後照鏡往後看：榕樹後面的路還在下雨，雨幕像一道簾子，掛在墳的那一邊。這一邊，路是乾的，乾到路面上有一層細細的灰。<\/p>\n<p>他把車停在路邊，坐了一會兒，才繼續往前開。<\/p>\n<hr class=\"sep\">\n<p>石崗只有一條街。<\/p>\n<p>街比霧川還短，兩排老透天，一間雜貨店，一間理髮院，一間招牌褪成粉紅色的藥房。廟在街的盡頭，不大，廟埕上有幾張石桌，兩個老人在下棋，三四個老人在旁邊看。廟口的屋簷下，一張摺疊桌收起來靠在牆上，桌面上蓋著一塊黃布。<\/p>\n<p>林依站在民宿門口等他。<\/p>\n<p>她比在福星旅社的時候瘦，可是臉上有了一點血色。頭髮洗過了，綁成一個低低的馬尾。脖子上掛著一條紅繩，繩子底下的東西塞在衣服裡面，她的手一直不自覺地去按它。<\/p>\n<p>她看見他下車，沒有走過來，就站在門口，看著他。<\/p>\n<p>「你真的來了。」她說。<\/p>\n<p>「我說我會來。」<\/p>\n<p>林依點點頭，又點了一次，然後低下頭，把臉藏進她那件大帽 T 的領口裡。周遠走過去，站在她旁邊，什麼都沒說，等她把臉抬起來。<\/p>\n<hr class=\"sep\">\n<p>民宿的老闆娘煮了地瓜粥。<\/p>\n<p>六十幾歲，頭髮梳得很整齊，穿一件洗得很舊的花襯衫，手腳很快。她在客廳的圓桌上擺了四副碗筷，三碗粥，一盤醬瓜，一盤荷包蛋，一盤炒高麗菜。<\/p>\n<p>周遠坐下來，看了一眼那第四副碗筷。<\/p>\n<p>「我後生的。」老闆娘說，一邊替他盛粥，一邊笑，「伊講欲轉來食飯，毋知按怎拖到這馬。我攏共伊的碗攢好咧，伊若轉來，隨時有通食。」<\/p>\n<p>「他在外地工作？」<\/p>\n<p>「佇山跤。」老闆娘說，「做土水的，彼陣仔做大水，叫伊莫出去，伊毋聽。」她把醬瓜往他前面推，「食啦，少年仔，莫客氣。」<\/p>\n<p>她也坐下來吃，吃得很香，一邊吃一邊問林依昨天睡得好不好，有沒有作惡夢。林依說還好，她說那就好，脖子上那個要戴好。<\/p>\n<p>周遠低頭喝粥。粥很燙，很甜，地瓜煮得很爛。<\/p>\n<p>他抬頭的時候，看見牆上掛著一本日曆，撕到某一天就停了。紙已經黃了，邊角捲起來。他看不清楚上面的日期，只看得見一個很大的紅色數字：十二。<\/p>\n<hr class=\"sep\">\n<p>吃完飯，他一個人去了廟口。<\/p>\n<p>先生不在。黃布蓋著那張靠在牆上的摺疊桌，桌腳邊放著一張小板凳，板凳上用一個舊茶杯壓著什麼東西。<\/p>\n<p>周遠走過去，拿起茶杯。<\/p>\n<p>底下是三枚銅錢。很舊的那種，中間有方孔，邊緣磨得發亮，用一條紅線串著。<\/p>\n<p>「伊今仔日無來。」下棋的老人頭也沒抬，「伊有時陣會按呢，一兩工無出來。你揣伊創啥？」<\/p>\n<p>「問一點事情。」<\/p>\n<p>「欲算命喔？」另一個老人轉過頭來，笑出一口金牙，「伊算毋準啦。阮逐家去，伊攏講今日無卦。三冬矣，逐工攏無卦。」<\/p>\n<p>「三年？」<\/p>\n<p>「三冬啦，抑是四冬。」金牙老人揮揮手，「啥人咧算。」<\/p>\n<p>周遠看著石桌上的棋盤。是象棋，紅黑兩方殺得很亂，紅方的車被困在角落，黑方的馬卡在河界上。下棋的兩個老人一個捏著棋子，想了很久，沒有落下去。<\/p>\n<p>「阿伯，」他說，「你們這盤下多久了？」<\/p>\n<p>捏棋子的老人抬頭看他，一臉莫名其妙。「拄才開始啊。」<\/p>\n<p>旁邊看棋的老人笑起來。「伊逐工都按呢，逐工都卡佇遮，彼隻車逐工都走毋出來。」<\/p>\n<p>捏棋的老人瞪了他一眼，又低下頭，繼續想。<\/p>\n<p>周遠站在旁邊看了一會兒。他不太會下象棋，可是他記得棋盤的樣子。他拿出手機，拍了一張照片。<\/p>\n<hr class=\"sep\">\n<p>「少年仔，」金牙老人說，「你嘛會算喔？我看你提伊的錢仔，提甲足順手。」<\/p>\n<p>周遠低頭。那三枚銅錢不知道什麼時候已經被他從紅線上解下來了，躺在他手心裡，他用拇指一枚一枚地推著，推得很熟，像推了很多年。<\/p>\n<p>「我不會。」他說。<\/p>\n<p>「試看覓啦。」金牙老人把手伸出來，攤在石桌上，「共我算一下，我後年會好額無。」<\/p>\n<p>旁邊的老人都笑了。<\/p>\n<p>周遠看著那隻手。很老，很瘦，指甲裡有洗不掉的黑垢，掌紋很深。他不知道為什麼，把三枚銅錢合在掌心，搖了三下，往石桌上一撒。<\/p>\n<p>叮，叮，叮。<\/p>\n<p>三枚銅錢在石桌上滾了幾圈，停下來。<\/p>\n<p>全部立著。<\/p>\n<p>三枚。都是側邊著地，直直地立在石桌上，像三個很小的墓碑。<\/p>\n<p>石桌邊安靜了一下。<\/p>\n<p>「哎呀，」金牙老人第一個笑出來，拍著大腿，「你嘛今日無卦！你佮陳先生仝款！」<\/p>\n<p>其他老人也跟著笑，笑得很開心，好像這是今天最好笑的事。捏棋的老人終於把棋子落下去了，紅方的車往前走了一格，又被黑方的炮擋了回來。<\/p>\n<p>周遠沒有笑。他看著那三枚立著的銅錢。<\/p>\n<p>然後他伸出手，用掌心，把它們一枚一枚壓倒。<\/p>\n<hr class=\"sep\">\n<p>廟公在廟裡擦神桌。<\/p>\n<p>七十幾歲，背駝得很厲害，穿一件深藍色的唐衫，拿一條抹布，一寸一寸地擦，擦得很慢。神桌上的香爐很乾淨，香只插了三支，燒到一半。<\/p>\n<p>周遠表明了身分。廟公聽完，放下抹布，請他在旁邊的長板凳上坐，倒了一杯茶給他。<\/p>\n<p>「你問陳先生喔。」廟公說，在他旁邊坐下來，「伊足久以前就死去矣。」<\/p>\n<p>「死了？」<\/p>\n<p>「十二冬矣。」廟公說，「屍是我收的。」<\/p>\n<p>周遠的茶杯停在嘴邊。<\/p>\n<p>「彼暗做風颱。」廟公看著神桌上的香，慢慢地說，「伊倒佇鎮口彼欉榕仔跤，歸身軀澹糊糊。我共伊扛轉來，無人識伊，揣無伊的厝內人，我就共伊埋佇彼位。伊倒佇佗位，我就共伊埋佇佗位。」<\/p>\n<p>「你知道他叫什麼名字嗎？」<\/p>\n<p>「毋知。」廟公說，「人攏叫伊陳先生。我刻碑，就刻陳先生。」<\/p>\n<p>周遠放下茶杯。<\/p>\n<p>「阿伯，」他說，「可是我朋友這幾天每天都在廟口看到他。他在擺攤算命。下棋的阿伯們也都看過他。」<\/p>\n<p>廟公看著他，看了很久。那雙很老的眼睛裡，沒有驚訝，也沒有害怕，只有一種很溫和的、好像他問了一個很傻的問題的表情。<\/p>\n<p>「著啊。」廟公說，「伊逐工攏佇遮。」<\/p>\n<p>「可是你說他死了。」<\/p>\n<p>「伊死去矣。」廟公點點頭，「伊逐工攏佇遮。」<\/p>\n<p>他說這兩句話的時候，語氣一模一樣，好像它們是同一件事，好像一點都不衝突。<\/p>\n<hr class=\"sep\">\n<p>周遠又問了幾個問題。<\/p>\n<p>廟公接這間廟多久了？廟公想了想，說很久了。很久是幾年？廟公皺著眉頭想，想了很久，說他也記不清楚，反正很久了，他阿爸過身以後就是他在顧。他阿爸是哪一年過世的？廟公張開嘴，又閉上，看著神桌，好像答案寫在桌上，卻被他擦掉了。<\/p>\n<p>「歲頭大矣，」他最後說，笑了一下，「啥物攏袂記得。」<\/p>\n<p>周遠出廟門的時候，回頭看了一眼。<\/p>\n<p>廟公又拿起抹布，一寸一寸地擦那張已經很乾淨的神桌。香爐裡的三支香，還是燒到一半。跟他進門時一樣長。<\/p>\n<hr class=\"sep\">\n<p>傍晚，他要下山。林依送他到車邊。<\/p>\n<p>「妳不跟我下去？」<\/p>\n<p>「先生叫我留在這裡。」林依說，手按著胸口那尊玉佛，「他說這裡比較安全。」<\/p>\n<p>周遠看著這條街。理髮院的老闆坐在門口打瞌睡，雜貨店的阿伯在把一箱牛奶搬上架。下棋的老人還在下，同一盤棋，紅方的車還困在角落。<\/p>\n<p>「林依，」他說，「妳覺得這裡安全嗎？」<\/p>\n<p>她想了想。<\/p>\n<p>「這裡的人對我很好。」她說，「好到我有時候會忘記，我跟他們不一樣。」<\/p>\n<p>他沒有問她是哪裡不一樣。他上車，發動。經過雜貨店的時候，他停下來，買了一瓶牛奶。阿伯收了他的錢，找給他一枚十元。他上車才看那瓶牛奶的日期，印得很糊，他對著車窗的光看了很久，才看清楚。<\/p>\n<p>是十二年前的日期。<\/p>\n<hr class=\"sep\">\n<p>他經過榕樹下那座墳的時候，停了車。<\/p>\n<p>碑很矮，石頭很粗，字是用鑿子一下一下鑿出來的，鑿得很歪，可是很深。<\/p>\n<p class=\"doc\">陳先生之墓<\/p>\n<p>旁邊一行小字，是日期。民國一〇三年九月。<\/p>\n<p>跟和平村筆錄上的日期，同一個月。<\/p>\n<p>他站在墳前，站到天開始暗。沒有香，他就站著。風從山谷那邊吹上來，吹動榕樹的鬚根，一下，一下，像有人在撥弄一串很長的珠簾。<\/p>\n<p>他回到車上，往前開。車頭一過墳，雨就落下來，打在擋風玻璃上，啪啪啪地響。他把雨刷打開。<\/p>\n<p>開到第一個加油站的時候，他把車停在路邊，拿出記事本，想把今天見到的人寫下來。<\/p>\n<p>民宿老闆娘。下棋的兩個老人。金牙阿伯。雜貨店阿伯。廟公。<\/p>\n<p>他寫下他們的稱呼，然後想寫他們的長相。他閉上眼睛想。<\/p>\n<p>他想不起來。<\/p>\n<p>不是記不清楚，是完全想不起來。他記得金牙阿伯笑的時候拍大腿，記得廟公擦神桌的抹布是藍格子的，記得老闆娘的花襯衫上有一朵紅色的扶桑。可是他們的臉，眼睛，鼻子，嘴巴，什麼都沒有，像一張被水泡過的照片，只剩下衣服的顏色。<\/p>\n<p>他打開手機，找到那張棋盤的照片。照片裡只有棋盤，兩隻手，一隻捏著棋子。他特地讓老人們入鏡了，他記得。可是照片上，那兩隻手往上的地方，是一片過曝的白。<\/p>\n<p>他坐在車裡，雨一直下。他看著那張照片看了很久，然後把記事本翻到新的一頁，寫了一行字：<\/p>\n<p class=\"doc\">他們都很和氣。<\/p>\n<p>他看著這行字，覺得這是他今天唯一確定的一件事。<\/p>", "chars": 3423}, "20": {"title": "第二十章　葬法", "html": "<p class=\"era\">一九三一年，霧川渡。<\/p>\n<p>師父睡前一定要洗腳。<\/p>\n<p>這是陳守一跟了他五年，最先記住的一件事。不管走了多少路，住的是破廟還是客棧，師父睡前一定要打一盆熱水，把那雙走得發白的腳泡進去，泡到水涼。泡腳的時候，他會哼歌。<\/p>\n<p>很輕，很慢，每一句都往下沉，像要把什麼東西放進很深的地方。<\/p>\n<p>陳守一第一年問過那是什麼歌。師父說：「學起來。毋免問。」<\/p>\n<p>他就學了。一個晚上一句，學了一整個冬天。學會了以後，師父就不再哼了，只在泡腳的時候，偶爾叫他：「守一，唱。」他就蹲在旁邊，一邊幫師父加熱水，一邊唱。唱完了，師父也不說好不好，擦乾腳，就睡了。<\/p>\n<p>他一直以為那只是一支師父喜歡的老歌。<\/p>\n<hr class=\"sep\">\n<p>天亮以後，他帶著小滿從土地廟回到客棧。<\/p>\n<p>他沒有睡。他把師父的布包打開，把那冊題著「封」字的手札拿出來，攤在桌上，從第一頁開始，一頁一頁地讀。<\/p>\n<p>前幾天他翻過，只是翻。這一次，他一個字一個字地讀。<\/p>\n<p>師父的字很急，很多地方是用簡寫，有些字他不認得，只能照著筆畫猜。符的畫法，硃砂的比例，什麼時辰，付什麼代價。每一條最後，都跟著同一個字：魂。或者，壽。<\/p>\n<p>他讀到第一個「魂」字的時候，手停了一下。他想起師父每天早上替月娥煮的那碗黑藥，想起藥的味道，香灰混著鐵鏽。<\/p>\n<p>他想起師父每三年回來一次。想起師父越來越瘦的臉。<\/p>\n<p>他繼續讀。<\/p>\n<p>小滿坐在床上，抱著膝蓋看他。看累了，就躺下來睡；睡醒了，又坐起來看。中午他下樓買了兩碗麵，兩個人在桌邊吃，吃完他又繼續讀。小滿把碗拿下樓還，回來的時候手上多了兩顆芭樂，是樓下的老闆娘給的，一顆給他，一顆自己啃。<\/p>\n<hr class=\"sep\">\n<p>他是在封鎮的名單上找到的。<\/p>\n<p>名單排在手札的中段，一行一個地方。第二行寫著：<\/p>\n<p class=\"doc\">辛丑年　霧川渡　與師同封　河<\/p>\n<p>他前幾天看過這一行，看過就過去了。這一次，他注意到這一行的旁邊，靠近書頁裝訂線的地方，有一排非常小的字。不是師父平常那種急急的字，是很慢、很小心寫的，墨色比較淡，像是很多年以後才補上去的。<\/p>\n<p>他把手札拿到窗邊，對著光，瞇著眼睛，一個字一個字地認。<\/p>\n<p class=\"doc\">封，非葬也。<br>師云：葬需三人。宿主甘願、放之者歸還、封之者放手。三人同歌，歌畢方葬。<br>此河之物，無放之者，故只能封。<br>待放之者出。<\/p>\n<p>陳守一把那四行字看了很多遍。<\/p>\n<p>窗外的街上，有一個賣麥芽糖的挑著擔子經過，一邊走一邊敲著兩塊竹板，叩叩，叩叩。他沒有聽見。<\/p>\n<p>宿主。放之者。封之者。<\/p>\n<p>月娥。小滿。<\/p>\n<p>還有封它的人。<\/p>\n<p>三十年前封它的，是師祖和師父。師祖早就死了，師父昨天才被他親手埋進土裡。<\/p>\n<p>他慢慢轉過頭，看著床上的小滿。小滿正在啃芭樂，啃得很專心，汁從下巴流下來，她用手背擦掉，發現他在看她，愣了一下，把那顆咬了一半的芭樂往他這邊遞。<\/p>\n<p>「你欲食無？」<\/p>\n<p>「毋免。」他說。<\/p>\n<hr class=\"sep\">\n<p>三人同歌。<\/p>\n<p>他想起師父泡腳時哼的歌。想起「學起來，毋免問」。想起他唱完以後，師父擦乾腳，什麼都不說，就睡了。<\/p>\n<p>他忽然明白了，師父為什麼不說好不好。<\/p>\n<p>師父不是在聽他唱得好不好。師父是在確定，他記住了。<\/p>\n<p>他把手札闔上，用雙手壓著封面，壓了很久。<\/p>\n<hr class=\"sep\">\n<p>下午，沈家派人來了。<\/p>\n<p>是一個年紀很小的丫鬟，十三四歲，站在客棧樓梯口，不敢上來，扯著嗓子喊：「小師父，阮少奶奶請你過去一下。」喊完了，她看了一眼樓梯，又小聲補了一句：「伊這馬，是伊家己。」<\/p>\n<p>她現在，是她自己。<\/p>\n<p>月娥在廂房裡等他。<\/p>\n<p>她換了一身乾淨的藍衣，頭髮梳得很整齊，坐在床沿。她的臉比上一次更白了，白得像一張薄紙，眼睛底下是兩圈很深的青。她看見他，站起來。<\/p>\n<p>然後她跪下來了。<\/p>\n<p>陳守一嚇得往後退了一步，撞到門框。<\/p>\n<p>「少奶奶，妳莫按呢——」<\/p>\n<p>「小師父，」月娥跪在地上，兩隻手放在膝蓋上，背挺得很直，「我只有一陣仔是我家己。日頭上懸的時陣，差不多一个時辰。過了，我就毋知我是啥人矣。」<\/p>\n<p>她說得很快，很清楚，像是在心裡排練了很多次，怕來不及。<\/p>\n<p>「我知影我暗時去佗位。我知影我敲啥人的門。我知影我帶啥人去曬穀場。」她的聲音開始抖，「豆腐伯仔，打鐵的阿炎，碼頭的阿福。小滿伊阿爸。我攏知影。我看會著。我就是擋袂牢。」<\/p>\n<p>陳守一說不出話。<\/p>\n<p>「葛先生死去的彼暗，」月娥說，「我嘛看著。」<\/p>\n<p>她低下頭，眼淚掉在藍衣的膝蓋上，暈成兩個深色的圓點。<\/p>\n<p>「小師父，我求你。」她說，「你若有法度，就共伊收走。就算愛連我做伙收，嘛無要緊。」<\/p>\n<hr class=\"sep\">\n<p>陳守一在她對面蹲下來。<\/p>\n<p>他想起師父最後抓著他手腕說的話。不能殺。她是一個囡仔。他想起師父的劍刺進水裡，河底傳出的那一聲「痛」。<\/p>\n<p>「師父講，」他說，「毋通殺。」<\/p>\n<p>「我知。」月娥說，「我毋是欲你殺我。」<\/p>\n<p>她抬起頭，看著他，然後把一隻手放在自己的肚子上。很輕地放著，像怕壓壞什麼。<\/p>\n<p>「我有身矣。」她說，「三個月。阮翁婿佇台北做生理，伊猶毋知。」<\/p>\n<p>陳守一看著那隻手。<\/p>\n<p>「我驚，」月娥小聲說，「我驚這个囡仔生出來，伊嘛佇內底。我驚伊大漢了後，暗時嘛會去敲人的門。」<\/p>\n<p>她的手在肚子上，慢慢握成拳頭。<\/p>\n<p>「我毋要緊。」她說，「伊袂使。」<\/p>\n<p>廂房裡很安靜。外面的庭院裡，有人在掃落葉，掃把一下一下刮著石板。<\/p>\n<p>陳守一想起那四行很小的字。宿主甘願。<\/p>\n<p>「少奶奶，」他說，「師父有留一个法度。毋免殺任何人。」<\/p>\n<p>月娥看著他。<\/p>\n<p>「愛三个人。」他說，「妳，小滿，佮我。三个人做伙唱一條歌，唱煞，伊就會走。毋是封起來，是真正走。」<\/p>\n<p>「走去佗位？」<\/p>\n<p>陳守一想了想。他不知道。手札上沒有寫。<\/p>\n<p>「伊該去的所在。」他說。<\/p>\n<p>月娥看了他很久。然後她點點頭，伸出手，扶著床沿慢慢站起來。她站得很不穩，他伸手扶了她一下，她的手很冰。<\/p>\n<p>「我甘願。」她說，「欲按怎唱，你教我。」<\/p>\n<hr class=\"sep\">\n<p>傍晚，他回到客棧。小滿坐在門檻上等他，手上拿著一根樹枝，在地上畫圈圈。<\/p>\n<p>他在她旁邊坐下來。<\/p>\n<p>「小滿，」他說，「我有一件事愛拜託妳。」<\/p>\n<p>小滿把樹枝放下，看著他。<\/p>\n<p>他跟她說了。說得很慢，用她聽得懂的話。說有一條歌，要三個人一起唱，少奶奶一個，他一個，她一個。說唱的時候，要把那包紅布，還回去。<\/p>\n<p>「還予啥人？」<\/p>\n<p>「還予伊。」陳守一說，「彼包是妳提的。妳愛家己還。」<\/p>\n<p>小滿低下頭，看著懷裡那包粉紅色的紅布。她抱了好幾天，布上已經有她手心的形狀了。<\/p>\n<p>「唱歌的時陣，」她小聲問，「伊會出來無？」<\/p>\n<p>陳守一想說謊。他看著她的臉，說不出來。<\/p>\n<p>「會。」他說。<\/p>\n<p>小滿抱著紅布，抱得很緊。她沒有哭，也沒有說好。她就坐在那裡，看著街上的人慢慢收攤，看著天色一點一點暗下來。<\/p>\n<p>「小師父，」過了很久，她說，「你會佇我邊仔無？」<\/p>\n<p>「會。」<\/p>\n<p>「你袂走？」<\/p>\n<p>「我袂走。」<\/p>\n<p>小滿點點頭。她把頭靠在他的手臂上，靠了一會兒，說：<\/p>\n<p>「彼條歌，你先教我。」<\/p>\n<hr class=\"sep\">\n<p>那天晚上，他沒有點燈，借著窗外的月光，教小滿唱歌。<\/p>\n<p>一句一句地教。她學得很快，比他當年快多了，第一句只唱了兩遍就會了。第二句卡了很久，她的聲音太高，總是在往下沉的地方翻上去，他就一遍一遍地示範，她就一遍一遍地跟。<\/p>\n<p>唱到第四句，她睡著了，頭靠在他的腿上，嘴裡還在含糊地哼。<\/p>\n<p>他輕輕把她移到床上，蓋好被子。<\/p>\n<p>然後他坐到桌前，打開那冊「封」字的手札，翻到最後一頁。最後一頁是空白的，前面也空白了很多頁，師父的字停在半句話上：凡封，皆有期。期滿，<\/p>\n<p>他磨了墨，拿起師父的筆。筆桿上有師父握出來的兩道淺淺的凹痕，他的手指放上去，剛好。<\/p>\n<p>他一筆一筆地寫，寫得很慢，很用力。他的字很醜，比師父的醜多了，他知道。<\/p>\n<p class=\"doc\">此物不能殺，只能葬。<br>葬需三人：宿主、放它出來的人、封它的人。<\/p>\n<p>寫到「一」的時候，他的筆尖在收尾的地方往上挑了一下，挑出一個小小的鉤。跟他在土地廟神案腳刻的那一筆一樣。<\/p>\n<p>他看著那個鉤子，沒有改。<\/p>\n<p>他把筆洗乾淨，放回筆架。窗外的月亮又比昨晚瘦了一點點，掛在河的上游，很淡，很遠。小滿在床上翻了個身，咕噥了一句什麼，又睡著了。<\/p>\n<p>宿主。放它出來的人。封它的人。<\/p>\n<p>三個人，都齊了。<\/p>", "chars": 3019}, "21": {"title": "第二十一章　逃", "html": "<p class=\"era\">一九三一年，霧川渡。<\/p>\n<p>他們選在子時，選在渡口。<\/p>\n<p>陳守一想過別的地方。土地廟太小，曬穀場太大，沈家的後院有老太爺。最後他還是選了渡口，選了那道石階，選了師父倒下去的地方。他說不出為什麼，只覺得如果要結束，就該在那裡結束。<\/p>\n<p>天黑以前，他一個人去石階上把師父的血跡洗了。用一個破木桶，從河裡一桶一桶地提水上來，用手搓。石頭吸了血，搓不乾淨，留下一塊一塊淡褐色的印子，像青苔。他搓到手指破皮，才停下來。<\/p>\n<p>七盞燈，他只買得起三盞。他把三盞燈排在石階上，排成一個歪歪的三角形。一盞給月娥，一盞給小滿，一盞給自己。<\/p>\n<hr class=\"sep\">\n<p>月娥是自己走來的。<\/p>\n<p>沈家的人不知道。她說她吃晚飯的時候說頭痛，早早回房，等丫鬟睡了，從後門出來。她穿著那件素淨的藍衣，頭髮梳好了，手上拿著一盞小燈籠，一路走到渡口，在石階頂上停下來，往下看。<\/p>\n<p>「小師父。」<\/p>\n<p>「少奶奶。」<\/p>\n<p>她慢慢走下來，在第一盞燈旁邊坐下。她的臉很白，可是眼睛很清楚。<\/p>\n<p>「我今仔日睏規工。」她說，「睏較飽，伊就較慢出來。」<\/p>\n<p>陳守一點點頭。他知道這不是真的，她只是想讓他安心。<\/p>\n<p>小滿是他牽來的。她抱著那包紅布，一路都沒說話，手心全是汗，濕得他的手也跟著濕。走到石階頂上，她停住了，看著底下黑黑的河，看了很久。<\/p>\n<p>「小滿。」<\/p>\n<p>她沒有動。<\/p>\n<p>「我佇妳邊仔。」他說。<\/p>\n<p>她把那包紅布抱得更緊，低著頭，一步一步走下來，在第二盞燈旁邊坐下。她坐得離月娥很遠，遠到兩個人中間可以再坐兩個人。<\/p>\n<p>陳守一在第三盞燈旁邊坐下。他從懷裡拿出師父的銅鈴，放在膝蓋上，用拇指壓住鈴舌。<\/p>\n<p>河水很平。月亮比昨天又瘦了一些，掛在上游，光很淡。對岸一盞燈都沒有。<\/p>\n<p>「欲開始矣。」他說。<\/p>\n<hr class=\"sep\">\n<p>他先唱。<\/p>\n<p>第一句，往下沉。他的聲音在發抖，抖得不像他自己的。第二句好一點。唱到第三句，月娥跟上來了。她的聲音很細，很輕，像怕吵醒什麼，可是她一句都沒唱錯。他教了她一個中午，她記住了。<\/p>\n<p>小滿沒有唱。<\/p>\n<p>她坐在那裡，抱著紅布，張著嘴，發不出聲音。<\/p>\n<p>陳守一沒有停。他一邊唱，一邊看著她，用眼睛跟她說：沒關係，慢慢來。<\/p>\n<p>唱到第五句，小滿的嘴唇動了。很小聲，小到幾乎聽不見，跟在他的聲音後面，慢了半句。<\/p>\n<p>然後，月娥的燈籠滅了。<\/p>\n<p>沒有風。燈籠就這樣自己滅了，像有人從裡面吹了一口氣。<\/p>\n<p>河水開始動。<\/p>\n<p>不是浪，是一圈一圈的波紋，從河中間往岸邊推過來，一圈，又一圈，很慢，很規律，像有什麼東西在水底下呼吸。<\/p>\n<p>月娥的歌聲停了一下，又接上。她的手放在肚子上，指節都白了，可是她沒有停。<\/p>\n<p>陳守一也沒有停。他的聲音越來越穩。他想起師父泡腳的樣子，想起熱水冒出來的白氣，想起師父閉著眼睛聽他唱，一句也不說好不好。<\/p>\n<p>唱到第七句，小滿的聲音大了一點。<\/p>\n<p>唱到第八句，水裡出來了一隻手。<\/p>\n<hr class=\"sep\">\n<p>很小的手。<\/p>\n<p>小孩的手，濕的，白的，手指細細的，從第一級石階旁邊的水面伸出來，攤開，掌心朝上，停在那裡。<\/p>\n<p>像在等什麼。<\/p>\n<p>陳守一的歌聲沒有斷。他看了小滿一眼，點了點頭。<\/p>\n<p>該還了。<\/p>\n<p>小滿看著那隻手。她慢慢站起來，抱著那包紅布，一步，一步，往水邊走。她走得很慢，腳在發抖，可是她在走。她的嘴裡還在唱，唱得亂七八糟，調子全跑了，可是她在唱。<\/p>\n<p>她走到最下面那一級石階，蹲下來，把紅布從懷裡拿出來，伸出去。<\/p>\n<p>紅布離那隻手，只剩一個指頭的距離。<\/p>\n<p>然後，那隻手動了。<\/p>\n<p>它沒有接紅布。它翻過來，手指張開，往前伸，輕輕地，碰了一下小滿的手腕。<\/p>\n<p>就像一個小孩，想拉另一個小孩的手。<\/p>\n<hr class=\"sep\">\n<p>小滿尖叫了。<\/p>\n<p>那一聲尖叫，把整條河都震碎了。她往後跌坐在石階上，抱著紅布，手腳並用地往上爬，爬上第二級，第三級，爬到石階頂上，站起來，跑。<\/p>\n<p>「小滿！」<\/p>\n<p>陳守一站起來。歌斷了。<\/p>\n<p>石階上那三盞燈，一盞接一盞，滅了。<\/p>\n<p>月娥的歌也斷了。她跪在第一盞燈旁邊，雙手抱住肚子，彎下腰，整個人在發抖。她的背上，有什麼東西在動，像布底下有一隻手在推。<\/p>\n<p>小滿跑到石階頂上，停了一下。她回過頭來，看著他，張開嘴，喊了一句話。<\/p>\n<p>他聽不見。<\/p>\n<p>河裡在同一刻傳出一聲尖叫，很多聲音疊在一起，老的、小的、男的、女的，像整條河的水都在叫。那聲音蓋過了一切，蓋過了風，蓋過了他自己的心跳，蓋過了小滿喊的那句話。<\/p>\n<p>他只看到她的嘴在動，看到她的眼淚，看到她喊完那句話以後轉過身，消失在石階頂上的黑暗裡。<\/p>\n<hr class=\"sep\">\n<p>月娥抬起頭。<\/p>\n<p>那不是她的臉了。嘴角拉開，拉到一個人不可能笑出來的角度，眼睛半閉著，很安詳，很滿足。她的手還放在肚子上，可是那雙手現在是在撫摸，很溫柔地撫摸，像在安撫裡面的什麼東西。<\/p>\n<p>「小師父，」那個聲音說，很多聲音疊在一起，「你看。少一个人。」<\/p>\n<p>鎮上的方向，傳來胡琴的聲音。甜的，黏的，像糖漿。腳步聲從主街上響起來，很多人，很整齊，啪，啪，啪，往渡口來。<\/p>\n<p>陳守一站在那裡，手上握著銅鈴。<\/p>\n<p>少一個人。<\/p>\n<p>他想起那四行很淡的小字。宿主甘願，放之者歸還，封之者放手。他想起師父最後說的話，要三個……要三個……師父沒說完的，是什麼？三個人到齊了，然後呢？唱完了，然後呢？<\/p>\n<p>他想起油紙包。想起那天早上，它比前一天薄了一指。想起靠窗那張冰冷的床。想起一艘順著大水往下游去、從頭到尾不回頭的小船。<\/p>\n<p>師父的手札有兩冊。他只有一冊。<\/p>\n<p>就算三個人都在，他也不知道歌唱完以後，還要做什麼。<\/p>\n<hr class=\"sep\">\n<p>他轉身，往坡頂跑。<\/p>\n<p>不是逃。他跑上石階，跑過師父倒下的地方，跑過那三盞已經熄掉的燈，一直跑到坡頂那座城隍廟前面。廟門關著，跟那天晚上一樣。<\/p>\n<p>他跪下來。<\/p>\n<p>他記得手札裡關於封的那一頁。封，以物封，以壽封，以魂封。以魂封者，封在，則形止。他第一次讀的時候不懂「形止」是什麼意思，現在他好像懂了，又好像不想懂。<\/p>\n<p>他把銅鈴舉起來。<\/p>\n<p>師父那天晚上搖了三下，門沒有開。<\/p>\n<p>他沒有搖。他把鈴放在門檻前面，雙手撐地，額頭貼在冰冷的石板上。<\/p>\n<p>「城隍爺，」他說，「弟子陳守一，葛青崖的徒弟。」<\/p>\n<p>他的聲音在抖。他停了一下，讓它穩下來。<\/p>\n<p>「弟子今仔日佇遮立誓。會使封，會使葬，袂使替任何一界出手。弟子若違誓，名字由城隍爺收轉去。」<\/p>\n<p>他抬起頭，看著那扇門。<\/p>\n<p>「弟子無師父的本事。弟子只有家己。」他說，「求城隍爺，予弟子一个封法。代價，弟子家己付。」<\/p>\n<p>廟裡很安靜。<\/p>\n<p>坡底下的腳步聲越來越近。胡琴聲越來越近。<\/p>\n<p>然後，廟裡亮了。<\/p>\n<p>很小的一點光，在門縫底下。是神案上的那盞燈。那天晚上，鈴響到第三聲就熄掉的那盞燈。<\/p>\n<p>它亮了。<\/p>\n<p>門沒有開。可是那一點光從門縫底下流出來，流過門檻，流到他的手邊，暖暖的，像一碗剛泡好的熱水。<\/p>\n<p>陳守一看著那一點光，眼淚掉下來。他擦掉，撿起銅鈴，站起來，轉身往坡下走。<\/p>\n<hr class=\"sep\">\n<p>封的時候，很痛。<\/p>\n<p>不是身體痛。是像有人從他胸口裡面，抓住了什麼東西，慢慢地，一點一點地，往外抽。像抽一條很長很長的線，線的另一頭綁在他的心上，他的記憶上，他這輩子所有的日子上。<\/p>\n<p>他跪在月娥面前，一手按著自己的胸口，一手按在她的肚子上。月娥沒有掙扎。那張臉在笑，笑著看他，好像在看一件很好玩的事。<\/p>\n<p>「你會後悔。」那個聲音說。<\/p>\n<p>「我知。」他說。<\/p>\n<p>那條線從他胸口抽出來，穿過他的手，穿進她的身體。一寸，一寸。月娥的笑容開始抖，開始歪，像一張被雨打濕的紙。那些疊在一起的聲音在叫，越叫越小，越叫越遠，像沉進一口很深的井。<\/p>\n<p>最後一寸線離開他的時候，他聽見了一聲很小很小的哭。<\/p>\n<p>是一個小孩的哭聲。從很深的地方傳上來，只有一聲，就沒有了。<\/p>\n<p>月娥倒在他手臂上。她的臉又是她自己的臉了，蒼白，疲倦，睡著了一樣。她的手還放在肚子上。<\/p>\n<p>坡上的胡琴聲停了。腳步聲停了。整個霧川渡，在同一刻，安靜下來。<\/p>\n<hr class=\"sep\">\n<p>天快亮的時候，他把月娥送回沈家的後門。丫鬟還在睡，他把她扶進廂房，蓋好被子，退出來，關上門。<\/p>\n<p>他沒有去找小滿。<\/p>\n<p>他走到土地廟，搬板凳，爬上神案，把那包粉紅色的紅布……不，紅布不在他手上。在小滿那裡。<\/p>\n<p>他站在神案上，看著空空的橫樑，站了很久，才慢慢爬下來。<\/p>\n<p>他走到河邊，蹲下來洗臉。河水很冷。他捧起水，潑在臉上，睜開眼睛的時候，看見了自己的倒影。<\/p>\n<p>天剛亮，水很平，倒影很清楚。一個十七歲的少年，瘦，臉色很白，眼睛底下兩圈青。<\/p>\n<p>他眨了一下眼睛。<\/p>\n<p>水裡的他，過了一下，才眨。<\/p>\n<p>他蹲在那裡，看著水裡那個慢了一點的自己，看了很久。然後他伸手，把水攪亂。<\/p>\n<hr class=\"sep\">\n<p>渡船是第三天早上開的。<\/p>\n<p>撐船的不是小滿的阿爸。<\/p>\n<p>那天早上，跟著跳過舞的人都醒了，站在自己家門口，你看我、我看你，什麼都不記得。可是門上被敲過三下的那十幾戶，沒有人醒來。豆腐店的老闆，打鐵的阿炎，碼頭的阿福。他們躺在自己的床上，很安靜，嘴角還帶著一點笑，身體已經冷了。床邊的草鞋，鞋頭朝外。<\/p>\n<p>小滿的阿爸，也是。<\/p>\n<p>撐船的換成了一個沒見過的船夫。<\/p>\n<p>陳守一背著師父的布包，站在碼頭上，等上船。<\/p>\n<p>小滿來了。她站在碼頭的柱子後面，抱著那包紅布，只露出半張臉。她的眼睛腫得很厲害，像哭了兩天兩夜。<\/p>\n<p>陳守一走過去，在她面前蹲下來，跟她一樣高。<\/p>\n<p>她往後退了一步。<\/p>\n<p>「小滿。」他說，「毋怪妳。」<\/p>\n<p>她看著他。嘴唇在抖。<\/p>\n<p>「彼包，」他看著她懷裡的紅布，「妳先替我顧。顧予好。」<\/p>\n<p>小滿點頭，用力地點，點得眼淚都甩出來了。<\/p>\n<p>他想再說什麼，船夫在喊了。他站起來，摸了摸她亂糟糟的頭髮，摸到一個打結的地方，用手指輕輕梳開。<\/p>\n<p>「我們還會再見。」他說。<\/p>\n<p>他上了船。船離岸的時候，他沒有回頭。他知道她還站在那根柱子後面，抱著那包紅布，一直看著他。他知道，可是他沒有回頭。<\/p>\n<p>夜裡走路，別回頭。現在是白天，他還是沒有回頭。<\/p>\n<p>他怕他一回頭，就會看見那個七歲的女孩在哭，就會跳下船，就再也走不了了。<\/p>\n<hr class=\"sep\">\n<p>周遠醒過來的時候，天還沒亮。<\/p>\n<p>他躺在床上，看著天花板，聽著自己的呼吸。他記得那條河，記得那三盞燈，記得那隻小小的、濕濕的手。他記得小滿回過頭來喊了一句話。<\/p>\n<p>他想不起來她喊了什麼。<\/p>\n<p>他閉上眼睛，拚命地想。那張哭著的臉，那張在動的嘴。一個字都沒有。只有河裡那一聲很多人疊在一起的尖叫，蓋住了一切。<\/p>\n<p>他起來，去浴室洗臉。他低著頭，捧水，潑在臉上，水從下巴滴下去。他抬起頭，伸手去拿毛巾。<\/p>\n<p>洗手台上方那面鏡子，他好幾年沒有正眼看過了。<\/p>\n<p>他看了。<\/p>\n<p>他抬起頭。鏡子裡的人，過了一下，才抬起頭。<\/p>\n<p>他伸手。鏡子裡的手，慢了一點，才跟上。<\/p>\n<p>跟河面上那個十七歲的少年一樣。慢了一點點。<\/p>\n<p>這一次，他沒有把視線移開。他站在洗手台前，水從下巴滴下去，看著鏡子裡那個慢了一拍的自己。他看了很久，久到窗外的天開始變灰，久到他覺得那個人好像也在看他，好像也有話想說，也一樣說不出來。<\/p>", "chars": 4059}, "22": {"title": "第二十二章　病歷", "html": "<p>那三個焦糖布丁，在周遠的冰箱裡放了五天。<\/p>\n<p>休假第六天下午，他帶著它們上了松嶺。櫃檯的護理師看見他手上的塑膠袋，什麼都沒問，撥了一個分機。這一次，她掛上電話的表情沒有那麼奇怪了。<\/p>\n<p>「何醫師說，你直接上去。」<\/p>\n<hr class=\"sep\">\n<p>阿婆醒著。<\/p>\n<p>她坐在床上，背靠著枕頭，臉對著窗外的松林。下午的光從樹縫裡漏進來，在她的被子上落成一塊一塊的亮斑。她的兩隻手還是交握在胸口，握得很緊，像抱著什麼。<\/p>\n<p>周遠拉了椅子坐在床邊，撕開布丁的蓋子，插上湯匙。<\/p>\n<p>「阿婆，」他說，「布丁。焦糖的。」<\/p>\n<p>阿婆沒有看他。他就舀了一小匙，放到她嘴邊，等著。<\/p>\n<p>等了很久，阿婆的嘴唇動了一下，張開一條縫。他把湯匙送進去。她含著，慢慢地抿，抿了很久，才吞下去。<\/p>\n<p>他舀第二匙。<\/p>\n<p>吃到第五匙的時候，阿婆轉過頭來看他。混濁的眼睛，在他臉上停了一會兒，然後往下移，移到他拿湯匙的那隻手的手腕上。<\/p>\n<p>她鬆開交握的手，伸出一隻，用乾瘦的手指，在他手腕上摸了一圈。很輕，像在找什麼東西。<\/p>\n<p>摸完了，她皺起眉頭，好像不太高興，又好像很失望。她把手縮回去，重新交握在胸口，轉過頭，繼續看窗外。<\/p>\n<p>周遠看著自己空空的手腕。<\/p>\n<p>他把剩下的布丁一匙一匙餵完。阿婆每一口都吃了。吃完最後一口，她閉上眼睛，像是睡著了。周遠把空杯子收進塑膠袋，起身的時候，聽見她很小聲地說了一句話。<\/p>\n<p>「甜。」<\/p>\n<hr class=\"sep\">\n<p>何靜在走廊上等他。<\/p>\n<p>她靠在牆邊，手上抱著一個很舊的牛皮紙檔案夾，紙邊已經捲起來了，泛著一種很深的黃。她看著他手上那袋空布丁杯，看了一下。<\/p>\n<p>「她吃完了？」<\/p>\n<p>「三個都吃完了。」<\/p>\n<p>何靜點點頭，沒有說話。她低頭看著懷裡的檔案夾，大拇指在封面的邊緣來回地磨。<\/p>\n<p>「周遠，」她說，「這是病人隱私。照規定，我一個字都不能給你看。」<\/p>\n<p>「我知道。」<\/p>\n<p>「到現在還是病人隱私。」她說，「我現在做的事，被院方知道，我會被記過。」<\/p>\n<p>她把檔案夾遞給他。<\/p>\n<p>「她最近吃得越來越少。」何靜說，「布丁是她這三個月吃得最多的一次。她在等一個東西，我不知道是什麼。我在這裡六年，我照顧她六年，我不知道她在等什麼。」她停了一下，「你好像知道。」<\/p>\n<p>周遠接過檔案夾。<\/p>\n<hr class=\"sep\">\n<p>他們在員工休息室裡看。<\/p>\n<p>休息室很小，一張圓桌，兩張塑膠椅，一台嗡嗡響的舊冰箱，牆上貼著一張已經過期的衛教海報。何靜泡了兩杯即溶咖啡，放在桌上，自己沒有喝。<\/p>\n<p>檔案夾裡的病歷是手寫的。墨水已經褪成淡褐色，字是那種老式的、很工整的楷書，一筆一畫，像是用毛筆寫的硬筆字。<\/p>\n<p class=\"doc\">入院日期：民國四十三年三月<br>姓名：林小滿<br>出生：民國十三年<br>籍貫：霧川渡<br>主訴：自稱幼時見過「夜遊神」，堅信其仍在人間。每逢月圓不肯進食，徹夜坐於窗前。雙手常作抱物狀，旁人欲分開，則大哭不止。<br>家屬述：病人七歲時，父親於某夜無故死亡。病人自此性情大變，夜不成眠，屢次欲投河，被救回。成年後嫁人生子，症狀時好時壞。近年加劇，夫家無力照顧，送院。<\/p>\n<p>周遠讀到「七歲」那一行，停了很久。<\/p>\n<p>民國十三年出生。一九二四年。一九三一年，七歲。<\/p>\n<p>「我上次給你算過。」何靜說，看著他的臉，「你在山腳下傳簡訊問我她愛吃什麼。我當時就在想，你為什麼突然想知道一個病人愛吃什麼。」<\/p>\n<p>「妳算出來了？」<\/p>\n<p>「我是醫生，我會減法。」何靜說，「一百零二。你在那之前就知道了。你一進門，她叫你守一，你就知道了。」<\/p>\n<p>周遠沒有否認。<\/p>\n<p>「她說，」何靜看著那頁病歷，聲音放得很低，「她見過夜遊神。」<\/p>\n<p>她說這幾個字的時候，用的是一種很小心的語氣，像拿著一個很燙的東西。不是不相信，是不知道該怎麼放下。<\/p>\n<hr class=\"sep\">\n<p>病歷後面夾著一張訪客紀錄的影本。<\/p>\n<p>是療養院大門的訪客登記簿，近一年的，何靜從警衛室偷偷印出來的。她用黃色螢光筆劃了好幾行。<\/p>\n<p>每個月一次。同一個名字，同一手很圓的字。<\/p>\n<p class=\"doc\">探視對象：七號床　林小滿<br>訪客：林依<br>關係：曾孫女<\/p>\n<p>周遠看著那個名字。<\/p>\n<p>「我上次跟你說，每個月有個年輕女生來看她。」何靜說，「我從來沒問過她是誰。她很安靜，坐一個下午，握著阿婆的手，有時候會說話，有時候什麼都不說。走的時候會跟護理站說謝謝。」<\/p>\n<p>她指著紀錄最右邊那一欄。那一欄是警衛手寫的備註，大部分是空白的，只有在林依那幾行，每一次都寫著同樣的四個字：<\/p>\n<p class=\"doc\">院長室會客。<\/p>\n<p>「這是什麼？」<\/p>\n<p>「她每次要走的時候，院長室的秘書都會下來，請她上去坐一下。」何靜說，「我以為是院長關心家屬。院長很少下樓，可是他很重視長期住院的病人，每年都捐很多錢給院裡。」<\/p>\n<p>「妳見過院長嗎？」<\/p>\n<p>何靜想了想。「見過幾次。院慶的時候。」她說，「很客氣的一個老先生。」<\/p>\n<p>周遠把那一欄看了很久。<\/p>\n<p>很客氣的老先生。他想起文史館那本登記簿。想起那個一筆拉到底的簽名。想起那句沒頭沒腦的留言。<\/p>\n<p>他什麼都沒說。他把影本夾回病歷裡。<\/p>\n<hr class=\"sep\">\n<p>傍晚，何靜送他到停車場。<\/p>\n<p>她在車邊站了一會兒，沒有走。山上的風很大，吹得松林一整片地響。她把白袍的領子拉起來。<\/p>\n<p>「我阿嬤以前說過一件事。」她忽然說，眼睛看著遠處的山，「她說我們家祖先是在河上擺渡的。很早以前，好幾代以前。她說祖先有一天晚上，想救一個人，沒救到。之後家裡就有一個規矩：每年農曆十月十五，要在河邊點一盞燈。」<\/p>\n<p>「妳們還有點嗎？」<\/p>\n<p>「我阿嬤過世以後就沒有了。」何靜說，「我媽覺得那是迷信。我也覺得。」<\/p>\n<p>她把手插進白袍的口袋裡，摸到那支貼著便利貼的筆。<\/p>\n<p>「我不知道我為什麼要跟你講這個。」她說。<\/p>\n<p>周遠看著她。<\/p>\n<p>「妳媽，」他說，「妳回她電話了嗎？」<\/p>\n<p>何靜愣了一下，低頭看著那張「回媽電話」的便利貼，看了很久，忽然笑了。是周遠第一次看到她笑，很短，有點不好意思。<\/p>\n<p>「還沒。」她說，「我現在打。」<\/p>\n<p>她拿出手機，往旁邊走了幾步。周遠聽見她說：「媽，是我。」然後她轉過身去，背對著他，聲音小下來。<\/p>\n<p>他上車，沒有馬上發動。<\/p>\n<hr class=\"sep\">\n<p>他從公事包裡拿出記事本，翻到新的一頁。<\/p>\n<p>他畫了兩欄。<\/p>\n<p>左邊一欄，寫著一九三一。底下三行：<\/p>\n<p>宿主　月娥<br>放它出來的人　小滿<br>封它的人　陳守一<\/p>\n<p>右邊一欄，寫著二〇二六。<\/p>\n<p>宿主　沈言<br>放它出來的人　林依<br>封它的人<\/p>\n<p>他寫到第三行，筆停在那裡。<\/p>\n<p>他看著那個空格，看了很久。窗外，何靜還在講電話，一隻手扶著額頭，在笑，又好像在哭。松林的影子越拉越長，爬過停車場，爬上他的車窗。<\/p>\n<p>他沒有寫下任何名字。他把筆蓋好，夾進記事本，發動了車子。何靜在後照鏡裡朝他揮了揮手，手機還貼在耳朵上。他也揮了一下，往山下開。<\/p>\n<p>轉出停車場的時候，他從後照鏡裡瞄到二樓有一扇窗，窗簾拉開了一半，窗後好像站著一個穿淡藍色衣服的人，臉朝著北邊，朝著山線的方向。<\/p>\n<p>他再看的時候，窗簾已經拉上了。<\/p>", "chars": 2534}, "23": {"title": "第二十三章　兩半", "html": "<p>周遠從松嶺下山，沒有回家。<\/p>\n<p>他在山腳的便利商店買了一瓶水、兩個飯糰，坐在車上吃完，然後把車開上山線。天黑以後的山線一盞路燈都沒有，只有車燈切開的一小段路，和兩邊一閃而過的反光標誌。雨從半路開始下，越下越大。<\/p>\n<p>九點多，他看見那棵榕樹。<\/p>\n<p>他把車停在路邊，熄火，關燈。雨打在車頂上，很密，很吵。他坐在黑暗裡，看著擋風玻璃外面那座墳。墳前沒有燈，可是他看得見，因為墳的那一邊沒有雨。雨下到墳前就停了，像有人在那裡拉了一道看不見的簾子。<\/p>\n<p>墳前坐著一個人。<\/p>\n<hr class=\"sep\">\n<p>周遠下車，走過去。雨打在他的肩膀上，走到墳前的那一步，雨停了。<\/p>\n<p>那個人坐在墓碑旁邊的石頭上，背靠著榕樹，一條腿伸直，一條腿曲著，手放在膝蓋上。他穿著一件很舊的長衫，顏色洗得分不出是灰還是藍。<\/p>\n<p>他抬起頭來。<\/p>\n<p>周遠站在那裡，動不了。<\/p>\n<p>他想過很多次，見到這個人的時候會是什麼樣子。林依說他有時候看起來二十幾，有時候很老很老。周遠想像過一個留著長鬍子的老人，或是一個看不出年紀的中年人。<\/p>\n<p>都不是。<\/p>\n<p>坐在那裡的，是一個十七歲的少年。瘦，臉色很白，眼睛底下兩圈青。頭髮剃得很短。是他在河面上、在土地廟裡、在渡口的石階上，用眼睛看過幾十次的那張臉。<\/p>\n<p>只是從來沒有從外面看過。<\/p>\n<p>少年的手腕上，綁著一條洗得發白的紅布條，結打得歪歪的。<\/p>\n<p>「你來矣。」他說。<\/p>\n<p>他的聲音很年輕，可是講話的樣子很老。慢，很慢，每一個字都像是從很遠的地方走過來的。<\/p>\n<p>「我等你足久矣。」<\/p>\n<hr class=\"sep\">\n<p>周遠在他對面坐下來。地是乾的，乾到坐下去會揚起一點灰。榕樹的鬚根垂在他們中間，被風吹得輕輕晃。<\/p>\n<p>他不知道該從哪裡問起。他想了一路，想好的問題全部不見了。<\/p>\n<p>最後他問的是：「小滿還好嗎？」<\/p>\n<p>少年愣了一下。然後他笑了，笑得眼角擠出幾條紋，左邊三條，右邊四條。<\/p>\n<p>周遠看著那幾條紋，喉嚨一緊。那是他師父的笑。不，那是葛青崖的笑。他分不清楚了。<\/p>\n<p>「你去看過伊矣。」少年說，「伊敢有咧食飯？」<\/p>\n<p>「今天吃了三個布丁。」<\/p>\n<p>少年點點頭，點了好幾次，低下頭看著自己手腕上那條紅布。<\/p>\n<p>「伊攏咧等。」他說，「我知。我袂當去。我離開這个所在，就散去矣。」<\/p>\n<p>他摸了一下那條紅布，又放下。<\/p>\n<p>「你替我共伊講，」他說，「我無放袂記得。」<\/p>\n<hr class=\"sep\">\n<p>「你是陳守一。」周遠說。<\/p>\n<p>少年沒有承認，也沒有否認。他看著周遠，看了很久。<\/p>\n<p>「彼个名，」他說，「已經毋是我的矣。」<\/p>\n<p>周遠想問那是什麼意思，少年先開口了。<\/p>\n<p>「你想欲知影十二冬前的代誌。」他說，「我講予你聽。你聽了，莫插喙，聽煞才問。」<\/p>\n<p>周遠點頭。<\/p>\n<p>少年把曲著的那條腿也伸直，兩隻手放在大腿上，看著榕樹外面的雨，開始講。他講得很慢，有時候講台語，有時候講國語，有時候講到一半停下來，好像要找一個很久沒用過的字。<\/p>\n<p>「十二冬前，做風颱彼暗，有人共伊放出來。」<\/p>\n<p>「佇和平村。彼个查某囡仔，沈和，伊是這一代的宿主。伊佇沈家的血脈內底，睏八十幾冬矣，睏甲好好的。彼暗，有人共伊叫醒。」<\/p>\n<p>「我趕到的時陣，規庄的人攏咧跳。我攔伊，攔一半。」<\/p>\n<p>他伸出兩隻手，掌心朝上，分開。<\/p>\n<p>「伊分做兩半。一半，轉去沈和的身軀。我用賰的魂的一半，做一罐藥，予沈和，叫伊逐工食，一工都袂使斷。瓶仔底我刻一个字，和平的和，是伊的名。我驚伊後來袂記得家己是啥人。」<\/p>\n<p>「彼罐藥，食袂了。」他說，「我的魂佇內底。伊食一粒，就閣生一粒。我的魂賰偌濟，藥就有偌濟。」<\/p>\n<p>「另外一半，」少年說，「走去矣。」<\/p>\n<hr class=\"sep\">\n<p>「伊順著山線，一路走起來，走到遮。」<\/p>\n<p>他抬了一下下巴，指著身後那條乾乾的街。<\/p>\n<p>「彼暗，這个鎮，」他說，「規个鎮的人，攏予伊帶走矣。」<\/p>\n<p>周遠的背上一陣發冷。他想起那條街。理髮院，雜貨店，藥房，下棋的老人。地瓜粥。多擺的那一副碗筷。<\/p>\n<p>「他們……」<\/p>\n<p>「你莫插喙。」少年說。<\/p>\n<p>周遠閉上嘴。<\/p>\n<p>「我追到這个鎮口，」少年說，「伊佇遮停落來。因為遮有一个人。」<\/p>\n<p>他看著周遠。<\/p>\n<p>「一个少年警察。」他說，「規身軀澹糊糊，車停佇路邊，手電仔提咧，一直咧喊一个名。我聽無清楚伊咧喊啥。伊喊甲喙都破去矣。」<\/p>\n<p>周遠聽不見雨聲了。<\/p>\n<p>「彼一半，就跳入去伊的身軀。」<\/p>\n<hr class=\"sep\">\n<p>很久，誰都沒有說話。<\/p>\n<p>「我無藥矣。」少年說，「我的魂，一半做藥予沈和，賰的，無夠我閣做一罐。我只賰一个法度。」<\/p>\n<p>他把一隻手放在自己胸口。<\/p>\n<p>「我共我家己賰的，攏封入去你的身軀。共彼一半壓咧。」<\/p>\n<p>周遠低頭看著自己的手。<\/p>\n<p>「所以你會夢著我的一生。」少年說，「我的魂佇你遐，我記得的，你攏會夢著。所以你敲門，只會曉敲兩下。你身軀內彼一半想欲敲第三下，我共伊擋咧。所以你袂照鏡，因為鏡內的你，比你慢一點點。你家己毋知，你的身軀知。」<\/p>\n<p>「我的字，」周遠說，「一的那個鉤子。」<\/p>\n<p>少年笑了一下。「我寫字足穤。你就愛忍耐。」<\/p>\n<p>周遠沒有笑。他想起 2014 年一月那份報告，那個平平的「一」。想起十月那份車禍報告，那個小小的鉤。想起老鄭說：你以前很愛笑，生了那場病以後就不講了。<\/p>\n<p>那不是病。<\/p>\n<p>「我在筆錄背面寫的那行字，」他說，「這次只擋住一個，還差一個。」<\/p>\n<p>「彼是我寫的。」少年說，「我攔著一半，封佇你身軀。另外一半，佇沈和身上，我只會當用藥壓，無法度葬。還差一个。還差一个人，佮我做伙葬伊。」<\/p>\n<p>他看著周遠。<\/p>\n<p>「十二冬，彼罐藥，伊攏無斷過。」他說，「到今年。」<\/p>\n<hr class=\"sep\">\n<p>雨小了一點。風從山谷那邊吹上來，把榕樹的鬚根吹得一齊往一邊倒。<\/p>\n<p>「你開槍彼暗，」少年說，「封條裂矣。」<\/p>\n<p>周遠想起那面碎掉的鏡子。想起他從來沒有正眼看過的那面浴室鏡子，鏡子裡那個慢了一拍的人。<\/p>\n<p>「你身軀內彼一半，伊佇內底，佮沈和身上彼一半，攏相通。」少年說，「伊會揣著伊。伊行佗位，你攏會知。伊夢啥，你攏會夢著。伊嘛會夢著你的夢。」<\/p>\n<p>這樣你就找得到她了。<\/p>\n<p>「所以那天，」周遠說，「在廟埕上，那兩個員警看不見她。」<\/p>\n<p>「伊醒咧的時陣，干焦身軀有封的人看會著伊。」少年說，「你看會著。因為你身上嘛有一半。」<\/p>\n<hr class=\"sep\">\n<p>「這座鎮，」周遠說，「他們都……」<\/p>\n<p>他說不下去。<\/p>\n<p>少年從長衫的口袋裡摸出三枚銅錢，就是那天壓在茶杯底下的那三枚。他沒有撒。他把它們放在掌心，用拇指一枚一枚推著。<\/p>\n<p>「卦，是問命的。」他說，「命，是活人才有的。一个人，三个錢仔攏徛咧，就是伊已經無命通算矣。」<\/p>\n<p>他看著手心裡的銅錢。<\/p>\n<p>「十二冬前彼暗，我行入這个鎮，想欲揣一个囡仔問路。我撒卦，三个攏徛咧。我一戶一戶撒。規條街，無一个人有命。」<\/p>\n<p>「彼暗，有一个人佇鎮口咧布陣。」少年說，聲音低下來，「一个我捌的人。伊驚規个鎮的人死去，帳面會歹看，就共這个鎮罩起來，予天頂佮地下攏看袂著。予這个鎮的人，繼續過日子。」<\/p>\n<p>「我攔伊。攔袂牢。陣嘛是做好矣，干焦予我撞破一角。」<\/p>\n<p>他回頭看了一眼身後那塊矮矮的墓碑。<\/p>\n<p>「我就倒佇彼一角。廟公共我埋佇遮。」他說，「我的墓，就硩佇彼个破空頂懸。所以你會入來，會出去。雨嘛會落到遮就停。」<\/p>\n<p>「他們不知道自己死了。」周遠說。<\/p>\n<p>「毋知。」<\/p>\n<p>「你為什麼不告訴他們？」<\/p>\n<p>少年看著他，看了很久。那張十七歲的臉上，有一種很老很老的疲倦。<\/p>\n<p>「毋通共伊講。」他說，「這馬共伊叫醒，伊連轉去的路都無。一个無名的魂，城隍的渡頭過袂去，只會佇河邊踅來踅去，踅一世人。」<\/p>\n<p>「那要怎麼辦？」<\/p>\n<p>「愛等。」少年說，「等有人會當一个一个，共伊的名喊轉來。」<\/p>\n<p>他把銅錢收回口袋。<\/p>\n<p>「這个鎮，毋是頭一个。」他說，「嘛袂是上尾一个。」<\/p>\n<hr class=\"sep\">\n<p>雨停了。不是墳這一邊，是整座山。雲散開了一點，露出一片很淡的月光。<\/p>\n<p>「你叫我來，」周遠說，「是要我做什麼？」<\/p>\n<p>少年站起來，拍了拍長衫上的灰。<\/p>\n<p>「葬伊。」他說，「三个人。宿主，放伊出來的人，封伊的人。」<\/p>\n<p>「封它的人，」周遠說，「是你。」<\/p>\n<p>少年搖頭。<\/p>\n<p>「我是一半。」他說，「我的魂，佇你身上。封伊的人，是你，也是我。」<\/p>\n<p>他看著周遠，眼睛很黑。<\/p>\n<p>「時間無多矣。封條裂開，伊會越來越強。沈和身上彼一半，今暝會出來。」<\/p>\n<p>周遠站起來。「今晚？」<\/p>\n<p>「伊咧揣路。伊欲來遮。」少年說，「伊欲來揣伊的另外一半。」<\/p>\n<p>他往鎮口外面看了一眼，看著那條往山下去的路，看著遠遠的、松嶺所在的那片黑暗。<\/p>\n<p>「你去松嶺。」他說，「天光進前。」<\/p>\n<hr class=\"sep\">\n<p>周遠走到車邊，拉開車門，停了一下。<\/p>\n<p>「你剛剛說，」他沒有回頭，「我那天晚上一直在喊一個名字。」<\/p>\n<p>「是。」<\/p>\n<p>「我在喊誰？」<\/p>\n<p>身後很久沒有聲音。他以為少年已經走了。他轉過身，面對著墳。<\/p>\n<p>少年還站在墳前，手放在那條紅布上。<\/p>\n<p>「我聽無清楚。」少年說，「彼个名，我嘛袂記得矣。」<\/p>\n<p>他停了一下。<\/p>\n<p>「毋過，你喊甲足傷心。」<\/p>\n<hr class=\"sep\">\n<p>周遠開車下山。<\/p>\n<p>車頭過墳，雨刷在乾玻璃上刮了一下，然後雨又落下來了，很小，很細。他把雨刷開到最慢。<\/p>\n<p>半路上，他從後照鏡裡看了自己一眼。<\/p>\n<p>鏡子裡的人，慢了一點，才看向他。<\/p>\n<p>他沒有移開視線。他看著鏡子裡那雙眼睛，那雙慢了一拍的眼睛，想著十二年前那個渾身濕透、站在鎮口喊一個名字喊到喉嚨破掉的年輕警察。<\/p>\n<p>他想不起來那個名字。<\/p>\n<p>他一直開，開過最後一個加油站，開上縣道，開向松嶺那片沒有燈的山。儀表板上的時間是凌晨一點十四分。他開得很快。<\/p>", "chars": 3495}, "24": {"title": "第二十四章　出院", "html": "<p>周遠到松嶺的時候，是凌晨三點四十分。<\/p>\n<p>山上沒有下雨。產業道路兩邊的松樹黑壓壓的，車燈照過去，一排一排的樹幹往後倒，像一隊一隊站得很直的人。最後一個彎道轉過去，療養院就在前面。<\/p>\n<p>整棟樓的燈都亮著。<\/p>\n<p>不是走廊那種夜間照明。是全部，每一扇窗，每一層樓，日光燈開到最亮，亮得整棟灰白色的樓在黑暗的山上像一個發光的盒子。<\/p>\n<p>只有四樓最右邊那一扇窗，是暗的。<\/p>\n<p>他把車停在大門前，沒有熄火，下車。<\/p>\n<hr class=\"sep\">\n<p>大門口站著一個人。<\/p>\n<p>是局裡派來守沈言的同事。周遠認得他，交通隊調過來支援的，姓郭，四十幾歲，有兩個女兒，手機桌布是她們在海邊的照片。<\/p>\n<p>老郭站在玻璃門外面，背對著門，面對著停車場。他的雙手往前平舉，手腕軟軟地垂著。<\/p>\n<p>他沒有在晃。他就站在那裡，一動也不動，像一尊被擺在門口的雕像。眼睛半閉，嘴角帶著一點笑。<\/p>\n<p>周遠走到他面前。<\/p>\n<p>「老郭。」<\/p>\n<p>老郭沒有反應。周遠在他眼前揮了揮手。他的眼皮動都沒動。<\/p>\n<p>周遠伸手去碰他的手腕。<\/p>\n<p>碰到的那一刻，周遠的手臂猛地一沉，像被什麼東西從底下往上提。他的手自己抬了起來，抬到跟老郭的手一樣高，手腕開始往下垂。<\/p>\n<p>他咬緊牙，把手抽回來，往後退了兩步，右手狠狠掐住左手虎口。那塊瘀青還沒退，一掐就痛得他眼前發白。<\/p>\n<p>痛讓他清醒了。他繞過老郭，推開玻璃門。<\/p>\n<hr class=\"sep\">\n<p>大廳很亮，很安靜。<\/p>\n<p>櫃檯後面的值班護理師趴在桌上，臉壓著一本攤開的護理紀錄，筆還握在手裡。周遠走過去，摸了摸她的脖子。脈搏很穩，呼吸很深。她睡著了，睡得很沉，嘴角也帶著一點笑。<\/p>\n<p>走廊的盡頭，傳來腳步聲。<\/p>\n<p>很輕。光著腳踩在磨石子地上的聲音，一步，一步，不快不慢，腳跟幾乎不沾地。<\/p>\n<p>周遠站在大廳中央，看著那條走廊。<\/p>\n<p>她從轉角走出來。<\/p>\n<p>淺藍色的病人服，頭髮披散，赤著腳。她的雙手垂在身體兩側，沒有舉起來。她走路的樣子很輕，身體隨著某種拍子微微地晃，像一邊走、一邊在聽一首只有她聽得見的歌。<\/p>\n<p>她經過七號房的時候，停了一下。<\/p>\n<p>七號房的門開著。周遠從大廳這邊看不見房間裡面，可是他聽見了一個很老、很乾的聲音，從那扇門裡傳出來。<\/p>\n<p>「去。」那個聲音說，「囡仔，去。」<\/p>\n<p>沈言站在門口，往房間裡看了一會兒。然後她點了點頭，繼續往前走。<\/p>\n<hr class=\"sep\">\n<p>她走進大廳，停下來。<\/p>\n<p>離周遠大概五步。跟九十五年前，月娥停在漁網前面的距離一樣。<\/p>\n<p>她沒有看他。她抬起頭，看著大廳角落天花板上那台監視器。黑色的半圓罩子，底下一顆紅燈，一閃一閃。<\/p>\n<p>周遠站在那裡，想往前走。他的腳沒有動。<\/p>\n<p>不是不想動。是他身體裡有個東西，在她走進大廳的那一刻醒過來了，像一隻聞到同類氣味的動物，豎起耳朵，安安靜靜地，往她的方向轉過去。他的胸口很熱，熱得發燙，那個地方有一條線，從他身體裡面一直延伸出去，延伸到她的身體裡面，繃得很緊，輕輕地在顫。<\/p>\n<p>兩半。<\/p>\n<p>「沈言。」他說。<\/p>\n<p>她轉過頭來。<\/p>\n<p>不是那個笑。是她自己的臉，蒼白，疲倦，眼睛裡有很深的血絲。她看著他，好像認出了他，又好像只是看見了一個很熟悉的影子。<\/p>\n<p>「周警官。」她說，「你嘛聽著矣，著無？」<\/p>\n<p>「聽到什麼？」<\/p>\n<p>「伊咧叫我。」她說，「伊佇山頂。伊佇彼个鎮。伊叫甲足久矣。」<\/p>\n<p>她說著，又抬頭看了監視器一眼。<\/p>\n<p>「我欲去揣伊。」<\/p>\n<p>周遠張開嘴，想說不行。想說妳不能走，妳是病人，妳是證人，外面有一整座山的黑暗。可是他身體裡的那一半，在她說「我欲去揣伊」的時候，往前傾了一下，像一個在門口等了很久的人，聽見了自己的名字。<\/p>\n<p>他沒有說出口。<\/p>\n<p>沈言對著監視器，嘴唇動了動。她的聲音很輕，很清楚，兩個字。<\/p>\n<p>「石崗。」<\/p>\n<p>然後她轉身，赤著腳，從周遠身邊走過去。走過去的時候，她的手背輕輕擦過他的手背。很冰。<\/p>\n<p>她推開玻璃門，走到老郭身邊，停了一下，像在跟他說晚安。然後她走下台階，走過停車場，走進松林底下那條產業道路的黑暗裡。<\/p>\n<p>腳步聲越來越遠，最後聽不見了。<\/p>\n<hr class=\"sep\">\n<p>周遠不知道自己在大廳站了多久。<\/p>\n<p>他的腳能動的時候，天邊已經灰了。他跑出玻璃門，跑下台階，跑到產業道路的入口。路上什麼都沒有。松林很安靜。他打開手機的手電筒往路上照，柏油路面上，一排很淺的泥腳印，從療養院的大門口開始，一步一步，往山下去。<\/p>\n<p>他沿著腳印往下走。走了大概兩百公尺，第一個彎道前面，腳印停了。<\/p>\n<p>不是變淡，不是走進草叢。是停了。最後一個腳印清清楚楚地印在路中間，腳尖朝著山下，前面什麼都沒有，像她走到這裡，就被誰牽起手，一步跨到了很遠的地方。<\/p>\n<p>他站在那裡，手電筒的光在發抖。<\/p>\n<p>身後，玻璃門被推開的聲音。<\/p>\n<hr class=\"sep\">\n<p>「周遠！」<\/p>\n<p>是何靜。她只穿著一件毛衣，頭髮散著，腳上是值班室的室內拖鞋，臉白得嚇人。<\/p>\n<p>「護理站的叫人鈴一直響，」她喘著氣，「我在值班室，怎麼樣都醒不過來，像被人壓著……我醒過來的時候，整棟樓的燈都開著……」<\/p>\n<p>她看見門口的老郭，愣了一下。老郭還舉著手。何靜衝過去，喊他的名字，拍他的臉，用力地拍。老郭的眼皮動了一下，手慢慢地放下來，一臉茫然地看著她。<\/p>\n<p>「醫師？」老郭說，「我……我站著睡著了？」<\/p>\n<p>何靜沒有回答他。她轉過頭，看著周遠。<\/p>\n<p>「沈言呢？」<\/p>\n<p>「走了。」<\/p>\n<p>「走去哪裡？」<\/p>\n<p>「石崗。」周遠說，「山線最後一站。」<\/p>\n<p>何靜盯著他。「你怎麼知道？」<\/p>\n<p>周遠沒有回答。他走回大門口，經過她身邊，抬頭看了一眼大廳角落那台監視器。紅燈還在閃。<\/p>\n<p>「調監視器。」他說，「妳自己看。」<\/p>\n<hr class=\"sep\">\n<p>何靜沒有馬上去監視室。<\/p>\n<p>周遠已經走到大廳中間了，才發現她沒跟上來。他回頭。<\/p>\n<p>她站在玻璃門前面，一動也不動。天亮了一點，大廳的燈還開著，那扇玻璃門像一面鏡子，映著外面的停車場、松林、灰色的天。她看著玻璃，看得很專心，臉上沒有表情。<\/p>\n<p>他走回去，站到她旁邊，順著她的視線看過去。<\/p>\n<p>玻璃門裡站著兩個人。一個是何靜。一個是他。<\/p>\n<p>玻璃裡的他，還面對著外面的停車場，還看著那條空空的產業道路。<\/p>\n<p>他已經轉過來了。他站在這裡，看著玻璃。玻璃裡的那個人，過了一下，很短的一下，才慢慢地把頭轉過來，看向他。<\/p>\n<p>何靜伸出手，手指碰到冰冷的玻璃，碰在那張臉的位置上。<\/p>\n<p>「你的倒影，」她說，聲音很輕，像怕把什麼東西吵醒，「慢了。」<\/p>\n<p>周遠沒有說話。<\/p>\n<p>他沒有移開視線，她也沒有。他們兩個並肩站在玻璃門前面，看著玻璃裡那個慢了一拍的周遠。何靜的手指一直停在那裡，沒有放下來，指尖在玻璃上壓出一圈淡淡的霧。<\/p>\n<p>「我第一次看見。」她說。<\/p>\n<p>她把手收回來，放進毛衣口袋裡，握成拳頭。然後她轉身往監視室走，走得很快，拖鞋在磨石子地上啪啪地響，沒有回頭。<\/p>\n<p>周遠推開玻璃門，走下台階，轉過身，抬起頭。<\/p>\n<p>四樓最右邊那扇窗，剛剛還是暗的。現在亮了。<\/p>", "chars": 2535}, "25": {"title": "第二十五章　山路", "html": "<p>監視器的畫面，何靜看了四次。<\/p>\n<p>第四次看完，她把螢幕關掉，在監視室的椅子上坐了很久，雙手放在膝蓋上，像一個在候診室等叫號的病人。周遠站在門口，沒有進去。<\/p>\n<p>「她說石崗。」何靜說，沒有回頭。<\/p>\n<p>「對。」<\/p>\n<p>「清清楚楚。對著鏡頭。」她說，「我看她的嘴唇看了四次。」<\/p>\n<p>她站起來，轉身，看著他。她的眼睛很紅，可是沒有哭。<\/p>\n<p>「我要通報。」她說，「病人失蹤，院方一定要通報。我會說她半夜自行離院，原因不明。警方會開始找。」<\/p>\n<p>「好。」<\/p>\n<p>「你呢？」<\/p>\n<p>「我去石崗。」<\/p>\n<p>何靜看著他。她張開嘴，像要說什麼，又閉上。過了一會兒，她走到桌邊，撕了一張便利貼，寫了一串號碼，貼在他的手背上。<\/p>\n<p>「每兩個小時打給我一次。」她說，「你沒打，我就報警，說你綁架我的病人。」<\/p>\n<p>周遠看著手背上那張黃色的紙。<\/p>\n<p>「我是認真的。」何靜說。<\/p>\n<p>「我知道。」<\/p>\n<hr class=\"sep\">\n<p>老郭在大廳的長椅上坐著，捧著一杯護理師泡給他的熱茶，臉色很灰。看見周遠經過，他站起來，站得太快，茶灑了一點在褲子上。<\/p>\n<p>「周組長，」他說，「我……我會不會被記過？」<\/p>\n<p>周遠想起阿凱。想起那罐熱的麥香奶茶。<\/p>\n<p>「不會。」他說，「你站著睡著了，整棟樓都睡著了。」<\/p>\n<p>「可是她從我旁邊走過去。」老郭說，聲音在抖，「我知道她從我旁邊走過去。我看得到，我就是動不了。她經過我的時候，還跟我說了一句話。」<\/p>\n<p>「她說什麼？」<\/p>\n<p>老郭低頭看著茶杯。<\/p>\n<p>「她說，」他說，「對不起，阿伯，害你冷到了。」<\/p>\n<hr class=\"sep\">\n<p>周遠在山腳加滿了油，買了一瓶水，一個麵包，往山線開。<\/p>\n<p>天氣很好。昨夜的雨把整片山洗過一遍，天空藍得很乾淨，山壁上的樹綠得發亮。縣道上車很少，偶爾有一台載著竹子的貨車從對面開過來，司機對他按一聲喇叭，打個招呼。<\/p>\n<p>開過第一個加油站，收音機響了。<\/p>\n<p>他沒有開收音機。他昨晚就關了，一路都沒開過。可是儀表板中間那個小小的螢幕亮了起來，沒有頻道，沒有頻率，只有一片沙沙聲，沙沙聲底下，慢慢浮上來一段旋律。<\/p>\n<p>輕快，甜，黏，像糖漿從屋簷上一滴一滴往下淌。<\/p>\n<p>是那一支。廟埕上那支。曬穀場上那支。床底下那支。<\/p>\n<p>周遠的手指在方向盤上收緊。<\/p>\n<p>他伸手去按電源鍵。按了，螢幕沒有暗。他又按了一次，長按，按到手指發白。旋律還在，不快不慢，跟著他的車速，彎道的時候慢一點，直路的時候快一點，像有人坐在他旁邊，跟著他的車，一路哼著。<\/p>\n<p>他把手放回方向盤上。<\/p>\n<p>他想起胸口那條線。想起它在大廳裡繃向沈言的時候，那種被拉扯的、溫熱的、想要跟上去的感覺。那支歌也在拉他。很溫柔地，很有耐心地。<\/p>\n<p>他張開嘴，唱了。<\/p>\n<p>不是那一支。是另一支。往下沉的那一支。師父泡腳的時候，要他學起來、毋免問的那一支。<\/p>\n<p>他唱得很難聽。他這輩子沒有在別人面前唱過歌，KTV 都是坐在角落幫人點歌。他的聲音很乾，很低，走音，有幾個地方他記不清楚，就用哼的帶過去。<\/p>\n<p>他唱到第三句的時候，收音機裡的旋律頓了一下。<\/p>\n<p>唱到第五句的時候，它開始亂了，拍子跟不上，越來越小聲。不像是被壓下去，倒像是有人停下手上的事，歪著頭，在聽。<\/p>\n<p>唱到第七句，收音機的螢幕暗了。<\/p>\n<p>沙沙聲沒有了。車裡只剩下引擎的聲音，輪胎壓過柏油的聲音，和他自己走了音的歌聲。<\/p>\n<p>他沒有停。他把那支歌一直唱完，唱到最後一句往下沉的地方，停了一拍，轉回來，結束。<\/p>\n<p>然後他打開車窗，讓山風灌進來。他的手心全是汗。<\/p>\n<hr class=\"sep\">\n<p>後座是空的。<\/p>\n<p>他知道是空的。他出發的時候檢查過，加油的時候也看過。可是過了第二個加油站以後，他一直覺得後座有人。<\/p>\n<p>不是看見。是感覺。像搭計程車的時候，知道後面坐著一個不說話的乘客。座椅好像往下陷了一點點，好像有人在呼吸，很輕，很慢，跟他的呼吸錯開半拍。<\/p>\n<p>他看了一眼後照鏡。<\/p>\n<p>後座空空的，椅套上有一片陽光。<\/p>\n<p>鏡子裡，他自己的眼睛在看著他。他眨了一下眼睛。<\/p>\n<p>鏡子裡的他，過了一下，才眨。<\/p>\n<p>他沒有移開視線。他看著鏡子裡那雙慢了半拍的眼睛，看了一個彎道那麼久，直到前面來了一台遊覽車，他才把目光放回路上。<\/p>\n<p>「你也要去嗎？」他對著空氣說。<\/p>\n<p>沒有人回答。可是後座那種有人的感覺，在他問完以後，好像輕輕地點了一下頭。<\/p>\n<hr class=\"sep\">\n<p>最後一塊里程牌，石崗　2。<\/p>\n<p>轉過最後一個彎，榕樹在那裡。他把車速放慢。<\/p>\n<p>山下的路是濕的，昨夜的雨還沒乾，路面上一灘一灘的水窪映著藍天。車頭經過那座墳的時候，輪胎壓上一層乾燥的灰，發出很細的沙沙聲。<\/p>\n<p>他把車停在墳前，下車。<\/p>\n<p>墓碑前面，三根香腳換成了新的，燒到一半。香灰落在石頭上，沒有被風吹散。<\/p>\n<p>他低頭看地上。<\/p>\n<p>鎮口這一段路，地是乾的，乾到一層細細的灰，像一張很平的紙。紙上有腳印。<\/p>\n<p>兩排。<\/p>\n<p>一排是赤腳。很小，很淺，腳趾的形狀清清楚楚，腳跟的地方幾乎沒有印子，好像走路的人只用腳尖著地。<\/p>\n<p>一排是布鞋。很舊的布鞋，鞋底磨平了，鞋尖有一個小小的補丁的痕跡。<\/p>\n<p>兩排腳印從墳前開始，並肩往前走。距離很近，近到如果是兩個人，應該是手牽著手。它們沿著乾掉的路面，一步一步，往鎮上去。<\/p>\n<p>周遠蹲下來，看著那排赤腳的腳印。<\/p>\n<p>最後一個，他在松嶺的山路上看過。腳尖朝著山下，停在路中間，前面什麼都沒有。<\/p>\n<p>這裡是接下去的那一步。<\/p>\n<hr class=\"sep\">\n<p>他跟著腳印走。<\/p>\n<p>經過理髮院，老闆坐在門口打瞌睡，跟上次一樣。經過雜貨店，阿伯在搬牛奶，跟上次一樣。經過廟口，兩個老人在下棋，紅方的車還困在角落。金牙阿伯抬頭看見他，笑著揮手，喊了一聲什麼，他沒聽清楚。<\/p>\n<p>他也揮了揮手。他想記住金牙阿伯的臉。他盯著看，看得很用力。<\/p>\n<p>腳印在民宿門口停下來。<\/p>\n<p>民宿的老闆娘坐在門口的小板凳上，看著街，跟林依說的一樣，好像在等什麼人。她看見周遠，站起來，拍了拍花襯衫上的灰。<\/p>\n<p>「你來矣。」她說，「伊攏佇樓頂等你。」<\/p>\n<p>「誰？」<\/p>\n<p>老闆娘笑了笑，沒有回答。她側身讓開，讓他進去。<\/p>\n<hr class=\"sep\">\n<p>樓梯很窄，木頭的，踩上去會響。二樓的走廊很短，盡頭一扇門，門縫底下透出一點光。<\/p>\n<p>周遠站在門前。<\/p>\n<p>門裡有聲音。很輕。有人在說話，有人在哭，哭得很小聲，像怕被人聽見。<\/p>\n<p>他抬起手，敲門。<\/p>\n<p>叩、叩。<\/p>\n<p>手停在第二下之後，跟每一次一樣。<\/p>\n<p>門裡安靜了一下。<\/p>\n<p>「幾下？」是林依的聲音。<\/p>\n<p>「兩下。」周遠說。<\/p>\n<p>門鎖喀的一聲開了。<\/p>", "chars": 2352}, "26": {"title": "第二十六章　三個人", "html": "<p>房間很小。<\/p>\n<p>木頭地板，一張單人床，一張矮桌，一扇對著後山的窗。窗簾是褪色的碎花布，拉開了一半，下午的光斜斜地照進來，照在床上，照在坐在床沿的那個人身上。<\/p>\n<p>沈言坐在床沿，穿著那件淡藍色的病人服，赤著腳。腳底很髒，沾滿了乾掉的泥和灰。她的雙手放在膝蓋上，掌心朝上。<\/p>\n<p>她在笑。<\/p>\n<p>那個笑，周遠見過。廟埕上，監視器裡，鏡子裡。嘴角拉開，拉到一個人不可能笑出來的角度，很安詳，很滿足。<\/p>\n<p>可是她在哭。<\/p>\n<p>眼淚從那雙半閉的眼睛裡流出來，一顆一顆，順著臉頰往下滑，滑過那個笑，滴在膝蓋上，滴進朝上的掌心裡。她沒有擦。她好像不知道自己在哭，又好像那個在笑的東西，不知道她在哭。<\/p>\n<p>林依跪在床邊的地板上。她的兩隻手捧在胸前，捧著兩樣東西：一只褪了色的白瓷小瓶，一只更小的黑瓶。她看見周遠，嘴唇動了一下，沒有發出聲音。<\/p>\n<p>窗邊站著一個人。<\/p>\n<p>穿著長衫，背對著房間，看著窗外的後山。他的手腕上綁著一條洗白的紅布條，在午後的光裡，像一道很淡的傷口。<\/p>\n<p>他沒有回頭。<\/p>\n<p>「坐。」他說。<\/p>\n<hr class=\"sep\">\n<p>周遠在矮桌旁邊坐下來。地板很硬，木頭有一股被太陽曬過的味道。<\/p>\n<p>「她是自己來的。」林依小聲說，「天快亮的時候，我聽到有人在敲樓下的門。兩下。我下去開，她就站在門口，光著腳。先生站在她旁邊，牽著她的手。」<\/p>\n<p>林依看了一眼窗邊的背影。<\/p>\n<p>「先生說，她走了足遠的路。」<\/p>\n<p>周遠想起那排停在山路中間的腳印。最後一步，腳尖朝著山下，前面什麼都沒有。<\/p>\n<p>他沒有說出來。<\/p>\n<p>「她一直這樣。」林依說，看著床上那張又笑又哭的臉，「從進門到現在。她有時候會跟我說話，是她自己的聲音。有時候……不是。」<\/p>\n<hr class=\"sep\">\n<p>床上的沈言，慢慢轉過頭來。<\/p>\n<p>她的眼睛睜開了一點，看著周遠。那雙眼睛很紅，佈滿血絲，裡面有一種很深、很遠的東西，像一個人站在很遠的岸邊，隔著一整條河看著你。<\/p>\n<p>「周警官。」<\/p>\n<p>是她的聲音。很啞，很輕。<\/p>\n<p>「嗯。」<\/p>\n<p>「我的薄荷……」她說，嘴角那個笑還掛著，眼淚還在流，「你後來，有再去澆嗎？」<\/p>\n<p>周遠看著她。<\/p>\n<p>「澆了。」他說，「上禮拜又去了一次。有一盆開花了，很小的白花。」<\/p>\n<p>沈言的嘴唇抖了一下。<\/p>\n<p>那個笑，在那一瞬間，鬆了一點點。只有一點點，嘴角往下掉了一毫米，像一條繃緊的橡皮筋，鬆開了一格。<\/p>\n<p>「開花了喔。」她說，「伊足愛撒嬌，毋過，伊會開花。」<\/p>\n<p>然後那個笑又拉回去了。<\/p>\n<p>她的頭偏過來，偏得很慢，很優雅，像一隻鳥。她看著周遠，那雙紅紅的眼睛裡，有另一個東西浮上來了。<\/p>\n<p>「你嘛來矣。」<\/p>\n<p>不是沈言的聲音。是很多聲音疊在一起，老的，小的，男的，女的，很甜，很黏，像糖漿。<\/p>\n<p>「宿主，」那個聲音說，眼睛從沈言自己身上，移到林依，移到周遠，「放我出來的人。封我的人。三个人，攏到矣。」<\/p>\n<p>它笑了。沈言的臉在笑，沈言的眼睛在哭。<\/p>\n<p>「可惜。」它說，「九十五冬前，嘛是按呢。三个人攏到矣。」<\/p>\n<p>它看向窗邊那個背影。<\/p>\n<p>「你講，這擺，會走去佗位？」<\/p>\n<hr class=\"sep\">\n<p>窗邊的人沒有回答。<\/p>\n<p>周遠看著那個背影，看著那條紅布條。他想起渡口的石階，想起三盞歪歪排成三角形的燈，想起一隻從水裡伸出來的、很小的手。想起一個七歲的女孩，尖叫著，爬上石階，跑進黑暗裡。<\/p>\n<p>他看向林依。<\/p>\n<p>林依跪在地板上，捧著那兩只瓶子，肩膀在抖。她看著床上的沈言，看著那個又笑又哭的人，眼淚也掉下來了。<\/p>\n<p>「小依。」<\/p>\n<p>那個甜甜的、疊在一起的聲音，叫她的名字。<\/p>\n<p>「妳閣有提啥物，無還我？」<\/p>\n<p>林依的手縮了一下。<\/p>\n<hr class=\"sep\">\n<p>周遠想起先生說過的話。這不是他的，也不是妳的。有一天，要親手還給她。<\/p>\n<p>他想起手札上那四行很淡的小字。宿主甘願，放之者歸還。<\/p>\n<p>他沒有說話。他只是看著林依，等她。<\/p>\n<p>林依低下頭，看著手心裡的兩只瓶子。白的那只，瓶底朝上，那個很小、很淺的「和」字，在光裡看得很清楚。黑的那只，小小的，裡面只剩幾顆藥，搖起來會輕輕地響。<\/p>\n<p>她把兩只瓶子握在一起，握得很緊。然後她站起來。<\/p>\n<p>她的腳跪麻了，站起來的時候晃了一下，扶著床沿才站穩。她在沈言面前蹲下來，跟坐在床沿的沈言一樣高。<\/p>\n<p>她伸出手，輕輕地，打開沈言放在膝蓋上的那隻手。那隻手很冰，手指僵硬，她一根一根地掰開，把掌心攤平。<\/p>\n<p>然後她把兩只瓶子，一起放進那個掌心裡。<\/p>\n<p>「這本來就是妳的。」林依說。<\/p>\n<p>她的聲音在抖，可是她說完了。<\/p>\n<p>「我還給妳。」<\/p>\n<hr class=\"sep\">\n<p>房間裡很安靜。<\/p>\n<p>窗外有一隻鳥在叫，叫了兩聲，停了。樓下傳來老闆娘洗菜的水聲，嘩啦嘩啦。<\/p>\n<p>沈言臉上的那個笑，停住了。<\/p>\n<p>不是消失。是停住。嘴角還拉在那個太寬的角度，可是它不動了，像一張照片，像一幅畫，像有人按下了暫停鍵。<\/p>\n<p>然後，它開始裂。<\/p>\n<p>從嘴角開始。那個弧度一點一點地往下掉，往下掉，掉得很慢，很不情願，像一個被搶走玩具的小孩，嘴巴還想撐著，臉已經垮了。眼睛裡那個很遠的、隔著一條河的東西，晃了一下，往後退。<\/p>\n<p>「妳……」那個疊在一起的聲音說，只說了一個字，就斷了。<\/p>\n<p>沈言的手指，在那兩只瓶子上，慢慢地，慢慢地收攏。<\/p>\n<p>她握住了。<\/p>\n<p>那個笑沒有了。<\/p>\n<p>剩下的，是一張很蒼白、很疲倦、哭得一塌糊塗的臉。沈言自己的臉。她低頭看著手心裡那兩只瓶子，看了很久，然後抬起頭，看著蹲在她面前的林依。<\/p>\n<p>「小依。」她說。<\/p>\n<p>林依撲上去，抱住她。<\/p>\n<p>兩個人抱在一起，跪在那張小床的床沿，哭得像兩個走丟了很久、終於在人群裡找到對方的小孩。沈言的手還握著那兩只瓶子，握得很緊，緊到指節發白，拳頭抵在林依的背上。<\/p>\n<p>周遠坐在矮桌旁邊，沒有動。<\/p>\n<p>窗邊的人，轉過身來了。<\/p>\n<p>十七歲的少年，瘦，白，眼睛很黑。他看著床邊那兩個抱在一起的女孩，看了很久。他的臉上沒有笑，可是眼角那幾條紋，左邊三條，右邊四條，淡淡地浮了出來。<\/p>\n<p>「放之者，歸還矣。」他說。<\/p>\n<p>他看向周遠。<\/p>\n<p>「今暝，子時。」<\/p>\n<hr class=\"sep\">\n<p>周遠走到走廊上，打電話給何靜。<\/p>\n<p>響了一聲她就接了。<\/p>\n<p>「兩個小時又十分鐘。」何靜說，「你遲到了。」<\/p>\n<p>「對不起。」<\/p>\n<p>「她在嗎？」<\/p>\n<p>「在。」周遠說，「她很好。林依也在。」<\/p>\n<p>電話那頭很久沒有聲音。他聽見她在呼吸，聽見背景有護理站的叫人鈴在響，有人推著車經過。<\/p>\n<p>「你們要做什麼？」何靜終於問。<\/p>\n<p>周遠看著走廊盡頭那扇小窗。窗外是後山，山上的天開始變黃了。<\/p>\n<p>「唱歌。」他說。<\/p>\n<p>何靜沒有笑，也沒有罵他。她安靜了很久。<\/p>\n<p>「唱完，」她說，「打給我。不管幾點。」<\/p>\n<p>「好。」<\/p>\n<p>「周遠。」<\/p>\n<p>「嗯。」<\/p>\n<p>「七號床的阿婆，」何靜說，聲音放得很低，「今天下午一直在哼歌。哼了一整個下午，沒停過。她要護理師幫她梳頭。梳好了，她就坐著，看著北邊。」<\/p>\n<p>周遠握著手機。<\/p>\n<p>「她說，」何靜說，「她要準備出門了。」<\/p>\n<hr class=\"sep\">\n<p>那天晚上，老闆娘煮了一桌菜。<\/p>\n<p>滷肉，炒高麗菜，蛋花湯，一盤煎得很香的虱目魚肚。她在圓桌上擺了六副碗筷。四副給他們。一副給她自己。一副，給她那個做土水的兒子。<\/p>\n<p>「食，食，」她說，一直往沈言的碗裡夾菜，「這个查某囡仔，瘦甲賰一支骨，愛加食一寡。」<\/p>\n<p>沈言坐在林依旁邊，手裡還握著那兩只瓶子，用另一隻手拿筷子。她吃得很少，很慢，可是她吃了。老闆娘夾給她的每一樣，她都吃了一口。<\/p>\n<p>林依吃了兩碗飯。<\/p>\n<p>周遠吃了一碗，又盛了一碗湯。湯很鹹，他喝完了。<\/p>\n<p>先生沒有坐下來。他站在門口，背靠著門框，看著外面的街。天黑了，整條街一盞燈都沒有亮，安靜得像一張還沒寫字的紙。<\/p>\n<p>老闆娘端著一碗飯走過去，遞給他。<\/p>\n<p>「陳先生，你嘛食一寡。」<\/p>\n<p>先生回過頭，看著那碗飯，看了一會兒。他伸手接過去，說了一聲多謝，捧在手上，沒有吃。<\/p>\n<p>老闆娘也不勉強。她回到桌邊坐下，看著空著的那一副碗筷，看了一下，又笑著轉回來，問林依明天要不要吃地瓜粥。<\/p>\n<p>林依說好。<\/p>\n<p>周遠低頭喝湯。湯碗底下，他看見自己的倒影，在湯裡晃。他喝完最後一口，倒影就沒有了。<\/p>", "chars": 2941}, "27": {"title": "第二十七章　下半本", "html": "<p>晚飯以後，先生叫他們都去睡。<\/p>\n<p>「子時以前，愛睏一下。」他說，「人無睏，聲會飄。」<\/p>\n<p>沈言和林依擠在那張單人床上，一個朝裡，一個朝外，背貼著背。沈言的手還握著那兩只瓶子，放在枕頭邊。周遠在矮桌旁邊的地板上躺下來，枕著自己摺起來的外套。木頭地板很硬，有一股曬過太陽的味道。<\/p>\n<p>他以為他睡不著。<\/p>\n<p>先生坐在窗邊，背靠著牆，看著外面。月亮還沒出來，窗外是一片很深的黑。他開始哼歌，很輕，輕到幾乎聽不見。<\/p>\n<p>周遠閉上眼睛。<\/p>\n<hr class=\"sep\">\n<p class=\"era\">一九三一年，霧川渡。<\/p>\n<p>是那天下午。<\/p>\n<p>陳守一認得那個下午。窗邊的光，桌上的油燈還沒點，樓下有人在劈柴，一下，一下。師父坐在窗邊的桌前，面前攤著兩冊手札。<\/p>\n<p>他自己躺在床上。他記得他那天下午很睏，前一夜守著裹著黃布、縮在牆角的小滿，守到天亮，眼皮重得撐不開。他躺著，半睡半醒，從眼睫毛的縫隙裡，看著師父的背影。<\/p>\n<p>師父翻開下面那一冊，提起筆。<\/p>\n<p>師父寫字的時候，嘴裡會念。他以前從來沒注意過。可是那天下午，他半睡半醒，耳朵比眼睛醒，他聽見了。<\/p>\n<p>很小聲，很快，一邊寫一邊念，像在跟自己說話。<\/p>\n<p>「宿主……愛甘願……毋是予人灌落去……家己提，家己食……」<\/p>\n<p>筆尖在紙上沙沙地響。<\/p>\n<p>「放之者……愛還……提啥物，還啥物……親手還……」<\/p>\n<p>師父停下來，蘸了一下墨。窗外的劈柴聲停了，又響起來。<\/p>\n<p>「封之者……」師父念到這裡，停了很久。筆懸在紙上，墨滴下來一點，他也沒有發現。<\/p>\n<p>「封之者，愛放手。」<\/p>\n<p>師父的聲音低下去，很低，低得像嘆氣。<\/p>\n<p>「伊家己的封，愛家己放。放了，伊就會醒。醒了，才葬會落去。」<\/p>\n<p>陳守一在床上翻了一個身。他記得他那時候在想：放手是什麼意思？封都封了，為什麼還要放？他想問，可是他太睏了，嘴巴張不開。<\/p>\n<p>師父又繼續寫，繼續念。<\/p>\n<p>「三人同歌……歌畢……」<\/p>\n<p>「愛喊……」<\/p>\n<p>陳守一的眼皮闔上了。<\/p>\n<p>他最後聽見的，是師父的筆，在紙上沙沙地，一直寫，一直寫。還有樓下劈柴的聲音，一下，一下，越來越遠。<\/p>\n<p>他睡著了。<\/p>\n<p>他不知道師父念完了沒有。不知道「愛喊」後面，是什麼。<\/p>\n<hr class=\"sep\">\n<p>夢翻了一頁。<\/p>\n<p>渡口。石階。三盞燈。<\/p>\n<p>是那一夜。可是這一次，所有的聲音都很遠，很薄，像隔著一層水。他站在第三盞燈旁邊，手上握著銅鈴，看著小滿尖叫著從最下面那級石階往上爬，爬上第二級，第三級，爬到石階頂上。<\/p>\n<p>她停下來。回過頭。<\/p>\n<p>河裡的尖叫聲又來了。很多聲音疊在一起，老的、小的、男的、女的，像整條河都在叫。<\/p>\n<p>上一次，這一聲蓋住了一切。<\/p>\n<p>這一次，他沒有看河。他只看著小滿。看著她的嘴。看著那張哭得一塌糊塗、在月光底下白得發青的小臉。<\/p>\n<p>他用盡全身的力氣去聽。<\/p>\n<p>尖叫聲還在，可是在尖叫聲底下，很細很細的，像一根針穿過一整匹布，有一個七歲小女孩的聲音，穿過來了。<\/p>\n<p>「小師父——」<\/p>\n<p>她的嘴張得好大，喊得整張臉都皺起來。<\/p>\n<p>「我以後一定會轉來還！」<\/p>\n<p>「我一定會轉來還——」<\/p>\n<p>然後她轉身，跑進黑暗裡。<\/p>\n<p>陳守一站在那裡，手上的銅鈴沉甸甸的。<\/p>\n<p>他想起來了。他一直想起來了。只是那一夜之後，他把這句話壓在很深很深的地方，壓了八十幾年，壓到他自己都以為忘了。<\/p>\n<hr class=\"sep\">\n<p>夢又翻了一頁。<\/p>\n<p>渡船。早上。河面很平，霧散了一半。<\/p>\n<p>小滿站在碼頭的柱子後面，抱著那包紅布，只露出半張臉。船離岸了，他沒有回頭。<\/p>\n<p>船走到河中間的時候，他打開師父的布包，拿出那冊「封」字的手札，又拿出一本空白的冊子。是他剛上船時，跟船上一個賣雜貨的買的，最便宜的那種，紙很粗，裝訂歪歪的。<\/p>\n<p>他借了船夫的墨盒，在船頭坐下來，把冊子攤在膝蓋上。<\/p>\n<p>他在封面寫了一個字。<\/p>\n<p>葬。<\/p>\n<p>寫得很醜，比師父的醜多了。<\/p>\n<p>然後他翻開第一頁，開始寫。寫他那天下午，半睡半醒，聽見師父念的那些話。一個字一個字，照著他記得的樣子寫。<\/p>\n<p class=\"doc\">宿主甘願。家己提，家己食。<br>放之者歸還。提啥物，還啥物，親手還。<br>封之者放手。家己的封，家己放。放了，伊會醒。醒了，才葬會落去。<br>三人同歌。歌畢——<\/p>\n<p>他寫到這裡，停下來。<\/p>\n<p>愛喊。<\/p>\n<p>愛喊什麼？<\/p>\n<p>他坐在船頭，筆懸在紙上，懸了很久。墨滴下來，在紙上暈成一個小小的黑點。河水從船邊滑過去，很平，很靜，倒映著天空，倒映著他的臉。<\/p>\n<p>水裡的他，慢了一點點，才低下頭。<\/p>\n<p>他沒有寫下去。他在「歌畢」後面，畫了一條短短的線，留下一大片空白。<\/p>\n<p>他想，有一天，他會想起來的。或者，有一天，他會找到師兄，把師父的下冊拿回來。到那時候，他再把這一頁寫完。<\/p>\n<p>他把冊子闔上，跟師父那一冊「封」，疊在一起，用油紙包好，麻繩綁三圈。綁到第三圈的時候，他的手停了一下。他想起那天早上，掂在手裡變薄了的油紙包。<\/p>\n<p>他綁好了。<\/p>\n<p>船靠岸了。他背起布包，上岸，沒有回頭。<\/p>\n<hr class=\"sep\">\n<p>「起來。」<\/p>\n<p>周遠睜開眼睛。<\/p>\n<p>先生蹲在他旁邊，手搭在他的肩膀上。窗外還是黑的，月亮還沒出來，只有走廊那頭一點昏黃的燈，從門縫底下透進來一條細細的光。<\/p>\n<p>「時間到矣。」先生說。<\/p>\n<p>周遠坐起來。他的臉是濕的。他用袖子擦了一下。<\/p>\n<p>床上，沈言和林依也醒了。沈言坐在床沿，手裡握著那兩只瓶子，看著他。林依在她旁邊，脖子上的紅繩露出一截，她用手按著。<\/p>\n<p>周遠看著先生。<\/p>\n<p>「愛喊，」他說，「愛喊什麼？」<\/p>\n<p>先生看了他很久。他的眼睛很黑，在昏暗裡，像兩口很深的井。<\/p>\n<p>「我寫到遐，就無閣寫矣。」他說，「八十幾冬，下冊一直無拿轉來。我一直等，等無答案。」<\/p>\n<p>他站起來，往門口走。<\/p>\n<p>「今暝，先唱。」他說，「唱會到佗位，就到佗位。」<\/p>\n<p>他打開門，走廊上很暗。他回過頭，看著他們三個人。<\/p>\n<p>「封之者，」他看著周遠，「愛放手。」<\/p>\n<p>周遠的手不自覺地按住了胸口。那裡很熱。那條線，又繃緊了。<\/p>\n<p>他站起來，跟著先生走出門。<\/p>", "chars": 2154}, "28": {"title": "第二十八章　七號床", "html": "<p>十一點，先生從廟裡借來三支蠟燭。<\/p>\n<p>紅色的，很粗，是神桌上用剩的，燒過一截，蠟淚凝在燭身上，像一條一條往下流的河。他把三支蠟燭立在房間的木頭地板上，排成一個三角形。一支靠床，一支靠門，一支靠窗。<\/p>\n<p>衣櫃門上有一面鏡子。長方形的，邊框的漆剝了一半，鏡面有一點霧。先生看了它一眼，從床上拿起一條薄被，掛上去，把鏡子整個蓋住。<\/p>\n<p>周遠看著那條被子。<\/p>\n<p>「先莫看。」先生說，「時間未到。」<\/p>\n<p>沈言坐在靠床那支蠟燭旁邊。林依坐在靠門那支旁邊。周遠在靠窗那支旁邊坐下來，背後就是那扇對著後山的窗，窗外一點光都沒有。<\/p>\n<p>先生沒有坐。他站在三角形外面，背靠著牆，手上握著一樣東西。周遠看了一眼。<\/p>\n<p>是一只銅鈴。<\/p>\n<p>很舊，表面磨得發亮，鈴舌用一條紅線綁住了，綁得很緊，搖不響。<\/p>\n<p>周遠看著那只鈴，喉嚨一緊。他在夢裡握過它。在船上，在渡口，在城隍廟的門檻前面。<\/p>\n<p>「欲開始矣。」先生說。<\/p>\n<hr class=\"sep\">\n<p>沈言先唱。<\/p>\n<p>先生沒有教她。她一開口，就是那支歌。往下沉，尾音拖得很長，一句一句，像要把什麼東西放進很深的地方。她的聲音很乾淨，很穩，跟她說話的時候完全不一樣，好像這支歌不是她學來的，是從她身體裡面一直存在的某個地方，自己流出來的。<\/p>\n<p>唱到第三句的時候，有一個音，她唱得跟阿婆不一樣。<\/p>\n<p>只有一個音。在往下沉的地方，阿婆是往下的，她往上挑了一點點，又落回來。<\/p>\n<p>周遠聽見了。他看向先生。先生閉著眼睛，臉上沒有表情，只是握著鈴的手，緊了一下。<\/p>\n<p>林依跟著哼。她不會唱，下午先生只教了她兩遍，她記不住字，就跟著調子哼，哼得很小聲，很怕唱錯。她的手一直按著胸口的玉佛。<\/p>\n<p>周遠張開嘴。<\/p>\n<p>他發不出聲音。<\/p>\n<p>不是不會。他在車上唱過，在電話那頭哼過，在阿婆的床邊一字不差地跟過。可是現在，他張開嘴，喉嚨就緊了，像有一隻手從裡面掐住他的聲帶。胸口那個地方很燙，燙得發痛，那條線繃得很緊，在發抖。<\/p>\n<p>他身體裡有個東西，不想讓他唱。<\/p>\n<p>他咬著牙，試了一次，只發出一點氣音。又試一次。還是一樣。<\/p>\n<p>沈言的歌聲在繼續。林依的哼聲在繼續。蠟燭的火苗筆直地往上燒，一動也不動，像被凍住了。<\/p>\n<p>唱到第八句的時候，三支蠟燭同時歪了一下。<\/p>\n<p>沒有風。窗是關著的，門也是關著的。三朵火苗，一起往同一個方向倒，倒向周遠，像有人從他對面輕輕吹了一口氣。<\/p>\n<p>沈言的歌聲斷了。<\/p>\n<p>她坐在那裡，雙手放在膝蓋上，握著那兩只瓶子。她的頭慢慢地偏過去，偏得很優雅，像一隻鳥。她的嘴角，開始往上拉。<\/p>\n<p>「閣少一个。」<\/p>\n<p>那個聲音說。很多聲音疊在一起，很甜，很黏。<\/p>\n<p>「九十五冬前，少一个。今仔日，嘛是少一个。」<\/p>\n<p>它看著周遠。<\/p>\n<p>「你閣毋甘放，著無？」<\/p>\n<hr class=\"sep\">\n<p>先生把鈴舉起來。<\/p>\n<p>他沒有搖。他用另一隻手的拇指，輕輕按在綁著鈴舌的那條紅線上，按了一下。<\/p>\n<p>「先停。」他說，「等。」<\/p>\n<p>那個笑容停了一下，然後慢慢地，退回去了。沈言的頭偏回來，眼睛眨了眨，是她自己的眼睛，很困惑，很疲倦。<\/p>\n<p>「我……」她說，「我唱到佗位矣？」<\/p>\n<p>「第八句。」先生說，「唱甲足好。」<\/p>\n<p>他把鈴放下來，在三角形外面的地板上坐下，背靠著牆，閉上眼睛。<\/p>\n<p>「子時若過，嘛莫要緊。」他說，「伊會來。」<\/p>\n<p>「誰？」周遠問。<\/p>\n<p>先生沒有回答。<\/p>\n<hr class=\"sep\">\n<p>一點多的時候，老闆娘上樓來了。<\/p>\n<p>她端著一個托盤，上面四碗甜湯，熱騰騰的，地瓜和薑煮的，湯裡浮著幾顆紅棗。她敲了兩下門，推開，看見滿地的蠟燭，一點都沒有驚訝。<\/p>\n<p>「三更半暝，食一寡燒的。」她說，把碗一碗一碗放在地板上，「莫寒著。」<\/p>\n<p>她放到第四碗的時候，猶豫了一下，看了看先生，又看了看周遠，最後放在先生腳邊。<\/p>\n<p>「陳先生，你嘛食。」<\/p>\n<p>「多謝。」先生說。<\/p>\n<p>老闆娘走了。門關上的時候，她在門外哼了一句什麼，很輕，很快就走遠了。<\/p>\n<p>林依捧著碗，吹了很久，才喝一口。燙得她吐了一下舌頭。<\/p>\n<p>沈言看著她，忽然笑出來。是她自己的笑，很小，很累，可是是真的。<\/p>\n<p>「妳每次都這樣。」沈言說，「每次都不等它涼。我們冰箱裡那瓶優格，妳也是這樣，等不及，偷吃我的。」<\/p>\n<p>林依愣了一下。<\/p>\n<p>「那是我的優格。」<\/p>\n<p>「是我的。」沈言說，「上面有寫名字。」<\/p>\n<p>「妳寫的是『沈』。我以為是『冰』。」<\/p>\n<p>沈言瞪著她。林依也瞪著她。然後兩個人一起笑出來，笑得很小聲，肩膀抖著，林依的甜湯差點灑出來，她趕快放下碗，笑得眼淚都流出來了。<\/p>\n<p>周遠坐在窗邊，看著她們。<\/p>\n<p>他想起一間很小的透天厝，二樓兩個房間，窗台上三盆薄荷。冰箱裡一瓶寫著名字的優格。兩個二十四歲的女孩，住在一個山坳裡的小鎮，每天早上一個趕著打卡，一個還在睡。<\/p>\n<p>那個鎮現在空了。<\/p>\n<p>他低頭喝甜湯。很甜。他喝完了。<\/p>\n<hr class=\"sep\">\n<p>兩點多，沈言和林依靠在一起睡著了。<\/p>\n<p>她們沒有躺下，就坐在地板上，林依靠著床沿，沈言靠著林依的肩膀。沈言的手還握著那兩只瓶子，放在膝蓋上。三支蠟燭燒短了一截，火苗很小，很安靜。<\/p>\n<p>周遠沒有睡。他看著先生。<\/p>\n<p>先生也沒有睡。他坐在牆邊，手上握著那只鈴，拇指在綁鈴舌的紅線上一下一下地摸，像在摸一條小狗的頭。<\/p>\n<p>「你在等誰？」周遠小聲問。<\/p>\n<p>先生睜開眼睛，看著他。<\/p>\n<p>「九十五冬前，」他說，聲音也很小，「有一个囡仔，佇石階頂越頭，共我講伊以後一定會轉來還。」<\/p>\n<p>周遠沒有說話。<\/p>\n<p>「伊無走。」先生說，「伊等。伊等足久矣。」<\/p>\n<p>他低頭看著手腕上那條紅布條。<\/p>\n<p>「彼包紅布，伊抱九十五冬。」他說，「欲還，愛伊家己來還。」<\/p>\n<p>周遠看著他。他想起何靜傍晚在電話裡說的話。她要護理師幫她梳頭。梳好了，她就坐著，看著北邊。她說她要準備出門了。<\/p>\n<p>他的手機在口袋裡震了。<\/p>\n<hr class=\"sep\">\n<p>凌晨兩點四十二分。<\/p>\n<p>是何靜。<\/p>\n<p>周遠站起來，走到走廊上，關上門，才接。<\/p>\n<p>電話那頭很久都沒有聲音。他聽見她在呼吸，呼吸得很慢，很深，像一個人在很努力地讓自己平靜下來。<\/p>\n<p>「周遠。」<\/p>\n<p>「我在。」<\/p>\n<p>「七號床的阿婆，」何靜說，「走了。」<\/p>\n<p>周遠靠在走廊的牆上。牆是木頭的，很冷。<\/p>\n<p>「兩點四十分。」何靜說，「值夜班的蔡護理師巡房，發現的。她在睡夢中走的。很安詳。」她停了一下，「她在笑。蔡姐說，她進去的時候，阿婆的嘴唇還在動，還在哼那支歌，哼了兩句，就停了。」<\/p>\n<p>周遠閉上眼睛。<\/p>\n<p>「她走之前，」何靜說，「十二點左右，蔡姐去看過她一次。她醒著，坐在床上，看著窗外。她問了蔡姐一個問題。」<\/p>\n<p>「什麼問題？」<\/p>\n<p>何靜吸了一口氣，用一種很生硬的、在學別人的腔調說：<\/p>\n<p>「彼條帶仔，伊猶閣有綁無？」<\/p>\n<p>周遠睜開眼睛。他轉過頭，透過門縫，看著房間裡那個坐在牆邊的少年。看著他手腕上那條洗白了的紅布條。<\/p>\n<p>「蔡姐聽不懂。」何靜說，「她問阿婆是什麼帶子，阿婆就不說話了。然後……」<\/p>\n<p>她的聲音抖了一下。<\/p>\n<p>「然後阿婆跟蔡姐說了最後一句話。蔡姐說，她講得很清楚，很大聲，一點都不像一百零二歲的人。」<\/p>\n<p>「她說什麼？」<\/p>\n<p>「這次我沒跑。」<\/p>\n<hr class=\"sep\">\n<p>走廊上很安靜。<\/p>\n<p>周遠握著手機，很久都說不出話。<\/p>\n<p>「周遠？」<\/p>\n<p>「我在。」<\/p>\n<p>「我整理她的床。」何靜說，「她的枕頭底下，有一樣東西。」<\/p>\n<p>「一包紅布。」周遠說。<\/p>\n<p>電話那頭沉默了。<\/p>\n<p>「……你怎麼知道？」<\/p>\n<p>「褪成粉紅色的。」周遠說，「用麻繩綁著，綁了好幾圈。」<\/p>\n<p>何靜很久沒有說話。<\/p>\n<p>「對。」她終於說，聲音很小，「麻繩綁得好好的，看起來從來沒有拆開過。蔡姐說，阿婆住進來那天就抱著它，七十年，誰都不准碰。阿婆以前交代過蔡姐一句話，蔡姐一直記著。」<\/p>\n<p>「什麼話？」<\/p>\n<p>「她說，有一天她走了，這包東西，要交給每個月來看她的那個查某囡仔。」<\/p>\n<p>周遠轉過頭，看著房間裡，靠在床邊睡著的林依。她的頭歪在床沿上，嘴巴微微張著，一隻手還搭在沈言的手背上。<\/p>\n<p>「何靜。」他說。<\/p>\n<p>「嗯。」<\/p>\n<p>「那包東西，先幫她收好。」他說，「不要拆。」<\/p>\n<p>「好。」何靜說。她停了一下。「周遠，你們那邊……唱完了嗎？」<\/p>\n<p>周遠看著房間。<\/p>\n<p>三支蠟燭的火苗，在那一刻，同時歪了一下。不是倒向他。是倒向門口。倒向他站著的這個方向，倒向走廊，倒向他背後那道往下走的木頭樓梯。<\/p>\n<p>像有人從樓梯上，走上來了。<\/p>\n<p>「還沒。」他說，「我再打給妳。」<\/p>\n<hr class=\"sep\">\n<p>他掛了電話，推開門。<\/p>\n<p>房間裡有一股味道。很淡，很潮濕，像河。像下過雨的河岸，像泡過水的木頭船，像很多很多年前，一個渡口的清晨。<\/p>\n<p>林依醒了。她坐起來，揉著眼睛，一臉茫然。她的手抬起來，停在半空中。<\/p>\n<p>「周警官，」她說，聲音很小，「有人……有人在牽我的手。」<\/p>\n<p>她低頭看著自己的右手。手心朝上，手指微微彎著，像正握著另一隻手。另一隻很小的、看不見的手。<\/p>\n<p>「好冰。」她說，「好小。」<\/p>\n<p>先生站起來了。<\/p>\n<p>他站在牆邊，手上握著那只鈴，看著林依的那隻手。看著那隻手裡什麼都沒有的地方。他看了很久，很久。<\/p>\n<p>周遠看見他的眼睛濕了。<\/p>\n<p>十七歲的少年，那雙很黑的眼睛，在燭光裡，慢慢地紅了。他沒有擦。他的嘴角動了一下，動了好幾下，像想笑，又像想哭，最後什麼都沒做成。<\/p>\n<p>「伊來矣。」他說。<\/p>", "chars": 3369}, "29": {"title": "第二十九章　放手", "html": "<p>林依沒有把手抽回來。<\/p>\n<p>她坐在床沿，右手攤在膝蓋上，手心朝上，手指微微彎著。她低頭看著那隻手，看著手裡什麼都沒有的地方，眼淚一直掉，掉在手腕上，順著手臂往下流。<\/p>\n<p>「好小。」她又說了一次，「周警官，她好小。」<\/p>\n<p>沈言醒了。她靠在林依的肩膀上，看著林依的手，看了很久。然後她伸出自己的手，輕輕地，覆在林依的手上面。兩隻手疊在一起，中間像夾著第三隻看不見的、很小的手。<\/p>\n<p>「阿祖。」林依小聲說。<\/p>\n<p>沒有人回答她。可是那股河岸的味道，在房間裡，濃了一點。<\/p>\n<hr class=\"sep\">\n<p>先生走回三角形外面，在牆邊坐下來。<\/p>\n<p>他從長衫的口袋裡拿出那三枚銅錢，合在掌心，搖了三下，往地板上一撒。<\/p>\n<p>叮，叮，叮。<\/p>\n<p>兩枚倒下。一枚，立著。<\/p>\n<p>周遠看著那枚立著的銅錢。他在夢裡看師父撒過很多次，師父說過：兩倒一立，是問卦的人自己的事，天機不給看。<\/p>\n<p>「你替自己算？」他問。<\/p>\n<p>「逐擺攏是按呢。」先生說，「我替我家己算，永遠是徛的。」<\/p>\n<p>他沒有把那枚銅錢壓倒。他把它撿起來，小心地，保持著立著的樣子，捏在指尖，站起來，走到窗邊，把它立在窗台上。<\/p>\n<p>窗台很窄，木頭的，漆剝了。那枚銅錢立在上面，邊緣貼著木頭，很穩，一動也不動。<\/p>\n<p>「等伊倒，」先生說，「我的代誌就煞矣。」<\/p>\n<hr class=\"sep\">\n<p>他走回來，站在周遠面前，低頭看著他。<\/p>\n<p>「你知影，封伊的人是啥人。」<\/p>\n<p>周遠點頭。<\/p>\n<p>「你知影，封伊的人愛做啥。」<\/p>\n<p>周遠的手按著胸口。那裡還是很燙。那條線還繃著，從他身體裡面一直延伸到沈言那邊，在發抖，在等。<\/p>\n<p>「放手。」他說，「可是我不知道怎麼放。」<\/p>\n<p>先生在他面前蹲下來，跟他一樣高。<\/p>\n<p>「十二冬，」先生說，「你敲門，敲兩下就停。你毋照鏡。你行路，袂越頭。你暗時睏，夢著我的一生，醒來就共伊壓落去，毋願想。」<\/p>\n<p>他看著周遠。<\/p>\n<p>「封，毋是我一个人做的。是你逐工，逐暝，家己咧顧。你顧甲足好。顧甲你家己攏毋知。」<\/p>\n<p>周遠看著他。<\/p>\n<p>「欲放，」先生說，「就莫閣顧。」<\/p>\n<p>他站起來，退開一步，看向那面蓋著薄被的衣櫃門。<\/p>\n<p>「去。」他說，「敲。」<\/p>\n<hr class=\"sep\">\n<p>周遠站起來。<\/p>\n<p>他的腿有點軟。他走過那支靠窗的蠟燭，走到衣櫃前面。薄被蓋著鏡子，被角垂到地上，被面上印著褪色的牡丹花。<\/p>\n<p>他抬起手，握成拳頭。<\/p>\n<p>指節離被面只有一公分。<\/p>\n<p>叩。<\/p>\n<p>很輕。隔著被子，鏡子發出一聲很悶的響。<\/p>\n<p>叩。<\/p>\n<p>他的手停在半空中。<\/p>\n<p>跟每一次一樣。跟他在小方辦公室門口一樣，跟他在福星旅社三〇七門口一樣，跟他這輩子每一次敲門一樣。手停在第二下之後，像被一根看不見的線拉住了，指節懸在那裡，離門板一公分，怎麼樣都下不去。<\/p>\n<p>他身體裡的那一半，醒著，在等。<\/p>\n<p>他身體裡的另一個東西，那個十七歲的少年留給他的東西，像一雙手，從背後輕輕地扣住他的手腕，扣了十二年。<\/p>\n<p>他閉上眼睛。<\/p>\n<p>他想起那條河。想起渡口的石階，三盞歪歪的燈。想起一個七歲的女孩，尖叫著，往上爬。想起一個少年跪在城隍廟前面，額頭貼著冰冷的石板。想起一條很長很長的線，從那個少年的胸口，一寸一寸地，抽出來。<\/p>\n<p>他想起鎮口那座墳。一個十七歲的少年，坐在墓碑旁邊，說：你顧甲足好。<\/p>\n<p>他鬆開了。<\/p>\n<p>不是手。是手腕上那雙看不見的手。他想像自己伸出另一隻手，輕輕地，一根一根地，把那些扣了十二年的手指掰開。像林依掰開沈言冰冷的手指那樣。很慢，很輕。<\/p>\n<p>他說：好了。可以了。<\/p>\n<p>叩。<\/p>\n<p>第三下。<\/p>\n<hr class=\"sep\">\n<p>胸口那個地方，裂開了。<\/p>\n<p>不痛。比痛更奇怪。像一扇關了很久很久的門，被風吹開，冷空氣灌進來，灌滿了整個胸腔。那條繃了很久的線，忽然鬆了，鬆成一條很軟、很長的絲帶，在他身體裡面飄起來，往外飄。<\/p>\n<p>他身體裡有個東西，醒了。<\/p>\n<p>他感覺得到它。很小。比他想的小很多。它在他胸口裡面伸了個懶腰，像一個睡了很久的小孩，揉著眼睛，坐起來，左看右看，不知道自己在哪裡。<\/p>\n<p>它想往外走。<\/p>\n<p>周遠沒有攔它。<\/p>\n<p>鏡子上的薄被，滑下來了。<\/p>\n<p>沒有人碰它。它從衣櫃門上慢慢地滑，一寸一寸，像有人在另一面輕輕地拉。被角先落地，然後是被面上那幾朵褪色的牡丹，最後整條被子堆在他腳邊，露出那面邊框剝了漆、有點霧的鏡子。<\/p>\n<hr class=\"sep\">\n<p>鏡子裡，是這個房間。<\/p>\n<p>三支蠟燭，火苗很小。床，床沿上坐著兩個女孩，手疊在一起。窗台上那枚立著的銅錢。牆邊站著一個穿長衫的少年。衣櫃前面站著一個男人，拳頭還舉在半空中。<\/p>\n<p>周遠看著鏡子裡的自己。<\/p>\n<p>鏡子裡的他，慢了一點，才看向他。<\/p>\n<p>然後他看見了。<\/p>\n<p>鏡子裡，他的身後，站著一個人。<\/p>\n<p>一個女人。穿著淺色的長睡衣，赤著腳，頭髮披散，垂到腰上。她站得很近，近到下巴幾乎靠在他的肩膀上。她的雙手輕輕地垂在身體兩側，沒有搭在他身上。<\/p>\n<p>周遠沒有轉頭。他知道轉過去，背後什麼都沒有。<\/p>\n<p>他看向鏡子裡的床。<\/p>\n<p>沈言的身後，也站著一個。<\/p>\n<p>一模一樣的長睡衣，一模一樣的赤腳，一模一樣披散的頭髮。她站在沈言背後，低著頭，看著沈言和林依疊在一起的那兩隻手。<\/p>\n<p>兩個女人，一個在他身後，一個在沈言身後。<\/p>\n<p>她們沒有笑。<\/p>\n<p>周遠一直以為，她會笑。那個拉得太寬、人不可能笑出來的笑。可是鏡子裡的兩張臉，都沒有。她們的臉被頭髮遮住了一半，露出來的那一半，很白，很平靜，像兩個很累很累、走了很遠的路的人，終於停下來，站在那裡，不知道接下來要往哪裡去。<\/p>\n<p>鏡子裡，他身後那一個，慢慢抬起頭，看著沈言身後那一個。<\/p>\n<p>沈言身後那一個，也抬起頭。<\/p>\n<p>隔著整個房間，隔著三支蠟燭，兩個一模一樣的女人，在鏡子裡，看著彼此。<\/p>\n<p>兩半。<\/p>\n<p>十二年。<\/p>\n<hr class=\"sep\">\n<p>先生開口唱了。<\/p>\n<p>很輕，很慢，第一句往下沉。他的聲音很年輕，可是唱起來很老，像一個在河邊唱了八十幾年的人。<\/p>\n<p>他沒有看鏡子。他閉著眼睛，站在牆邊，手上握著那只綁著紅線的鈴，一句一句地唱。<\/p>\n<p>林依跟上來了。<\/p>\n<p>她本來只會哼。下午先生教了她兩遍，她記不住，只能跟著調子哼。可是現在，她張開嘴，唱的是完整的句子。她的聲音變了，變得很高，很細，像一個小孩。唱到第二句往下沉的地方，她的聲音翻上去了，翻得很高，又落回來。<\/p>\n<p>周遠聽過那個翻上去的音。<\/p>\n<p>在夢裡。在一個月光很淡的客棧房間裡，一個七歲的女孩靠在他的腿上，學了一遍又一遍，每一次唱到這裡，都翻上去。<\/p>\n<p>林依沒有發現。她閉著眼睛，右手還攤在膝蓋上，手心朝上，被沈言的手蓋著。她一直唱，唱得滿臉都是淚。<\/p>\n<p>沈言也唱了。她的聲音穩穩的，在林依和先生的聲音中間，像一條河的河床。<\/p>\n<p>周遠站在鏡子前面。<\/p>\n<p>他張開嘴。<\/p>\n<p>這一次，喉嚨沒有被掐住。胸口那扇門開著，風灌進來，又灌出去。那個很小的、剛睡醒的東西，坐在門邊，歪著頭，在聽。<\/p>\n<p>他唱了。<\/p>\n<p>很難聽。走音。他記不清楚的地方，就用哼的帶過。他的聲音很乾，很低，跟在先生後面，跟在林依和沈言中間。<\/p>\n<p>鏡子裡，他身後那個女人，偏過頭，看著他的嘴。<\/p>\n<p>他們唱到第七句。<\/p>\n<p>唱到第八句。<\/p>\n<p>三支蠟燭的火苗，筆直地往上燒，一動也不動。<\/p>\n<p>九十五年前，渡口的石階上，這支歌在第八句斷了。一個女孩尖叫著逃走，一個少年跪在城隍廟前。<\/p>\n<p>他們唱過了第八句。<\/p>\n<p>唱到第九句的時候，周遠聽見鏡子裡，傳出一個很小、很小的聲音。<\/p>\n<p>不是那種很多人疊在一起的聲音。是一個人。一個小女孩。很細，很輕，有點走調，跟在他們後面，慢了半句。<\/p>\n<p>她也在唱。<\/p>", "chars": 2729}, "30": {"title": "第三十章　退潮", "html": "<p>他們一直唱。<\/p>\n<p>唱到第十句，第十一句。周遠不知道這支歌有多長。他在夢裡學的時候，師父泡腳的熱水涼了，他就停了。他從來不知道後面還有。<\/p>\n<p>可是他唱得出來。每一句還沒到，他就知道它會往哪裡走。往下，再往下，在這裡停一拍，在這裡轉回來。像沿著一條很熟的路走回家，天黑了，看不見路，腳還記得。<\/p>\n<p>鏡子裡那個小女孩的聲音，一直跟在他們後面。慢半句，走調，有時候忘了詞，就停下來，等他們唱過去，再從下一句接上。<\/p>\n<p>周遠閉上眼睛。<\/p>\n<hr class=\"sep\">\n<p>他看見了。<\/p>\n<p>不是用眼睛。是胸口那扇門。那扇門開著，那個很小的、剛睡醒的東西坐在門邊，它看得到的地方，他也看得到。<\/p>\n<p>它看得到很遠的地方。<\/p>\n<p>一座山。山坳裡一個空了的小鎮。主街，雜貨店，早餐店，土地公廟。廟後面一條往上走的路，路的盡頭，一片公墓。<\/p>\n<p>公墓裡，有人在跳舞。<\/p>\n<p>很多人。兩百多個，排成整整齊齊的方陣，在墓碑和墓碑之間。雙手平舉，手腕垂著，往左晃，往右晃。他們已經跳了很多天了。腳底的鞋子磨破了，有的光著腳，腳底全是泥。他們的臉上都帶著同一種笑。<\/p>\n<p>周遠看見早餐店的阿姨。看見穿著汗衫的雜貨店隔壁鄰居。看見一個很小的男孩，跟在他阿嬤旁邊，跳得歪歪扭扭的。<\/p>\n<p>然後，歌聲到了。<\/p>\n<p>歌聲從很遠的地方飄過來，飄過一條山線，飄過兩座山，飄進那片公墓。很輕，輕得像霧。<\/p>\n<p>方陣最前面那一排，有一個人的手，垂下來了。<\/p>\n<p>是早餐店的阿姨。她的手慢慢放下來，垂在身體兩側。她站在那裡，眨了眨眼睛，嘴角的笑一點一點褪掉。她低頭看著自己的腳，看著那雙磨破的拖鞋，好像不知道自己為什麼會在這裡。<\/p>\n<p>然後她坐下來了。坐在一塊墓碑旁邊，靠著墓碑，閉上眼睛。<\/p>\n<p>第二個人的手垂下來了。第三個。第十個。<\/p>\n<p>一排接一排，像退潮。方陣從前面開始，一個一個人放下手，一個一個人坐下來，躺下來，在墓碑之間，在草地上，在彼此的身邊，閉上眼睛。<\/p>\n<p>那個很小的男孩，最後一個放下手。他看了看旁邊已經躺下來的阿嬤，打了一個很大的呵欠，爬過去，鑽進阿嬤的臂彎裡，把頭靠在她的胸口上，睡著了。<\/p>\n<p>整片公墓，安靜下來。<\/p>\n<hr class=\"sep\">\n<p>它還看得到更遠的地方。<\/p>\n<p>一座縣城。凌晨的縣城，很安靜，路燈一盞一盞亮著。車站後面的一條街，一間叫福星的舊旅社，三樓走廊最裡面那個房間。<\/p>\n<p>房間裡沒有人。床底下，有一團灰白色的東西。<\/p>\n<p>很瘦，很長，手指的關節比人多一節。它一直趴在床底最深的地方，一動也不動。歌聲飄進來的時候，它動了一下。<\/p>\n<p>它把自己蜷起來。手指一根一根地收攏，膝蓋縮到胸口，像一個在很冷的晚上把自己抱緊的人。它蜷成一小團，貼著牆角，不動了。<\/p>\n<p>不只那間房。<\/p>\n<p>周遠看見一戶一戶的人家。老公寓外牆上的水漬，臉一張一張地淡掉，眼睛的凹洞慢慢填平，變回普通的、雨水留下的污痕。水溝的鐵蓋底下，有什麼細長的東西縮了回去，縮進很深的地方，不再往外探。<\/p>\n<p>一間便利商店的冷藏櫃後面，一棟大樓地下室的鍋爐旁邊，一所國小廁所最後一間的天花板上。那些被塞進床底、塞進牆縫、塞進沒有人會去看的地方的東西，一個一個，聽見了歌，蜷起來，睡了。<\/p>\n<p>像一整座城，在半夜，一起翻了一個身。<\/p>\n<hr class=\"sep\">\n<p>周遠睜開眼睛。<\/p>\n<p>他還站在衣櫃前面，還在唱。先生在唱，林依在唱，沈言在唱。<\/p>\n<p>他看向鏡子。<\/p>\n<p>鏡子裡，他身後那個穿長睡衣的女人，還站在那裡。沈言身後那一個，也還站著。她們沒有再看彼此了。她們都低著頭，聽著歌，聽得很專心，像兩個很久沒有人唱歌給她們聽的人。<\/p>\n<p>然後，他身後那一個，開始淡了。<\/p>\n<p>不是消失。是散開。從邊緣開始，頭髮的末端，睡衣的下襬，赤著的腳趾，一點一點地，暈開，變淡，像一滴墨水滴進一杯很清的水裡，慢慢地化開，化成一縷一縷很淡很淡的灰，在水裡飄。<\/p>\n<p>沈言身後那一個，也在散。<\/p>\n<p>兩縷灰，在鏡子裡飄著，飄向對方。它們在房間中間，在三支蠟燭的上方，碰到了。纏在一起。轉了一圈，又一圈。<\/p>\n<p>然後一起淡了。<\/p>\n<p>淡到看不見了。<\/p>\n<p>鏡子裡，只剩下這個房間。三支蠟燭，兩個坐在床沿的女孩，一個站在牆邊的少年，一個站在衣櫃前的男人。<\/p>\n<p>那個小女孩的歌聲，還在。<\/p>\n<p>很遠了。好像從鏡子很深很深的地方傳出來，從一條河的對岸傳過來。走調的，慢半句的，一個人，在很遠的地方，跟著唱。<\/p>\n<p>然後，也沒有了。<\/p>\n<hr class=\"sep\">\n<p>他們唱完了最後一句。<\/p>\n<p>最後一句往下沉，沉到很深的地方，停了一拍，轉回來，結束。<\/p>\n<p>房間裡很安靜。<\/p>\n<p>周遠的胸口不燙了。他把手按上去，那裡很平靜，很空，像一個住了很久的人搬走以後的房間，窗戶開著，風吹進來，什麼都沒有。<\/p>\n<p>那條線，不見了。<\/p>\n<p>床沿上，沈言低頭看著自己的手。她的手還覆在林依的手上，兩隻手疊在一起。她慢慢地把手拿開。<\/p>\n<p>林依的右手，還攤著，手心朝上。手指慢慢地，慢慢地伸直了，攤平了。<\/p>\n<p>那隻很小的、很冰的手，不在了。<\/p>\n<p>林依看著自己空空的手心，看了很久。然後她把手握起來，握成拳頭，按在胸口的玉佛上，低下頭，哭了。她哭得沒有聲音，肩膀一直抖。<\/p>\n<p>沈言抱住她。<\/p>\n<p>沈言的臉，是她自己的臉。蒼白，疲倦，眼睛腫腫的。她沒有笑，也沒有哭。她只是抱著林依，下巴靠在林依的頭頂上，看著窗外。<\/p>\n<p>窗外，天開始亮了。<\/p>\n<hr class=\"sep\">\n<p>先生站在窗邊。<\/p>\n<p>他背對著房間，看著窗外的後山。天邊是一種很淡的灰藍色，後山的稜線一點一點浮出來，一棵樹，一塊石頭。<\/p>\n<p>他的手放在窗台上，手指旁邊，就是那枚立著的銅錢。<\/p>\n<p>周遠走過去，站在他旁邊。<\/p>\n<p>「結束了嗎？」周遠問。<\/p>\n<p>先生沒有馬上回答。他看著那片越來越亮的天。<\/p>\n<p>「這擺，」他說，「伊無轉去血脈內底。伊走矣。」<\/p>\n<p>「走去哪裡？」<\/p>\n<p>「轉去伊來的所在。」先生說，「河邊。伊會佇遐，等。」<\/p>\n<p>「等什麼？」<\/p>\n<p>先生轉過頭來看他。十七歲的臉，在天光裡，很白，很淡，好像比昨天晚上淡了一點，淡到可以看見他身後窗框的顏色。<\/p>\n<p>「等人去喊伊的名。」他說。<\/p>\n<p>他笑了。眼角的紋，左邊三條，右邊四條。很淡，很輕，像一個做完了很長一件事的人，終於可以坐下來喘一口氣。<\/p>\n<p>「我講過，」他說，「我們還會再見。」<\/p>\n<p>周遠不知道他是在跟誰說。跟他說，還是跟一個九十五年前站在碼頭柱子後面、抱著一包紅布的小女孩說。<\/p>\n<p>窗台上，那枚銅錢，輕輕地晃了一下。<\/p>\n<p>然後倒下了。<\/p>\n<p>叮。<\/p>\n<p>很小的一聲。銅錢平平地躺在木頭窗台上，方孔朝上，被第一道陽光照到，亮了一下。<\/p>\n<p>周遠轉頭。<\/p>\n<p>窗邊沒有人了。<\/p>\n<p>窗台上，那枚倒下的銅錢旁邊，放著一只銅鈴。鈴舌還綁著那條紅線。鈴身被磨得很亮，在晨光裡，映出一小塊天空。<\/p>\n<hr class=\"sep\">\n<p>他下樓的時候，老闆娘已經在掃地了。<\/p>\n<p>她看見他，笑了一下，說早。他也說早。<\/p>\n<p>他走出民宿的門，站在街上。<\/p>\n<p>整條街的人，都站在門口。<\/p>\n<p>理髮院的老闆站在理髮院門口，雜貨店的阿伯站在雜貨店門口，藥房裡走出一個穿白袍的老人，站在褪成粉紅色的招牌底下。廟口，兩個下棋的老人站起來了，金牙阿伯站在他們旁邊。廟公拿著那條藍格子抹布，站在廟門口。<\/p>\n<p>每一個人，都低著頭，看著自己的手。<\/p>\n<p>他們看得很專心。翻過來，又翻過去。看手心，看手背，看指甲，看掌紋。好像那是一樣很陌生的東西，好像他們是第一次發現自己有手。<\/p>\n<p>金牙阿伯抬起頭來，看見了周遠。<\/p>\n<p>他的臉上有一種很茫然的表情。他張開嘴，像要問什麼。<\/p>\n<p>「少年仔，」他說，「我……」<\/p>\n<p>周遠等著。<\/p>\n<p>金牙阿伯看著他，看了很久。然後他搖了搖頭，像要把什麼東西甩掉。他笑了，又露出那一口金牙。<\/p>\n<p>「無啦。」他說，「眠夢。」<\/p>\n<p>他轉身，走回石桌邊，坐下來，拿起一顆棋子。另一個老人也坐下來了。紅方的車，還困在角落。<\/p>\n<p>理髮院的老闆打了一個呵欠，坐回門口的椅子上。雜貨店的阿伯彎腰，繼續把牛奶搬上架。廟公低頭，一寸一寸地擦廟門。<\/p>\n<p>整條街，又動起來了。跟昨天一樣，跟前天一樣，跟十二年來的每一天一樣。<\/p>\n<p>周遠站在街上，看著他們。<\/p>\n<p>他想起先生說過的話：無名的魂，城隍的渡頭過袂去。<\/p>\n<p>他拿出手機，打給何靜。<\/p>\n<p>響了一聲，她就接了。<\/p>\n<p>「唱完了。」他說。<\/p>\n<p>電話那頭很久沒有聲音。然後他聽見她哭了。很小聲，像怕被人聽見，一下，一下。<\/p>\n<p>他沒有說話，就拿著手機，站在街上，聽她哭。太陽從東邊的山後面升起來，照在這條乾乾的街上，照在每一個重新開始過日子的人身上，照在他們的手上。<\/p>\n<p>他們的手底下，都沒有影子。<\/p>", "chars": 3125}, "31": {"title": "第三十一章　結案", "html": "<p>小方的電話，是在他們下山的路上打來的。<\/p>\n<p>周遠開車，沈言和林依坐在後座，靠在一起睡著了。那只銅鈴放在副駕駛座上，用他的外套包著。手機在儀表板上震，他按了擴音。<\/p>\n<p>「組長。」小方的聲音很怪，很高，像是一直在跑，「你在哪裡？」<\/p>\n<p>「山線，要下山了。」<\/p>\n<p>「霧川後山的公墓，」小方說，「找到了。」<\/p>\n<p>周遠的手握緊方向盤。<\/p>\n<p>「兩百六十七個。」小方說，她的聲音在抖，「全部都在。躺在墓碑中間，草地上，一排一排的。都還活著。組長，他們都還活著。」<\/p>\n<p>後座，林依動了一下，沒有醒。<\/p>\n<p>「搜救隊從出事到現在，」小方說，「經過那片公墓不下三十次。我自己就去過兩次。上禮拜三我還站在那裡，拿手電筒照每一個墓碑。什麼都沒有。」<\/p>\n<p>她停了一下。<\/p>\n<p>「今天早上六點，管理員去開門。他們就在那裡。」<\/p>\n<hr class=\"sep\">\n<p>周遠把沈言和林依送到松嶺。<\/p>\n<p>何靜在大門口等。她穿著白袍，頭髮紮得很緊，眼睛底下很青，看起來一夜沒睡。她看見沈言從車上下來，光著腳，踩在停車場的柏油路上，快步走過去，什麼都沒說，脫下自己的室內拖鞋，蹲下來，套在沈言的腳上。<\/p>\n<p>沈言低頭看著那雙拖鞋，太大了，她的腳在裡面滑來滑去。<\/p>\n<p>「何醫師，」她說，「對不起，我跑掉了。」<\/p>\n<p>「回來就好。」何靜說，站起來，光著腳站在柏油路上，「先進去洗澡。妳的腳要擦藥。」<\/p>\n<p>她扶著沈言往裡面走。走到門口，她回過頭，看著還站在車邊的林依。<\/p>\n<p>「林小姐。」<\/p>\n<p>林依抬起頭。<\/p>\n<p>何靜看著她，看了很久，像在找一個開口的方法。最後她什麼都沒繞。<\/p>\n<p>「妳的阿祖，昨天晚上走了。」她說，「兩點四十分。在睡夢中。她走的時候在笑。」<\/p>\n<p>林依點點頭。<\/p>\n<p>「我知道。」她說，「她來跟我說再見了。」<\/p>\n<p>何靜沒有問她是什麼意思。她只是點點頭，轉身，帶著沈言走進去。<\/p>\n<hr class=\"sep\">\n<p>兩百六十七個人，醒過來以後，什麼都不記得。<\/p>\n<p>他們被一個一個抬下山，送到縣立醫院、送到鄉立衛生所、送到體育館臨時搭起來的醫療站。每一個人的手，在被發現的時候，都是交疊在胸前的。右手壓左手，很整齊，像有人在他們睡著以後，一個一個，替他們擺好。<\/p>\n<p>有人問他們這兩個禮拜去了哪裡。他們說，他們記得的最後一件事，是那天晚上，在自己家裡，上床睡覺。<\/p>\n<p>早餐店的阿姨問今天幾號。護理師告訴她，她哭了，說她的蘿蔔糕放在冷藏庫兩個禮拜，一定都壞了。<\/p>\n<p>那個三歲的小男孩，醒過來的時候抓著他阿嬤的衣服不放，一直說他夢到有一個姐姐唱歌給他聽。<\/p>\n<p>周遠在縣立醫院的走廊上，聽一個護理師轉述這句話，站了很久。<\/p>\n<hr class=\"sep\">\n<p>四十三戶，沒有找到。<\/p>\n<p>雜貨店老闆不在兩百六十七個人裡面。主街第六戶的男主人不在。鎮公所退休的會計不在。土地公廟的廟公，那個一輩子沒有欠過任何人、每天早上五點開廟門的老實人，也不在。<\/p>\n<p>小方把名單印出來。四十三戶，四十三個名字，一戶一個。每一戶被敲門的，都只帶走了那一個人；同一個屋簷下的其他家人，都在後山的公墓裡。兩百六十七，加上沈言、林依，加上這四十三個，剛好三百一十二。她用紅筆，一個一個地圈。圈完了，她坐在電腦前面，很久都沒有動。<\/p>\n<p>「他們去哪裡了，組長？」<\/p>\n<p>周遠看著那張紙。他想起先生說的話。伊走矣，轉去伊來的所在。河邊。<\/p>\n<p>他沒有回答。<\/p>\n<p>那天傍晚，雜貨店老闆的女兒打電話來。<\/p>\n<p>她在超市上班，聽到新聞，下了班就打來了。她的聲音很急，很亮，像一個終於可以鬆一口氣的人。<\/p>\n<p>「警察先生，新聞說找到人了！我爸呢？他在哪間醫院？」<\/p>\n<p>周遠拿著手機，站在局裡的走廊上。窗外的天已經暗了，對面那棟大樓的窗戶一格一格地亮起來。<\/p>\n<p>他告訴她了。<\/p>\n<p>電話那頭很久都沒有聲音。他聽見超市的廣播在背景裡響，在報今天的特價：高麗菜一顆三十九。<\/p>\n<p>「他種的芭樂，」她終於說，聲音很平，「今年結了好多。他上禮拜打電話來說，等熟了要寄一箱給我。」<\/p>\n<p>周遠閉上眼睛。<\/p>\n<p>「我會一直找。」他說。<\/p>\n<p>他說完，才發現自己說的是真的。<\/p>\n<hr class=\"sep\">\n<p>報告是兩天以後出來的。<\/p>\n<p>縣府召開記者會，消防局、環保局、衛生局、警察局各派一個人坐在台上。結論唸了十五分鐘：霧川鎮位於溪谷地形，地底沼氣於特定氣候條件下大量逸散，導致居民集體一氧化碳與硫化氫輕度中毒，產生意識混亂及集體夢遊現象。居民於夢遊狀態下前往後山，於公墓地勢較高處脫離毒氣範圍後陷入昏睡。另有四十三戶居民，研判於夢遊過程中誤入溪谷，目前仍持續搜尋中。<\/p>\n<p>台下的記者問：那縣城停電那天晚上，幾百個人在街上夢遊，也是沼氣嗎？<\/p>\n<p>台上的人說：那是另一個案子，另案調查中。<\/p>\n<p>周遠沒有去記者會。他坐在局裡的會議室，看著電視直播。<\/p>\n<p>羅振邦坐在他旁邊，捏著那個保溫杯，看完了，把電視關掉。<\/p>\n<p>「你覺得呢？」羅振邦問。<\/p>\n<p>「很合理。」周遠說。<\/p>\n<p>羅振邦轉過頭，看著他，看了很久。然後他哼了一聲，站起來，拍了拍周遠的肩膀，力氣很大。<\/p>\n<p>「明天回來上班。」他說，「槍去保管室領。何醫師的評估報告，早上送到我桌上了。」<\/p>\n<hr class=\"sep\">\n<p>何靜的評估報告，只有一頁。<\/p>\n<p>羅振邦把它丟給周遠的時候，什麼都沒說。周遠拿起來看。<\/p>\n<p>前面是一些基本資料，一些量表的分數。最後一欄，是評估結論。<\/p>\n<p>何靜的字很工整，很硬，跟她說話一樣。<\/p>\n<p class=\"doc\">評估結論：無異常。<\/p>\n<p class=\"doc\">建議：恢復勤務。<\/p>\n<p>周遠看著那兩行字，看了很久。<\/p>\n<p>那天下午，他去松嶺辦沈言的出院手續。何靜在護理站簽完最後一張單子，把筆插回口袋，筆桿上那張便利貼不見了。<\/p>\n<p>「妳寫無異常。」周遠說。<\/p>\n<p>何靜沒有抬頭。「你有意見？」<\/p>\n<p>「妳十天前，說我是解離症狀，建議停職就醫。」<\/p>\n<p>何靜把單子疊整齊，用迴紋針夾好。<\/p>\n<p>「十天前，」她說，「你進我們醫院大門，會繞過那扇玻璃門走。」<\/p>\n<p>她抬起頭，看著他。<\/p>\n<p>「今天你沒有繞。」<\/p>\n<p>周遠愣了一下。他回頭看了一眼大廳那扇玻璃門。他剛剛走進來的時候，是直直走過來的。他沒有注意到。<\/p>\n<p>玻璃門上，映著大廳，映著櫃檯，映著他們兩個人。<\/p>\n<p>玻璃裡的他，跟他一樣回過頭。他盯著看，看不出來有沒有慢。也許慢了一點點，也許沒有，玻璃太霧，大廳的燈太亮。<\/p>\n<p>何靜也在看。她看了一會兒，把視線收回來，低頭整理那疊已經很整齊的單子。<\/p>\n<p>「無異常。」她又說了一次，聲音很小，像在跟自己說。<\/p>\n<hr class=\"sep\">\n<p>沈言和林依搬家，是在阿婆的告別式之後。<\/p>\n<p>告別式很小，在松嶺附近的一間小殯儀館。來的人不多：林依，沈言，何靜，蔡護理師，周遠。還有兩個林依也不太認識的遠房親戚，坐了半個小時就走了。<\/p>\n<p>阿婆的照片是年輕時候的。黑白的，大概二十幾歲，綁著兩條辮子，對著鏡頭，笑得有點緊張，好像拍照的人叫她笑，她就很認真地笑了。<\/p>\n<p>林依在靈前放了一個東西。<\/p>\n<p>是那包紅布。褪成粉紅色的，麻繩綁著，綁了好幾圈。何靜那天在松嶺交給她，她一直沒有拆。<\/p>\n<p>「她說要給我的。」林依說，「可是我覺得，這本來就不是要給我的。」<\/p>\n<p>她看著那包紅布，看了很久。然後她又把它拿起來，抱在懷裡，抱得很緊。<\/p>\n<p>「我先替她顧。」她說，「顧予好。」<\/p>\n<p>周遠站在後面，看著她的背影，沒有說話。<\/p>\n<hr class=\"sep\">\n<p>她們搬去海邊。<\/p>\n<p>一個叫海尾的小漁港，在縣的最南邊，從縣城開過去要兩個小時。沈言在那裡找到一份工作，在漁會當行政。林依說她要在港口開一間小小的飲料店，賣檸檬愛玉和冬瓜茶，賣不好就收起來，再想別的。<\/p>\n<p>周遠開車送她們去。後車廂塞滿了紙箱，還有三盆薄荷。薄荷是何靜派人從霧川那間透天厝裡搬出來的，三盆都活著，有一盆還開著很小的白花。<\/p>\n<p>她們租的房子在港口後面的巷子裡，兩層樓，一樓是空的店面，二樓兩個房間。跟霧川那間很像。<\/p>\n<p>林依說，她是故意找的。<\/p>\n<p>搬完東西，天快黑了。三個人坐在一樓空空的店面裡，坐在紙箱上，吃周遠在路口買的鹹酥雞。外面是港口，漁船的燈一盞一盞亮起來，海風從門口灌進來，鹹的，帶著柴油的味道。<\/p>\n<p>沈言把那只白瓷瓶從口袋裡拿出來，放在紙箱上。<\/p>\n<p>瓶子裡還有藥。黑色的，幾顆。她沒有再吃了。她說，從那天晚上以後，她就不需要吃了。可是她一直帶在身上，洗澡的時候放在洗手台邊，睡覺的時候放在枕頭旁邊。<\/p>\n<p>「我不是怕她再醒來。」沈言說，看著那只瓶子，「先生說，她不會再回來了。」<\/p>\n<p>她用手指碰了碰瓶底，碰了碰那個很小、很淺的「和」字。<\/p>\n<p>「我是怕我忘記。」她說，「忘記有一個人，蹲下來，跟我一樣高。忘記他給了我十二年。忘記這件事真的發生過。」<\/p>\n<p>林依沒有說話。她把頭靠在沈言的肩膀上。<\/p>\n<p>周遠看著那只瓶子。<\/p>\n<hr class=\"sep\">\n<p>他走的時候，沈言送他到門口。<\/p>\n<p>她手上拿著一樣東西，是那本封面印著卡通圖案的國小筆記本。很舊了，邊角都捲起來。她翻到最新的一頁，給他看。<\/p>\n<p>格子還在。一格一天。<\/p>\n<p>星期一那一格，還是空的。後面的格子，也都是空的，空了三個禮拜。<\/p>\n<p>可是在那些空格子的下面，她新畫了一排格子。小小的，跟上面那排一樣大。最上面寫了兩個字，字很工整：<\/p>\n<p class=\"beat\"><strong>記得<\/strong><\/p>\n<p>第一格裡面，有一個小小的勾。<\/p>\n<p>「今天的。」沈言說，「我記得了。」<\/p>\n<p>周遠看著那個勾。<\/p>\n<p>他點點頭，說了再見。他上車，發動，開出巷子。後照鏡裡，沈言還站在門口，手上拿著那本筆記本，一直看著他的車開遠。<\/p>\n<p>他看著後照鏡裡的自己。<\/p>\n<p>他眨了一下眼睛。鏡子裡的他也眨了。他分不出來有沒有慢，就像分不出來，胸口那個空空的地方，是輕鬆，還是想念。<\/p>", "chars": 3487}, "32": {"title": "第三十二章　第三聲", "html": "<p>回局裡上班的第一天，周遠去保管室領槍。<\/p>\n<p>保管室的老楊從鐵櫃裡把槍拿出來，核對編號，推到他面前，要他簽名。周遠拿起筆，簽了。周字的口寫得很扁。<\/p>\n<p>老楊把簽收單收回去，看了一眼，又看了他一眼。<\/p>\n<p>「休假休得怎樣？」<\/p>\n<p>「還好。」<\/p>\n<p>「看起來有睡飽。」老楊說，「之前你那個黑眼圈，我以為你在家裡養熊貓。」<\/p>\n<p>周遠把槍插回腰上。那個重量回來了，貼著他的腰側，很熟悉，又有一點陌生，像一件很久沒穿的外套。<\/p>\n<hr class=\"sep\">\n<p>三樓的辦公室什麼都沒變。<\/p>\n<p>白板上的照片還貼著，只是旁邊多了一張列印出來的新聞稿，有人用紅筆在「沼氣」兩個字上面畫了一個問號，又用藍筆把問號劃掉。他猜是小方畫的，然後是老張劃的。<\/p>\n<p>他的桌上放著一杯飲料。超商的大杯冰拿鐵，杯子外面凝著一圈水珠，底下壓著一張便利貼。<\/p>\n<p class=\"doc\">學長歡迎回來！！！我媽說要記得吃豬腳麵線　阿凱<\/p>\n<p>周遠看著那三個驚嘆號，看了一會兒，把便利貼撕下來，貼在電腦螢幕的邊框上。<\/p>\n<p>小方從隔壁的鑑識室探出頭來，手上抱著那個大保溫杯。<\/p>\n<p>「組長，」她說，「你回來了。」<\/p>\n<p>「嗯。」<\/p>\n<p>「加班說牠想你。」<\/p>\n<p>周遠愣了一下。小方拿出手機，翻出一張照片給他看。是那隻橘貓，趴在一疊卷宗上，睡得四腳朝天。<\/p>\n<p>「牠每天都睡在你那份霧川的報告上面。」小方說，「我把它帶回家看，牠就霸佔了。我推牠下去，牠又爬上來。」<\/p>\n<p>她把手機收起來，看著他。<\/p>\n<p>「你看起來不一樣了。」她說。<\/p>\n<p>「老楊說我黑眼圈不見了。」<\/p>\n<p>「不是。」小方歪著頭想了想，「你剛剛進門的時候，經過茶水間那面鏡子，你有看一眼。」<\/p>\n<p>周遠沒有說話。<\/p>\n<p>小方笑了，縮回鑑識室裡去了。<\/p>\n<hr class=\"sep\">\n<p>那幾天過得很普通。<\/p>\n<p>一件機車竊盜，一件鄰居為了停車位打架，一件獨居老人在家裡跌倒、三天才被發現。周遠一件一件處理，寫報告，簽名。每一個「一」字，收尾都還是往上勾一個小鉤。他沒有試著改。<\/p>\n<p>霧川案的檔案轉到老張手上，標註為「持續追查」。四十三個名字，用紅筆圈著，夾在最後一頁。<\/p>\n<p>第三天下午，雜貨店老闆的女兒又打來一次。她沒問什麼，只說她把她爸種的芭樂摘下來了，很多，很硬，不甜，問周遠要不要。<\/p>\n<p>周遠說要。<\/p>\n<p>隔天他輪休，早上去超市找她拿。她從員工休息室拎出一個塑膠袋，沉甸甸的，裡面二十幾顆芭樂，青青的，表皮有點粗。<\/p>\n<p>「放幾天會軟一點。」她說，「還是不會甜。」<\/p>\n<p>「謝謝。」<\/p>\n<p>她看著他。她穿著超市的制服背心，名牌上寫著她的名字，周遠第一次注意到。<\/p>\n<p>「警察先生，」她說，「你說你會一直找。」<\/p>\n<p>「嗯。」<\/p>\n<p>「我相信你。」她說，「我不知道為什麼，可是我相信你。」<\/p>\n<hr class=\"sep\">\n<p>他把芭樂放在副駕駛座上，往山線開。<\/p>\n<p>天氣很好，跟上次一樣。山壁上的樹綠得發亮，溪水的聲音很大，從關著的車窗外面一直灌進來。他沒有開收音機。收音機也沒有自己響。<\/p>\n<p>那只銅鈴放在後座，用他的外套包著。<\/p>\n<p>開到第二個加油站，他停下來，從後座把鈴拿過來，放在膝蓋上，打開外套看了一眼。<\/p>\n<p>很舊的鈴。鈴身被磨得發亮，映出他的臉，變形的，小小的。鈴舌還綁著那條紅線，綁得很緊，打了一個很複雜的結。他不知道是誰綁的，是先生，還是更早以前的人。<\/p>\n<p>他沒有解開。他把外套重新包好，放在副駕駛座，跟那袋芭樂並排。<\/p>\n<hr class=\"sep\">\n<p>石崗的雨，還是停在鎮口。<\/p>\n<p>山下是晴天，可是過了最後一個彎，榕樹那一帶飄著很細的毛毛雨，雨絲在陽光底下亮亮的，像一張掛在半空中的蜘蛛網。他的車開過那座墳，毛毛雨在他背後停了，前面的路是乾的，有一層灰。<\/p>\n<p>他把車停在墳前，下車。<\/p>\n<p>墳還是那座墳。矮矮的石碑，鑿得很歪的字：陳先生之墓。旁邊一行小字，民國一〇三年九月。墳前的香腳換過了，三根新的，燒到一半。<\/p>\n<p>他不知道是誰換的。<\/p>\n<p>他蹲下來，把外套打開，把那只銅鈴拿出來，放在墓碑前面。放得很小心，鈴口朝下，紅線打結的地方朝上。<\/p>\n<p>然後他從口袋裡拿出一包香。在山下的金紙店買的，最普通的那種。他抽出三支，用打火機點著，等火苗變成紅色的炭頭，甩了兩下，插在那三根燒到一半的舊香旁邊。<\/p>\n<p>沒有風。<\/p>\n<p>三縷煙從香頭升起來，筆直地往上，一點都沒有歪。升到榕樹的鬚根那裡，碰到鬚根，也沒有散開，就那樣穿過去，繼續往上，一直升到他看不見的地方。<\/p>\n<p>周遠蹲在墳前，看著那三縷煙。<\/p>\n<p>他想說點什麼。他想了很久。<\/p>\n<p>「她走了。」他最後說，「走的時候在笑。」<\/p>\n<p>他停了一下。<\/p>\n<p>「她最後說，這次我沒跑。」<\/p>\n<p>三縷煙還是筆直地往上。<\/p>\n<p>「林依把那包紅布帶走了。她說她先替她顧。」周遠說，「沈言不吃藥了。她說她怕忘記。她每天在本子上打一個勾。」<\/p>\n<p>他看著那塊石碑。鑿得很歪的字，像一個不太會寫字的人，一筆一畫照著描出來的。<\/p>\n<p>「你的字很醜。」他說，「我的也是。」<\/p>\n<p>他站起來，膝蓋響了一聲。<\/p>\n<hr class=\"sep\">\n<p>他沒有馬上走。他沿著那條乾乾的街，慢慢地走了一趟。<\/p>\n<p>理髮院的老闆坐在門口打瞌睡。雜貨店的阿伯在搬牛奶。廟口兩個老人在下棋，紅方的車還困在角落。<\/p>\n<p>金牙阿伯抬頭看見他，笑著揮手。<\/p>\n<p>「少年仔！閣來喔！」<\/p>\n<p>周遠也揮了揮手。他走過去，站在石桌旁邊，看了一會兒棋。他還是不會下象棋。<\/p>\n<p>「阿伯，」他說，「你叫什麼名字？」<\/p>\n<p>金牙阿伯愣了一下，好像這個問題很好笑。<\/p>\n<p>「問這創啥？」<\/p>\n<p>「我想記住。」<\/p>\n<p>金牙阿伯看著他，看了很久。他張開嘴，像要說什麼，又閉上。他皺起眉頭，看著棋盤，看著自己捏著棋子的那隻手。手底下，沒有影子。<\/p>\n<p>「阿伯毋記得矣。」他說，笑了一下，露出那口金牙，「歲頭大矣，啥物攏袂記得。」<\/p>\n<p>周遠點點頭。<\/p>\n<p>他從口袋裡拿出記事本，翻到新的一頁，寫了一行字：<\/p>\n<p class=\"doc\">石崗廟口，金牙，喜歡下象棋，紅方的車困在角落。<\/p>\n<p>他寫完，把記事本收起來。他知道他離開以後，會想不起金牙阿伯的臉。可是這一行字，會留在本子上。<\/p>\n<p>民宿的老闆娘坐在門口的小板凳上，看著街。她看見周遠，站起來，拍了拍花襯衫上的灰。<\/p>\n<p>「少年仔，」她說，「欲入來食飯無？我今仔日煮麵線。」<\/p>\n<p>「下次。」周遠說。<\/p>\n<p>「好。」老闆娘說，「我共你留一副碗。」<\/p>\n<hr class=\"sep\">\n<p>回程，車頭過墳，毛毛雨又落下來，打在擋風玻璃上，很細，很輕。他把雨刷開到最慢。<\/p>\n<p>過了第一個彎，雨停了，山下是晴天。<\/p>\n<p>他看了一眼後照鏡。<\/p>\n<p>鏡子裡，一個三十七歲的男人，頭髮有點亂，下巴的鬍子刮得不太乾淨，眼睛底下的青色淡了很多。<\/p>\n<p>他眨了一下眼睛。<\/p>\n<p>鏡子裡的他，也眨了一下。<\/p>\n<p>同時。<\/p>\n<p>他又眨了一次，故意眨得很慢。鏡子裡的人跟著他，一樣慢，一樣在同一個時間闔上，同一個時間睜開。<\/p>\n<p>他盯著那雙眼睛看。不是慢了一拍的眼睛。不是好像還想說什麼、卻說不出來的眼睛。就是他自己的眼睛，三十七年，第一次這麼完整地，跟他自己在一起。<\/p>\n<p>他把目光收回來，放在前面的路上。<\/p>\n<p>副駕駛座上，那袋芭樂在轉彎的時候滾了一下，一顆芭樂滾出塑膠袋，滾到座位邊緣，停住了。<\/p>\n<p>他伸手把它撿起來，放回袋子裡。<\/p>\n<hr class=\"sep\">\n<p>那天晚上，他在家裡切了一顆芭樂。<\/p>\n<p>很硬，切的時候刀子要用力壓。他切成八塊，放在盤子裡，坐在客廳的沙發上，一塊一塊吃。不甜。真的不甜。可是很脆，有一股很淡的、青澀的香味。<\/p>\n<p>他吃了四塊，把剩下的用保鮮膜包起來，放進冰箱。冰箱門上，那張便利貼還在。葛青崖，石崗。他看了一會兒，沒有撕掉。<\/p>\n<p>他走到玄關。<\/p>\n<p>鐵門內側，那兩段膠帶還貼著。很平，很整齊，蓋著那兩個凹痕。底下那一道沒敲下去的淺痕，在走廊燈斜斜的光裡，幾乎看不見了。<\/p>\n<p>他伸手，撕下第一段膠帶。<\/p>\n<p>凹痕在底下，很淺，邊緣圓圓的。他把拳頭放上去，指節嵌進去，剛好。<\/p>\n<p>他撕下第二段。<\/p>\n<p>兩個凹痕，並排在鐵皮上，安安靜靜的。他看著它們，看了很久。然後他把兩段膠帶揉成一團，丟進垃圾桶。<\/p>\n<p>他關了燈，去睡覺。<\/p>\n<p>他沒有做夢。<\/p>\n<hr class=\"sep\">\n<p>半夜，他被一個聲音吵醒。<\/p>\n<p>他躺在黑暗裡，睜著眼睛，不知道自己是被什麼吵醒的。窗外很安靜，連機車的聲音都沒有。手機上顯示兩點零七分。<\/p>\n<p>然後他又聽見了。<\/p>\n<p>從客廳傳來。從玄關。從那扇鐵門。<\/p>\n<p>叩。<\/p>\n<p>很輕。像有人用指節，敲在鐵門上。<\/p>\n<p>叩。<\/p>\n<p>周遠沒有動。<\/p>\n<p>他躺在床上，屏住呼吸，聽著。他的心跳很快，一下一下撞在耳膜上。<\/p>\n<p>他在等。<\/p>\n<p>等第三聲。<\/p>\n<p>客廳很安靜。玄關很安靜。整棟公寓都很安靜。他聽得見冰箱的壓縮機在嗡嗡響，聽得見樓上有人沖馬桶，水管裡的水嘩啦嘩啦流過牆壁。<\/p>\n<p>他等了很久。<\/p>\n<p>一分鐘。兩分鐘。五分鐘。<\/p>\n<p>第三聲，一直沒有來。<\/p>\n<p>他慢慢坐起來，掀開被子，光著腳，走出房間，穿過黑暗的客廳，走到玄關。<\/p>\n<p>他站在鐵門前面。門的另一邊，很安靜。可是他知道，那裡有人。他感覺得到。不是胸口那扇門告訴他的，胸口那扇門已經空了。是他自己的耳朵，他自己的皮膚，聽見了門外很輕很輕的、濕濕的呼吸聲。<\/p>\n<p>像一個人淋了很久的雨，站在門外，不敢再敲。<\/p>\n<p>兩下。<\/p>\n<p>兩下是人。<\/p>\n<p>周遠伸出手，握住了門把。<\/p>", "chars": 3309}, "33": {"title": "第三十三章　兩下", "html": "<p>門外站著一個人。<\/p>\n<p>走廊的燈是感應式的，周遠一開門，燈就亮了，白白的，照在那個人身上。<\/p>\n<p>是一個老人。六十幾歲，個子不高，很瘦，瘦得臉頰凹下去，顴骨頂著一層發皺的皮。他穿著一件汗衫，一條洗到發白的西裝褲，光著腳。他全身都是濕的。頭髮貼在頭皮上，汗衫貼在身上，水從褲管一滴一滴往下流，在磨石子地上積成一小灘，一小灘，往周遠的門檻這邊慢慢地漫過來。<\/p>\n<p>那種濕，不是淋雨。是泡過水。手指頭的皮皺成一層一層，白白的，像在浴缸裡泡了一整天的人。<\/p>\n<p>他的嘴唇在發抖。<\/p>\n<p>周遠認得他。<\/p>\n<p>不是見過。是看過照片。小方那疊報表的第一張。十二年被消保官檢舉七次，對老人少找錢，對外地人亂開價。帳簿上最後一行，醜醜的字：阿春，米一包，欠。<\/p>\n<p>「警察先生，」老人開口，聲音很啞，像很久沒說過話，「你是周警官，著無？」<\/p>\n<p>「我是。」<\/p>\n<p>「阮查某囝講，」老人說，「伊講你會揣阮。」<\/p>\n<hr class=\"sep\">\n<p>周遠讓他進門。<\/p>\n<p>老人站在玄關，不肯再往裡走。他低頭看著自己滴水的腳，看著乾淨的地板，往後縮了一步，站回門檻邊。<\/p>\n<p>「我會共你的地拖澹。」他說。<\/p>\n<p>周遠去浴室拿了兩條大毛巾，一條披在他肩上，一條鋪在他腳下。他又去廚房燒水，泡了一杯熱茶，端出來的時候，老人還站在那條毛巾上，一動也沒動，肩上的毛巾已經濕透了，像一條被扔進河裡又撈起來的抹布。<\/p>\n<p>周遠把茶遞給他。<\/p>\n<p>老人兩隻手捧著那杯茶，捧得很緊。熱氣從杯口升起來，碰到他的臉。他低頭看著茶，看了很久，沒有喝。<\/p>\n<p>「我毋敢啉。」他說，「我驚啉落去，就轉袂去矣。」<\/p>\n<p>周遠沒有問轉不去是什麼意思。他拉了一張椅子到玄關，要老人坐。老人搖頭，他就自己坐下了，坐在老人對面，隔著那條濕透的毛巾。<\/p>\n<p>「邱先生，」周遠說，「你這幾個禮拜，在哪裡？」<\/p>\n<p>老人看著他，好像很意外他知道自己姓什麼。<\/p>\n<p>「霧川。」老人說，「我一直攏佇霧川。」<\/p>\n<hr class=\"sep\">\n<p>他講得很慢，很亂，一下講台語，一下講國語，有時候講到一半就停下來，眼睛看著很遠的地方，好像在找下一句話放在哪裡。<\/p>\n<p>他說那天晚上，他聽到有人敲門。三下。他起來，開燈，開門。他記得他開了門。後面的事，他記不清楚了。<\/p>\n<p>「醒過來的時陣，」老人說，「我佇咧跳舞。」<\/p>\n<p>他說那是霧川。是他住了一輩子的那條主街，那間雜貨店，那間土地公廟。可是不一樣。招牌上的字是反的。店門口那幅春聯，字是倒過來寫的，像在鏡子裡看。天是灰的，一直是灰的，沒有日頭，也沒有月娘。廟口那個時鐘，一直停在同一個時間。<\/p>\n<p>「十二點十四分。」老人說，「我看幾若擺。一直攏是十二點十四分。」<\/p>\n<p>周遠的手指在膝蓋上停了一下。<\/p>\n<p>「我們攏佇廟埕跳。四十幾个人，排做一陣，攏是鎮內的人。阿雄，退休的會計，廟公，主街第六間彼个……」他停了一下，「跳袂停。手放袂落來。跤一直咧行。」<\/p>\n<p>他抬起一隻手，在空中比劃了一下。周遠看著那個動作。手往前伸，然後往後收。腳往後退一步，再往後退一步。<\/p>\n<p>「倒退咧跳。」老人說，「逐个人，攏倒退咧跳。」<\/p>\n<hr class=\"sep\">\n<p>「是誰在前面帶？」周遠問，「那個穿長睡衣的女人？」<\/p>\n<p>老人搖頭。他想了很久。<\/p>\n<p>「換人矣。」他說，「毋是伊。」<\/p>\n<p>「是誰？」<\/p>\n<p>老人張開嘴，又閉上。他低頭看著那杯茶，熱氣已經沒那麼多了。<\/p>\n<p>「我講袂出來。」他說，「伊佇頭前，一直背對阮。我看袂著伊的面。毋過伊……」他皺著眉頭，好像在找一個很難找的字，「伊足細漢。」<\/p>\n<p>周遠沒有再問。<\/p>\n<p>「後來，」老人說，「有一工，我聽著有人咧叫我。」<\/p>\n<p>他的聲音變了。很輕，像怕把什麼東西嚇跑。<\/p>\n<p>「叫我的名。邱永福。叫甲足大聲。」他說，「是阮查某囝的聲。」<\/p>\n<hr class=\"sep\">\n<p>周遠想起那張超市的名牌。他第一次注意到的那個名字。<\/p>\n<p>「她去霧川了。」他說。<\/p>\n<p>「伊去廟口。」老人說，「三更半暝，伊一个查某人，騎機車去霧川，偷偷仔入去，跪佇土地公廟頭前，一直叫我的名。」<\/p>\n<p>他捧著茶杯的手在抖。<\/p>\n<p>「我聽著矣。」他說，「我一聽著，跤就停矣。手就放落來矣。我就……我就沿著彼个聲，一直行，一直行，行出來矣。」<\/p>\n<p>「那你為什麼來找我？」<\/p>\n<p>老人看著他。<\/p>\n<p>「因為伊講你會揣阮。」老人說，「伊佇廟口叫我，叫甲聲都啞去，閣一直講，阿爸，你莫驚，有一个警察講伊會揣你。伊講伊相信你。」<\/p>\n<p>周遠沒有說話。<\/p>\n<p>「我毋知我會當留偌久。」老人說，「我感覺伊咧牽我。彼條河。伊一直咧牽我轉去。天若光，我就愛轉去矣。」<\/p>\n<p>他低下頭。<\/p>\n<p>「我是欲來共你講，」他說，「阮佇遐。四十三个，攏佇遐。阮出袂來。」<\/p>\n<hr class=\"sep\">\n<p>天還沒亮的時候，老人說了一件事。<\/p>\n<p>他說他這輩子做過很多不對的事。對老人少找錢，對外地人亂開價，被檢舉了也不改。他說他知道，他都知道，鎮上的人背後叫他什麼，他都知道。<\/p>\n<p>「毋過，」他說，「我毋是因為按呢予人帶走的。」<\/p>\n<p>周遠抬頭看他。<\/p>\n<p>「我佇遐跳的時陣，」老人說，「有聽著一寡聲。毋是歌。是河。河一直咧講話，講足濟足濟的名。阮阿公的名，阮阿祖的名。」<\/p>\n<p>他看著周遠。<\/p>\n<p>「我阿祖，彼年，佇渡頭。」他說，「我毋知伊做啥。毋過河記得。」<\/p>\n<p>周遠的背上一陣發冷。他想起夢裡沈家老太爺那隻握著核桃、一直在抖的手。想起那句「那一年大水」。<\/p>\n<p>「天欲光矣。」老人說。<\/p>\n<p>他把那杯一口都沒喝的茶，小心地放在鞋櫃上。他把肩上那條濕透的毛巾拿下來，摺好，摺得很整齊，放在茶杯旁邊。<\/p>\n<p>「多謝你的茶。」他說，「我無啉，毋過我知影伊是燒的。」<\/p>\n<p>他轉身，打開門，走出去。<\/p>\n<p>周遠站起來跟上去。<\/p>\n<p>走廊的感應燈亮了。老人光著腳，一步一步走向樓梯。他走得很慢，背駝著，水還在從他的褲管往下滴。<\/p>\n<p>他走到樓梯口，停了一下，回過頭來。<\/p>\n<p>「替我共阮查某囝講，」他說，「芭樂莫閣種矣。足穤食。」<\/p>\n<p>他笑了一下。然後他走下樓梯。<\/p>\n<p>周遠追到樓梯口。<\/p>\n<p>樓梯上沒有人。<\/p>\n<hr class=\"sep\">\n<p>只有腳印。<\/p>\n<p>濕的腳印，赤腳，一階一階往下。周遠沿著腳印往下走，四樓，三樓，二樓，一樓。腳印穿過公寓的鐵門，走到外面的人行道上。<\/p>\n<p>天剛亮，街上空空的，路燈還沒熄。早餐店的老闆在拉鐵門，看了周遠一眼，又低頭繼續拉。<\/p>\n<p>腳印在人行道上，一個一個，很清楚。往東。往山的方向。往霧川。<\/p>\n<p>周遠沿著腳印走了一段。走過一個路口，兩個路口。腳印越來越淡，越來越淺，像水被太陽曬乾，像一個人越走越輕。<\/p>\n<p>走到第三個路口，紅綠燈底下，腳印沒有了。<\/p>\n<p>最後一個腳印，腳尖朝東，停在斑馬線前面，等著過馬路。<\/p>\n<p>綠燈亮了。周遠站在那裡，沒有過。<\/p>\n<hr class=\"sep\">\n<p>他七點打給邱永福的女兒。<\/p>\n<p>響了很久她才接。她的聲音很啞，啞得幾乎聽不見。<\/p>\n<p>「妳昨天晚上，」周遠說，「是不是去了霧川？」<\/p>\n<p>電話那頭很久沒有聲音。<\/p>\n<p>「你怎麼知道？」<\/p>\n<p>「他來找我了。」周遠說。<\/p>\n<p>他聽見她吸了一口氣，然後什麼聲音都沒有了。過了很久，久到他以為斷線了，她才開口。<\/p>\n<p>「他還好嗎？」<\/p>\n<p>周遠看著鞋櫃上那杯冷掉的茶，和那條摺得整整齊齊的濕毛巾。<\/p>\n<p>「很冷。」他說，「可是他說他知道那杯茶是熱的。」<\/p>\n<p>電話那頭，她哭了。<\/p>\n<p>「他還說，」周遠說，「芭樂不要再種了。很難吃。」<\/p>\n<p>她哭著笑出來，笑了一聲，又哭。<\/p>\n<p>「他每次都這樣講，」她說，「每次都這樣講，每年還是種。」<\/p>\n<hr class=\"sep\">\n<p>傍晚，何靜打來。<\/p>\n<p>周遠在局裡，正在看一份霧川鎮的老地圖。地圖是日治時期的，從文史館借來的，上面標著「霧川渡」三個字，河道比現在寬很多，渡口的位置畫著一個小小的碼頭。<\/p>\n<p>「七號床，」何靜說，「今天收了新病人。」<\/p>\n<p>周遠的手停在地圖上。<\/p>\n<p>「一個老先生，七十幾歲，從別的醫院轉來的。」何靜說，「家屬說他在大廟當了四十年的乩童，去年退下來，開始講一些很奇怪的話，說廟裡降的旨不對，說有人在用神明的嘴說話。家屬覺得他失智了。」<\/p>\n<p>「轉介醫師是誰？」<\/p>\n<p>何靜頓了一下。<\/p>\n<p>「簽名很潦草。」她說，「跟沈言那張一樣。」<\/p>\n<p>周遠沒有說話。<\/p>\n<p>「還有一件事。」何靜說，聲音放低了，「今天晚上，蔡姐巡房，聽到七號房裡有人在哼歌。」<\/p>\n<p>周遠握緊手機。<\/p>\n<p>「不是阿婆那支。」何靜說，「蔡姐說，那支她聽了二十年，她認得。這支不一樣。」<\/p>\n<p>「哪裡不一樣？」<\/p>\n<p>何靜沉默了一下。<\/p>\n<p>「她說，」何靜說，「很甜。」<\/p>", "chars": 3058}, "34": {"title": "第三十四章　背面", "html": "<p>周遠本來打算一個人去。<\/p>\n<p>他跟何靜說的時候，只是想讓她知道。他在電話裡講了邱永福，講了那杯一口都沒喝的茶，講了那串在斑馬線前停住的腳印。他說他今天晚上要去霧川看一看。<\/p>\n<p>何靜聽完，很久沒有說話。<\/p>\n<p>「幾點？」她問。<\/p>\n<p>「十一點出發。」<\/p>\n<p>「我跟你去。」<\/p>\n<p>「妳明天要上班。」<\/p>\n<p>「你也要。」何靜說，「九點半，我在松嶺山下那間便利商店等你。你遲到，我就自己開車去。」<\/p>\n<p>她掛了電話。<\/p>\n<hr class=\"sep\">\n<p>她九點二十分就到了。<\/p>\n<p>周遠開進便利商店的停車場時，她坐在窗邊的高腳椅上，面前擺著兩個御飯糰、一瓶無糖綠茶、一個很大的保溫瓶。她穿著一件深灰色的運動外套，頭髮紮成馬尾，沒穿白袍的樣子，看起來年輕了好幾歲。<\/p>\n<p>她看見他，把一個御飯糰推過來。<\/p>\n<p>「鮭魚的。」她說，「你一定沒吃晚飯。」<\/p>\n<p>他確實沒吃。他坐下來，撕開包裝，把海苔撕破了，飯糰從中間裂開。何靜看著他笨手笨腳地把海苔包回去，嘴角動了一下。<\/p>\n<p>「你們警察都這樣嗎？」<\/p>\n<p>「什麼？」<\/p>\n<p>「連飯糰都不會開。」<\/p>\n<p>周遠低頭看著手上那個破掉的飯糰，咬了一口。<\/p>\n<p>「我以前會。」他說，「我妹……」<\/p>\n<p>他停住了。<\/p>\n<p>何靜看著他。「你妹？」<\/p>\n<p>周遠拿著飯糰，愣在那裡。他不知道自己剛剛要說什麼。那句話像從很深的地方浮上來一個泡泡，到了嘴邊，破了，什麼都沒有。<\/p>\n<p>「沒事。」他說，「我說錯了。我沒有妹妹。」<\/p>\n<p>何靜沒有追問。她低頭喝綠茶，眼睛卻一直看著他。<\/p>\n<hr class=\"sep\">\n<p>霧川鎮的入口拉著封鎖線。<\/p>\n<p>黃色的膠帶在夜風裡啪啪地響，旁邊停著一輛巡邏車，車裡亮著一盞小燈。周遠把車停下來，巡邏車的門開了，一個人跑過來。<\/p>\n<p>是阿凱。<\/p>\n<p>「學長！」阿凱壓低聲音，一臉驚訝，「你怎麼來了？」<\/p>\n<p>「你值夜班？」<\/p>\n<p>「這禮拜輪到我。」阿凱說，「守封鎖線。整個晚上一個人都沒有，我快無聊死了。」他看見副駕駛座上的何靜，愣了一下，又看了周遠一眼，表情變得很複雜。<\/p>\n<p>「她是醫生。」周遠說。<\/p>\n<p>「喔。」阿凱說，「喔，醫生。」<\/p>\n<p>「我們進去看一下。一個小時就出來。」<\/p>\n<p>阿凱看著他，猶豫了很久。<\/p>\n<p>「學長，」他說，「我媽說，晚上不要進這種地方。」<\/p>\n<p>「我知道。」<\/p>\n<p>阿凱嘆了一口氣，把封鎖線拉起來，讓車子過去。車頭經過他身邊的時候，他敲了敲車窗。周遠搖下來。<\/p>\n<p>阿凱從口袋裡掏出一樣東西，塞進來。是一個小小的平安符，紅色的，縫得歪歪的。<\/p>\n<p>「我媽給的。」他說，「她說我一定用得到。我覺得你比較用得到。」<\/p>\n<hr class=\"sep\">\n<p>霧川很黑。<\/p>\n<p>整條主街一盞燈都沒有。車燈照過去，照出一扇一扇拉下來的鐵門，一個一個貼著封條的門板。雜貨店的鐵門上貼著兩張交叉的封條，封條上的字被露水打濕了，糊成一片。<\/p>\n<p>周遠把車停在廟埕旁邊，熄了火。<\/p>\n<p>他們下車。山上的夜風很冷，帶著溪水的味道。何靜把運動外套的拉鍊拉到下巴，打開手機的手電筒。<\/p>\n<p>廟埕的石板上有一灘水。<\/p>\n<p>不大，在廟埕的正中央，兩三步寬，形狀不規則，像有人在那裡打翻了一桶水。可是這幾天都沒有下雨。周遠拿手電筒照了一下，水很淺，很清，底下的石板和青苔清清楚楚。<\/p>\n<p>「這裡為什麼會有水？」何靜問。<\/p>\n<p>周遠想起邱永福的女兒。跪在土地公廟頭前，一直叫我的名。<\/p>\n<p>他沒有回答。<\/p>\n<p>他看了一眼手錶。十一點五十一分。<\/p>\n<p>「我們等一下。」他說。<\/p>\n<hr class=\"sep\">\n<p>他們坐在廟前的石階上等。<\/p>\n<p>何靜把保溫瓶打開，倒了兩杯熱的薑茶，一杯給他。薑放得很多，辣得他喉嚨發燙。<\/p>\n<p>「我媽煮的。」何靜說，「她聽說我晚上要上山，硬塞給我的。」<\/p>\n<p>「妳跟她說妳要來這裡？」<\/p>\n<p>「我說我要值夜班。」何靜說，「她說值夜班更要喝。」<\/p>\n<p>她捧著杯子，看著廟埕那灘水。<\/p>\n<p>「我阿嬤以前說過，」她說，「我們家祖先擺渡的那條河，晚上會講話。她說她小時候，跟著她阿公去河邊點燈，她阿公會蹲在河邊，一直聽，聽很久。她問阿公在聽什麼，阿公說，在聽一個人有沒有原諒他。」<\/p>\n<p>周遠看著她。<\/p>\n<p>「我以前覺得那是老人家的故事。」何靜說，「我念醫學院的時候，還寫過一篇報告，講台灣民間信仰裡的集體罪咎感。拿了 A。」<\/p>\n<p>她喝了一口薑茶。<\/p>\n<p>「阿婆走了以後，」她說，「我常常夢到一條河。」<\/p>\n<p>周遠沒有說話。<\/p>\n<p>「河邊有一盞燈。」何靜說，「我一直想走過去，一直走不到。」<\/p>\n<p>她把杯子放下來，看著自己的手。<\/p>\n<p>「我沒有跟任何人講過。」她說，「我是精神科醫生。我知道這叫什麼。」<\/p>\n<hr class=\"sep\">\n<p>十一點五十九分。<\/p>\n<p>周遠看著手錶的秒針。五十七，五十八，五十九。<\/p>\n<p>秒針跳到十二。<\/p>\n<p>然後跳到下一格。十二點整。十二點零一分。<\/p>\n<p>他鬆了一口氣，又覺得奇怪。他繼續看著。零二，零三。秒針一格一格地跳，很正常。<\/p>\n<p>十二點十四分。<\/p>\n<p>秒針跳到十二。<\/p>\n<p>然後，停了。<\/p>\n<p>不是慢下來。是停了。那根細細的紅色秒針，停在正上方，一動也不動，像被釘住了。<\/p>\n<p>周遠把手腕湊到耳邊。聽不到走動的聲音。<\/p>\n<p>「何靜。」<\/p>\n<p>何靜低頭看自己的手機。螢幕亮著，上面的時間是 00:14。她盯著看，看了很久，數字沒有變。<\/p>\n<p>她抬頭，看向廟門。<\/p>\n<p>廟裡神桌的上方，掛著一個老式的圓形時鐘，玻璃面有點霧。手電筒照過去，時針和分針指著十二點十四分。秒針停在正上方。<\/p>\n<p>整座霧川，好像在那一秒，被人按下了暫停鍵。<\/p>\n<hr class=\"sep\">\n<p>然後他們聽見了。<\/p>\n<p>很輕。從廟埕中央傳過來。不是風，不是溪水。是腳步聲。很多人的腳步聲，整齊，緩慢，啪，啪，啪。<\/p>\n<p>可是廟埕上一個人都沒有。<\/p>\n<p>周遠站起來，走到那灘水旁邊，蹲下來。<\/p>\n<p>水面很平，平得像一面鏡子。手電筒的光照下去，水裡映出廟埕上方的天空。不，不是天空。<\/p>\n<p>是一座鎮。<\/p>\n<p>灰色的。整座都是灰的，像一張褪色的老照片。廟埕，土地公廟，廟後面的小巷，主街上的招牌。一模一樣的霧川，可是所有的顏色都被抽掉了，只剩下深深淺淺的灰。廟門上的匾額，字是反的。<\/p>\n<p>廟埕
